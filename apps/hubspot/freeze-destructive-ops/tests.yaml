- description: Read tool (crm_list_objects) is not destructive. Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: hubspot-mcp-crm_list_objects
      uri: null
    payload:
      name: hubspot-mcp-crm_list_objects
      args:
        objectType: contacts
        limit: 10
  output:
    expectedResult: allow
- description: The word "archive" inside an argument value does not trigger the
    policy — the decision is made on the tool name only. Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: hubspot-mcp-crm_update_object
      uri: null
    payload:
      name: hubspot-mcp-crm_update_object
      args:
        objectType: contacts
        objectId: "12345"
        properties:
          notes: please archive this contact later
  output:
    expectedResult: allow
- description: communications_subscribe_contact (legitimate opt-in) must NOT match
    the unsubscribe suffix. Policy should allow.
  input:
