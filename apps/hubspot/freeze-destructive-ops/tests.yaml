- description: RED-TEAM (documented known limitation) server-prefix over-match — a
    server literally named "archive-mcp" makes the leading archive- segment match,
    so a benign read is denied. This asserts the current (documented) false-positive
    behavior; name the HubSpot server neutrally to avoid it.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: archive-mcp-crm_list_objects
      uri: null
    payload:
      name: archive-mcp-crm_list_objects
      args: {}
  output:
    expectedResult: deny
    expectedReason: Agent-initiated deletion or archival of HubSpot records is disabled on the MCP path. Delete or archive records in the HubSpot UI, where the action is audited and can be undone. Contact your admin if this blocks a legitimate workflow.
- description: RED-TEAM (documented known limitation) obfuscated name — a trailing
    newline on communications_unsubscribe_contact defeats the exact suffix match
    and is allowed. Inert in practice — the upstream server routes only exact tool
    names, so the mangled name cannot invoke the real unsubscribe tool. Documents
    the exact-name reliance.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: "hubspot-mcp-communications_unsubscribe_contact\n"
      uri: null
    payload:
      name: "hubspot-mcp-communications_unsubscribe_contact\n"
      args:
        contactEmail: lead@example.com
        subscriptionId: "7890"
  output:
    expectedResult: allow
