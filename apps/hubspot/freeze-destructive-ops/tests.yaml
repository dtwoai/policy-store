- description: Engagement archive tool (calls_archive) — the `_archive` suffix form.
    Policy should deny with the archive reason.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: hubspot-mcp-calls_archive
      uri: null
    payload:
      name: hubspot-mcp-calls_archive
      args:
        callId: "555"
  output:
    expectedResult: deny
    expectedReason: Agent-initiated deletion or archival of HubSpot records is disabled on the MCP path. Delete or archive records in the HubSpot UI, where the action is audited and can be undone. Contact your admin if this blocks a legitimate workflow.
