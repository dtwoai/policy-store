# --- SQL (query_crm_data) ---
- description: SQL with no LIMIT — LIMIT 200 appended on its own line.
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: hubspot-query-crm-data, uri: null }
    payload:
      args: { sql: "SELECT firstname, email FROM CONTACT WHERE lifecyclestage = 'lead'" }
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain: { sql: "SELECT firstname, email FROM CONTACT WHERE lifecyclestage = 'lead'\nLIMIT 200" }
- description: SQL with a trailing semicolon and no LIMIT — semicolon dropped, LIMIT 200 appended.
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: hubspot-query-crm-data, uri: null }
    payload:
      args: { sql: "SELECT * FROM DEAL;" }
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain: { sql: "SELECT * FROM DEAL\nLIMIT 200" }
- description: SQL ending in a line comment — appended LIMIT lands on a new line, outside the comment.
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: hubspot-query-crm-data, uri: null }
    payload:
      args: { sql: "SELECT * FROM CONTACT -- all of them" }
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain: { sql: "SELECT * FROM CONTACT -- all of them\nLIMIT 200" }
- description: SQL with LIMIT 1000 OFFSET 50 — lowered to LIMIT 200, OFFSET kept.
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: hubspot-query-crm-data, uri: null }
    payload:
      args: { sql: "SELECT * FROM CONTACT ORDER BY createdate DESC LIMIT 1000 OFFSET 50" }
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain: { sql: "SELECT * FROM CONTACT ORDER BY createdate DESC LIMIT 200 OFFSET 50" }
- description: SQL already at LIMIT 10 — untouched.
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: hubspot-query-crm-data, uri: null }
    payload:
      args: { sql: "SELECT hubspot_owner_id, SUM(amount_in_home_currency) FROM DEAL GROUP BY hubspot_owner_id LIMIT 10" }
  output:
    expectedResult: allow
  transformApplied: false
- description: LIMIT inside a string literal doesn't count — LIMIT 200 still appended.
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: hubspot-query-crm-data, uri: null }
    payload:
      args: { sql: "SELECT * FROM CONTACT WHERE lastname = 'LIMIT 5'" }
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain: { sql: "SELECT * FROM CONTACT WHERE lastname = 'LIMIT 5'\nLIMIT 200" }

