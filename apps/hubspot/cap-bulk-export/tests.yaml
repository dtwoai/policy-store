# --- Search / list (remote server, gateway kebab-case names) ---
- description: Free-text search (query term) with limit 200 — clamped to 50; other args preserved.
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: hubspot-search-crm-objects, uri: null }
    payload:
      args: { objectType: CONTACT, query: smith, limit: 200 }
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain: { limit: 50, objectType: CONTACT, query: smith }
- description: Free-text search with no limit — limit 50 injected.
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: hubspot-search-crm-objects, uri: null }
    payload:
      args: { objectType: COMPANY, query: acme }
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain: { limit: 50 }
- description: Free-text search already at limit 50 — untouched (boundary).
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: hubspot-search-crm-objects, uri: null }
    payload:
      args: { objectType: CONTACT, query: smith, limit: 50 }
  output:
    expectedResult: allow
  transformApplied: false
- description: Filter-only search with no limit — limit 200 injected (server default is 100, max 200).
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: hubspot-search-crm-objects, uri: null }
    payload:
      args:
        objectType: DEAL
        filterGroups: [ { filters: [ { propertyName: dealstage, operator: EQ, value: qualifiedtobuy } ] } ]
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain: { limit: 200, objectType: DEAL }
- description: Filter-only search at limit 150 — untouched (under 200).
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: hubspot-search-crm-objects, uri: null }
    payload:
      args: { objectType: CONTACT, limit: 150 }
  output:
    expectedResult: allow
  transformApplied: false
- description: Filter-only search with a blank query string counts as a list — 500 clamped to 200.
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: hubspot-search-crm-objects, uri: null }
    payload:
      args: { objectType: CONTACT, query: "  ", limit: 500 }
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain: { limit: 200 }
- description: Non-positive limit (0) — rewritten to the cap (no unbounded fallback).
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: hubspot-search-crm-objects, uri: null }
    payload:
      args: { objectType: CONTACT, limit: 0 }
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain: { limit: 200 }
- description: Non-numeric limit — rewritten to the cap.
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: hubspot-search-crm-objects, uri: null }
    payload:
      args: { objectType: CONTACT, query: jane, limit: "all" }
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain: { limit: 50 }
- description: Snake_case spelling with a custom server prefix still matches.
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: HubSpot-Remote-Search_CRM_Objects, uri: null }
    payload:
      args: { objectType: CONTACT, query: smith, limit: 100 }
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain: { limit: 50 }

