- description: Red-team — shinzo wildcard UPDATE-property stem (crm_update_property)
    by a non-admin. Editing a property definition is a portal-schema mutation; the
    _update_property suffix must gate it just like _create_property. deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: hubspot-shinzo-crm_update_property
      uri: null
    subject:
      sub: auth0|writer@example.com
      claims:
        groups:
          - crm-writers
    payload:
      name: hubspot-shinzo-crm_update_property
      args:
        name: dealstage
  output:
    expectedResult: deny
    expectedReason: "HubSpot property definitions are admin-owned: creating or editing them changes the portal schema for every user. Editing property definitions through the agent channel is limited to members of the 'hubspot-admins' group. Manage properties in HubSpot Settings > Properties, or ask an administrator to add you to that group if you believe this is a false positive."
