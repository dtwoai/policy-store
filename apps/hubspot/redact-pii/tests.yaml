- description: Egress response from a non-HubSpot tool. Out of scope, so the
    policy applies no transform and the response is returned unchanged.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: slack-mcp-slack-post-message
      uri: null
    payload:
      name: slack-mcp-slack-post-message
      result:
        ok: true
        channel: C0123456789
  output:
    expectedResult: allow
  transformApplied: false
- description: Egress response from a HubSpot tool on the output path. Policy is
    in scope, so it returns a redaction transform that masks PII in the response
    body.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: hubspot-list-objects
      uri: null
    payload:
      name: hubspot-list-objects
      result:
        results:
          - id: "12345"
            properties:
              email: lead@example.com
              phone: 555-666-7777
              company: Example Inc
  output:
    expectedResult: allow
    expectedReason: PII redacted from HubSpot response
  transformApplied: true
  transform:
    replacement: "[REDACTED]"
