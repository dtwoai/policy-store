- description: Call to a read tool (not the write tool). Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: hubspot-list-objects
      uri: null
    payload:
      name: hubspot-list-objects
      args:
        objectType: deals
  output:
    expectedResult: allow
- description: Call to the write tool (hubspot-manage-crm-objects). Policy should
    deny with a reason.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: hubspot-manage-crm-objects
      uri: null
    payload:
      name: hubspot-manage-crm-objects
      args:
        updateRequest:
          objects:
            - objectType: deals
              id: "12345"
              properties:
                amount: "500"
  output:
    expectedResult: deny
    expectedReason: HubSpot write operations are disabled on this gateway. This connection is read-only.
