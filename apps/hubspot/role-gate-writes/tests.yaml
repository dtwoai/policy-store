- description: Remote read tool (search_crm_objects) with a non-writer caller.
    Reads pass for everyone — allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: hubspot-remote-search_crm_objects
      uri: null
    subject:
      sub: auth0|reader@example.com
      claims:
        groups:
          - support
    payload:
      name: hubspot-remote-search_crm_objects
      args:
        objectType: contacts
        query: acme
  output:
    expectedResult: allow
