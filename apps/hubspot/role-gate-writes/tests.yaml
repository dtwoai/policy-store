- description: RED-TEAM (documented fail-open) — baryhuang community server write
    (hubspot_create_contact) is not in the verified suffix list, so a non-writer's
    create is ALLOWED. Codifies the "baryhuang not covered" Known limitation; run a
    destructive/community deny policy alongside this one if you use that server.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: hubspot-bary-hubspot_create_contact
      uri: null
    subject:
      sub: auth0|reader@example.com
      claims:
        groups:
          - support
    payload:
      name: hubspot-bary-hubspot_create_contact
      args:
        properties:
          email: jane@example.com
  output:
    expectedResult: allow
- description: RED-TEAM (documented fail-open) — shinzo destructive tool
    (crm_archive_object) is intentionally NOT gated as a write, so a non-writer's
    archive is ALLOWED. Codifies the "destructive tools not listed — block with a
    dedicated deny policy" Known limitation.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: hubspot-shinzo-crm_archive_object
      uri: null
