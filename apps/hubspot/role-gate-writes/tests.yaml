        objectType: contacts
        id: "101"
  output:
    expectedResult: allow
- description: RED-TEAM (documented fail-open) — shinzo consent-destructive tool
    (communications_unsubscribe_contact) is not on the write list, so a non-writer's
    unsubscribe is ALLOWED. Codifies the documented residual; pair with a
    destructive-suffix deny policy to close it.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: hubspot-shinzo-communications_unsubscribe_contact
      uri: null
    subject:
      sub: auth0|reader@example.com
      claims:
        groups:
          - support
    payload:
      name: hubspot-shinzo-communications_unsubscribe_contact
      args:
        contactEmail: jane@example.com
        subscriptionId: "77"
  output:
    expectedResult: allow
- description: RED-TEAM (fail-closed) — claims emitted as a bare string instead of an
    object. object.get chain resolves groups to [] and the write is denied even
    though the string value equals crm-writers. No claim-spoofing via malformed claims.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: hubspot-remote-manage_crm_objects
      uri: null
    subject:
      sub: auth0|writer@example.com
      claims: crm-writers
    payload:
      name: hubspot-remote-manage_crm_objects
      args:
        objectType: contacts
  output:
    expectedResult: deny
    expectedReason: HubSpot write tools are limited to members of the 'crm-writers' group — your HubSpot access through the agent channel is read-only. If you believe this is a false positive, ask your administrator to add you to the writers group.
- description: RED-TEAM (fail-closed) — groups claim emitted as a number (not a list
    of strings). Not iterable, caller_is_writer never fires, write is denied.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: hubspot-remote-manage_crm_objects
      uri: null
    subject:
      sub: auth0|writer@example.com
      claims:
        groups: 5
    payload:
      name: hubspot-remote-manage_crm_objects
      args:
        objectType: contacts
  output:
    expectedResult: deny
    expectedReason: HubSpot write tools are limited to members of the 'crm-writers' group — your HubSpot access through the agent channel is read-only. If you believe this is a false positive, ask your administrator to add you to the writers group.
- description: RED-TEAM (blocklist edge) — resource.name absent entirely. The
