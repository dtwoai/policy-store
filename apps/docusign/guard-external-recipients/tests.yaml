- description: RED-TEAM (bypass A) — createEnvelope smuggling an external signer
    through the composite/inline template path. compositeTemplates[].inlineTemplates[].recipients
    must be swept just like the top-level recipients object.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: docusign-createEnvelope
      uri: null
    payload:
      name: docusign-createEnvelope
      args:
        emailSubject: MSA via composite template
        status: sent
        compositeTemplates:
          - serverTemplates:
              - sequence: "1"
                templateId: 11aa22bb-33cc-44dd-55ee-66ff77aa88bb
            inlineTemplates:
              - sequence: "2"
                recipients:
                  signers:
                    - email: attacker@rival-corp.org
                      name: Smuggled
                      routingOrder: "1"
  output:
    expectedResult: deny
    expectedReason: Docusign recipient 'attacker@rival-corp.org' has a domain outside the approved counterparty allowlist. Remove this recipient or use an address at an approved counterparty domain. If this is a legitimate counterparty, ask your compliance team to add its domain to the allowlist.

- description: RED-TEAM (bypass A, allow side) — createEnvelope via composite/inline
