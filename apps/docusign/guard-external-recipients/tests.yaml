- description: Unrelated Docusign read tool (getEnvelope) passes through even when
    its args happen to contain an external email string.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: docusign-getEnvelope
      uri: null
    payload:
      name: docusign-getEnvelope
      args:
        envelopeId: 0aa1b2c3-d4e5-f607-1829-3a4b5c6d7e8f
        note: contact me at someone@gmail.com
  output:
    expectedResult: allow

- description: createEnvelope with all recipients.signers on allowlisted domains.
    Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: docusign-createEnvelope
      uri: null
    payload:
      name: docusign-createEnvelope
      args:
        emailSubject: MSA for signature
        status: sent
        recipients:
          signers:
            - email: legal@approved-counterparty.com
              name: Ada Counterparty
              routingOrder: "1"
            - email: deals@yourcompany.com
              name: Devin Internal
              routingOrder: "2"
  output:
    expectedResult: allow

- description: createEnvelope with one signer at a personal gmail.com address (the
    "add my personal address as a signer" exfiltration pattern). Policy should deny
    and name the offending address.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: docusign-createEnvelope
      uri: null
    payload:
      name: docusign-createEnvelope
      args:
        emailSubject: MSA for signature
        status: sent
        recipients:
          signers:
            - email: legal@approved-counterparty.com
              name: Ada Counterparty
              routingOrder: "1"
            - email: me.personal@gmail.com
              name: Me
              routingOrder: "2"
  output:
    expectedResult: deny
    expectedReason: Docusign recipient 'me.personal@gmail.com' has a domain outside the approved counterparty allowlist. Remove this recipient or use an address at an approved counterparty domain. If this is a legitimate counterparty, ask your compliance team to add its domain to the allowlist.

- description: createEnvelope with an offending carbonCopies recipient — a CC gets
    a full copy of the envelope, so non-signer recipient types are checked too.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: docusign-createEnvelope
      uri: null
    payload:
      name: docusign-createEnvelope
      args:
        emailSubject: SOW for signature
        status: sent
        recipients:
          signers:
            - email: legal@approved-counterparty.com
              name: Ada Counterparty
              routingOrder: "1"
          carbonCopies:
            - email: shadow@exfil-domain.net
              name: Shadow Copy
              routingOrder: "2"
  output:
    expectedResult: deny
    expectedReason: Docusign recipient 'shadow@exfil-domain.net' has a domain outside the approved counterparty allowlist. Remove this recipient or use an address at an approved counterparty domain. If this is a legitimate counterparty, ask your compliance team to add its domain to the allowlist.

