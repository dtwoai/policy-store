      name: docusign-updateEnvelopeRecipients
      uri: null
    payload:
      name: docusign-updateEnvelopeRecipients
      args:
        envelopeId: 0aa1b2c3-d4e5-f607-1829-3a4b5c6d7e8f
        carbonCopies:
