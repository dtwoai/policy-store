- description: Official createEnvelope with status "sent" from a non-sender — rewritten to draft; all other arguments preserved.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: docusign-createEnvelope
      uri: null
    subject:
      sub: agent@example.com
      claims:
        groups:
          - staff
    payload:
      name: docusign-createEnvelope
      args:
        emailSubject: "Please sign: MSA"
        status: sent
        templateId: tpl-1
        templateRoles:
          - roleName: Signer
            name: Ana
            email: ana@acme.com
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    emailSubject: "Please sign: MSA"
    status: created
    templateId: tpl-1
    templateRoles:
      - email: ana@acme.com
        name: Ana
        roleName: Signer

