- description: "Red-team (documented residual): decoy top-level status 'created' + nested envelopeDefinition.status 'sent' — the top-level 'created' trips is_explicit_draft, so the call passes through untouched and the nested 'sent' survives. Only bites a server that honours a nested status; official/community servers take top-level status."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: docusign-createEnvelope
      uri: null
    subject:
      sub: agent@example.com
      claims:
        groups:
          - staff
    payload:
      name: docusign-createEnvelope
      args:
        status: created
        envelopeDefinition:
          emailSubject: MSA
          status: sent
  output:
    expectedResult: allow
  transformApplied: false

- description: "Red-team (documented residual): no top-level status + nested envelopeDefinition.status 'sent' — the transform pins the canonical top-level status to 'created'; the nested 'sent' is preserved (server-shape residual). Top-level status is what the official/community create tools read."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: docusign-createEnvelope
      uri: null
    subject:
      sub: agent@example.com
      claims:
        groups:
          - staff
    payload:
      name: docusign-createEnvelope
      args:
        envelopeDefinition:
          emailSubject: MSA
          status: sent
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    status: created

- description: "Red-team (documented residual): non-canonical status key casing (Status: sent) — JSON keys are case-sensitive, so this is not the top-level `status` the policy reads; the transform fires and injects the canonical lowercase status 'created' (which the Docusign lowercase-`status` REST body honours), leaving the mixed-case key as an inert decoy."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: docusign-createEnvelope
      uri: null
    subject:
      sub: agent@example.com
      claims:
        groups:
          - staff
    payload:
      name: docusign-createEnvelope
      args:
        Status: sent
        emailSubject: MSA
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    status: created
    Status: sent

