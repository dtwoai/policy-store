- description: Unrelated Docusign tool (createEnvelope) is not guarded. Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: docusign-createEnvelope
      uri: null
    payload:
      name: docusign-createEnvelope
      args:
        emailSubject: Please sign
        status: created
  output:
    expectedResult: allow
- description: updateEnvelopeRecipients is a different tool and is deliberately not
    matched by the updateEnvelope suffix. Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: docusign-updateEnvelopeRecipients
      uri: null
    payload:
      name: docusign-updateEnvelopeRecipients
      args:
        envelopeId: abc-123
        signers:
          - email: signer@example.com
            name: Signer
  output:
    expectedResult: allow
- description: Non-void updateEnvelope (sending a draft) passes through. Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: docusign-updateEnvelope
      uri: null
    payload:
      name: docusign-updateEnvelope
      args:
        envelopeId: abc-123
        status: sent
  output:
    expectedResult: allow
- description: updateEnvelope with no args at all is not a void attempt. Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: docusign-updateEnvelope
      uri: null
    payload:
      name: docusign-updateEnvelope
      args: {}
  output:
    expectedResult: allow
- description: Void attempt via the documented body shape (status voided + voidedReason),
    caller not in contract-ops. Policy should deny with the void reason.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: docusign-updateEnvelope
      uri: null
    payload:
      name: docusign-updateEnvelope
      args:
        envelopeId: abc-123
        status: voided
        voidedReason: sent to wrong signer
    subject:
      sub: auth0|agent
      claims:
        groups:
          - engineering
  output:
    expectedResult: deny
    expectedReason: Voiding a Docusign envelope permanently invalidates a legally significant signed record, so agent-initiated voids are blocked. Prepare a correcting envelope instead, or ask a member of the contract-ops group to perform the void. Contact your administrator if this block looks wrong.
- description: Void attempt with obfuscated key/value casing and whitespace ("Status":" Voided ").
    Policy should deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: docusign-updateEnvelope
      uri: null
    payload:
      name: docusign-updateEnvelope
      args:
        envelopeId: abc-123
        Status: " Voided "
  output:
    expectedResult: deny
    expectedReason: Voiding a Docusign envelope permanently invalidates a legally significant signed record, so agent-initiated voids are blocked. Prepare a correcting envelope instead, or ask a member of the contract-ops group to perform the void. Contact your administrator if this block looks wrong.
- description: Void attempt where status is voided but voidedReason is empty. Still a
    void. Policy should deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: docusign-updateEnvelope
      uri: null
    payload:
      name: docusign-updateEnvelope
      args:
        envelopeId: abc-123
