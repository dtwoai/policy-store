- description: Spoofing surface — a string-valued groups claim ("contract-ops" as a
    plain string, not an array) does not grant the exemption. Policy should deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: docusign-cancelWorkflowInstance
      uri: null
    payload:
      name: docusign-cancelWorkflowInstance
      args:
        instanceId: wf-instance-9
    subject:
      sub: auth0|agent
      claims:
        groups: contract-ops
  output:
    expectedResult: deny
    expectedReason: Cancelling a running Docusign Maestro workflow instance is irreversible, so agent-initiated cancellations are blocked. Ask a member of the contract-ops group to cancel the instance from the Docusign console. Contact your administrator if this block looks wrong.
- description: Red-team residual (documented limitation) — a void body nested under a
    wrapper key ("envelope") evades the top-level-only argument check. No wrapper shape
    is documented for the official server; this test pins the current pass-through
    behaviour. Policy allows.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: docusign-updateEnvelope
      uri: null
    payload:
      name: docusign-updateEnvelope
      args:
        envelopeId: abc-123
        envelope:
          status: voided
          voidedReason: nested to evade
  output:
    expectedResult: allow
- description: Red-team residual (documented limitation) — an updateEnvelope document
    purge via a "purgeState" field (no status voided, no voidedReason) is a separate
    irreversible destruction that this void-focused policy does not key on. The field
    is unverified in the landscape note; this test pins the current pass-through
    behaviour. Policy allows.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: docusign-updateEnvelope
      uri: null
    payload:
      name: docusign-updateEnvelope
      args:
        envelopeId: abc-123
        purgeState: documents_and_metadata_queued
  output:
    expectedResult: allow
- description: Red-team residual (documented limitation) — a non-string, array-wrapped
    status value (["voided"]) with no voidedReason evades Signal 1's string equality
    check. Not exploitable — the Docusign REST body requires a string status, so this
    malformed shape is rejected server-side and no void occurs; any well-formed void
    carries voidedReason (Signal 2). This test pins the current pass-through behaviour.
    Policy allows.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: docusign-updateEnvelope
      uri: null
    payload:
      name: docusign-updateEnvelope
      args:
        envelopeId: abc-123
        status:
          - voided
  output:
    expectedResult: allow
