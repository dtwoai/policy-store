# --- Red-team residual: SSN buried in a STRUCTURED (object) block ---
- description: Red-team — SSN buried in a structured (object) content block rather
    than a bare string. redact_block only rewrites string blocks, so the non-string
    block passes through unmodified and the SSN inside is not masked (documented
    structured/nested-block residual). No string block changed, so no transform.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: gusto-get_gusto_employee
      uri: null
    payload:
      name: gusto-get_gusto_employee
      text:
        - type: text
          text: "ssn 123-45-6789 here"
  output:
    expectedResult: allow
  transformApplied: false

