    canonical hyphenated SSN form or an account/routing label, so it passes through
    (documented residual — avoids colliding with amounts/IDs).
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: gusto-get_payroll
      uri: null
    payload:
      name: gusto-get_payroll
      text:
        - "internal id 123456789 for the pay run"
  output:
    expectedResult: allow
  transformApplied: false

