# --- Branch: non-string block passthrough (mixed content blocks) ---
- description: Mixed content blocks — a string with an SSN, a non-string structured
    block, and a clean string. Only the matching string is rewritten; the other
    blocks are preserved as-is.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: gusto-get_gusto_employee
      uri: null
    payload:
      name: gusto-get_gusto_employee
      text:
        - "contact ssn: 078-05-1120"
        - type: resource
          uri: gusto://employee/214
        - no financial ids here
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "contact ssn: [REDACTED-FINANCIAL-ID]"
      - type: resource
        uri: gusto://employee/214
      - no financial ids here

# --- FIX: long labelled account run (18 digits) masked in full ---
- description: Labelled account number of 18 digits (longer than a naive bounded
    cap). The greedy unbounded \d{8,} masks the full run rather than failing open
    on over-length runs.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: gusto-get_gusto_employee
      uri: null
    payload:
      name: gusto-get_gusto_employee
      text:
        - "contractor Acme | acct 123456789012345678 | net 30"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "contractor Acme | acct [REDACTED-FINANCIAL-ID] | net 30"

# --- Over-redaction residual (documented label-anchor trade-off) ---
- description: Red-team — an unrelated 8-digit figure that follows the word
    "account" within 12 characters is masked (safe over-masking on egress, never
    disclosure). Documents the label-anchor trade-off.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: gusto-get_payroll
      uri: null
    payload:
      name: gusto-get_payroll
      text:
        - "account balance is 12345678 dollars"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "account balance is [REDACTED-FINANCIAL-ID] dollars"

