    expectedResult: allow
  transformApplied: false

# --- Red-team (fix A): word that BEGINS with a label word is over-masked ---
- description: Red-team — `bankaccount 12345678`. The `\b` anchors only the START
    of the label, so the `bank` prefix at a word boundary matches and the run is
    masked (safe over-masking on egress). Corrects the earlier doc claim that this
    form "passes through". Contrast `subaccount` below, where the label is interior.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: gusto-get_gusto_employee
      uri: null
    payload:
      name: gusto-get_gusto_employee
      text:
        - "bankaccount 12345678 listed"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "bankaccount [REDACTED-FINANCIAL-ID] listed"

# --- Red-team (fix A): label fused directly onto the digits (no separator) ---
- description: Red-team — `account12345678` with no separator between label and
    digits. The connector group matches zero characters, so the run is still
    masked. Documents why a trailing `\b` after the label is deliberately omitted
    (it would fail open on this no-separator form).
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: gusto-get_contractor
      uri: null
    payload:
      name: gusto-get_contractor
      text:
        - "acct87654321 primary"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "acct[REDACTED-FINANCIAL-ID] primary"

# --- Red-team (fix B): SSN with a LETTER fused to the front passes through ---
- description: Red-team — SSN with a non-digit word character (a letter) fused to
    the front (`ref123-45-6789`). Like digit padding, a fused letter breaks the
    leading word boundary, so the value passes through unmasked (documented
    word-boundary residual — now covers letters, not only digits). At egress the
    upstream response text, not the agent, controls this formatting.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: gusto-get_gusto_employee
      uri: null
    payload:
      name: gusto-get_gusto_employee
      text:
        - "ref123-45-6789 stored"
  output:
    expectedResult: allow
  transformApplied: false

