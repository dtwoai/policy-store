    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: gusto-get_gusto_employee
      uri: null
    payload:
      name: gusto-get_gusto_employee
      args:
        query: "find employee with ssn 123-45-6789"
  output:
    expectedResult: allow
  transformApplied: false

