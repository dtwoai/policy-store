# Transform-only policy: every case expects allow. The assertions that matter are
# transformApplied / transformedArgsContain (gate-only keys). This policy is NOT
# tool-name-scoped — it fires on every Gusto egress response — so several cases
# deliberately use different tool names (official, community kebab-case, StackOne
# hris_*) to prove the guard does not depend on a name list.

# --- Branch: is_egress via mode == "output"; SSN class ---
- description: Employee read with a canonical hyphenated SSN. Egress scope matched
    via mode == "output"; the SSN is masked to the fixed token.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: gusto-get_gusto_employee
      uri: null
    payload:
      name: gusto-get_gusto_employee
      text:
        - "employee 214 | ssn 123-45-6789 | dept payroll"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    name: gusto-get_gusto_employee
    text:
      - "employee 214 | ssn [REDACTED-FINANCIAL-ID] | dept payroll"

# --- Branch: is_egress via action only (mode absent) ---
- description: Egress scope matched via the PARC action alone (mode key absent).
    The SSN is still masked, proving the action branch fires independently.
  input:
    action: tool_post_invoke
    resource:
      type: tool
      name: gusto-get_gusto_employee
      uri: null
    payload:
      name: gusto-get_gusto_employee
      text:
        - "ssn 540-12-3456 on file"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "ssn [REDACTED-FINANCIAL-ID] on file"

# --- Branch: is_egress via legacy kind only (mode + action absent) ---
- description: Egress scope matched via the legacy `kind` alias alone (mode and
    action absent) — an older gateway near the minimum version. The SSN is masked.
  input:
    kind: tool_post_invoke
    resource:
      type: tool
      name: gusto-get_gusto_employee
      uri: null
    payload:
      name: gusto-get_gusto_employee
      text:
        - "ssn 078-05-1120 recorded"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "ssn [REDACTED-FINANCIAL-ID] recorded"

# --- Branch: bank account class (account label) + routing class in one block ---
- description: Contractor bank read (community kebab-case tool name) with a
    label-anchored account number and a labelled routing number. Both are masked,
    labels preserved. Proves the policy is not tool-name-scoped.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: gusto-community-get-contractor-bank
      uri: null
    payload:
      name: gusto-community-get-contractor-bank
      text:
        - "contractor Acme | account number: 000123456789 | routing 021000021"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "contractor Acme | account number: [REDACTED-FINANCIAL-ID] | routing [REDACTED-FINANCIAL-ID]"

