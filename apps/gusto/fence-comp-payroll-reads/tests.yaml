# --- Red-team: documented residual bypasses (Known limitations) ---

- description: 'RED-TEAM (documented): community kebab-case name (get-payroll) is NOT the snake_case fenced suffix, so it passes through even with no group. Locks the "Official-server names only" limitation — pin a per-server name list for community servers.'
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: gusto-community-get-payroll
      uri: null
    payload:
      name: gusto-community-get-payroll
      args:
        payrollId: p1
    subject:
      claims:
        groups:
          - engineering
  output:
    expectedResult: allow

- description: 'RED-TEAM (documented): suffix-extension evasion. A versioned/renamed variant (get_payroll_v2) appends text after the fenced base, so endswith does not match and the sensitive read passes through with no group. Locks the "Suffix-extension evasion" limitation.'
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: gusto-mcp-get_payroll_v2
      uri: null
    payload:
      name: gusto-mcp-get_payroll_v2
      args:
        payroll_uuid: p1
    subject:
      claims: {}
  output:
    expectedResult: allow

- description: 'RED-TEAM (documented): aggregator verb (get_employee_compensation) does not end in the fenced get_compensation suffix (preceded by employee_, not get_), so it passes through. Reinforces the suffix-extension / per-server-name-list limitation.'
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: stackone-hris-get_employee_compensation
      uri: null
    payload:
      name: stackone-hris-get_employee_compensation
      args: {}
    subject:
      claims:
        groups:
          - engineering
  output:
    expectedResult: allow

- description: 'RED-TEAM: missing-args probe. No resource.name/payload at all -> is_fenced_read cannot fire, so allow (benign: no tool is being invoked). Confirms the policy does not error on absent fields.'
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
  output:
    expectedResult: allow

- description: 'RED-TEAM: very long server prefix (200+ chars) ending in the fenced get_payroll suffix, no group -> deny. endswith stays correct regardless of prefix length; a long name cannot slip past the fence.'
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-gusto-mcp-get_payroll
      uri: null
    payload:
      name: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-gusto-mcp-get_payroll
      args:
        payroll_uuid: p1
    subject:
      claims:
        groups:
          - engineering
  output:
    expectedResult: deny
    expectedReason: *deny_reason

- description: 'RED-TEAM (documented): trailing-newline suffix edge. get_payroll\n has appended whitespace, so endswith("...get_payroll\n", "get_payroll") is false and it passes through. Documented degenerate case of the suffix-extension limitation; not routable on a real gateway (exact-name dispatch), but locked so a refactor cannot regress silently.'
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: "gusto-mcp-get_payroll\n"
      uri: null
    payload:
      name: "gusto-mcp-get_payroll\n"
      args:
        payroll_uuid: p1
    subject:
      claims: {}
  output:
    expectedResult: allow
