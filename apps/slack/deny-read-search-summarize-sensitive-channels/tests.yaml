- description: Reading a non-sensitive channel's history. Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: slack-mcp-conversations-history
      uri: null
    payload:
      name: slack-mcp-conversations-history
      args:
        channel: C0PUBLIC001
        limit: 50
  output:
    expectedResult: allow
- description: Reading a sensitive channel's history (channel arg matches the
    configured ID). Policy should deny with a reason.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: slack-mcp-conversations-history
      uri: null
    payload:
      name: slack-mcp-conversations-history
      args:
        channel: SLACK_CHANNEL_ID
        limit: 50
  output:
    expectedResult: deny
    expectedReason: Reading, searching, or summarizing this Slack channel is not permitted via this gateway. Contact your InfoSec team if this needs to change.
