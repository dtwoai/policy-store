- description: Official slack_read_user_profile response with no subject at all
    (no IdP configured). Exemption must fail closed, so the redaction transform
    applies. Asserts the exact transform fields.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: slack-mcp-slack_read_user_profile
      uri: null
    tool_metadata:
      name: slack-mcp-slack_read_user_profile
    payload:
      name: slack-mcp-slack_read_user_profile
      text:
        - '{"user_id":"U024BE7LH","display_name":"jane","email":"jane@corp.example","phone":"+1 555 123 4567","fields":{"Xf06":{"value":"Manager: Bob"}}}'
  output:
    expectedResult: allow
  transformApplied: true
  transform:
    redact_fields: ["email", "phone", "fields"]
    replacement: "[REDACTED]"
- description: Caller whose groups claim contains people-ops reads a user
    profile. Exempt — no transform, unredacted profile returned.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: slack-mcp-slack_read_user_profile
      uri: null
    tool_metadata:
      name: slack-mcp-slack_read_user_profile
    subject:
      sub: google-apps|hrbp@corp.example
      claims:
        groups:
          - people-ops
          - everyone
    payload:
      name: slack-mcp-slack_read_user_profile
      text:
        - '{"user_id":"U024BE7LH","email":"jane@corp.example"}'
  output:
    expectedResult: allow
  transformApplied: false
