- description: Official send tool to a listed Slack Connect channel, no identity.
    Policy should deny with the external-channel reason.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: slack-mcp-slack_send_message
      uri: null
    payload:
      name: slack-mcp-slack_send_message
      args:
        channel_id: C0EXTPARTNER1
        message: Q3 roadmap attached
  output:
    expectedResult: deny
    expectedReason: This channel is shared externally via Slack Connect — a message posted here is visible to another organization the moment it lands and cannot be recalled. Posting to externally shared channels requires a human send from the Slack client. If your role requires agent posts to external channels, ask your InfoSec team for the slack-external-comms group; if this channel is no longer externally shared, ask your Slack workspace admin to remove it from the external channel list.
