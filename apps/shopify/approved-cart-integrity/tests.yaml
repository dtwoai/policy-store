# case: allow
- description: ENFORCE phase. complete_checkout submits exactly the cart the buyer
    approved (prod_sweater x2) against exactly the checkout the approval was
    recorded for (chk_9f2b). The approved baseline and checkout id were
    recorded in a prior update_checkout (status=ready_for_complete) observe
    step and are pre-populated here under the policy's own writer namespace in
    input.context.session.policies. The submitted line items normalize to the
    same {id,item_id,quantity} set as the baseline and the checkout ids match,
    so the policy allows — and CONSUMES the approval (single-use) by emitting
    session writes that clear it, making a replayed completion fail closed.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    subject:
      claims:
        sub: buyer-123
        iss: https://login.example.com/
    resource:
      type: tool
      name: shopify-mcp-complete_checkout
      uri: null
    payload:
      name: complete_checkout
      args:
        checkout:
          id: chk_9f2b
          status: complete_in_progress
          currency: USD
          line_items:
            - id: li_1
              item:
                id: prod_sweater
                title: Merino Sweater
                price: 8900
              quantity: 2
              totals:
                - type: total
                  amount: 17800
    context:
      session:
        _meta:
          created_at: 2026-06-27T10:00:00Z
          last_accessed: 2026-06-27T10:05:00Z
        policies:
          approved-cart-integrity:
            approval_recorded: true
            approved_checkout_id: chk_9f2b
            approved_line_items:
              - id: li_1
                item_id: prod_sweater
                quantity: 2
  output:
    expectedResult: allow
  # Consume-on-complete: the allowed completion clears the approval so it is
  # single-use. (expectedSessionWrites is a gate-only assertion key, ignored by
  # the published schema; verified against data.<pkg>.session_writes.)
  expectedSessionWrites:
    approval_recorded: false
    approved_line_items: []
    approved_checkout_id: ""
# case: deny-slugified
- description: "Live-gateway shape: the gateway federates tools as
    \"<server-prefix>-<op>\" and slugifies underscores to hyphens, so the tool
    arrives as \"ucp-shop-complete-checkout\" — no underscore survives. This
    fixture proves the policy still matches (an underscore-only suffix match
    would fail open here). Scenario otherwise identical to deny.json: ENFORCE
    phase, prompt-injection / Unit 42 gift-card scenario. The buyer approved
    prod_sweater x2 (recorded in a prior observe step, pre-populated under the
    policy's own writer namespace in input.context.session.policies). After
    approval, a poisoned tool result convinced the agent to add an unapproved
    $500 gift card to the cart. complete_checkout now submits prod_sweater x2
    PLUS prod_giftcard_500 x1. The submitted set diverges from the approved
    baseline set, so the policy denies."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    subject:
      claims:
        sub: buyer-123
        iss: https://login.example.com/
    resource:
      type: tool
      name: ucp-shop-complete-checkout
      uri: null
    payload:
      name: ucp-shop-complete-checkout
      args:
        checkout:
          id: chk_9f2b
          status: complete_in_progress
          currency: USD
          line_items:
            - id: li_1
              item:
                id: prod_sweater
                title: Merino Sweater
                price: 8900
              quantity: 2
              totals:
                - type: total
                  amount: 17800
            - id: li_2
              item:
                id: prod_giftcard_500
                title: Gift Card $500
                price: 50000
              quantity: 1
              totals:
                - type: total
                  amount: 50000
    context:
      session:
        _meta:
          created_at: 2026-06-27T10:00:00Z
          last_accessed: 2026-06-27T10:05:00Z
        policies:
          approved-cart-integrity:
            approval_recorded: true
            approved_checkout_id: chk_9f2b
            approved_line_items:
              - id: li_1
                item_id: prod_sweater
                quantity: 2
  output:
    expectedResult: deny
    expectedReason: Checkout completion does not match the cart the buyer approved.
      The submitted line items diverge from the approved baseline recorded at
      approval time.
# case: deny-checkout-mismatch
- description: ENFORCE phase, checkout-binding scenario. A valid approval is on
    file for checkout chk_9f2b, but the completion arrives for a DIFFERENT
    checkout (chk_e77a) carrying line items identical to the approved
    baseline. Content equality is not enough — the approval is bound to the
    checkout id it was recorded on, so a stale approval from an abandoned
    checkout can never authorize a new one. The policy denies with a reason
    naming both ids.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    subject:
      claims:
        sub: buyer-123
        iss: https://login.example.com/
    resource:
      type: tool
      name: shopify-mcp-complete_checkout
      uri: null
    payload:
      name: complete_checkout
      args:
        checkout:
          id: chk_e77a
          status: complete_in_progress
          currency: USD
          line_items:
            - id: li_1
              item:
                id: prod_sweater
                title: Merino Sweater
                price: 8900
              quantity: 2
              totals:
                - type: total
                  amount: 17800
    context:
      session:
        _meta:
          created_at: 2026-06-27T10:00:00Z
          last_accessed: 2026-06-27T10:05:00Z
        policies:
          approved-cart-integrity:
            approval_recorded: true
            approved_checkout_id: chk_9f2b
            approved_line_items:
              - id: li_1
                item_id: prod_sweater
                quantity: 2
  output:
    expectedResult: deny
    expectedReason: 'Checkout completion is not bound to the recorded approval:
      the buyer''s approval was recorded for checkout id "chk_9f2b", but this
      completion targets checkout id "chk_e77a". An approval authorizes only
      the checkout it was given on; record a fresh approval for this checkout.'
# case: deny-replay
- description: ENFORCE phase, replay / double-completion scenario. A prior
    complete_checkout for this cart already succeeded and CONSUMED the
    approval — the session state shows the cleared marker the consume writes
    leave behind (approval_recorded false, emptied baseline and checkout id).
    An identical completion is replayed. With no live approval on file the
    policy fails closed and denies, exactly as it would for a completion that
    never had an approval.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    subject:
      claims:
        sub: buyer-123
        iss: https://login.example.com/
    resource:
      type: tool
      name: shopify-mcp-complete_checkout
      uri: null
    payload:
      name: complete_checkout
      args:
        checkout:
          id: chk_9f2b
          status: complete_in_progress
          currency: USD
          line_items:
            - id: li_1
              item:
                id: prod_sweater
                title: Merino Sweater
                price: 8900
              quantity: 2
              totals:
                - type: total
                  amount: 17800
    context:
      session:
        _meta:
          created_at: 2026-06-27T10:00:00Z
          last_accessed: 2026-06-27T10:06:00Z
        policies:
          approved-cart-integrity:
            approval_recorded: false
            approved_checkout_id: ""
            approved_line_items: []
  output:
    expectedResult: deny
    expectedReason: 'Checkout completion blocked: no live human-approved cart is
      on file for this session. Approvals are single-use and are consumed by a
      successful completion; approval must be recorded (update_checkout ->
      ready_for_complete) before each completion.'
