    flattened form as a fallback, so a restricted SKU there still denies. Same
    restricted SKU-by-id scenario as deny.json."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: shopify-mcp-7f3a-complete_checkout
      uri: null
    payload:
      name: shopify-mcp-7f3a-complete_checkout
      args:
        currency: USD
