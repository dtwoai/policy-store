# Generated from the tests/*.json fixtures (same PARC inputs, runner schema).
- description: complete_checkout (canonical args.checkout shape) with only
    ordinary items. The restricted_skus list (DTwo-supplied at input.context)
    does not match any line item id, no restricted title keyword, no restricted
    warning. Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: shopify-mcp-7f3a-complete_checkout
      uri: null
    payload:
      name: shopify-mcp-7f3a-complete_checkout
      args:
        checkout:
          currency: USD
          status: ready_for_complete
          continue_url: https://merchant.example.com/checkout/chk_01HZX5VQ80
          totals:
            - type: subtotal
              amount: 500
            - type: total
              amount: 500
              display_text: $5.00
          line_items:
            - id: li_1
              quantity: 2
              item:
                id: SKU-PEN-014
                title: Ballpoint Pen
                price: 250
              totals:
                - type: total
                  amount: 500
          messages:
            - type: info
              code: free_shipping_applied
          buyer:
            first_name: Ada
            last_name: Lovelace
            email: ada@example.com
            phone_number: "+14155550101"
    context:
      restricted_skus:
        - SKU-RESTRICTED-001
    subject:
      claims:
        sub: agent-7
        iss: https://auth.example.com/
  output:
    expectedResult: allow
- description: 'Live-gateway shape: the gateway federates tools as
    "<server-prefix>-<op>" and slugifies underscores to hyphens, so the tool
    arrives as "ucp-shop-complete-checkout" — no underscore survives. This
    fixture proves the policy still matches (an underscore-only suffix match
    would fail open here). Scenario otherwise identical to deny.json:
    complete_checkout whose checkout.line_items (canonical args.checkout shape)
    contain a DTwo-supplied restricted SKU (input.context.restricted_skus).
    Policy should deny and name the restricted item id. Tool name is read from
    input.resource.name (suffix-matched), never input.payload.name.'
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: ucp-shop-complete-checkout
      uri: null
    payload:
      name: ucp-shop-complete-checkout
      args:
        checkout:
          currency: USD
          status: ready_for_complete
          continue_url: https://merchant.example.com/checkout/chk_01HZX5VQ7B
          totals:
            - type: subtotal
              amount: 4999
            - type: total
              amount: 4999
              display_text: $49.99
          line_items:
            - id: li_1
              quantity: 1
              item:
                id: SKU-RESTRICTED-001
                title: Field Knife
                price: 4999
              totals:
                - type: total
                  amount: 4999
          buyer:
            first_name: Ada
            last_name: Lovelace
            email: ada@example.com
            phone_number: "+14155550101"
    context:
      restricted_skus:
        - SKU-RESTRICTED-001
    subject:
      claims:
        sub: agent-7
        iss: https://auth.example.com/
  output:
    expectedResult: deny
    expectedReason: Item 'SKU-RESTRICTED-001' is in a restricted category your
      agents may not purchase. Contact your procurement team if this needs to
      change.
- description: "Fallback arg shape: some servers accept line_items at the TOP
