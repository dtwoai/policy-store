        continue_url: https://merchant.example.com/checkout/chk_01HZX5VQ7B
        totals:
          - type: subtotal
            amount: 4999
          - type: total
            amount: 4999
            display_text: $49.99
        line_items:
          - id: li_1
            quantity: 1
            item:
              id: SKU-RESTRICTED-001
              title: Field Knife
              price: 4999
            totals:
              - type: total
                amount: 4999
        buyer:
          first_name: Ada
          last_name: Lovelace
          email: ada@example.com
          phone_number: "+14155550101"
    context:
      restricted_skus:
        - SKU-RESTRICTED-001
    subject:
      claims:
        sub: agent-7
        iss: https://auth.example.com/
  output:
    expectedResult: deny
    expectedReason: Item 'SKU-RESTRICTED-001' is in a restricted category your
      agents may not purchase. Contact your procurement team if this needs to
      change.
