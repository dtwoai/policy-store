# case: allow
- description: "Egress response from a Shopify UCP get_checkout on the output
    path. In scope (tool name suffix-matches get_checkout under the non-standard
    gateway prefix), so the policy returns allow=true together with the
    redaction transform. This fixture inspects the transform shape:
    redact_fields must list the buyer contact and fulfillment destination postal
    address field names, with replacement [REDACTED] and an empty
    redact_patterns (no free-text scanning)."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    subject:
      claims:
        sub: agent-7f3c
        groups:
          - commerce-agents
    resource:
      type: tool
      name: ucp-shopify-prod-get_checkout
      uri: null
    payload:
      name: ucp-shopify-prod-get_checkout
      args:
        checkout_id: chk_8842
      result:
        id: chk_8842
        status: ready_for_complete
        currency: USD
        continue_url: https://shop.example.com/checkout/chk_8842
        buyer:
          first_name: Sam
          last_name: Okafor
          email: sam.okafor@example.com
          phone_number: "+442071234567"
        fulfillment:
          methods:
            - destinations:
                - street_address: 10 Downing St
                  address_locality: London
                  address_country: GB
                  postal_code: SW1A 2AA
        totals:
          - type: subtotal
            amount: 4500
          - type: total
            amount: 4900
            display_text: £49.00
  output:
    expectedResult: allow
  transformApplied: true
  transform:
    replacement: "[REDACTED]"
    redact_patterns: []
    redact_fields:
      - email
      - phone_number
      - street_address
      - extended_address
      - address_locality
      - address_region
      - address_country
      - postal_code
# case: deny
- description: Out-of-scope egress response. The tool name suffix-matches
    search_catalog, not get_order / get_checkout, so the policy applies no
    transform and the response is returned unchanged. This policy is
    transform-only and never denies; 'deny' here means 'no redaction transform'
    (pass-through), which is the negative case for a transform policy.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    subject:
      claims:
        sub: agent-7f3c
        groups:
          - commerce-agents
    resource:
      type: tool
      name: shopify-mcp-server-search_catalog
      uri: null
    payload:
      name: shopify-mcp-server-search_catalog
      args:
        query: earbuds
      result:
        products:
          - id: prod_22
            title: Wireless Earbuds
            price: 7999
  output:
    expectedResult: allow
  transformApplied: false
# case: redact-slugified
- description: 'Live-gateway shape: the gateway federates tools as
    "<server-prefix>-<op>" and slugifies underscores to hyphens, so the tool
    arrives as "ucp-shop-get-order" — no underscore survives. This fixture
    proves the policy still matches (an underscore-only suffix match would fail
    open here). Scenario otherwise identical to redact.json: Egress response
    from a Shopify UCP get_order on the output path. Tool name suffix-matches
    get_order (despite the non-standard gateway server prefix), so the policy is
    in scope and returns a redaction transform that masks buyer.email,
    buyer.phone_number, and the fulfillment destination postal address fields in
    input.payload.result. Order economics (totals, currency, line_items) and
    continue_url are left intact.'
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    subject:
      claims:
        sub: agent-7f3c
        groups:
          - commerce-agents
    resource:
      type: tool
      name: ucp-shop-get-order
      uri: null
    payload:
      name: ucp-shop-get-order
      args:
        order_id: ord_01J9X
      result:
        id: ord_01J9X
        status: completed
        currency: USD
        continue_url: https://shop.example.com/checkout/ord_01J9X/return
        buyer:
          first_name: Jordan
          last_name: Rivera
          email: jordan.rivera@example.com
          phone_number: "+14155551234"
        fulfillment:
          methods:
            - destinations:
                - street_address: 500 Market St
                  extended_address: Suite 400
                  address_locality: San Francisco
                  address_region: CA
                  address_country: US
                  postal_code: "94105"
        line_items:
          - id: li_1
            item:
              id: prod_22
              title: Wireless Earbuds
              price: 7999
            quantity: 1
            totals:
              - type: total
                amount: 7999
        totals:
          - type: subtotal
            amount: 7999
          - type: total
            amount: 8499
            display_text: $84.99
  output:
    expectedResult: allow
  transformApplied: true
  transform:
    replacement: "[REDACTED]"
