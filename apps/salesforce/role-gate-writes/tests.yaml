- description: Create tool for a caller outside the approved groups is denied.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: salesforce-createSobjectRecord
      uri: null
    subject:
      sub: auth0|intern@example.com
      claims:
        groups:
          - marketing
    payload:
      name: salesforce-createSobjectRecord
      args:
        sobject-name: Opportunity
        body:
          Amount: 50000
  output:
    expectedResult: deny
    expectedReason: "The tool 'salesforce-createsobjectrecord' creates or updates Salesforce records, which is limited to members of the sales or support groups on this channel. Ask an approved team member to make the change, or request membership in the appropriate group. Contact your InfoSec team if this block is a false positive."

