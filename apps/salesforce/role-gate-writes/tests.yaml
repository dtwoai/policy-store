# --- Red-team regression cases (standards §10) ---

- description: Red-team - FLS-management tool under the salesforce- prefix fails closed (privileged write not in write list).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: salesforce-salesforce_manage_field_permissions
      uri: null
    payload:
      name: salesforce-salesforce_manage_field_permissions
      args:
        operation: grant
        field: SSN__c
  output:
    expectedResult: deny
    expectedReason: "The Salesforce tool 'salesforce-salesforce_manage_field_permissions' is not on this gateway's recognized read, create/update, or delete list, so it is denied by default (fail closed). If this is a legitimate Salesforce tool, add its name suffix to the policy's read or write list. Contact your InfoSec team to review."

