- description: tsmztech insert of two call Tasks on contacts — allow.
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: sf-salesforce_dml_records, uri: null }
    payload:
      args:
        operation: insert
        objectName: Task
        records:
          - { Subject: Call 1, TaskSubtype: Call, WhoId: 003Ak00000Ab1CdIAJ }
          - { Subject: Call 2, TaskSubtype: Call, WhoId: 003Ak00000Zz9YxIAJ }
  output:
    expectedResult: allow
- description: Contact update — deny with the read-only reason.
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: salesforce-updateSobjectRecord, uri: null }
    payload:
      args: { sobject-name: Contact, record-id: 003Ak00000Ab1CdIAJ, body: { Title: VP } }
  output:
    expectedResult: deny
    expectedReason: "Blocked: Salesforce is read-only through this gateway. The only change allowed is logging a call note on a contact (a Task with type Call, or a Note, attached to a Contact). Ask your admin if you need anything else changed in Salesforce."
