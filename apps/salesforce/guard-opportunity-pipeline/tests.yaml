- description: Read tool (not a matched update tool). Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: salesforce-soql_query
      uri: null
    payload:
      name: salesforce-soql_query
      args:
        query: SELECT Id, StageName FROM Opportunity LIMIT 5
  output:
    expectedResult: allow

- description: Hosted updateSobjectRecord moving Opportunity StageName and Amount, caller not a sales manager. Deny naming the offending fields.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: salesforce-updatesobjectrecord
      uri: null
    payload:
      name: salesforce-updatesobjectrecord
      args:
        sobject-name: Opportunity
        id: 006xx0000000001
        body:
          StageName: Closed Won
          Amount: 250000
    subject:
      claims:
        groups:
          - sales-reps
  output:
    expectedResult: deny
    expectedReason: "Moving an Opportunity's pipeline is restricted: this update changes amount, stagename. Route revenue-pipeline changes through a sales manager (IdP group \"sales-managers\") or complete the stage move in the Salesforce UI approval flow."

