# Reason strings asserted below:
#   SOQL cap:   "Salesforce queries (SOQL) must end with a 'LIMIT' clause of 200 rows or fewer. Add 'LIMIT 200' (or lower) to the end of your query, and page or narrow the query if you need more."
#   SOSL cap:   "Salesforce searches (SOSL) must end with a 'LIMIT' clause of 50 results or fewer. Add 'LIMIT 50' (or lower) to the end of your search, and narrow the search term if what you need isn't in the first 50."
#   No query:   "This Salesforce query tool was called without query text, so its scope cannot be verified and it is blocked. Provide the SOQL you want to run."
#   No search:  "This Salesforce search tool was called without search text, so it is blocked. Provide the SOSL search you want to run."

#   (COUNT() queries are exempt)

# --- SOQL (hosted GA shape: salesforce-soqlquery with `q`) ---
- description: Hosted soqlQuery on Contact with LIMIT 1 — allow.
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: salesforce-soqlquery, uri: null }
    payload:
      args: { q: "SELECT Id, Name, Email FROM Contact WHERE Email = 'jane@example.com' LIMIT 1" }
  output:
    expectedResult: allow
- description: Hosted soqlQuery on Lead at exactly LIMIT 200 — allow (boundary).
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: salesforce-soqlquery, uri: null }
    payload:
      args: { q: "SELECT Id, Email FROM Lead WHERE Status = 'Open' LIMIT 200" }
  output:
    expectedResult: allow
- description: Hosted soqlQuery on Account at LIMIT 201 — deny (boundary).
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: salesforce-soqlquery, uri: null }
    payload:
      args: { q: "SELECT Id, Name FROM Account LIMIT 201" }
  output:
    expectedResult: deny
    expectedReason: "Salesforce queries (SOQL) must end with a 'LIMIT' clause of 200 rows or fewer. Add 'LIMIT 200' (or lower) to the end of your query, and page or narrow the query if you need more."
- description: Hosted soqlQuery on Lead with no LIMIT (WHERE filter only) — deny.
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: salesforce-soqlquery, uri: null }
    payload:
      args: { q: "SELECT Id, Email, Phone FROM Lead WHERE CreatedDate = LAST_N_DAYS:30" }
  output:
    expectedResult: deny
    expectedReason: "Salesforce queries (SOQL) must end with a 'LIMIT' clause of 200 rows or fewer. Add 'LIMIT 200' (or lower) to the end of your query, and page or narrow the query if you need more."
- description: Paging with LIMIT 200 OFFSET 400 — allow (per-call cap only).
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: salesforce-soqlquery, uri: null }
    payload:
      args: { q: "SELECT Id, Name FROM Contact ORDER BY Name LIMIT 200 OFFSET 400" }
  output:
    expectedResult: allow
- description: Opportunity query with no LIMIT — deny (the cap applies to every object).
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: salesforce-soqlquery, uri: null }
    payload:
      args: { q: "SELECT Id, Name, StageName, Amount FROM Opportunity WHERE IsClosed = false" }
  output:
    expectedResult: deny
    expectedReason: "Salesforce queries (SOQL) must end with a 'LIMIT' clause of 200 rows or fewer. Add 'LIMIT 200' (or lower) to the end of your query, and page or narrow the query if you need more."
- description: Custom object query at LIMIT 200 — allow.
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: salesforce-soqlquery, uri: null }
    payload:
      args: { q: "SELECT Id, Name FROM Fleet_Vehicle__c LIMIT 200" }
  output:
    expectedResult: allow
- description: Bare SELECT COUNT() with no LIMIT — allow (returns one number, not records).
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: salesforce-soqlquery, uri: null }
    payload:
      args: { q: "SELECT COUNT() FROM Contact WHERE MailingState = 'CA'" }
  output:
    expectedResult: allow
- description: GROUP BY aggregate with no LIMIT — deny (only bare COUNT() is exempt).
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: salesforce-soqlquery, uri: null }
    payload:
      args: { q: "SELECT StageName, COUNT(Id) FROM Opportunity GROUP BY StageName" }
  output:
    expectedResult: deny
- description: Outer Account read with an in-bound subquery LIMIT but no outer LIMIT — deny (subquery LIMIT doesn't count).
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: salesforce-soqlquery, uri: null }
    payload:
      args: { q: "SELECT Id, Name, (SELECT Id FROM Contacts LIMIT 5) FROM Account" }
  output:
    expectedResult: deny
- description: LIMIT faked inside a WHERE string literal — deny.
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: salesforce-soqlquery, uri: null }
    payload:
      args: { q: "SELECT Id FROM Contact WHERE LastName = 'LIMIT 5'" }
  output:
    expectedResult: deny
- description: Lowercase query with trailing whitespace and LIMIT 10 — allow.
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: Salesforce-SOQLQuery, uri: null }
    payload:
      args: { q: "  select id from contact limit 10  " }
  output:
    expectedResult: allow
- description: Hosted soqlQuery with no query text — deny (fail closed).
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: salesforce-soqlquery, uri: null }
    payload:
      args: { q: "   " }
  output:
    expectedResult: deny
    expectedReason: "This Salesforce query tool was called without query text, so its scope cannot be verified and it is blocked. Provide the SOQL you want to run."

# --- SOQL (community shapes) ---
- description: smn2gnt run_soql_query using `query` key, Contact LIMIT 50 — allow.
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: sf-community-run_soql_query, uri: null }
    payload:
      args: { query: "SELECT Id, Name FROM Contact LIMIT 50" }
  output:
    expectedResult: allow
- description: tsmztech salesforce_query_records using `query` key, Lead with no LIMIT — deny.
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: sf-salesforce_query_records, uri: null }
    payload:
      args: { query: "SELECT Id, Email FROM Lead" }
  output:
    expectedResult: deny

# --- SOSL (hosted GA shape: salesforce-find with `q`) ---
- description: Hosted find with overall LIMIT 50 — allow (boundary).
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: salesforce-find, uri: null }
    payload:
      args: { q: "FIND {Acme*} IN NAME FIELDS RETURNING Account(Id, Name), Contact(Id, Name) LIMIT 50" }
  output:
    expectedResult: allow
- description: Hosted find with LIMIT 10 followed by UPDATE TRACKING — allow.
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: salesforce-find, uri: null }
    payload:
      args: { q: "FIND {jane} RETURNING Contact(Id, Email) LIMIT 10 UPDATE TRACKING" }
  output:
    expectedResult: allow
- description: Hosted find with LIMIT 51 — deny (boundary).
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: salesforce-find, uri: null }
    payload:
      args: { q: "FIND {Acme*} RETURNING Account(Id, Name) LIMIT 51" }
  output:
    expectedResult: deny
    expectedReason: "Salesforce searches (SOSL) must end with a 'LIMIT' clause of 50 results or fewer. Add 'LIMIT 50' (or lower) to the end of your search, and narrow the search term if what you need isn't in the first 50."
- description: Hosted find with no LIMIT — deny.
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: salesforce-find, uri: null }
    payload:
      args: { q: "FIND {\"Joe Smith\"}" }
  output:
    expectedResult: deny
    expectedReason: "Salesforce searches (SOSL) must end with a 'LIMIT' clause of 50 results or fewer. Add 'LIMIT 50' (or lower) to the end of your search, and narrow the search term if what you need isn't in the first 50."
- description: Hosted find with only per-object RETURNING limits and no overall LIMIT — deny.
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: salesforce-find, uri: null }
    payload:
      args: { q: "FIND {Acme*} RETURNING Account(Id, Name LIMIT 10), Contact(Id, Name LIMIT 10)" }
  output:
    expectedResult: deny
- description: LIMIT smuggled inside the search term braces — deny.
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: salesforce-find, uri: null }
    payload:
      args: { q: "FIND {acme LIMIT 5}" }
  output:
    expectedResult: deny
- description: Hosted find with empty search text — deny (fail closed).
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: salesforce-find, uri: null }
    payload:
      args: { q: "" }
  output:
    expectedResult: deny
    expectedReason: "This Salesforce search tool was called without search text, so it is blocked. Provide the SOSL search you want to run."
- description: No IdP groups needed — a caller with no claims at all can run a bounded search.
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: salesforce-find, uri: null }
    subject: { sub: "auth0|rep@example.com", claims: {} }
    payload:
      args: { q: "FIND {renewal} RETURNING Opportunity(Id, Name) LIMIT 25" }
  output:
    expectedResult: allow

