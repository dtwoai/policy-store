- description: >-
    Red-team (documented limitation) — the suekou community server uses an
    underscore prefix (notion_), so a raw user-list tool named
    notion_get_users does NOT match the hyphenated -get-users suffix and passes
    through. This asserts the documented bypass: on that server you must extend
    the suffix match (see Known limitations).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: notion_get_users
      uri: null
    subject:
      sub: auth0|dev
      claims:
        groups:
          - engineering
    payload:
      name: notion_get_users
      args: {}
  output:
    expectedResult: allow
- description: >-
    Red-team (documented limitation) — the awkoy community server funnels every
    operation, including user reads, through a single notion_execute meta-tool.
    Tool-name matching cannot fence it: notion_execute does not end in
    -get-users, so a user-directory read smuggled via {operation, payload}
    passes through. Mitigation is to block that server in gateway config (see
    Known limitations), not this policy.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: notion-notion_execute
      uri: null
    subject:
      sub: auth0|dev
      claims:
        groups:
          - engineering
    payload:
      name: notion-notion_execute
      args:
        operation: users.list
        payload: {}
  output:
    expectedResult: allow
