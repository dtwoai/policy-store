- description: "Red-team DOCUMENTED residual: notion-get-async-task returns the eventual result of async operations (can carry page content) but is NOT in pii_read_suffixes — no transform, content passes through unredacted (add the suffix if your deployment relies on async-task content reads)."
  input:
