      claims:
        groups:
          - eng
    payload:
      name: notion-notion-search
      text:
        - "Match in page 'Vendors': billing contact ops.lead@example.co.uk"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "Match in page 'Vendors': billing contact [REDACTED-EMAIL]"

