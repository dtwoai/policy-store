- description: "Red-team DOCUMENTED residual: a phone number with a directly-appended extension (206-555-0100x123) escapes the trailing word-boundary anchor and is NOT matched — the leading digits pass through unredacted (best-effort pattern residual; the anchor is deliberate so the pattern does not fire inside longer ID/digit runs)."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
