# Egress transform policy (default allow := true) — allow is always true; the
# meaningful assertions are transformApplied / transformedArgsContain. Cases
# cover every rule branch: each detection class independently (email, phone)
# and both together, every in-scope tool suffix, the resource.name /
# tool_metadata.name / payload.name candidate surfaces, both group-exemption
# forms (hr and legal, array and bare-string), case-insensitive matching,
# fail-closed on missing/oddly-shaped claims, out-of-scope tools (including
# the deliberate notion-get-users exclusion), non-string blocks,
# conservative-regex negatives (UUID page IDs / dates / version strings), and
# the ingress guard.

- description: In-scope notion-fetch, non-exempt caller — email and phone are both redacted in place; surrounding page text is kept.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: notion-notion-fetch
      uri: null
    subject:
      sub: auth0|u1
      claims:
        groups:
          - marketing
    payload:
      name: notion-notion-fetch
      text:
        - "Candidate contact: jane@acme.com or 206-555-0100"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "Candidate contact: [REDACTED-EMAIL] or [REDACTED-PHONE]"

- description: Lone email in a notion-search snippet is redacted on its own — no pairing required.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: notion-notion-search
      uri: null
    subject:
