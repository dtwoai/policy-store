# --- Red-team-style hardening cases (standards §10 anticipation) ---

- description: "Red-team: egress with action=tool_post_invoke but mode unset — is_egress still matches on action, so redaction fires (no fail-open leak)."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    resource:
      type: tool
      name: notion-notion-fetch
      uri: null
    subject:
      sub: auth0|u19
      claims:
        groups:
          - eng
    payload:
      name: notion-notion-fetch
      text:
        - "Contact jane@acme.com"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "Contact [REDACTED-EMAIL]"

- description: "Red-team: uppercase tool name NOTION-NOTION-FETCH is still matched — tool matching is case-insensitive."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: NOTION-NOTION-FETCH
      uri: null
    subject:
      sub: auth0|u20
      claims:
        groups:
          - eng
    payload:
      name: NOTION-NOTION-FETCH
      text:
        - "Contact jane@acme.com"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "Contact [REDACTED-EMAIL]"

- description: "Red-team: object-shaped groups claim {department: hr} must NOT grant the exemption — the is_array guard fails it closed, so redaction still applies."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: notion-notion-fetch
      uri: null
    subject:
      sub: auth0|u21
      claims:
        groups:
          department: hr
    payload:
      name: notion-notion-fetch
      text:
        - "Contact jane@acme.com"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "Contact [REDACTED-EMAIL]"

- description: "Red-team: nested-array groups [[hr]] is not a flat array of strings — the is_string(g) guard fails it closed (not exempt), redaction applies."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: notion-notion-fetch
      uri: null
    subject:
      sub: auth0|u22
      claims:
        groups:
          - - hr
    payload:
      name: notion-notion-fetch
      text:
        - "Contact jane@acme.com"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "Contact [REDACTED-EMAIL]"

- description: "Red-team: page body delivered as MCP-standard structured text blocks {type:text, text:...} — the inner `text` is redacted and `type` preserved."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: notion-notion-fetch
      uri: null
    subject:
      sub: auth0|u23
      claims:
        groups:
          - eng
    payload:
      name: notion-notion-fetch
      text:
        - type: text
          text: "Candidate contact: jane@acme.com or 206-555-0100"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - text: "Candidate contact: [REDACTED-EMAIL] or [REDACTED-PHONE]"
        type: text

- description: "Red-team: mixed content-block array — one plain string and one MCP {type,text} object, both carrying PII — every block is redacted regardless of shape."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: notion-notion-query-meeting-notes
      uri: null
    subject:
      sub: auth0|u24
      claims:
        groups:
          - support
    payload:
      name: notion-notion-query-meeting-notes
      text:
        - "Plain block phone 206-555-0100"
        - type: text
          text: "Object block email ops.lead@example.co.uk"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "Plain block phone [REDACTED-PHONE]"
      - text: "Object block email [REDACTED-EMAIL]"
        type: text

- description: "Red-team DOCUMENTED residual: a structured block with NO string `text` key (custom {column,value} query-row shape) passes through untouched — PII under other keys is out of the policy's claim, so no transform even with an email in `value`."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: notion-notion-query-data-sources
      uri: null
    subject:
      sub: auth0|u25
      claims:
        groups:
          - eng
    payload:
      name: notion-notion-query-data-sources
      text:
        - column: email
          value: "jane@acme.com"
  output:
    expectedResult: allow
  transformApplied: false

- description: "Red-team DOCUMENTED residual: off-spec scalar `text` (a bare string, not an array) fails the is_array transform guard — no transform fires and the email passes through (fail-open on a shape off the documented gateway contract)."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: notion-notion-fetch
      uri: null
    subject:
      sub: auth0|u26
      claims:
        groups:
          - eng
    payload:
      name: notion-notion-fetch
      text: "Contact jane@acme.com"
  output:
    expectedResult: allow
  transformApplied: false

- description: "Red-team DOCUMENTED residual: notion-query-database-view returns database rows but is NOT in pii_read_suffixes — no transform, content passes through unredacted (add the suffix if your deployment relies on view reads)."
