- description: People search with per_page 100 — clamped to 50; other args preserved.
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: apollo-apollo_mixed_people_api_search, uri: null }
    payload:
      args: { person_titles: ["VP Sales"], per_page: 100, page: 2 }
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain: { per_page: 50, page: 2, person_titles: ["VP Sales"] }
