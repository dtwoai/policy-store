- description: Creating a contact — deny.
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: apollo-apollo_contacts_create, uri: null }
    payload:
      args: { first_name: Jane, last_name: Doe, organization_name: Acme }
  output:
    expectedResult: deny
    expectedReason: "Blocked: Apollo is read-only through this gateway. You can search and enrich, but creating or changing records, adding people to sequences, and sending emails have to be done in Apollo by a person."
- description: Updating an account — deny.
