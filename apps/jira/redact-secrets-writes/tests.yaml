- description: Read tool (getJiraIssue) is out of scope even if args look secret.
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: atlassian-getJiraIssue, uri: null }
    payload:
      args: { cloudId: acme, issueIdOrKey: "token=abc123" }
