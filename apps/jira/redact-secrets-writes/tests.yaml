- description: transitionJiraIssue with a comment in update — the comment body is masked.
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: atlassian-transitionJiraIssue, uri: null }
    payload:
      args:
        cloudId: acme
        issueIdOrKey: PLAT-412
        transition: { id: "31" }
        update:
          comment:
            - add: { body: "fixed, password: s3cr3t!" }
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    update:
      comment:
        - add: { body: "fixed, [REDACTED-SECRET]" }

- description: PEM private key block in a description — the whole block is masked.
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: atlassian-createJiraIssue, uri: null }
    payload:
      args: { cloudId: acme, projectKey: SEC, issueTypeName: Task, summary: Rotate, description: "old key:\n-----BEGIN RSA PRIVATE KEY-----\nMIIEow\nabc\n-----END RSA PRIVATE KEY-----\ndone" }
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    description: "old key:\n[REDACTED-SECRET]\ndone"

- description: Community mcp-atlassian jira_add_comment — masked.
