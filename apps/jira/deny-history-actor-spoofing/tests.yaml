- description: Non-transition read tool (getjiraissue). Not in scope. Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: atlassian-getjiraissue
      uri: null
    payload:
      name: atlassian-getjiraissue
      args:
        issueIdOrKey: DEV-7
  output:
    expectedResult: allow
- description: Transition with no historyMetadata — a normal workflow move. Policy
    should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: atlassian-transitionjiraissue
      uri: null
    payload:
      name: atlassian-transitionjiraissue
      args:
        issueIdOrKey: DEV-7
        transition:
          id: "31"
  output:
    expectedResult: allow
- description: Transition with a full historyMetadata block (spoofed actor + cause).
    Policy should deny with the spoofing reason.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: atlassian-transitionjiraissue
      uri: null
    payload:
      name: atlassian-transitionjiraissue
      args:
        issueIdOrKey: DEV-7
        transition:
          id: "31"
        historyMetadata:
          actor:
            displayName: Jane Approver
            avatarUrl: https://example.com/jane.png
          cause:
            displayName: quarterly review
          generator:
            displayName: workflow-bot
  output:
    expectedResult: deny
    expectedReason: This Jira write call includes a historyMetadata block, which lets the caller stamp a fabricated actor, cause, or generator onto the issue's change history and forge who performed the change. Remove the historyMetadata field and retry so Jira records the real actor. Contact your admin if a vetted integration must set change-history metadata.
- description: Transition with only a partial historyMetadata (actor only). Presence
    is enough. Policy should deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: atlassian-transitionjiraissue
      uri: null
    payload:
      name: atlassian-transitionjiraissue
      args:
        issueIdOrKey: DEV-7
        transition:
          id: "31"
        historyMetadata:
          actor:
            displayName: Someone Else
  output:
    expectedResult: deny
    expectedReason: This Jira write call includes a historyMetadata block, which lets the caller stamp a fabricated actor, cause, or generator onto the issue's change history and forge who performed the change. Remove the historyMetadata field and retry so Jira records the real actor. Contact your admin if a vetted integration must set change-history metadata.
