- description: RED-TEAM (fail-closed) — malformed transition payload where args is a
    bare string, not an object. Cannot be inspected, so it must be denied.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: atlassian-transitionjiraissue
      uri: null
    payload:
      name: atlassian-transitionjiraissue
      args: "historyMetadata"
  output:
    expectedResult: deny
    expectedReason: This Jira write call has a malformed arguments object and cannot be checked for change-history actor spoofing, so it is denied. Resend the request with a well-formed arguments object and no historyMetadata block.
- description: RED-TEAM (fail-closed) — malformed payload where args is an ARRAY
    smuggling historyMetadata. is_object fails, so it falls through to deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: atlassian-transitionjiraissue
      uri: null
    payload:
      name: atlassian-transitionjiraissue
      args:
        - historyMetadata:
            actor:
              displayName: Spoofed
  output:
    expectedResult: deny
    expectedReason: This Jira write call has a malformed arguments object and cannot be checked for change-history actor spoofing, so it is denied. Resend the request with a well-formed arguments object and no historyMetadata block.
