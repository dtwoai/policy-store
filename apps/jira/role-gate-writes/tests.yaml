# Deny reason string is kept identical across every deny case that asserts it;
# it must match the sprintf output in policy.md exactly.

# --- Reads pass for everyone (not is_write_tool branch) ---
- description: Read tool (getjiraissue) with no subject at all — reads pass for everyone.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: atlassian-getjiraissue
      uri: null
    payload:
      name: atlassian-getjiraissue
      args:
        issueIdOrKey: DEV-7
  output:
    expectedResult: allow
- description: Search tool (searchjiraissuesusingjql) for a caller with unrelated
    groups — reads pass regardless of identity.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: atlassian-searchjiraissuesusingjql
      uri: null
    subject:
      sub: auth0|bob
      claims:
        groups:
          - engineering
    payload:
      name: atlassian-searchjiraissuesusingjql
      args:
        jql: project = DEV ORDER BY created DESC
  output:
    expectedResult: allow
- description: Project/issue-type metadata read (getjiraprojectissuetypesmetadata)
    with empty claims — treated as a read, allowed.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: atlassian-getjiraprojectissuetypesmetadata
      uri: null
    subject:
      sub: auth0|carol
      claims: {}
    payload:
      name: atlassian-getjiraprojectissuetypesmetadata
      args:
        projectIdOrKey: DEV
  output:
    expectedResult: allow
- description: Read whose name CONTAINS "jiraissue" but is not a gated write
    (gettransitionsforjiraissue) — endswith is exact at the tail, so it passes.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: atlassian-gettransitionsforjiraissue
      uri: null
    payload:
      name: atlassian-gettransitionsforjiraissue
      args:
        issueIdOrKey: DEV-7
  output:
    expectedResult: allow
- description: Non-tool ingress hook (prompt_pre_fetch) — no write suffix, passes.
  input:
    action: prompt_pre_fetch
    kind: prompt_pre_fetch
    mode: input
    resource:
      type: prompt
      name: greeting
      uri: null
    payload:
      prompt_id: greeting
      args:
        user: alice
  output:
    expectedResult: allow

# --- Writes pass for writer-group members (is_write_tool + caller_is_writer) ---
- description: Official write (createjiraissue) by a member of jira-writers — allowed.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: atlassian-createjiraissue
      uri: null
    subject:
      sub: auth0|alice
      claims:
        groups:
          - jira-writers
    payload:
      name: atlassian-createjiraissue
      args:
        projectKey: DEV
        summary: New task
  output:
    expectedResult: allow
- description: Community write (jira_update_issue) when jira-writers is one of
    several groups — allowed (community dialect).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: mcp-atlassian-jira_update_issue
      uri: null
    subject:
      sub: auth0|alice
      claims:
        groups:
          - engineering
          - jira-writers
    payload:
      name: mcp-atlassian-jira_update_issue
      args:
        issue_key: DEV-7
        fields:
          summary: updated
  output:
    expectedResult: allow
- description: Official issue-link write (createissuelink) by a writer — allowed
    (exercises the issue-link suffix branch, official dialect).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: atlassian-createissuelink
      uri: null
    subject:
      sub: auth0|alice
      claims:
        groups:
          - jira-writers
    payload:
      name: atlassian-createissuelink
      args:
        inwardIssue:
          key: DEV-7
        outwardIssue:
          key: DEV-8
        type:
          name: Blocks
  output:
    expectedResult: allow
- description: Community transition (jira_transition_issue) by a writer — allowed.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: mcp-atlassian-jira_transition_issue
      uri: null
    subject:
      sub: auth0|alice
      claims:
        groups:
          - jira-writers
    payload:
      name: mcp-atlassian-jira_transition_issue
      args:
        issue_key: DEV-7
        transition:
          id: "31"
  output:
    expectedResult: allow

# --- Writes deny for non-members (is_write_tool + not caller_is_writer) ---
- description: Official write (editjiraissue) by a caller whose groups do not
    include jira-writers — denied with the standard reason.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: atlassian-editjiraissue
      uri: null
    subject:
      sub: auth0|bob
      claims:
        groups:
          - engineering
    payload:
      name: atlassian-editjiraissue
      args:
        issueIdOrKey: DEV-7
        fields:
          summary: changed
  output:
    expectedResult: deny
    expectedReason: Jira write tools are restricted to members of the 'jira-writers' group — this account has read-only Jira access through the gateway. Ask your identity admin to add you to 'jira-writers', or hand this write (create, edit, transition, comment, worklog, or issue link) to a teammate with Jira write access. If this tool is actually read-only, contact your InfoSec team to update the policy.
- description: Community create (jira_create_issue) with no subject in the input at
    all — identity lookup fails closed, write denied.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: mcp-atlassian-jira_create_issue
      uri: null
    payload:
      name: mcp-atlassian-jira_create_issue
      args:
        project: DEV
        summary: New task
  output:
    expectedResult: deny
- description: Official transition (transitionjiraissue) with an empty groups
    array — denied.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: atlassian-transitionjiraissue
      uri: null
    subject:
      sub: auth0|bob
      claims:
        groups: []
    payload:
      name: atlassian-transitionjiraissue
      args:
        issueIdOrKey: DEV-7
        transition:
          id: "31"
  output:
    expectedResult: deny
- description: Official comment write (addcommenttojiraissue) by a non-writer —
    denied.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: atlassian-addcommenttojiraissue
      uri: null
    subject:
      sub: auth0|bob
      claims:
        groups:
          - engineering
    payload:
      name: atlassian-addcommenttojiraissue
      args:
        issueIdOrKey: DEV-7
        commentBody: looks good
  output:
    expectedResult: deny
- description: Community worklog write (jira_add_worklog) by a non-writer — denied.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: mcp-atlassian-jira_add_worklog
      uri: null
    subject:
      sub: auth0|bob
      claims:
        groups:
          - engineering
    payload:
      name: mcp-atlassian-jira_add_worklog
      args:
        issue_key: DEV-7
        time_spent: 1h
  output:
    expectedResult: deny
- description: Community issue-link write (jira_create_issue_link) by a non-writer —
    denied. Confirms this snake_case suffix matches and does not collide with the
    jira_create_issue suffix.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: mcp-atlassian-jira_create_issue_link
      uri: null
    subject:
      sub: auth0|bob
      claims:
        groups:
          - engineering
    payload:
      name: mcp-atlassian-jira_create_issue_link
      args:
        link_type: Blocks
        inward_issue_key: DEV-7
        outward_issue_key: DEV-8
  output:
    expectedResult: deny
- description: Uppercased write tool name (ATLASSIAN-CREATEJIRAISSUE) without the
    group — matching is case-insensitive, so still denied.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: ATLASSIAN-CREATEJIRAISSUE
      uri: null
    subject:
      sub: auth0|bob
      claims:
        groups:
          - engineering
    payload:
      name: ATLASSIAN-CREATEJIRAISSUE
      args:
        projectKey: DEV
        summary: New task
  output:
    expectedResult: deny

# --- Red-team: identity-shape spoofing must fail closed ---
- description: Red-team — groups claim is a plain string ("jira-writers") instead of
    an array. Malformed shape fails closed, write denied.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: atlassian-createjiraissue
      uri: null
    subject:
      sub: auth0|mallory
      claims:
        groups: jira-writers
    payload:
      name: atlassian-createjiraissue
      args:
        projectKey: DEV
        summary: sneaky
  output:
    expectedResult: deny
    expectedReason: Jira write tools are restricted to members of the 'jira-writers' group — this account has read-only Jira access through the gateway. Ask your identity admin to add you to 'jira-writers', or hand this write (create, edit, transition, comment, worklog, or issue link) to a teammate with Jira write access. If this tool is actually read-only, contact your InfoSec team to update the policy.
- description: Red-team — groups claim shaped as an object whose VALUE is the writer
    group name ({"role":"jira-writers"}). `some x in obj` iterates values, so this
    would fail OPEN without the is_array guard. Non-array shape must fail closed.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: atlassian-editjiraissue
      uri: null
    subject:
      sub: auth0|mallory
      claims:
        groups:
          role: jira-writers
    payload:
      name: atlassian-editjiraissue
      args:
        issueIdOrKey: DEV-7
        fields:
          summary: sneaky
  output:
    expectedResult: deny
    expectedReason: Jira write tools are restricted to members of the 'jira-writers' group — this account has read-only Jira access through the gateway. Ask your identity admin to add you to 'jira-writers', or hand this write (create, edit, transition, comment, worklog, or issue link) to a teammate with Jira write access. If this tool is actually read-only, contact your InfoSec team to update the policy.

# --- Red-team: batch-create must be gated (create operation in bulk) ---
- description: Red-team — community batch-create (jira_batch_create_issues) by a
    non-writer. This tool creates issues wholesale and carries none of the six
    single-op suffixes; it is explicitly gated as a create variant, so denied.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: mcp-atlassian-jira_batch_create_issues
      uri: null
    subject:
      sub: auth0|mallory
      claims:
        groups:
          - engineering
    payload:
      name: mcp-atlassian-jira_batch_create_issues
      args:
        issues:
          - project: DEV
            summary: bulk one
          - project: DEV
            summary: bulk two
  output:
    expectedResult: deny
    expectedReason: Jira write tools are restricted to members of the 'jira-writers' group — this account has read-only Jira access through the gateway. Ask your identity admin to add you to 'jira-writers', or hand this write (create, edit, transition, comment, worklog, or issue link) to a teammate with Jira write access. If this tool is actually read-only, contact your InfoSec team to update the policy.
- description: Community batch-create (jira_batch_create_issues) by a jira-writers
    member — allowed (exercises the batch-create suffix branch for a writer).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: mcp-atlassian-jira_batch_create_issues
      uri: null
    subject:
      sub: auth0|alice
      claims:
        groups:
          - jira-writers
    payload:
      name: mcp-atlassian-jira_batch_create_issues
      args:
        issues:
          - project: DEV
            summary: bulk one
  output:
    expectedResult: allow

