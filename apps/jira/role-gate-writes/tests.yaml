# --- Red-team: degenerate tool hook must not present a write as a read ---
- description: Red-team (fixed) — tool hook with resource.name null but the legacy
    payload.name alias identifying a write tool. Without the payload.name fallback
    the write would look like a read and fail OPEN; with it, the non-writer is
    denied.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: null
      uri: null
    subject:
      sub: auth0|mallory
      claims:
        groups:
          - engineering
    payload:
      name: atlassian-createjiraissue
      args:
        projectKey: DEV
        summary: sneaky via degenerate hook
  output:
    expectedResult: deny
    expectedReason: Jira write tools are restricted to members of the 'jira-writers' group — this account has read-only Jira access through the gateway. Ask your identity admin to add you to 'jira-writers', or hand this write (create, edit, transition, comment, worklog, or issue link) to a teammate with Jira write access. If this tool is actually read-only, contact your InfoSec team to update the policy.
- description: Legacy-fallback sanity — resource.name null with payload.name naming
    a read tool (getjiraissue). Fallback resolves the name, read passes for
    everyone.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: null
      uri: null
    payload:
      name: atlassian-getjiraissue
      args:
        issueIdOrKey: DEV-7
  output:
    expectedResult: allow

# --- Documented residual (Known limitations: closed write set) ---
- description: Documents the closed-write-set limitation — the community
    destructive tool jira_delete_issue carries none of the six gated suffixes, so
    it is NOT gated by this baseline and passes even without the writer group. Gate
    it with the destructive-op / sensitive-project companions.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: mcp-atlassian-jira_delete_issue
      uri: null
    subject:
      sub: auth0|mallory
      claims:
        groups:
          - engineering
    payload:
      name: mcp-atlassian-jira_delete_issue
      args:
        issue_key: DEV-7
  output:
    expectedResult: allow
- description: Documents the closed-write-set limitation — the community
    jira_create_remote_issue_link (attaches an external URL, a distinct operation
    from the gated issue-to-issue createissuelink) carries none of the gated
    suffixes, so it is NOT gated and passes even for a non-writer. Gate it with the
    sensitive-project / destructive-op companions if needed.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: mcp-atlassian-jira_create_remote_issue_link
      uri: null
    subject:
      sub: auth0|mallory
      claims:
        groups:
          - engineering
    payload:
      name: mcp-atlassian-jira_create_remote_issue_link
      args:
        issue_key: DEV-7
        url: https://example.com/evidence
  output:
    expectedResult: allow
- description: Documents the closed-write-set limitation — the community
    jira_update_proforma_form_answers updates issue-attached ProForma form answers,
    issue-adjacent data this baseline does not treat as an issue edit. It carries
    none of the gated suffixes, so it is NOT gated and passes even for a
    non-writer. Extend write_suffixes if your tenant uses ProForma forms for
    controlled data.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: mcp-atlassian-jira_update_proforma_form_answers
      uri: null
    subject:
      sub: auth0|mallory
      claims:
        groups:
          - engineering
    payload:
      name: mcp-atlassian-jira_update_proforma_form_answers
      args:
        issue_key: DEV-7
        form_id: "42"
        answers:
          - question: budget
            answer: "100000"
  output:
    expectedResult: allow
- description: Documents the official-server residual — write tools in Rovo
    permission groups outside write_jira (here JSM Ops updateJsmOpsAlert) are not
    issue writes and are NOT gated by this baseline; they pass even for a
    non-writer. Gate them separately if your tenant exposes JSM Ops or Compass
    tools.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: atlassian-updatejsmopsalert
      uri: null
    subject:
      sub: auth0|mallory
      claims:
        groups:
          - engineering
    payload:
      name: atlassian-updatejsmopsalert
      args:
        alert_id: "A-123"
        status: acknowledged
  output:
    expectedResult: allow
