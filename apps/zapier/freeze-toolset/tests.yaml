- description: Non-admin tries to enable a new Zapier action — denied with the
    provision-out-of-band reason.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: zapier-mcp-enable_zapier_action
      uri: null
    subject:
      sub: auth0|dev
      claims:
        groups:
          - engineering
    payload:
      name: zapier-mcp-enable_zapier_action
      args:
        action: gmail_send_email
  output:
    expectedResult: deny
    expectedReason: "This Zapier connector's toolset is frozen: enabling actions, provisioning tools, code actions, and Zapier skill changes are restricted to automation admins. Ask an automation admin to provision the action out-of-band, then retry with your existing toolset. If you believe this is a false positive, contact your InfoSec team."
