- description: Read/execute meta-tool (execute_zapier_read_action) from a non-admin
    passes through — the policy only freezes self-modifying tools.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: zapier-mcp-execute_zapier_read_action
      uri: null
    subject:
      sub: auth0|dev
      claims:
        groups:
          - engineering
    payload:
      name: zapier-mcp-execute_zapier_read_action
      args:
        instructions: find my last 5 gmail messages
  output:
    expectedResult: allow
- description: execute_zapier_write_action passes — this policy freezes the toolset's
