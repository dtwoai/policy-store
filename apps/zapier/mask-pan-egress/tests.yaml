      text:
        - "sent email containing 4111111111111111"
  output:
    expectedResult: allow
  transformApplied: false

- description: Meta-tool get_zapier_skill incidentally matches the -get-
    substring rule — a Luhn-valid PAN embedded in stored skill text is masked
    (documented as intended-harmless behavior).
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: zapier-mcp-get_zapier_skill
      uri: null
    payload:
      name: zapier-mcp-get_zapier_skill
      text:
        - "skill: always refund to card 4111111111111111"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "skill: always refund to card 411111******1111"

- description: "Documented residual (read-meta-tool asymmetry): list_zapier_skills
    returns the same stored skill text as get_zapier_skill but contains neither
    -find- nor -get-, so it is NOT matched and a PAN in the skill text passes
    through unmasked. Pins the agentic read-meta-tool coverage gap."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: zapier-mcp-list_zapier_skills
      uri: null
    payload:
      name: zapier-mcp-list_zapier_skills
      text:
        - "skill: always refund to card 4111111111111111"
  output:
    expectedResult: allow
  transformApplied: false

- description: Multiple distinct PANs in one content block are each masked to
    their own BIN+last4 form.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: zapier-mcp-execute_zapier_read_action
      uri: null
    payload:
      name: zapier-mcp-execute_zapier_read_action
      text:
        - "cards 4111111111111111 and 5555555555554444 on the account"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "cards 411111******1111 and 555555******4444 on the account"

- description: Multiple content blocks — clean blocks pass through unchanged
    while the block containing a PAN is masked.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: zapier-mcp-execute_zapier_read_action
      uri: null
    payload:
      name: zapier-mcp-execute_zapier_read_action
      text:
        - "record 1 of 2: no payment data"
        - "record 2 of 2: PAN 378282246310005 on file"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "record 1 of 2: no payment data"
      - "record 2 of 2: PAN 378282*****0005 on file"

- description: Empty text array — nothing to mask, no transform emitted.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: zapier-mcp-execute_zapier_read_action
      uri: null
    payload:
      name: zapier-mcp-execute_zapier_read_action
      text: []
  output:
    expectedResult: allow
  transformApplied: false

- description: Hyphenated tool-name delivery (execute-zapier-read-action)
    matches via underscore normalization and masking applies.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: zapier-gw-execute-zapier-read-action
      uri: null
    payload:
      name: zapier-gw-execute-zapier-read-action
      text:
        - "card 6011111111111117"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "card 601111******1117"

- description: "Documented residual (fail-open): a PAN glued to a word
    character (underscore) in a serialized-JSON token value has no word
    boundary and is NOT masked — pins the \\b-anchoring residual."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: zapier-mcp-execute_zapier_read_action
      uri: null
    payload:
      name: zapier-mcp-execute_zapier_read_action
      text:
        - "{\"source\":\"card_4111111111111111\"}"
  output:
    expectedResult: allow
  transformApplied: false

- description: "Documented residual (encoding): a PAN typed with Unicode
    fullwidth digits does not match the ASCII-only RE2 \\d class, so no
    transform is emitted and the digits pass through unmasked."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: zapier-mcp-execute_zapier_read_action
      uri: null
    payload:
      name: zapier-mcp-execute_zapier_read_action
      text:
        - "card ４１１１１１１１１１１１１１１１ on file"
  output:
    expectedResult: allow
  transformApplied: false

- description: "Documented residual (fail-open): when payload.text is a bare
    string instead of an array, the is_array guard leaves the transform
    undefined and the PAN passes through byte-identical."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: zapier-mcp-execute_zapier_read_action
      uri: null
    payload:
      name: zapier-mcp-execute_zapier_read_action
      text: "customer card 4111111111111111 on file"
  output:
    expectedResult: allow
  transformApplied: false

- description: "Documented residual (fail-open): a PAN inside a structured
    object content block (MCP typed {type,text} shape) is NOT a string, so
    mask_block passes it through unmodified and no transform is emitted."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: zapier-mcp-execute_zapier_read_action
      uri: null
    payload:
      name: zapier-mcp-execute_zapier_read_action
      text:
        - type: text
          text: "customer card 4111111111111111 on file"
  output:
    expectedResult: allow
  transformApplied: false
