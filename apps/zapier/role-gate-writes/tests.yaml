- description: Agentic write funnel, caller not in the writer group. Policy should
    deny with the exact reason.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: zapier-mcp-execute_zapier_write_action
      uri: null
    subject:
      sub: auth0|analyst
      claims:
        groups:
          - engineering
    payload:
      name: zapier-mcp-execute_zapier_write_action
      args:
        instructions: email the quarterly report to the whole team
  output:
    expectedResult: deny
    expectedReason: Zapier write actions are restricted to members of the automation-writers group; read actions remain available to everyone. Ask your IdP administrator to add you to automation-writers if your role requires write access through this connector. If you believe this is a false positive, contact your InfoSec team.
- description: Agentic write funnel, caller IS in the writer group. Policy should
    allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: zapier-mcp-execute_zapier_write_action
      uri: null
    subject:
      sub: auth0|ops
      claims:
        groups:
          - engineering
          - automation-writers
    payload:
      name: zapier-mcp-execute_zapier_write_action
      args:
        instructions: add a row to the ops tracking sheet
  output:
    expectedResult: allow
- description: Agentic write funnel with missing claims entirely (empty subject) —
    must fail closed. Policy should deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: zapier-mcp-execute_zapier_write_action
      uri: null
    subject: {}
    payload:
      name: zapier-mcp-execute_zapier_write_action
      args:
        instructions: delete the old records
  output:
    expectedResult: deny
    expectedReason: Zapier write actions are restricted to members of the automation-writers group; read actions remain available to everyone. Ask your IdP administrator to add you to automation-writers if your role requires write access through this connector. If you believe this is a false positive, contact your InfoSec team.
- description: Agentic write funnel where the groups claim is a string, not an array —
