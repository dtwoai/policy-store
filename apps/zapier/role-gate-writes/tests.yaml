- description: "Red-team: resource.name entirely missing. Cannot be classified as a
    read, so the read-open branch does not fire and it falls through to default deny
    (fail closed on unidentifiable tool identity)."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      uri: null
    subject:
      sub: auth0|analyst
      claims:
        groups:
          - engineering
    payload:
      args:
        instructions: delete the customer records
  output:
    expectedResult: deny
- description: "Red-team: resource.name is an empty string. is_string is true but the
    name is blank, so has_tool_name fails and the request falls through to default
    deny (fail closed)."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: ""
      uri: null
    subject:
      sub: auth0|ops
      claims:
        groups:
          - automation-writers
    payload:
      name: ""
      args: {}
  output:
    expectedResult: deny
- description: "Red-team (documented residual): disable_zapier_action is a toolset
    self-modification meta-tool with no listed write verb, so it passes as a read for a
    non-writer. Writes-of-capability are out of this policy's scope by design — cover
    with freeze-toolset. Policy allows."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: zapier-mcp-disable_zapier_action
      uri: null
    subject:
      sub: auth0|analyst
      claims:
        groups:
          - engineering
    payload:
      name: zapier-mcp-disable_zapier_action
      args:
        action_key: gmail_send_email
  output:
    expectedResult: allow
