- description: Agentic read funnel with no groups claim at all — reads stay open to
    everyone. Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: zapier-mcp-execute_zapier_read_action
      uri: null
    subject:
      sub: auth0|analyst
      claims: {}
    payload:
      name: zapier-mcp-execute_zapier_read_action
      args:
        instructions: list my open invoices
  output:
    expectedResult: allow
- description: Classic-mode read tool (find_ verb), caller not in any group — reads
