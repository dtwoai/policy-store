- description: "Documented limitation (split PAN): a single card number typed
    across two conversation PARTS (delivered as separate content blocks) leaves
    no block with 13+ contiguous card digits, so neither matches and the PAN is
    NOT masked. Matching is per-block by design. Pins the split-across-parts
    residual."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: intercom-mcp-get_conversation
      uri: null
    payload:
      name: intercom-mcp-get_conversation
      text:
        - "my card is 4111 1111"
        - "1111 1111 thanks"
    subject:
      sub: google-apps|casey@acme.com
      claims:
        groups:
          - support
  output:
    expectedResult: allow
  transformApplied: false

- description: "Documented limitation (obfuscation): a PAN separated by dots
    (non-digit filler other than space/dash) matches neither grouped pattern nor
    the unseparated run, so it is NOT masked."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: intercom-mcp-get_conversation
      uri: null
    payload:
      name: intercom-mcp-get_conversation
      text:
        - "card 4111.1111.1111.1111 on file"
    subject:
      sub: google-apps|casey@acme.com
      claims:
        groups:
          - support
  output:
    expectedResult: allow
  transformApplied: false

- description: "Documented limitation (\\b anchoring): a PAN glued directly to an
    underscore (a word character in RE2) has no word boundary and is NOT masked
    — the same anchoring that prevents partial-masking of longer identifiers."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: intercom-mcp-get_conversation
      uri: null
    payload:
      name: intercom-mcp-get_conversation
      text:
        - '{"conversation_parts":[{"body":"ref conversation_4111111111111111 end"}]}'
    subject:
      sub: google-apps|casey@acme.com
      claims:
        groups:
          - support
  output:
    expectedResult: allow
  transformApplied: false

- description: "Documented limitation (length ceiling): a 20-digit run never
    matches (no word boundary inside a digit run), so longer account/reference
    identifiers are not partially masked."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: intercom-mcp-get_conversation
      uri: null
    payload:
