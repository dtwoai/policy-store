      claims:
        groups:
          - support
  output:
    expectedResult: allow
  transformApplied: false

- description: "Documented limitation (encoding): a PAN typed with Unicode
    fullwidth digits does not match the ASCII-only RE2 \\d class, so no transform
    is emitted and the digits pass through unmasked."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: intercom-mcp-get_conversation
      uri: null
    payload:
      name: intercom-mcp-get_conversation
      text:
        - "card ４１１１１１１１１１１１１１１１ on file"
    subject:
      sub: google-apps|casey@acme.com
      claims:
        groups:
          - support
  output:
    expectedResult: allow
  transformApplied: false

- description: "Documented residual (fail-open): a PAN inside a structured/object
    content block (MCP typed {type,text} shape) is not a string, so mask_block
    passes it through and no transform is emitted."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: intercom-mcp-get_conversation
      uri: null
    payload:
      name: intercom-mcp-get_conversation
      text:
        - type: text
          text: "customer card 4111111111111111 on file"
    subject:
      sub: google-apps|casey@acme.com
      claims:
        groups:
          - support
  output:
    expectedResult: allow
  transformApplied: false

- description: "Documented limitation (unsurveyed community tool): evolsb
    sync_conversations is not in the suffix list and carries no generic
    search/fetch alias, so it is out of scope and its PAN passes through
    unmasked. Add its suffix at import time if that server is in play."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
