# Tests for intercom.egress.mask_pan — transform-only PAN masking on Intercom
# conversation responses. The policy never denies, so every case expects
# allow; the interesting assertions are the transform ones.

- description: get_conversation full-thread read (official server) with a
    space-grouped 4-4-4-4 PAN in a conversation part is masked to BIN+last4 for
    a non-exempt caller.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: intercom-mcp-get_conversation
      uri: null
    payload:
      name: intercom-mcp-get_conversation
      text:
        - '{"conversation_parts":[{"body":"my card is 4111 1111 1111 1111"}]}'
    subject:
      sub: google-apps|casey@acme.com
      claims:
        groups:
          - support
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    name: intercom-mcp-get_conversation
    text:
      - '{"conversation_parts":[{"body":"my card is 411111******1111"}]}'

- description: search_conversations (official snake_case) with an unseparated
    16-digit PAN in a part body is masked; typed conversation tools are in scope
    unconditionally.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: intercom-mcp-search_conversations
      uri: null
    payload:
      name: intercom-mcp-search_conversations
      text:
        - '{"conversations":[{"conversation_parts":[{"body":"pay 4111111111111111 now"}]}]}'
    subject:
      sub: google-apps|casey@acme.com
      claims:
        groups:
          - support
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - '{"conversations":[{"conversation_parts":[{"body":"pay 411111******1111 now"}]}]}'

- description: search-conversations (fabian1710 kebab-case) is matched via
    underscore normalization; the dash-separated PAN is masked (separators
    dropped in the masked form).
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: intercom-mcp-search-conversations
      uri: null
    payload:
      name: intercom-mcp-search-conversations
      text:
        - "match: card 4111-1111-1111-1111 on file"
    subject:
      sub: google-apps|casey@acme.com
      claims:
        groups:
          - support
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "match: card 411111******1111 on file"

- description: Generic `search` alias (object_type conversations) — the response
    carries a "type":"conversation" marker, so it is brought into scope and the
    PAN is masked.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: intercom-mcp-search
      uri: null
    payload:
      name: intercom-mcp-search
      text:
        - '{"results":[{"type":"conversation","body":"charge 4242 4242 4242 4242"}]}'
    subject:
      sub: google-apps|casey@acme.com
      claims:
        groups:
          - support
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - '{"results":[{"type":"conversation","body":"charge 424242******4242"}]}'

- description: Generic `fetch` alias resolving a conversation_ ID — the
    conversation_-prefixed ID in the response marks it as conversation data, so
    it is in scope and the PAN is masked.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: intercom-mcp-fetch
      uri: null
    payload:
      name: intercom-mcp-fetch
      text:
        - '{"id":"conversation_123","conversation_parts":[{"body":"card 5555555555554444"}]}'
    subject:
      sub: google-apps|casey@acme.com
      claims:
        groups:
          - support
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - '{"id":"conversation_123","conversation_parts":[{"body":"card 555555******4444"}]}'

- description: "Scoping negative: generic `search` returning CONTACT results (no
    conversation marker) is out of scope even though the response contains a
