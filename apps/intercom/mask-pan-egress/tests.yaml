    space/dash between groups) nor the unseparated run, so it LEAKS. Pins the
    single-space/dash separator boundary (existing obfuscation tests cover dots
    and fullwidth digits, not multi-space)."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: intercom-mcp-get_conversation
      uri: null
    payload:
      name: intercom-mcp-get_conversation
      text:
        - "card 4111  1111  1111  1111 on file"
    subject:
      sub: google-apps|casey@acme.com
      claims:
        groups:
          - support
  output:
    expectedResult: allow
  transformApplied: false

- description: "Red-team (length ceiling, glued multi-PAN): two 16-digit PANs
    concatenated with no separator form a 32-digit run with no interior word
    boundary, so \\d{13,19}\\b cannot anchor and NEITHER card is masked — they
    LEAK. (Note: had either PAN also appeared standalone elsewhere in the block,
    strings.replace_n would have masked the glued copies too; this case has no
    standalone occurrence, so the run escapes entirely.) Pins the length-ceiling
    residual for the glued-cards shape."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: intercom-mcp-get_conversation
      uri: null
    payload:
      name: intercom-mcp-get_conversation
      text:
        - "dump 41111111111111114242424242424242 end"
    subject:
      sub: google-apps|casey@acme.com
