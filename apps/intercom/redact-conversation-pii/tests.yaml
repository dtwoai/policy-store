# Transform-only egress policy: every case expects allow. The assertions that
# matter are transformApplied / transformedArgsContain. Redaction is UNIFORM
# (no group exemption). Cardholder PAN is intentionally NOT handled here
# (companion mask-pan-egress / PF-01).

# --- Typed conversation/contact read tools (always in scope) ---

- description: get_conversation response with an SSN in a conversation-part
    body. The SSN is redacted; the surrounding thread structure is preserved.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: intercom-get_conversation
      uri: null
    payload:
      name: intercom-get_conversation
      text:
        - '{"type":"conversation","conversation_parts":[{"body":"<p>my ssn is 123-45-6789</p>"}]}'
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - '{"type":"conversation","conversation_parts":[{"body":"<p>my ssn is [REDACTED-SSN]</p>"}]}'

- description: search_contacts response with a contact email and phone. Both
    identifiers are masked.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: intercom-search_contacts
      uri: null
    payload:
      name: intercom-search_contacts
      text:
        - '[{"email":"jane@acme.com","phone":"206-555-0100"}]'
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - '[{"email":"[REDACTED-EMAIL]","phone":"[REDACTED-PHONE]"}]'

- description: get_contact response carrying a credential in a custom attribute
    note. The key:value secret is redacted to the credential token.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: intercom-get_contact
      uri: null
    payload:
      name: intercom-get_contact
      text:
        - '{"custom_attributes":{"note":"api_key: AKIA1234567890ABCDEF rotate soon"}}'
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - '{"custom_attributes":{"note":"[REDACTED-CREDENTIAL] rotate soon"}}'

- description: Community fabian1710 server uses kebab-case search-conversations.
    A label-anchored national ID in the body is redacted (portability across
    the snake/kebab separator).
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: intercom-search-conversations
      uri: null
    payload:
      name: intercom-search-conversations
      text:
        - '[{"body":"customer national id: AB123456C please verify"}]'
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - '[{"body":"customer [REDACTED-ID] please verify"}]'

# --- Generic connector aliases (search / fetch) ---

- description: Generic search whose request args scope it to conversations
    (object_type == "conversations"). An SSN in the result is redacted
    (request-arg gating branch).
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: intercom-search
      uri: null
    payload:
      name: intercom-search
      args:
        object_type: conversations
      text:
        - 'agent notes: ssn 123-45-6789'
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - 'agent notes: ssn [REDACTED-SSN]'

- description: Generic search scoped to contacts (object_type == "contacts")
    with no conversation marker in the response. By design the generic-alias
    gating covers CONVERSATIONS only, so this passes through unredacted
    (documented gap — the typed search_contacts is always in scope).
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: intercom-search
      uri: null
    payload:
      name: intercom-search
      args:
        object_type: contacts
      text:
        - '[{"type":"contact","email":"jane@acme.com"}]'
  output:
    expectedResult: allow
  transformApplied: false

- description: Generic fetch of a conversation (request id starts with
    conversation_). An email in the fetched thread is redacted (fetch
    request-arg gating branch).
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: intercom-fetch
      uri: null
    payload:
      name: intercom-fetch
      args:
        id: conversation_abc123
      text:
        - 'thread: reach me at ops@acme.io'
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - 'thread: reach me at [REDACTED-EMAIL]'

- description: Generic fetch of a contact (request id starts with contact_) with
    no conversation marker. Out of the conversation-only generic scope, so it
    passes through unredacted (documented gap).
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: intercom-fetch
      uri: null
    payload:
      name: intercom-fetch
      args:
        id: contact_xyz789
      text:
        - 'profile email support@acme.com'
  output:
    expectedResult: allow
  transformApplied: false

- description: Generic search on a gateway that did NOT mirror request args onto
    the egress hook. The response-content fallback fires because the payload
    carries a conversation_parts marker, so the phone number is still redacted.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: intercom-search
      uri: null
    payload:
      name: intercom-search
      text:
        - 'thread {"conversation_parts": true} call me 206-555-0100'
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - 'thread {"conversation_parts": true} call me [REDACTED-PHONE]'

# --- Name-surface, structural, and passthrough branches ---

- description: Tool name available only via tool_metadata.name (resource name
    empty, no payload.name). The candidate-name fallback matches and the SSN is
    redacted.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: ""
      uri: null
    tool_metadata:
      name: intercom-get_conversation
    payload:
      text:
        - 'SSN 078-05-1120 noted'
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - 'SSN [REDACTED-SSN] noted'

- description: Mixed content blocks — a string with an SSN, a non-string
    structured block, and a clean string. Only the matching string is rewritten;
    the other blocks are preserved as-is.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: intercom-get_conversation
      uri: null
    payload:
      name: intercom-get_conversation
      text:
        - 'Contact SSN: 078-05-1120'
        - type: resource
          uri: intercom://conversation/1
        - no pii here
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - 'Contact SSN: [REDACTED-SSN]'
      - type: resource
        uri: intercom://conversation/1
      - no pii here

- description: Clean response from an in-scope tool — no PII patterns match, so
    no transform is emitted and the response passes through unchanged.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: intercom-get_conversation
      uri: null
    payload:
      name: intercom-get_conversation
      text:
        - 'Thanks, that is resolved. No personal data here.'
  output:
    expectedResult: allow
  transformApplied: false

- description: Ingress-mode call to a matching tool name. The policy only fires
    on the output path, so no transform is applied.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: intercom-get_conversation
      uri: null
    payload:
      name: intercom-get_conversation
      args:
        id: conversation_abc123
  output:
    expectedResult: allow
  transformApplied: false

- description: Out-of-scope tool (get_article — public Help Center content) with
    an email-shaped string. Not a conversation/contact read, so no transform.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: intercom-get_article
      uri: null
    payload:
      name: intercom-get_article
      text:
        - 'Contact support at help@acme.com'
  output:
    expectedResult: allow
  transformApplied: false

- description: Tool name in mixed case. Matching is case-insensitive, so
    redaction still applies.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: Intercom-Get_Conversation
      uri: null
    payload:
      name: Intercom-Get_Conversation
      text:
        - 'SSN 123-45-6789'
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - 'SSN [REDACTED-SSN]'

- description: In-scope tool whose payload.text is a bare string rather than the
    MCP content-block array. The is_array guard keeps the transform undefined
    rather than emitting a malformed payload.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: intercom-get_conversation
      uri: null
    payload:
      name: intercom-get_conversation
      text: 'SSN 123-45-6789'
  output:
    expectedResult: allow
  transformApplied: false

- description: In-scope tool whose payload has no text array at all. Nothing to
    rewrite — no transform, no error (fail-open for observability).
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: intercom-get_conversation
      uri: null
    payload:
      name: intercom-get_conversation
  output:
    expectedResult: allow
  transformApplied: false

# --- Red-team: community raoulbia-ai server coverage (was a full bypass) ---

- description: Red-team — community raoulbia list_conversations returns a
    conversation body with an SSN. Its name (`list_conversations`) matches
    neither the `search_conversations` suffix nor the generic search/fetch
    branch, so it was previously an unredacted bypass. Now matched explicitly.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: intercom-list_conversations
      uri: null
    payload:
      name: intercom-list_conversations
      text:
        - '[{"body":"customer says my ssn is 123-45-6789"}]'
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - '[{"body":"customer says my ssn is [REDACTED-SSN]"}]'

- description: Red-team — community raoulbia search_conversations_by_customer
