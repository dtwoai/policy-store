# Rule branches covered:
#   is_typed_pii_tool: get_contact / search_contacts / get_company / list_companies
#   is_generic_search_contacts: search + object_type=contacts (and the conversations pass-through)
#   is_fetch_pii_id: fetch of contact_/company_ id (and conversation_ pass-through)
#   caller_authorized: support group, crm group, non-allowed group, no groups, no subject
#   allow via not-PII-surface: get_conversation

- description: get_contact by a support-group caller — authorized, allowed.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: intercom-get_contact
      uri: null
    subject:
      sub: auth0|alice
      claims:
        groups: [support]
    payload:
      name: intercom-get_contact
      args:
        id: contact_123
  output:
    expectedResult: allow

- description: get_contact by a crm-group caller — authorized via the second allowed group, allowed.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: intercom-get_contact
      uri: null
    subject:
      sub: auth0|carol
      claims:
        groups: [engineering, crm]
    payload:
      name: intercom-get_contact
      args:
        id: contact_123
  output:
    expectedResult: allow

- description: get_contact by a caller with a non-allowed group — denied with the role-gate reason.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: intercom-get_contact
      uri: null
    subject:
      sub: auth0|bob
      claims:
        groups: [analytics]
    payload:
      name: intercom-get_contact
      args:
        id: contact_123
  output:
    expectedResult: deny
    expectedReason: Intercom contact and company profiles are limited to support and CRM roles. Other roles keep conversation access. Ask your admin to add you to the support or CRM IdP group if you need customer-profile access, or contact your security team if this is a false positive.

- description: get_contact by a caller with no groups claim — fail closed, denied.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: intercom-get_contact
      uri: null
    subject:
      sub: auth0|dave
      claims:
        scope: openid profile email
    payload:
      name: intercom-get_contact
      args:
        id: contact_123
  output:
    expectedResult: deny

- description: get_contact by a caller with no subject at all — fail closed, denied.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: intercom-get_contact
      uri: null
    payload:
      name: intercom-get_contact
      args:
        id: contact_123
  output:
    expectedResult: deny

