# --- Red-team gate cases (reviewer, standards §10) ---

- description: Red-team — fetch a contact by a workspace URL that embeds the contact_ token, non-support — denied (contains-match closes the startswith bypass).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: intercom-fetch
      uri: null
    subject:
      sub: auth0|bob
      claims:
        groups: [analytics]
    payload:
      name: intercom-fetch
      args:
        id: "https://app.intercom.com/a/apps/xyz/users/contact_123"
  output:
    expectedResult: deny

- description: Red-team — fetch a company by a workspace URL that embeds the company_ token, non-support — denied.
  input:
    action: tool_pre_invoke
