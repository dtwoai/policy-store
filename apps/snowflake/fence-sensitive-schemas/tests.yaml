- description: Non-inspected tool (no query/statement/message arg) passes through untouched.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: snowflake-list_databases
      uri: null
    subject:
      sub: google-apps|dev@example.com
      claims:
        groups:
          - engineering
    payload:
      name: snowflake-list_databases
      args: {}
  output:
    expectedResult: allow

- description: Cleared caller selecting explicit columns from a fenced PHI_ schema is allowed.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: snowflake-run_snowflake_query
      uri: null
    subject:
      sub: google-apps|nurse@example.com
      claims:
        groups:
          - phi-cleared
    payload:
      name: snowflake-run_snowflake_query
      args:
        query: SELECT patient_id, visit_date FROM PHI_RECORDS WHERE patient_id = 42
  output:
    expectedResult: allow

- description: Query against a non-sensitive schema is allowed even when it uses SELECT * (star fence only bites fenced schemas).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: snowflake-run_snowflake_query
      uri: null
    subject:
      sub: google-apps|dev@example.com
      claims:
        groups: []
    payload:
      name: snowflake-run_snowflake_query
      args:
        query: SELECT * FROM SALES.ORDERS LIMIT 10
  output:
    expectedResult: allow

- description: Uncleared caller referencing a fenced PII_ schema (explicit columns) is denied by the domain fence.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: snowflake-run_snowflake_query
      uri: null
    subject:
      sub: google-apps|dev@example.com
      claims:
        groups:
          - engineering
    payload:
      name: snowflake-run_snowflake_query
      args:
        query: SELECT customer_id, email FROM PII_CUSTOMERS WHERE id = 5
  output:
    expectedResult: deny
    expectedReason: Access to the 'PII_' sensitive data domain requires the 'pii-cleared' IdP group. Ask your data platform admin for that entitlement, or contact InfoSec if this fence looks wrong.

- description: SELECT * on a fenced FINANCE_ schema is denied outright even for a cleared caller.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: snowflake-run_snowflake_query
      uri: null
    subject:
      sub: google-apps|analyst@example.com
      claims:
        groups:
          - finance
    payload:
      name: snowflake-run_snowflake_query
      args:
        query: SELECT * FROM FINANCE_LEDGER
  output:
    expectedResult: deny
    expectedReason: SELECT * against a fenced sensitive schema is not allowed. List the specific columns you need so the access is minimum-necessary, then re-run. Contact your data platform admin if a fenced prefix is mislabeled.

