- description: COPY INTO <table> FROM @stage is a data LOAD, not an unload. Policy should allow (false-positive guard).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: snowflake-mcp-run_snowflake_query
      uri: null
    payload:
      name: snowflake-mcp-run_snowflake_query
      args:
        query: COPY INTO analytics.customers FROM @load_stage FILE_FORMAT = (TYPE = CSV)
  output:
    expectedResult: allow
- description: Branch 1 — COPY INTO @stage bulk unload. Policy should deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: snowflake-mcp-run_snowflake_query
      uri: null
    payload:
      name: snowflake-mcp-run_snowflake_query
      args:
        query: COPY INTO @my_ext_stage FROM prod.pii.customers
  output:
    expectedResult: deny
    expectedReason: "This Snowflake SQL performs a bulk export or external-sharing operation (COPY INTO @<stage> (bulk unload to a stage)), which the agent is not permitted to run. Bulk export of warehouse data off Snowflake's perimeter must be run by a human out of band — no IdP group is exempt. Contact your data-platform team if this was a false positive."
- description: Branch 2 — COPY INTO cloud-storage URL. Policy should deny.
  input:
