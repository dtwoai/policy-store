    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: snowflake-mcp-product-search
      uri: null
    payload:
      name: snowflake-mcp-product-search
      args:
        query: wireless headphones
        limit: 10
  output:
    expectedResult: allow
