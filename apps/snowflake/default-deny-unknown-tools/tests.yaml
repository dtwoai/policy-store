    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      uri: null
  output:
    expectedResult: allow
- description: Unknown managed-server tool (refund-runner) — e.g. newly published
    upstream after the audit. Policy should deny with the drift-alert reason.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: snowflake-mcp-refund-runner
      uri: null
    payload:
      name: snowflake-mcp-refund-runner
      args:
        message: process all pending refunds
  output:
    expectedResult: deny
    expectedReason: The Snowflake tool 'snowflake-mcp-refund-runner' is not on the pinned allowlist of audited tool names for this gateway, so it is denied by default. Snowflake tool names are admin-chosen and the type that carries their real semantics (SQL execution, Cortex agent, generic UDF) is not visible on the wire, so an unknown name may be a newly added or renamed tool that has not been reviewed. If this tool is legitimate, ask your gateway operator to audit it against the Snowflake MCP server spec and add its exact name to the pinned allowlist in this policy.
