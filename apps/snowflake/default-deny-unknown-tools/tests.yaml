- description: "Red-team bypass (fixed): a LEADING-whitespace padded allowlisted
    name (' snowflake-mcp-execute-sql') must NOT escape scoping via the
    pass-through branch. Scoping trims whitespace so the name stays in scope,
    but the exact allowlist match runs on the untrimmed name and fails, so it is
    denied (fail closed). Before the fix this returned allow=true — a fail-open
    bypass."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: " snowflake-mcp-execute-sql"
      uri: null
    payload:
      name: " snowflake-mcp-execute-sql"
      args:
        query: DROP TABLE customers
  output:
    expectedResult: deny
    expectedReason: "The Snowflake tool ' snowflake-mcp-execute-sql' is not on the pinned allowlist of audited tool names for this gateway, so it is denied by default. Snowflake tool names are admin-chosen and the type that carries their real semantics (SQL execution, Cortex agent, generic UDF) is not visible on the wire, so an unknown name may be a newly added or renamed tool that has not been reviewed. If this tool is legitimate, ask your gateway operator to audit it against the Snowflake MCP server spec and add its exact name to the pinned allowlist in this policy."
- description: "Red-team bypass (fixed): a leading-whitespace padded bare server
