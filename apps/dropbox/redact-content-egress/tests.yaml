      claims:
        groups:
          - eng
    payload:
      name: dbx-get_file_content
      text:
        - "Contact jane.doe@acme.com or 415-555-0142 for access"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "Contact [REDACTED-EMAIL] or [REDACTED-PHONE] for access"

