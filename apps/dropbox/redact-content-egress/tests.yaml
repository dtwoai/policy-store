    payload:
      name: dropbox-mcp-GetFileContent
      text:
        - "build 1234.5678.9012.3456 shipped"
  output:
    expectedResult: allow
  transformApplied: false

- description: "Red-team (documented, fail-open): payload.text delivered as a BARE STRING (not an array) passes through unredacted — the transform requires is_array(text_blocks). Confirm your gateway emits array-shaped text blocks. See Known limitations."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: dropbox-mcp-GetFileContent
      uri: null
    subject:
      sub: auth0|u24
      claims:
        groups:
          - eng
    payload:
      name: dropbox-mcp-GetFileContent
      text: "SSN 123-45-6789 card 4111 1111 1111 1111"
  output:
    expectedResult: allow
  transformApplied: false

- description: "Red-team (documented edge): a card number glued directly to an email TLD with no separator (jane@acme.com4111111111111111) defeats the \\b anchor on both patterns and passes through. Contrived shape; see Known limitations."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: dropbox-mcp-GetFileContent
      uri: null
    subject:
      sub: auth0|u25
      claims:
        groups:
          - eng
    payload:
      name: dropbox-mcp-GetFileContent
      text:
        - "mail jane@acme.com4111111111111111 x"
  output:
    expectedResult: allow
  transformApplied: false

- description: "Red-team (fail-closed): no subject key at all — caller_may_view_full_pan is undefined, so PAN masking still applies (carve-out fails closed on a missing subject)."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: dropbox-mcp-GetFileContent
      uri: null
    payload:
