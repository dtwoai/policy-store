# --- Red-team regression cases (reviewer, standards §10) ---

- description: "Red-team: object-shaped groups claim {role: pci-fullpan} must NOT grant the carve-out — the is_array guard fails it closed, so the PAN is masked."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: dropbox-mcp-GetFileContent
      uri: null
    subject:
      sub: auth0|u18
      claims:
        groups:
          role: pci-fullpan
    payload:
      name: dropbox-mcp-GetFileContent
      text:
        - "card 4111 1111 1111 1111"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "card 411111******1111"

- description: "Red-team: egress with action=tool_post_invoke but mode unset — is_egress still matches on action, so redaction fires (no fail-open leak)."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    resource:
      type: tool
      name: dropbox-mcp-GetFileContent
      uri: null
    subject:
      sub: auth0|u19
      claims:
        groups:
          - eng
    payload:
      name: dropbox-mcp-GetFileContent
      text:
        - "SSN 123-45-6789"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "SSN [REDACTED-SSN]"

- description: "Red-team: tool name present only under payload.name (resource.name empty, no tool_metadata) — payload.name is a candidate surface, so the call is in scope and redaction fires."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: ""
      uri: null
    subject:
      sub: auth0|u20
      claims:
        groups:
          - eng
    payload:
      name: dropbox-mcp-GetFileContent
      text:
        - "SSN 123-45-6789"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "SSN [REDACTED-SSN]"

- description: "Red-team: a 20+ digit identifier is never partially masked (no word boundary inside a digit run) — left alone, no transform."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: dropbox-mcp-GetFileContent
      uri: null
    subject:
