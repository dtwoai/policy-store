      claims:
        groups:
          - eng
    payload:
      name: dropbox-mcp-GetFileContent
      text:
        - "trace id 41111111111111114111 logged"
  output:
    expectedResult: allow
  transformApplied: false

- description: "Red-team (fixed): dot-separated 16-digit PAN (4111.1111.1111.1111) is now masked — the separator class covers space, dash, AND dot, closing the dotted-card bypass."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: dropbox-mcp-GetFileContent
      uri: null
    subject:
