# Egress transform policy (default allow := true) — allow is always true; the
# meaningful assertions are transformApplied / transformedArgsContain. Cases
# cover every rule branch: each detection class (SSN, email, phone, secret,
# Luhn-checked PAN mask), the full-PAN carve-out (array + bare-string forms and
# its PAN-only scope), fail-closed on missing/malformed claims, every tool-name
# surface, out-of-scope tools (DownloadLink / metadata), the ingress guard,
# non-string blocks, and red-team bypasses.

- description: Official GetFileContent, non-exempt caller — SSN redacted, Luhn-valid PAN masked to BIN+last4, AKIA secret redacted, all in one block.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: dropbox-mcp-GetFileContent
      uri: null
    subject:
      sub: auth0|u1
      claims:
        groups:
          - support
    payload:
      name: dropbox-mcp-GetFileContent
      text:
        - "SSN 123-45-6789, card 4111 1111 1111 1111, key AKIA1234567890ABCDEF"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "SSN [REDACTED-SSN], card 411111******1111, key [REDACTED-SECRET]"

- description: Email and phone are redacted stand-alone (no co-occurrence heuristic) on community get_file_content.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: dbx-get_file_content
      uri: null
    subject:
