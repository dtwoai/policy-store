  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "card 411111******1111 on file"

- description: "Red-team (fixed): a dotted 4-4-4-4 run that fails Luhn (a version/build string) is still left alone — the dot separator did not weaken the Luhn gate."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
