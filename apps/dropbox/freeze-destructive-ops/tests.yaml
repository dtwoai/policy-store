# Documented residual (Known limitations: "Matching is a full-token suffix, not a
# substring"). The generic `delete` suffix only fires when the name ENDS in
# `delete`, so a batch/qualified delete tool ends in `_batch` and slips through.
# Dropbox's HTTP API has a real `/files/delete_batch`; no in-scope MCP dialect
# exposes it today. Locks the pass-through so a future edit can't silently change
# it, and flags that such a name must be added to `delete_suffixes` explicitly.
- description: Hypothetical delete_batch (trailing qualifier after 'delete') is NOT caught — documented full-token-suffix residual.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: dropbox-delete_batch
      uri: null
    payload:
      name: dropbox-delete_batch
      args:
        paths: ["/a", "/b"]
  output:
    expectedResult: allow

# Same residual: a `PermanentlyDelete`-style name does not END in a listed suffix
# (`permanentlydelete` != `delete` and has no `-`/`_` boundary before `delete`),
# so it passes through. Not an in-scope tool; must be enumerated if a fork adds it.
- description: Hypothetical PermanentlyDelete (no boundary before 'delete') is NOT caught — documented residual.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: dropbox-PermanentlyDelete
      uri: null
    payload:
      name: dropbox-PermanentlyDelete
      args:
        path: /x
  output:
    expectedResult: allow

# Fail-open probe: tool name entirely absent (resource.name missing). The
# gateway always populates resource.name for tool hooks, but confirm the
# name-only matcher defaults to "" (matches nothing) → allow, not a crash.
- description: Missing resource.name defaults to "" — no destructive match, allow (no fail-closed on unknown name).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      uri: null
    payload:
      args:
        path: /x
  output:
    expectedResult: allow
