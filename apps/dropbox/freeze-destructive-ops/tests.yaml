# --- Red-team regression cases (reviewer-added) ---

# Documented residual: "Overwrites are not deletion." An agent can replace a
# file's content by re-uploading over it without ever calling a delete tool.
# The official text-only CreateFile is NOT frozen here — locks the documented
# residual so a future edit can't silently start/stop blocking it unnoticed.
- description: Official CreateFile (overwrite) is NOT frozen — documented overwrite residual, passes through.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: dropbox-CreateFile
      uri: null
    payload:
      name: dropbox-CreateFile
      args:
        path: /Finance/2026/ledger.xlsx
        content: "overwritten"
  output:
    expectedResult: allow

# Community dbx-mcp-server upload_file takes arbitrary base64 (any file type),
# so it can overwrite any existing path. Same documented overwrite residual.
- description: Community dbx-mcp-server upload_file (base64 overwrite) is NOT frozen — documented residual.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: dbx-mcp-upload_file
      uri: null
    payload:
      name: dbx-mcp-upload_file
      args:
        path: /Finance/2026/ledger.xlsx
        content: "YmFzZTY0"
  output:
    expectedResult: allow

# ngs dropbox_upload overwrite — same residual on the third dialect.
- description: Community ngs dropbox_upload (overwrite) is NOT frozen — documented residual.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: dropbox-mcp-dropbox_upload
      uri: null
    payload:
      name: dropbox-mcp-dropbox_upload
      args:
        path: /docs/report.docx
        content: "hi"
  output:
    expectedResult: allow

