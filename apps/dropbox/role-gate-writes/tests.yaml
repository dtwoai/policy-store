# Tests for dropbox.ingress.role_gate_writes
# Branches covered:
#   allow  - read tools pass through without any group (ListFolder, GetFileContent, Search, WhoAmI, ListFileRevisions, GetFileRequest)
#   allow  - each write suffix + caller in dropbox-writers group
#   deny   - each write suffix across all three dialects without the group
#   deny   - subject/claims entirely absent (fail closed)
#   deny   - groups claim non-array string (fail closed)
#   deny   - empty groups array (fail closed)
#   allow  - group name matched case-insensitively (DROPBOX-WRITERS)
#   deny   - gateway server-name prefix still matched by suffix (red team)
#   allow  - scope boundary: Delete and CreateSharedLink pass through (companion policies own them)
#   allow  - copy suffix does NOT over-match copy_item / no separator handling

# ---------------------------------------------------------------------------
# Reads pass through with no group at all.

- description: ListFolder is a read tool — passes through with no writers group.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: dropbox-ListFolder
      uri: null
    subject:
      sub: google-apps|dev@example.com
      claims:
        groups:
          - engineering
    payload:
      name: dropbox-ListFolder
      args:
        path: /Projects
  output:
    expectedResult: allow

- description: GetFileContent is a read tool — passes through even with no groups claim.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
