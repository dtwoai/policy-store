# ---------------------------------------------------------------------------
# Fail-closed identity cases.

- description: No subject/claims at all on a write — grant fails closed. Deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: dropbox-CreateFolder
      uri: null
    payload:
      name: dropbox-CreateFolder
      args:
        path: /Projects/new
  output:
    expectedResult: deny

- description: Groups claim is a non-array string (malformed) on a write — iteration fails, grant fails closed. Deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: dropbox-CreateFolder
      uri: null
    subject:
      sub: google-apps|dev@example.com
      claims:
        groups: dropbox-writers
    payload:
      name: dropbox-CreateFolder
      args:
        path: /Projects/new
  output:
    expectedResult: deny

- description: Empty groups array on a write — grant fails closed. Deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: dropbox-CreateFolder
      uri: null
    subject:
      sub: google-apps|dev@example.com
      claims:
        groups: []
    payload:
      name: dropbox-CreateFolder
      args:
        path: /Projects/new
  output:
    expectedResult: deny

# ---------------------------------------------------------------------------
# Red team + scope-boundary cases.

- description: Red team — full gateway server-name prefix still matched by suffix on a write. Deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: dropbox-mcp-server-CreateFile
      uri: null
    subject:
      sub: google-apps|dev@example.com
      claims:
        groups:
          - engineering
    payload:
      name: dropbox-mcp-server-CreateFile
      args:
        path: /Projects/notes.txt
        content: hello
  output:
    expectedResult: deny

- description: Scope boundary — Delete is intentionally NOT gated here (destructive-freeze owns it); passes through even for a read-only caller. Allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: dropbox-Delete
      uri: null
    subject:
      sub: google-apps|dev@example.com
      claims:
        groups:
          - engineering
    payload:
      name: dropbox-Delete
      args:
        path: /Projects/old.txt
  output:
    expectedResult: allow

- description: Scope boundary — CreateSharedLink is intentionally NOT gated here (guard-share-links owns it); passes through this policy. Allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: dropbox-CreateSharedLink
      uri: null
    subject:
      sub: google-apps|dev@example.com
      claims:
        groups:
          - engineering
    payload:
      name: dropbox-CreateSharedLink
      args:
        path: /Projects/roadmap.pdf
  output:
    expectedResult: allow

# ---------------------------------------------------------------------------
# Red team (reviewer) — tool-name normalization.

- description: Red team — trailing space padded onto a write tool name must not evade the suffix match (trim_space). Deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: "dropbox-CreateFile "
      uri: null
    subject:
      sub: google-apps|dev@example.com
      claims:
        groups:
          - engineering
    payload:
      name: "dropbox-CreateFile "
      args:
        path: /Projects/notes.txt
        content: hello
  output:
    expectedResult: deny

- description: Red team — trailing newline padded onto a write tool name must not evade the suffix match (trim_space). Deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: "dropbox-CreateFolder\n"
      uri: null
    subject:
      sub: google-apps|dev@example.com
      claims:
        groups:
          - engineering
    payload:
      name: "dropbox-CreateFolder\n"
      args:
        path: /Projects/new
  output:
    expectedResult: deny

- description: Red team — leading whitespace on a write tool name must not evade the suffix match (trim_space). Deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: "  dropbox-upload_file"
      uri: null
    subject:
      sub: google-apps|dev@example.com
      claims:
        groups:
          - engineering
    payload:
      name: "  dropbox-upload_file"
      args:
        path: /Projects/x.bin
        content: aGVsbG8=
  output:
    expectedResult: deny

- description: Documented residual — a non-standard prefix separator (dot) is NOT matched by the -/_ suffix test, so the write passes through ungated (Known limitations). Allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: dropbox.CreateFile
      uri: null
    subject:
      sub: google-apps|dev@example.com
      claims:
        groups:
          - engineering
    payload:
      name: dropbox.CreateFile
      args:
        path: /Projects/notes.txt
        content: hello
  output:
    expectedResult: allow
