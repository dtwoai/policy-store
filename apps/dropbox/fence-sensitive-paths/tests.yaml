    expectedReason: "Dropbox path '/finance/ledger.xlsx' is inside the protected '/finance/' folder, which is restricted to the 'finance' group. Ask your Dropbox administrator to grant you the 'finance' group, or contact InfoSec if this fence looks wrong."

- description: Red-team - uppercase gateway prefix + mixed-case tool name is still matched by suffix and fenced.
