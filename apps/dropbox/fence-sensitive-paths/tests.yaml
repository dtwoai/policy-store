- description: Red-team - groups claim sent as a bare string (not an array) does not grant access; fenced path denied.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: dropbox-GetFileContent
      uri: null
    subject:
