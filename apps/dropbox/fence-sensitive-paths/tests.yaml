# --- Fail-closed: protected tool with no readable path ------------------------
- description: Unscoped Search (no path filter) is denied for everyone — even a caller holding every fenced group — because it can enumerate fenced filenames.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: dropbox-Search
      uri: null
    subject:
      sub: google-apps|dpo@example.com
      claims:
        groups:
          - finance
          - hr
          - legal
          - customers
    payload:
      name: dropbox-Search
      args:
        query: salary
  output:
    expectedResult: deny
    expectedReason: "This Dropbox call is a protected file operation but supplied no readable path, so the sensitive-path fence cannot verify it and the request fails closed. Re-issue with an explicit string path (for example the `path` argument scoped to a folder you may access)."

- description: ListFolder with no path argument fails closed (cannot verify the target).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: dropbox-ListFolder
      uri: null
    subject:
      sub: google-apps|dev@example.com
      claims:
        groups:
          - engineering
    payload:
      name: dropbox-ListFolder
      args: {}
  output:
    expectedResult: deny
    expectedReason: "This Dropbox call is a protected file operation but supplied no readable path, so the sensitive-path fence cannot verify it and the request fails closed. Re-issue with an explicit string path (for example the `path` argument scoped to a folder you may access)."

