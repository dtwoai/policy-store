    expectedReason: "Dropbox path '//Finance/2026/payroll.xlsx' is inside the protected '/finance/' folder, which is restricted to the 'finance' group. Ask your Dropbox administrator to grant you the 'finance' group, or contact InfoSec if this fence looks wrong."

- description: "Red-team (documented residual) - a fenced file reached by its Dropbox ns: namespace-relative path is NOT path-fenced and passes; pair with egress redaction."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: dropbox-GetFileContent
      uri: null
    subject:
      sub: google-apps|dev@example.com
      claims:
        groups:
          - engineering
    payload:
      name: dropbox-GetFileContent
      args:
        path: "ns:123456/Finance/2026/payroll.xlsx"
  output:
    expectedResult: allow

- description: "Red-team (documented residual) - a fenced file reached by its Dropbox id: handle is NOT path-fenced and passes; pair with egress redaction."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: dropbox-GetFileContent
      uri: null
    subject:
      sub: google-apps|dev@example.com
      claims:
        groups:
          - engineering
    payload:
      name: dropbox-GetFileContent
      args:
        path: "id:aQ7fkj2xYz0AAAAAAAAAAA"
  output:
    expectedResult: allow
