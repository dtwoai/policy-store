# Tests for dropbox/fence-sensitive-paths. Every rule branch is covered:
# pass-through of non-protected tools; protected tools allowed off-fence;
# protected tools denied on-fence without the mapped group; allowed on-fence
# WITH the group; reads/listings/writes(CreateFile)/deletes/moves/copies/search;
# move/copy checking both source and destination; scoped search allowed/denied;
# fail-closed on a protected tool with no readable path (unscoped search, missing
# path); fail-closed on a non-string path; community-dialect tool names (dbx +
# ngs) including the CreateFile/Delete synonyms; and red-team cases
# (case-insensitive path, missing leading slash, prefix-boundary sibling, missing
# groups claim, bare-string groups claim, uppercase tool name, and the documented
# id:-handle residual).
#
# fenced_prefixes under test: /hr->hr, /finance->finance, /legal->legal,
# /customers->customers.

# --- Pass-through -------------------------------------------------------------
- description: Non-protected Dropbox tool (CreateSharedLink) passes through even with a fenced path.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: dropbox-CreateSharedLink
      uri: null
    subject:
      sub: google-apps|dev@example.com
      claims:
        groups:
          - engineering
    payload:
      name: dropbox-CreateSharedLink
      args:
        path: /Finance/2026/payroll.xlsx
  output:
    expectedResult: allow

# --- Reads: off-fence / on-fence / on-fence-with-group ------------------------
- description: GetFileContent on an unfenced path is allowed.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: dropbox-GetFileContent
      uri: null
    subject:
      sub: google-apps|dev@example.com
      claims:
        groups:
          - engineering
    payload:
      name: dropbox-GetFileContent
      args:
        path: /Projects/roadmap.pdf
  output:
    expectedResult: allow

- description: GetFileContent on a fenced /Finance path without the finance group is denied.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: dropbox-GetFileContent
      uri: null
    subject:
      sub: google-apps|dev@example.com
      claims:
        groups:
          - engineering
    payload:
      name: dropbox-GetFileContent
      args:
        path: /Finance/2026/payroll.xlsx
  output:
    expectedResult: deny
    expectedReason: "Dropbox path '/Finance/2026/payroll.xlsx' is inside the protected '/finance/' folder, which is restricted to the 'finance' group. Ask your Dropbox administrator to grant you the 'finance' group, or contact InfoSec if this fence looks wrong."

- description: GetFileContent on a fenced /Finance path WITH the finance group is allowed.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
