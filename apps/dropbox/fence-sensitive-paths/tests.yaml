# --- Red-team -----------------------------------------------------------------
- description: Red-team - case-insensitive path matching means /FINANCE (uppercase) is still fenced.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: dropbox-GetFileContent
      uri: null
    subject:
      sub: google-apps|dev@example.com
      claims:
        groups:
          - engineering
    payload:
      name: dropbox-GetFileContent
      args:
        path: /FINANCE/2026/q1.xlsx
  output:
    expectedResult: deny
    expectedReason: "Dropbox path '/FINANCE/2026/q1.xlsx' is inside the protected '/finance/' folder, which is restricted to the 'finance' group. Ask your Dropbox administrator to grant you the 'finance' group, or contact InfoSec if this fence looks wrong."

- description: Red-team - path supplied without a leading slash is normalized and still fenced.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: dropbox-GetFileContent
      uri: null
    subject:
      sub: google-apps|dev@example.com
      claims:
        groups:
          - engineering
    payload:
      name: dropbox-GetFileContent
      args:
        path: finance/secret.xlsx
  output:
    expectedResult: deny
    expectedReason: "Dropbox path 'finance/secret.xlsx' is inside the protected '/finance/' folder, which is restricted to the 'finance' group. Ask your Dropbox administrator to grant you the 'finance' group, or contact InfoSec if this fence looks wrong."

- description: Red-team - prefix boundary; sibling /finance-public is NOT fenced by the /finance prefix.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: dropbox-GetFileContent
      uri: null
    subject:
      sub: google-apps|dev@example.com
      claims:
        groups:
          - engineering
    payload:
      name: dropbox-GetFileContent
      args:
        path: /finance-public/press-release.pdf
  output:
    expectedResult: allow

- description: Red-team - non-string path argument fails closed (fence cannot evaluate).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: dropbox-GetFileContent
      uri: null
    subject:
      sub: google-apps|dev@example.com
      claims:
        groups:
          - engineering
    payload:
      name: dropbox-GetFileContent
      args:
        path:
          nested: /finance/x
  output:
    expectedResult: deny
    expectedReason: "This Dropbox call carries a malformed path argument (not a string), so the sensitive-path fence cannot evaluate it and the request fails closed. Re-issue with a string path."

- description: Red-team - missing subject/claims entirely fails closed on a fenced path.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: dropbox-GetFileContent
      uri: null
    payload:
      name: dropbox-GetFileContent
