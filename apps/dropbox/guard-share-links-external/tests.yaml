# Tests for dropbox.ingress.guard_share_links_external
# Branches covered:
#   allow  - non-sharing tool passes through (read + non-sharing write)
#   allow  - external-sharing tool + caller in dropbox-sharing group
#   deny   - each external-sharing suffix without the group
#   deny   - group present but missing dropbox-sharing
#   deny   - subject/claims entirely absent (fail closed)
#   deny   - groups claim non-array (fail closed)
#   allow  - group name matched case-insensitively
#   deny   - gateway server-name prefix still matched by substring (red team)
#   deny   - trailing-token variants (...WithSettings / _with_settings / ...V2) caught by contains (red team)
#   allow  - read/revoke tools (ListSharedLinks, revoke, ListFileRequests, download_file) NOT caught by contains (regression)
#   allow  - sharing-group member may still create a trailing-token variant

- description: Read tool (GetFileContent) is not a sharing surface. Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: dropbox-GetFileContent
      uri: null
    subject:
      sub: google-apps|dev@example.com
      claims:
        groups:
          - engineering
    payload:
      name: dropbox-GetFileContent
      args:
        path: /Projects/roadmap.pdf
  output:
    expectedResult: allow

- description: Non-sharing write (CreateFolder) passes through untouched. Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: dropbox-CreateFolder
      uri: null
    subject:
