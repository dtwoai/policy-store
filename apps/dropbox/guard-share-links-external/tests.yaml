  output:
    expectedResult: allow

- description: Official CreateSharedLink, caller lacks the sharing group. Policy should deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: dropbox-CreateSharedLink
      uri: null
    subject:
      sub: google-apps|dev@example.com
      claims:
        groups:
          - engineering
    payload:
      name: dropbox-CreateSharedLink
      args:
        path: /Finance/2026/payroll.xlsx
  output:
    expectedResult: deny
    expectedReason: "Creating a public Dropbox share link, download link, or file request turns an internal file into an internet-visible resource in one step and is effectively irreversible once the URL is fetched, so it is blocked on the agent path by default. Route the file through an internal Dropbox channel (a shared team folder or existing workspace) instead, or ask a member of the 'dropbox-sharing' group to create the link. Contact your InfoSec team if this was a false positive."

