        groups: []
    payload:
      name: dropbox-CreateSharedLink
      args:
        path: /Finance/2026/payroll.xlsx
  output:
    expectedResult: deny

- description: Red team — claim-spoofing via a look-alike group name (dropbox-sharing-admins). Group check is exact equality, not substring, so this must NOT grant. Policy should deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: dropbox-CreateSharedLink
      uri: null
    subject:
      sub: google-apps|dev@example.com
      claims:
        groups:
          - dropbox-sharing-admins
          - sharing
    payload:
      name: dropbox-CreateSharedLink
      args:
        path: /Finance/2026/payroll.xlsx
  output:
    expectedResult: deny

- description: Red team — a malformed groups array mixing a non-string element with the valid sharing group. The valid string still grants (iteration skips the bad element). Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: dropbox-CreateSharedLink
      uri: null
    subject:
      sub: google-apps|ops@example.com
      claims:
        groups:
          - 123
          - dropbox-sharing
    payload:
      name: dropbox-CreateSharedLink
      args:
        path: /Projects/roadmap.pdf
  output:
    expectedResult: allow

- description: Red team / documented gap — a "shared"-not-"sharing" creation verb (get_shared_link) matches none of the narrow stems and passes through. Locks the Known-limitation boundary. Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: dropbox-get_shared_link
      uri: null
    subject:
