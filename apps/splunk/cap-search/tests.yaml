      args: { query: "search index=web earliest=-1h [search index=users earliest=-30d | fields user]" }
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain: { query: "search index=web earliest=-1h [search index=users earliest=-7d | fields user]" }

