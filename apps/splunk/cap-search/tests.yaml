# --- Each search scope bounded on its own (PR #33 review) ---

- description: Outer search unbounded, subsearch bounded — default added to the outer search only.
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: splunk-splunk_run_query, uri: null }
    payload:
      args: { query: "search index=web [search index=users earliest=-1h | fields user] | stats count" }
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain: { query: "search earliest=-24h index=web [search index=users earliest=-1h | fields user] | stats count" }

- description: Outer search bounded, subsearch unbounded — default added to the subsearch only.
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: splunk-splunk_run_query, uri: null }
    payload:
      args: { query: "search index=web earliest=-1h [search index=users | fields user]" }
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain: { query: "search index=web earliest=-1h [search earliest=-24h index=users | fields user]" }

- description: Neither bounded — default added to both.
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: splunk-splunk_run_query, uri: null }
    payload:
      args: { query: "index=web [search index=users | fields user]" }
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain: { query: "earliest=-24h index=web [search earliest=-24h index=users | fields user]" }

- description: Nested subsearches — each scope checked on its own.
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: splunk-splunk_run_query, uri: null }
    payload:
      args: { query: "index=web [search index=a [search index=b earliest=-2h | fields id] | fields user]" }
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain: { query: "earliest=-24h index=web [search earliest=-24h index=a [search index=b earliest=-2h | fields id] | fields user]" }

- description: Two sibling subsearches, one bounded and one too wide — default added, wide one trimmed.
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: splunk-splunk_run_query, uri: null }
    payload:
      args: { query: "search index=web earliest=-1h [search index=a | fields x] [search index=b earliest=-30d | fields y]" }
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain: { query: "search index=web earliest=-1h [search earliest=-24h index=a | fields x] [search index=b earliest=-7d | fields y]" }

- description: Generating-command subsearch ([| inputlookup]) is skipped.
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: splunk-splunk_run_query, uri: null }
    payload:
      args: { query: "index=web earliest=-1h [| inputlookup users.csv | fields user]" }
  output:
    expectedResult: allow
  transformApplied: false

- description: Brackets inside a quoted rex pattern are not a subsearch.
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: splunk-splunk_run_query, uri: null }
    payload:
      args: { query: "index=web earliest=-1h | rex \"user=(?<u>[^ ]+)\"" }
  output:
    expectedResult: allow
  transformApplied: false

- description: earliest_time argument sets the job range — no default added to a subsearch.
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: splunk-run_splunk_search, uri: null }
    payload:
      args: { search: "index=web [search index=users | fields user]", earliest_time: "-1h" }
  output:
    expectedResult: allow
  transformApplied: false
