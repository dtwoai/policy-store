# Transform-only policy (default allow := true): allow is always true; the
# meaningful assertions are transformApplied / transformedArgsContain. Cases
# cover default injection, trimming each unit family, all-time/epoch values,
# subsearches, skipped query shapes, the earliest_time argument, and scope.

- description: No time range, leading search keyword — earliest=-24h added after it.
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: splunk-splunk_run_query, uri: null }
    payload:
      args: { query: "search index=payments timeout | stats count by host" }
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain: { query: "search earliest=-24h index=payments timeout | stats count by host" }

- description: No time range, no search keyword — earliest=-24h prepended.
