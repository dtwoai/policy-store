# Transform-only policy (default allow := true): allow is always true; the
# meaningful assertions are transformApplied / transformedArgsContain. Cases
# cover each time format, the window boundary, the limit argument passing
# through untouched, and out-of-scope tools.

- description: Logs search over 30 days with limit 1000 — window trimmed to now-7d; limit passes through unchanged.
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: datadog-search_datadog_logs, uri: null }
    payload:
      args: { query: "service:checkout-api status:error", from: now-30d, limit: 1000 }
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain: { from: now-7d, limit: 1000, query: "service:checkout-api status:error" }

- description: Logs search over the last hour with limit 50 — untouched.
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: datadog-search_datadog_logs, uri: null }
    payload:
      args: { query: "service:checkout-api", from: now-1h, limit: 50 }
  output:
    expectedResult: allow
  transformApplied: false

- description: Exactly 7 days (now-7d) is within the cap — untouched.
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: datadog-search_datadog_logs, uri: null }
    payload:
      args: { query: "*", from: now-7d, limit: 100 }
  output:
    expectedResult: allow
  transformApplied: false

- description: Two weeks given in weeks (now-2w) on aggregate_spans — trimmed.
