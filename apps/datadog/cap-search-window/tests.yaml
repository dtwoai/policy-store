    payload:
      args: { query: "service:checkout-api", from: now-2w, computes: [{ field: "*", aggregation: COUNT, output: n }] }
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain: { from: now-7d }

- description: Aggregation within the window — untouched.
