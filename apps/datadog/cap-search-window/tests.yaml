- description: Absolute RFC 3339 range of 31 days — from moved to 7 days before to.
  input:
    action: tool_pre_invoke
    mode: input
    resource: { type: tool, name: datadog-analyze_datadog_logs, uri: null }
    payload:
      args: { sql_query: "SELECT count(*) FROM logs", from: "2026-09-01T00:00:00Z", to: "2026-10-02T00:00:00Z" }
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain: { from: "2026-09-25T00:00:00Z", to: "2026-10-02T00:00:00Z" }

