      args:
        id: "56"
        print_on_check_name: "remit to 000123456789"
  output:
    expectedResult: allow

- description: Red-team residual — parameterized mega-tool server (hvkshetry `party`, verb in argument) carrying bank details. Tool name matches neither suffix, so it passes. Policy allows (documented limitation — needs a companion arg-inspecting policy).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: qbo-mcp-party
      uri: null
    payload:
      name: qbo-mcp-party
      args:
        operation: update
        party_type: vendor
        bank_account_number: "000123456789"
        routing_number: "021000021"
  output:
    expectedResult: allow

- description: Red-team residual — undashed 9-digit SSN in a free-text field with no sensitive key name. The dash-delimited value regex does not match, so it passes. Policy allows (documented limitation).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
