        TaxIdentifier: PROVIDED
  output:
    expectedResult: deny
    expectedReason: "Creating or updating a vendor with bank-account, routing/ACH, or tax-identity (EIN/SSN) fields is blocked at the gateway. Silently repointing a vendor's payment coordinates is the primary business-email-compromise (BEC) vector: a rerouted bank account diverts every future ACH payment. Change vendor banking or tax-ID details directly in QuickBooks under dual approval, or ask your finance/AP administrator to make the change or grant an exception."

- description: Vendor update smuggling an SSN into a free-text notes field (no sensitive key name). Policy should deny (tax-ID-value branch).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: qbo-mcp-update_vendor
      uri: null
    payload:
      name: qbo-mcp-update_vendor
      args:
        id: "56"
        display_name: Contractor Co
        notes: "1099 vendor, taxpayer 123-45-6789"
  output:
    expectedResult: deny
    expectedReason: "This vendor create/update carries a value shaped like a US tax identifier (SSN or EIN). Tax IDs for 1099 vendors must be set in QuickBooks under finance review, not through the agent. Contact your finance/AP administrator if this change is legitimate."

- description: Vendor create with an EIN-shaped value under a benign key. Policy should deny (tax-ID-value branch).
  input:
    action: tool_pre_invoke
