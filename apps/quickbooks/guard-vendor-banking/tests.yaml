# Tests for quickbooks.ingress.guard_vendor_banking
# Covers: non-vendor pass-through, benign vendor edits, banking-field deny
# (snake_case + PascalCase, nested), tax-field deny, tax-ID-value deny, and the
# red-team bypasses (vendor_credit exclusion, delete pass-through, gateway
# prefix, missing args, free-text shapeless account-number residual).

- description: Non-vendor tool (create_invoice) — not a vendor write. Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: qbo-mcp-create_invoice
      uri: null
    payload:
      name: qbo-mcp-create_invoice
      args:
        customer_ref: "12"
        line_items:
          - item_ref: "5"
            qty: 1
            unit_price: 100
  output:
    expectedResult: allow

- description: Read vendor (get_vendor) — reads are out of scope. Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: qbo-mcp-get_vendor
      uri: null
    payload:
      name: qbo-mcp-get_vendor
      args:
        id: "56"
  output:
    expectedResult: allow

- description: Vendor update touching only display name / terms — non-banking edit. Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: qbo-mcp-update_vendor
      uri: null
    payload:
      name: qbo-mcp-update_vendor
      args:
        id: "56"
        display_name: Acme Supplies
        terms_ref: NET30
        primary_email_addr: ap@acme.example
  output:
    expectedResult: allow

- description: Vendor create with snake_case bank_account_number + routing_number. Policy should deny (banking-field branch).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: qbo-mcp-create_vendor
      uri: null
    payload:
      name: qbo-mcp-create_vendor
      args:
        display_name: New Vendor LLC
        bank_account_number: "000123456789"
        routing_number: "021000021"
  output:
    expectedResult: deny
    expectedReason: "Creating or updating a vendor with bank-account, routing/ACH, or tax-identity (EIN/SSN) fields is blocked at the gateway. Silently repointing a vendor's payment coordinates is the primary business-email-compromise (BEC) vector: a rerouted bank account diverts every future ACH payment. Change vendor banking or tax-ID details directly in QuickBooks under dual approval, or ask your finance/AP administrator to make the change or grant an exception."

- description: Vendor update with LibreChat PascalCase bank details nested under VendorPaymentBankDetail. Policy should deny (banking-field branch, nested + PascalCase).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: qbo-mcp-update_vendor
      uri: null
    payload:
      name: qbo-mcp-update_vendor
      args:
        Id: "56"
        VendorPaymentBankDetail:
          BankAccountNumber: "000987654321"
          BankBranchIdentifier: "026009593"
  output:
    expectedResult: deny
    expectedReason: "Creating or updating a vendor with bank-account, routing/ACH, or tax-identity (EIN/SSN) fields is blocked at the gateway. Silently repointing a vendor's payment coordinates is the primary business-email-compromise (BEC) vector: a rerouted bank account diverts every future ACH payment. Change vendor banking or tax-ID details directly in QuickBooks under dual approval, or ask your finance/AP administrator to make the change or grant an exception."

