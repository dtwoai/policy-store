- description: Documented residual — a shapeless bank account number in a free-text field with no sensitive key name is NOT caught. Policy allows (see Known limitations).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: qbo-mcp-update_vendor
      uri: null
    payload:
