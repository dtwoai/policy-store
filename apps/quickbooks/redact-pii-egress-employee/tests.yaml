# --- Red-team regression cases (reviewer, standards §10) ---

- description: "Red-team: object-shaped groups claim {department: finance} must NOT grant the exemption — is_array guard fails it closed, so redaction still applies."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: quickbooks-mcp-get_employee
      uri: null
    subject:
      sub: auth0|u14
      claims:
        groups:
          department: finance
    payload:
      name: quickbooks-mcp-get_employee
      text:
        - '{"Employee":{"SSN":"123-45-6789"}}'
  output:
    expectedResult: allow
  transformApplied: true

- description: "Red-team: nested-array groups [[hr]] is not a flat array of strings — is_string(g) fails, caller not exempt, redaction applies."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: quickbooks-mcp-get_vendor
      uri: null
    subject:
      sub: auth0|u15
      claims:
        groups:
          - - hr
    payload:
      name: quickbooks-mcp-get_vendor
      text:
        - '{"Vendor":{"TaxIdentifier":"12-3456789"}}'
  output:
    expectedResult: allow
  transformApplied: true

# Reviewer red-team: scope-of-redaction bypasses. Both are DOCUMENTED limitations
# (see Known limitations) — these cases lock the current behaviour so a future
# edit that silently narrows/widens scope is caught.

- description: "Red-team (documented limitation): an EIN-shaped identifier returned by get_company_info — an out-of-scope read tool — is NOT masked. Field- and pattern-redaction fire only for the four name-entity tools, so the transform is never emitted and the same identifier escapes via reports / company-info / attachable reads."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: quickbooks-mcp-get_company_info
      uri: null
    subject:
      sub: auth0|u16
      claims:
        groups:
          - eng
    payload:
      name: quickbooks-mcp-get_company_info
      text:
        - '{"CompanyInfo":{"CompanyName":"Acme","LegalName":"Acme LLC","Note":"owner EIN 12-3456789"}}'
  output:
    expectedResult: allow
  transformApplied: false

- description: "Red-team (FIXED): egress signalled only by the legacy `kind` field (action and mode both absent) — an older gateway near the minimum version may populate only `kind`. is_egress must still match on `kind`, so redaction fires and PII does not leak. Before the fix this returned transformApplied=false (fail-open leak)."
  input:
    kind: tool_post_invoke
    resource:
      type: tool
      name: quickbooks-mcp-get_employee
      uri: null
    subject:
      sub: auth0|u18
      claims:
        groups:
          - eng
    payload:
      name: quickbooks-mcp-get_employee
      text:
        - '{"Employee":{"SSN":"123-45-6789"}}'
  output:
    expectedResult: allow
  transformApplied: true

- description: "Red-team (documented limitation): the archived hvkshetry `party` mega-tool carries the verb in an `operation` argument, so an Employee read arrives as tool name `party` (party_type=Employee). It ends with none of the four suffixes, so no transform is emitted and the SSN in the response is NOT masked. Locks the documented parameterized-server gap so a future suffix edit that silently claims to cover it is caught."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: quickbooks-mcp-party
      uri: null
    subject:
      sub: auth0|u19
      claims:
        groups:
          - eng
    payload:
      name: quickbooks-mcp-party
      text:
        - '{"party_type":"Employee","Employee":{"SSN":"123-45-6789"}}'
  output:
    expectedResult: allow
  transformApplied: false

- description: "Red-team (documented limitation): a non-exempt Employee read whose only sensitive fields are contact PII (PrimaryEmailAddr / Mobile / BirthDate). The transform fires, but redact_fields is scoped to high-value identifiers only — email, phone, and DOB are absent from the list and match neither the SSN nor the EIN pattern, so they pass through. This asserts the exact field set to guard against silent scope drift."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: quickbooks-mcp-get_employee
      uri: null
    subject:
      sub: auth0|u17
      claims:
        groups:
          - eng
    payload:
      name: quickbooks-mcp-get_employee
      text:
        - '{"Employee":{"PrimaryEmailAddr":{"Address":"jane@example.com"},"Mobile":{"FreeFormNumber":"555-1212"},"BirthDate":"1990-01-01"}}'
  output:
    expectedResult: allow
  transformApplied: true
  transform:
    redact_fields:
      - SSN
      - PrimaryAddr
      - BillRate
      - TaxIdentifier
      - AcctNum
      - BankAccountNumber
      - BankBranchIdentifier
      - VendorPaymentBankDetail
