# --- Fail-closed on identity ---

- description: Fail closed for the grant — subject has claims but no groups claim, so the caller is not exempt and redaction applies.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: quickbooks-mcp-get_employee
      uri: null
    subject:
      sub: auth0|u11
      claims:
        scope: openid profile
    payload:
      name: quickbooks-mcp-get_employee
      text:
        - '{"Employee":{"SSN":"123-45-6789"}}'
  output:
    expectedResult: allow
  transformApplied: true

- description: "Fail closed — no subject at all: the object.get chain yields no groups, caller is not exempt, redaction applies."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: quickbooks-mcp-get_vendor
      uri: null
    payload:
