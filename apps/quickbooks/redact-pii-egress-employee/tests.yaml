  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: ""
      uri: null
    tool_metadata:
      name: qbo-prod-get_employee
    subject:
      sub: auth0|u5
      claims:
        groups:
          - eng
    payload:
      name: qbo-prod-get_employee
      text:
        - '{"Employee":{"SSN":"111-22-3333"}}'
  output:
    expectedResult: allow
  transformApplied: true

- description: "Tool name present only under payload.name (resource.name empty, no tool_metadata) — payload.name is a candidate surface, so in scope."
