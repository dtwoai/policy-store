# Egress transform policy (default allow := true) — allow is always true; the
# meaningful assertions are transformApplied / the transform object. Cases cover
# every rule branch: all four in-scope tools, each tool-name surface (resource,
# tool_metadata, payload), both is_egress branches (mode, action-only), all three
# exemption forms (array / bare-string / case-insensitive), fail-closed on missing
# claims and missing subject, out-of-scope tool, the ingress guard, and the
# red-team group-claim shapes (object-map, nested array).

# --- In scope, non-exempt: transform emitted (asserted field-by-field once) ---

- description: Employee read, non-exempt caller (sales) — transform emitted with the full redact instruction.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: quickbooks-mcp-get_employee
      uri: null
    subject:
      sub: auth0|u1
      claims:
        groups:
          - sales
    payload:
      name: quickbooks-mcp-get_employee
      text:
        - '{"Employee":{"SSN":"123-45-6789","PrimaryAddr":{"Line1":"1 Main St"}}}'
  output:
    expectedResult: allow
  transformApplied: true
  transform:
    redact_fields:
      - SSN
      - PrimaryAddr
      - BillRate
      - TaxIdentifier
      - AcctNum
      - BankAccountNumber
      - BankBranchIdentifier
      - VendorPaymentBankDetail
    redact_patterns:
      - '\b\d{3}-\d{2}-\d{4}\b'
      - '\b\d{2}-\d{7}\b'
    replacement: "[REDACTED]"

