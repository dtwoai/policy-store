- description: >-
    Red-team (documented gap) — camelCase tool name `createPayment` (no underscore) is not
    matched by the snake_case suffix list, so it passes through unchanged even for a
    non-finance caller with a large amount. Not the case for any surveyed server; verify
    the exact tool strings your gateway emits.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: quickbooks-mcp-createPayment
      uri: null
    subject:
      claims:
        groups:
          - sales
    payload:
      name: quickbooks-mcp-createPayment
      args:
        amount: 90000
  output:
    expectedResult: allow
- description: >-
    Red-team — args supplied as a non-object (a raw string) yields no parseable candidate,
    so extraction fails closed and the money-movement call is denied.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: quickbooks-mcp-create_transfer
      uri: null
    subject:
      claims:
        groups:
          - finance
    payload:
      name: quickbooks-mcp-create_transfer
      args: amount=9000
  output:
    expectedResult: deny
    expectedReason: This money-movement call was denied because no transaction amount could be read from the request, so the $5,000 approval ceiling cannot be verified. Route this disbursement through the human approval workflow, or resend with an explicit amount if you believe this is a false positive.
