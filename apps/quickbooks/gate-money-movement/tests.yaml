- description: Read tool (search_invoices) is not money movement — passes through regardless of group.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: quickbooks-mcp-search_invoices
      uri: null
    subject:
      claims: {}
    payload:
      name: quickbooks-mcp-search_invoices
      args:
        criteria:
          field: TxnDate
          value: "2026-01-01"
  output:
    expectedResult: allow
- description: Non-money-movement write (create_customer) passes through even for a non-finance caller.
