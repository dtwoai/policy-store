- description: >-
    Red-team (documented residual) — real amount in an UNRECOGNIZED field
    (PaymentAmount) plus a small recognized decoy (amount:1). Extraction succeeds
    on the decoy, so the call is ALLOWED under the ceiling while the real $90000 goes
    uncounted. Documents the max-of-candidates residual: reconcile amount_keys with
    the live schema. NOT a fail-closed deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: quickbooks-mcp-create_payment
      uri: null
    subject:
      claims:
        groups:
          - finance
    payload:
      name: quickbooks-mcp-create_payment
      args:
        amount: 1
        PaymentAmount: 90000
  output:
    expectedResult: allow
- description: >-
    Red-team — real amount in an unrecognized field with NO recognized decoy at all
    fails closed (deny), confirming the guard only breaks when a recognized decoy is
    added.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: quickbooks-mcp-create_payment
      uri: null
    subject:
      claims:
        groups:
          - finance
    payload:
      name: quickbooks-mcp-create_payment
      args:
        PaymentAmount: 90000
  output:
    expectedResult: deny
    expectedReason: This money-movement call was denied because no transaction amount could be read from the request, so the $5,000 approval ceiling cannot be verified. Route this disbursement through the human approval workflow, or resend with an explicit amount if you believe this is a false positive.
- description: >-
    Red-team (documented gap) — update_payment is NOT one of the five gated create_*
    tools, so it passes through even for a non-finance (sales) caller carrying a large
    amount. Compose with role-gate-writes to close this.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: quickbooks-mcp-update_payment
      uri: null
    subject:
      claims:
        groups:
          - sales
    payload:
      name: quickbooks-mcp-update_payment
      args:
        amount: 90000
  output:
    expectedResult: allow
- description: >-
    Red-team (documented gap) — parameterized hvkshetry-style `transaction` tool with
    the verb in an `operation` argument is not matched by the create_* suffix list and
    passes through. Add an argument-level rule if that server is in scope.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: quickbooks-mcp-transaction
      uri: null
    subject:
      claims:
        groups:
          - sales
    payload:
      name: quickbooks-mcp-transaction
      args:
        operation: create
        entity_type: payment
        amount: 90000
  output:
    expectedResult: allow
- description: >-
    Red-team — comma-formatted amount string "9,000" is not coerced by to_number, so if
    it is the only field present the policy fails closed (deny), not a silent
    under-count. Multi-currency / formatted amounts must be normalized upstream.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: quickbooks-mcp-create_transfer
      uri: null
    subject:
      claims:
        groups:
          - finance
    payload:
      name: quickbooks-mcp-create_transfer
      args:
        amount: "9,000"
  output:
    expectedResult: deny
    expectedReason: This money-movement call was denied because no transaction amount could be read from the request, so the $5,000 approval ceiling cannot be verified. Route this disbursement through the human approval workflow, or resend with an explicit amount if you believe this is a false positive.
