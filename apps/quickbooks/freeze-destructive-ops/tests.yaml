- description: Dedicated delete_invoice tool is denied by the delete_ verb match.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: quickbooks-delete_invoice
      uri: null
    payload:
      name: quickbooks-delete_invoice
      args:
        id: "145"
  output:
    expectedResult: deny
    expectedReason: "The tool 'quickbooks-delete_invoice' performs a destructive QuickBooks operation. In QuickBooks Online most transaction deletes are hard deletes, recoverable only from the audit log, so agent-initiated deletes and deactivations are blocked on this channel. A person must perform the deletion in the QuickBooks Online UI. Contact your finance or InfoSec team if this block is a false positive."

