        entity_type: Invoice
        id: "145"
  output:
    expectedResult: deny
    expectedReason: "This QuickBooks tool call requests a destructive operation ('delete') through its 'operation' argument. Delete, void, and deactivate are blocked on the agent channel because QuickBooks transaction deletes are hard deletes, recoverable only from the audit log. Perform the change in the QuickBooks Online UI instead. Contact your finance or InfoSec team if this block is a false positive."

