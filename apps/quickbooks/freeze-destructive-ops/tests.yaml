# quickbooks / freeze-destructive-ops — every rule branch + red-team bypasses.

- description: Read tool (get_invoice) passes through untouched.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: quickbooks-get_invoice
      uri: null
    payload:
      name: quickbooks-get_invoice
      args:
        id: "145"
  output:
    expectedResult: allow

