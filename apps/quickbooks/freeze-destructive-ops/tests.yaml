# Red-team: hyphen-separated delete-invoice (a build/gateway that renders the
# verb/entity boundary with `-` instead of `_`) must still be denied. This was a
# real bypass under the old `delete_` regex; fixed by matching `delete[_-]`.
- description: Hyphen-separated delete-invoice is denied (delete[_-] boundary).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: quickbooks-delete-invoice
      uri: null
    payload:
      name: quickbooks-delete-invoice
      args:
        id: "145"
  output:
    expectedResult: deny

# Red-team boundary lock: a READ tool whose name merely contains "deleted" must
# NOT be over-blocked (the char after `delete` is a letter, not a separator).
- description: Read tool get_deleted_invoices is allowed (not a delete_/delete- match).
  input:
    action: tool_pre_invoke
