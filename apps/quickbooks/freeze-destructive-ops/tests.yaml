    expectedResult: allow

# Red-team documented residual: a concatenated delete name with NO verb/entity
# separator is not matched by the name rule. Not a real evasion on a correctly
# configured gateway (it routes on the exact registered `delete_<entity>` name);
# documented under Known limitations, compose PF-28 if the invariant can't hold.
- description: No-separator concatenated deleteinvoice is not matched (documented residual, allowed).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: quickbooks-deleteinvoice
      uri: null
    payload:
      name: quickbooks-deleteinvoice
      args:
        id: "145"
  output:
    expectedResult: allow

# Red-team documented residual: reversible deactivation of a name entity via an
# ordinary update_customer(active:false) write is NOT blocked — the policy allows
# non-destructive updates by design. Bounded to reversible deactivations; hard
# deletes/voids of transactions have no update_* equivalent. Documented under
# Known limitations; compose PF-12 role-gate-writes to freeze active:false toggles.
- description: Reversible deactivation via update_customer(active=false) passes through (documented residual).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: quickbooks-update_customer
      uri: null
    payload:
      name: quickbooks-update_customer
      args:
        id: "58"
        active: false
  output:
    expectedResult: allow

# Red-team fix: the operation-argument rule blocks {delete, void, deactivate} but
# the OLD tool-name rule only matched `delete[_-]`, so a dedicated void_/deactivate_
# tool (plausible on the unverified Claude-connector build) would pass by name.
# Fixed by broadening the name regex to (delete|void|deactivate)[_-].
- description: Dedicated void_payment tool is denied by the broadened destructive-verb name match.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: quickbooks-void_payment
      uri: null
    payload:
      name: quickbooks-void_payment
      args:
        id: "22"
  output:
    expectedResult: deny
    expectedReason: "The tool 'quickbooks-void_payment' performs a destructive QuickBooks operation. In QuickBooks Online most transaction deletes are hard deletes, recoverable only from the audit log, so agent-initiated deletes and deactivations are blocked on this channel. A person must perform the deletion in the QuickBooks Online UI. Contact your finance or InfoSec team if this block is a false positive."

- description: Dedicated deactivate_customer tool (hyphen-prefixed server) is denied by the broadened name match.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
