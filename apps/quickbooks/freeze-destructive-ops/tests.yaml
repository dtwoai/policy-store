# Red-team documented residual: the operation-argument rule keys on the exact verb
# set {delete, void, deactivate}. A parameterized mega-tool that uses a DIFFERENT
# destructive verb (e.g. operation=purge/remove) and carries no delete_/void_/
# deactivate_ tool name is NOT caught. No surveyed QBO build uses these verbs;
# documented under Known limitations — extend destructive_operations if yours does.
- description: Mega-tool operation=purge (verb outside the destructive set) is not caught (documented residual, allowed).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: qbo-transaction
      uri: null
    payload:
      name: qbo-transaction
      args:
        operation: purge
        entity_type: Invoice
        id: "1"
  output:
    expectedResult: allow

# Red-team documented residual: a non-string operation value (e.g. an array) is
# stringified by sprintf("%v") to "[delete]", which is not in the destructive set,
# so it is not caught by the argument rule. Not a real evasion: a typed mega-tool
# server rejects a non-string operation, so the call never reaches a destructive
# code path. Documented; asserts current behavior.
- description: Mega-tool operation as an array value is stringified and not matched (documented residual, allowed).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: qbo-transaction
      uri: null
    payload:
      name: qbo-transaction
      args:
        operation:
          - delete
        id: "1"
  output:
    expectedResult: allow
