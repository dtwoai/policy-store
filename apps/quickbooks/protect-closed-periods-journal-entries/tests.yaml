- description: Create a journal entry with no subject/claims at all — fails closed, denied.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: qbo-mcp-create_journal_entry
      uri: null
    payload:
      name: qbo-mcp-create_journal_entry
      args:
        line_items:
          - amount: 999999
  output:
    expectedResult: deny
    expectedReason: "Direct journal-entry writes to the QuickBooks general ledger are restricted to the controller role. A manual journal entry restates the ledger without flowing through a normal transaction workflow, so it is gated for segregation of duties. Ask a controller to post the entry, or request the controller group from your finance systems administrator if you believe this is a false positive."

