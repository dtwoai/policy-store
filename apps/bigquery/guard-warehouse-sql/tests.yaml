# Tests for bigquery/guard-warehouse-sql (PF-07, ingress).
# Covers every rule branch: non-guarded tool passthrough, read-only tool
# exclusion, read-only SELECT on a write tool, break-glass exemption, the
# mutating-SQL deny, and the fail-closed empty-SQL deny — plus red-team cases
# (identifier substrings, comment/string-literal keywords, CREATE TEMP,
# each write suffix, per-keyword coverage).

# --- Passthrough: non-guarded metadata/read tool -----------------------------
- description: Metadata tool list_dataset_ids is not a write-capable SQL tool. Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: bigquery-mcp-list_dataset_ids
      uri: null
    payload:
      name: bigquery-mcp-list_dataset_ids
      args:
        project_id: my-proj
  output:
    expectedResult: allow

- description: LucasHild metadata tool list-tables is not a write-capable SQL tool. Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: bq-mcp-list-tables
      uri: null
    payload:
      name: bq-mcp-list-tables
      args: {}
  output:
    expectedResult: allow

# --- Read-only tool is matched first and excluded ----------------------------
- description: execute_sql_readonly with a scary DROP-looking string literal. _readonly matched first, so allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: bigquery-mcp-execute_sql_readonly
      uri: null
    payload:
      name: bigquery-mcp-execute_sql_readonly
      args:
        sql: "SELECT 'we should DROP TABLE later' AS note"
  output:
    expectedResult: allow

# --- Read-only SELECT on a write-capable tool passes -------------------------
- description: Plain SELECT on execute_sql. Read-only, no mutating keyword. Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: bigquery-mcp-execute_sql
      uri: null
    payload:
      name: bigquery-mcp-execute_sql
      args:
        sql: "SELECT id, created_at, updated_at FROM ds.orders LIMIT 10"
  output:
    expectedResult: allow

- description: SELECT via ergut query tool. Read-only. Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: ergut-bq-query
      uri: null
    payload:
      name: ergut-bq-query
      args:
        sql: "SELECT COUNT(*) FROM ds.events"
  output:
    expectedResult: allow

# --- Red-team: identifier substrings must NOT trip word-boundary patterns -----
- description: Column names created_at/updated_at/merge_log resemble CREATE/UPDATE/MERGE but are word-bounded identifiers. Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: bigquery-mcp-execute_sql
      uri: null
    payload:
      name: bigquery-mcp-execute_sql
      args:
        sql: "SELECT created_at, updated_at, merge_log FROM ds.audit"
  output:
    expectedResult: allow

# --- CREATE TEMP is exempted from the CREATE class ---------------------------
- description: CREATE TEMP TABLE is a temporary create, allowed by the emulated CREATE lookahead. Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: bigquery-mcp-execute_sql
      uri: null
    payload:
      name: bigquery-mcp-execute_sql
      args:
        sql: "CREATE TEMP TABLE t AS SELECT 1 AS x"
  output:
    expectedResult: allow

# --- Denies: mutating / destructive SQL --------------------------------------
- description: DROP TABLE on execute_sql, non-exempt caller. Policy should deny with the mutating-SQL reason.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: bigquery-mcp-execute_sql
      uri: null
    payload:
      name: bigquery-mcp-execute_sql
      args:
        sql: "DROP TABLE ds.customers"
  output:
    expectedResult: deny
    expectedReason: "This BigQuery statement performs a write, DDL, or otherwise state-changing operation (INSERT, UPDATE, DELETE, MERGE, TRUNCATE TABLE, DROP TABLE/DATASET/SCHEMA, ALTER, non-temporary CREATE, CALL, GRANT, LOAD DATA, or EXECUTE IMMEDIATE) and is blocked on the agent MCP path, which is read-only. Re-issue the query through the read-only tool execute_sql_readonly, or route the write through an approved data-engineering pipeline. If this was a false positive, contact your data platform team."

- description: DELETE on execute_sql, non-exempt caller. Policy should deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: bigquery-mcp-execute_sql
      uri: null
    payload:
      name: bigquery-mcp-execute_sql
      args:
        sql: "DELETE FROM ds.orders WHERE id = 1"
  output:
    expectedResult: deny

- description: INSERT on ergut query tool, non-exempt. Policy should deny.
  input:
