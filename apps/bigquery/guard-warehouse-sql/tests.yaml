      uri: null
    payload:
      name: ergut-bq-query
      args:
        sql: "INSERT INTO ds.orders (id) VALUES (1)"
  output:
    expectedResult: deny

- description: UPDATE on LucasHild execute-query tool, non-exempt. Policy should deny.
  input:
