# --- Fail closed: missing / empty / non-string SQL on a write tool -----------
- description: execute_sql called with empty sql string, non-exempt. Fail closed — deny with unreadable-SQL reason.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: bigquery-mcp-execute_sql
      uri: null
    payload:
      name: bigquery-mcp-execute_sql
      args:
        sql: ""
  output:
    expectedResult: deny
    expectedReason: "This BigQuery write-capable tool was called with no readable SQL statement, so the guard cannot confirm the call is read-only and blocks it fail-closed. Supply the statement in the `sql` argument and re-issue read-only queries through execute_sql_readonly, or route writes through an approved data-engineering pipeline. If this was a false positive, contact your data platform team."

- description: execute_sql called with no sql argument at all, non-exempt. Fail closed — deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: bigquery-mcp-execute_sql
      uri: null
    payload:
      name: bigquery-mcp-execute_sql
      args:
        project_id: my-proj
  output:
    expectedResult: deny
    expectedReason: "This BigQuery write-capable tool was called with no readable SQL statement, so the guard cannot confirm the call is read-only and blocks it fail-closed. Supply the statement in the `sql` argument and re-issue read-only queries through execute_sql_readonly, or route writes through an approved data-engineering pipeline. If this was a false positive, contact your data platform team."

- description: execute_sql called with a non-string sql value (list). Treated as no readable SQL — deny fail closed.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: bigquery-mcp-execute_sql
      uri: null
    payload:
      name: bigquery-mcp-execute_sql
      args:
        sql:
          - "SELECT 1"
  output:
    expectedResult: deny

# --- Red-team: documented false negatives (regex is not a SQL parser) --------
# These assert the CURRENT (allow) behavior and lock the documented Known
# limitations so a future change that closes them is noticed by this suite.
- description: "Red-team FN: DROP /* */ TABLE comment injection splits the construct. Documented false negative — currently allowed."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: bigquery-mcp-execute_sql
      uri: null
    payload:
      name: bigquery-mcp-execute_sql
      args:
        sql: "DROP /* x */ TABLE ds.customers"
  output:
    expectedResult: allow

- description: "Red-team FN: TRUNCATE with a line comment before TABLE. Documented false negative — currently allowed."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: bigquery-mcp-execute_sql
      uri: null
    payload:
      name: bigquery-mcp-execute_sql
      args:
        sql: "TRUNCATE --drop it\nTABLE ds.staging"
  output:
    expectedResult: allow

- description: "Red-team FN: LOAD /* */ DATA comment injection. Documented false negative — currently allowed."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: bigquery-mcp-execute_sql
      uri: null
    payload:
      name: bigquery-mcp-execute_sql
      args:
        sql: "LOAD /* */ DATA INTO ds.orders FROM FILES(uris=['gs://b/f.csv'])"
  output:
    expectedResult: allow

- description: "Red-team (fixed): multi-statement pairs CREATE TEMP with a persistent CREATE. Object-keyword adjacency catches the persistent CREATE TABLE. Denied."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: bigquery-mcp-execute_sql
      uri: null
    payload:
      name: bigquery-mcp-execute_sql
      args:
        sql: "CREATE TEMP TABLE t AS SELECT 1; CREATE TABLE ds.persist AS SELECT 1"
  output:
    expectedResult: deny

# --- Red-team (fixed): CREATE-temp suppression via comment / string literal -----
# Injecting the text "CREATE TEMP"/"CREATE TEMPORARY" into a comment or string
# literal used to suppress the mutating verdict on a real persistent CREATE
# (the old global create_present/create_is_temp emulation). Object-keyword
# adjacency closes it: "CREATE TABLE" is matched regardless of the injected text.
- description: "Red-team (fixed): persistent CREATE TABLE with a trailing comment CREATE TEMPORARY that used to suppress the verdict. Denied."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: bigquery-mcp-execute_sql
      uri: null
    payload:
      name: bigquery-mcp-execute_sql
      args:
        sql: "CREATE TABLE ds.exfil AS SELECT * FROM ds.customers -- CREATE TEMPORARY"
  output:
    expectedResult: deny
    expectedReason: "This BigQuery statement performs a write, DDL, or otherwise state-changing operation (INSERT, UPDATE, DELETE, MERGE, TRUNCATE TABLE, DROP TABLE/DATASET/SCHEMA, ALTER, non-temporary CREATE, CALL, GRANT, LOAD DATA, or EXECUTE IMMEDIATE) and is blocked on the agent MCP path, which is read-only. Re-issue the query through the read-only tool execute_sql_readonly, or route the write through an approved data-engineering pipeline. If this was a false positive, contact your data platform team."

- description: "Red-team (fixed): persistent CREATE TABLE with a string literal 'CREATE TEMP' that used to suppress the verdict. Denied."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: bigquery-mcp-execute_sql
      uri: null
    payload:
      name: bigquery-mcp-execute_sql
      args:
        sql: "CREATE TABLE ds.x AS SELECT 'CREATE TEMP' AS note"
  output:
    expectedResult: deny

# --- Red-team (fixed): data-bearing DROP variants now blocked ----------------
# A red-team pass found DROP SNAPSHOT TABLE / DROP EXTERNAL TABLE / DROP
# MATERIALIZED VIEW slipping past the earlier DROP\s+(?:TABLE|DATASET|SCHEMA)
# pattern (object keyword not adjacent to DROP), even though each destroys stored
# data and the matching CREATE is blocked. The DROP alternation now covers them.
- description: "Red-team (fixed): DROP SNAPSHOT TABLE destroys a table snapshot. Now denied."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: bigquery-mcp-execute_sql
      uri: null
    payload:
      name: bigquery-mcp-execute_sql
      args:
        sql: "DROP SNAPSHOT TABLE ds.orders_snap"
  output:
    expectedResult: deny
    expectedReason: "This BigQuery statement performs a write, DDL, or otherwise state-changing operation (INSERT, UPDATE, DELETE, MERGE, TRUNCATE TABLE, DROP TABLE/DATASET/SCHEMA, ALTER, non-temporary CREATE, CALL, GRANT, LOAD DATA, or EXECUTE IMMEDIATE) and is blocked on the agent MCP path, which is read-only. Re-issue the query through the read-only tool execute_sql_readonly, or route the write through an approved data-engineering pipeline. If this was a false positive, contact your data platform team."

- description: "Red-team (fixed): DROP EXTERNAL TABLE. Now denied."
  input:
