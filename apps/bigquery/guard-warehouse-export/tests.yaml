      uri: null
    payload:
      name: bigquery-mcp-query
      args:
        sql: "SELECT * FROM EXTERNAL_QUERY('projects/x/locations/us/connections/c', 'SELECT * FROM t')"
  output:
    expectedResult: deny
    expectedReason: "This BigQuery call is blocked on the agent MCP path: it uses EXTERNAL_QUERY, a federated pull from another data source outside your project. Data may only land inside your tenant's own allowlisted project. Route approved cross-source work through your data platform team's sanctioned export pipeline. If this was a false positive, contact your data platform team."

