# guard-warehouse-export — cover every rule branch:
#   allow: non-matched tool, read-only tool (excluded), in-project SELECT,
#          allowlisted-project write, two-part (implicit-project) target,
#          allowlisted project_id.
#   deny:  EXPORT DATA, EXPORT MODEL, EXTERNAL_QUERY, cross-project CREATE TABLE / INSERT /
#          CREATE SNAPSHOT, whole-backtick-wrapped cross-project target,
#          bad project_id, fail-closed missing / empty / non-string SQL.
#   red-team (added by review): INSERT without the optional INTO, MERGE INTO, and
#          UPDATE-with-subquery cross-project writes (all now denied); documented
#          gap — cross-project CREATE MATERIALIZED VIEW is allowed (see policy.md
#          Known limitations).

- description: Metadata tool (list_dataset_ids) is not a SQL surface — pass through.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: bigquery-mcp-list_dataset_ids
      uri: null
    payload:
      name: bigquery-mcp-list_dataset_ids
      args: {}
  output:
    expectedResult: allow

- description: Read-only tool is excluded even when its SQL text contains EXPORT DATA.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: bigquery-mcp-execute_sql_readonly
      uri: null
    payload:
      name: bigquery-mcp-execute_sql_readonly
      args:
        sql: "SELECT 'we could EXPORT DATA later' AS note"
  output:
    expectedResult: allow

- description: In-project SELECT with no exfil construct — allow.
