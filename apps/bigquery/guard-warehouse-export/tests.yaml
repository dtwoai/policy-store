- description: Red-team (fixed) — present-but-non-string project_id is malformed, denied fail-closed.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: bigquery-mcp-execute_sql
      uri: null
    payload:
