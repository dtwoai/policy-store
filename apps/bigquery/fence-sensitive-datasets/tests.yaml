- description: Uncleared caller references a phi_ dataset in SQL — denied, PHI reason.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: bigquery-mcp-execute_sql
      uri: null
    subject:
      sub: google-apps|dev@example.com
      claims:
        groups:
          - engineering
    payload:
      name: bigquery-mcp-execute_sql
      args:
        sql: SELECT patient_id FROM phi_records.encounters
  output:
    expectedResult: deny
    expectedReason: "Access to the protected health information (PHI) data domain (BigQuery dataset prefix 'phi_') requires membership in the 'clinical-data' IdP group, which your identity does not carry. Request the 'clinical-data' group from your data-governance owner and retry; if you believe this dataset is misclassified, contact your data platform team."

