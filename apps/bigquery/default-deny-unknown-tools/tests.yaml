# Tests for bigquery/default-deny-unknown-tools.
# Covers every branch of the allowlist gate:
#   - allow: official/Toolbox snake_case names (bare + gateway-prefixed), the
#     execute_sql vs execute_sql_readonly non-collision, metadata reads, the
#     community query/execute-query/list-tables/describe-table names,
#     case-insensitive match;
#   - deny (fail closed): the deliberately-excluded MCP Toolbox AI-analytics
#     tools (ask_data_insights, forecast, analyze_contribution, search_catalog),
#     an unknown/renamed tool, missing/empty name, non-string name, non-ASCII
#     homoglyph, spliced newline, whitespace padding;
#   - documented residual: a prefix glued directly to an allowlisted suffix.

- description: Official write-capable SQL tool (gateway-prefixed bigquery-mcp-execute_sql) ends with an allowlisted suffix and is allowed; its SQL text is governed by the companion guard-warehouse-sql policy.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: bigquery-mcp-execute_sql
      uri: null
    payload:
      name: bigquery-mcp-execute_sql
      args:
        sql: SELECT id FROM ds.orders LIMIT 10
  output:
    expectedResult: allow

- description: >-
    The read-only tool execute_sql_readonly is a SEPARATE allowlist entry — it
    does NOT end with execute_sql — and is allowed. Locks the execute_sql /
    execute_sql_readonly non-collision.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: bigquery-mcp-execute_sql_readonly
      uri: null
    payload:
      name: bigquery-mcp-execute_sql_readonly
      args:
        sql: SELECT 1
  output:
    expectedResult: allow

