    resource:
      type: tool
      name: ""
      uri: null
    payload:
      name: ""
      args: {}
  output:
    expectedResult: deny
    expectedReason: "This BigQuery tool is not on the audited BigQuery allowlist, so the gateway denies it by default and surfaces the call as tool drift. The allowlist pins the verified official Google / MCP Toolbox tools (execute_sql, execute_sql_readonly, list_dataset_ids, list_table_ids, get_dataset_info, get_table_info) and the community server tools (query, execute-query, list-tables, describe-table); a newly added, renamed, or self-expanding upstream tool — including the MCP Toolbox AI-analytics tools (ask_data_insights, forecast, analyze_contribution, search_catalog) that move table data to other Google APIs — is not on it and must fail closed until it is reviewed. If this tool is legitimate, contact your gateway admin to introspect it live and add its verified name to the per-tenant allowlist in this policy after review."

- description: Non-string tool name (number) is coerced to "" instead of raising a lower() type error — clean, reasoned deny (fail closed).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: 12345
      uri: null
    payload:
      name: 12345
      args: {}
  output:
    expectedResult: deny

- description: >-
    Red-team regression — homoglyph of an allowlisted suffix (Cyrillic
    "еxecute_sql", leading Cyrillic е U+0435) fails the raw ASCII guard before
    lower() runs and is denied — closes the Unicode case-fold / spoof evasion.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: "bigquery-mcp-еxecute_sql"
      uri: null
    payload:
      name: "bigquery-mcp-еxecute_sql"
      args: {}
  output:
    expectedResult: deny

- description: >-
    Red-team regression — an embedded newline splicing a denied tool onto an
    allowlisted suffix ("forecast\nexecute_sql") is denied. The raw ASCII guard
    regex (^[A-Za-z0-9._-]+$) is NOT multiline in OPA/Go, so $ anchors to
    end-of-text and the newline breaks the whole-string match before endswith
    ever sees "execute_sql". Locks the non-multiline anchoring assumption.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: "forecast\nexecute_sql"
      uri: null
    payload:
      name: "forecast\nexecute_sql"
      args: {}
  output:
    expectedResult: deny

- description: >-
    Red-team regression — leading/trailing whitespace padding around an
    allowlisted suffix ("  execute_sql ") fails the raw ASCII character-class
    guard (space is outside [A-Za-z0-9._-]) and is denied. Locks the guard's
    strictness against whitespace-smuggled names.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: "  execute_sql "
      uri: null
    payload:
      name: "  execute_sql "
      args: {}
  output:
    expectedResult: deny

- description: >-
    Documented endswith residual — a prefix glued directly to an allowlisted
    suffix (xexecute_sql, no separator) still matches and is allowed. Recorded in
    Known limitations; use full gateway tool names if stricter matching is
    required.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: xexecute_sql
      uri: null
    payload:
      name: xexecute_sql
      args:
        sql: SELECT 1
  output:
    expectedResult: allow

- description: >-
    Red-team residual (realistic drift) — a NEW/unaudited upstream tool whose
    bare name ends in an allowlisted suffix (batch_execute_sql, gateway-prefixed)
    is ADMITTED, not caught as drift, because endswith requires no separator.
    Locks the concrete limitation the "What it does" section now qualifies; close
    it with exact full gateway tool names if your deployment needs strict drift
    detection.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: bigquery-mcp-batch_execute_sql
      uri: null
    payload:
      name: bigquery-mcp-batch_execute_sql
      args:
        sql: SELECT 1
  output:
    expectedResult: allow

- description: >-
    Red-team residual (loosest suffix) — the one-word community suffix `query`
    matches ANY name ending in "query", so an unaudited/foreign tool such as
    `run_arbitrary_query` (here gateway-prefixed from another server on a shared
    pipeline) is ADMITTED, not caught as drift. Documented under Known
    limitations (loose `query` suffix + attach-to-BigQuery-pipeline); close it by
    attaching only to the BigQuery server's pipeline and/or replacing `query`
    with the exact full gateway tool name.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: otherserver-run_arbitrary_query
      uri: null
    payload:
      name: otherserver-run_arbitrary_query
      args:
        sql: SELECT 1
  output:
    expectedResult: allow

- description: >-
    Fail-closed on a fully missing resource/name — the request carries no
    resource object at all, so raw_tool_name falls back to "" via object.get's
    default, matches nothing, and is denied. Exercises the default-fallback
    branch (distinct from a present empty-string name).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    payload:
      args: {}
  output:
    expectedResult: deny
    expectedReason: "This BigQuery tool is not on the audited BigQuery allowlist, so the gateway denies it by default and surfaces the call as tool drift. The allowlist pins the verified official Google / MCP Toolbox tools (execute_sql, execute_sql_readonly, list_dataset_ids, list_table_ids, get_dataset_info, get_table_info) and the community server tools (query, execute-query, list-tables, describe-table); a newly added, renamed, or self-expanding upstream tool — including the MCP Toolbox AI-analytics tools (ask_data_insights, forecast, analyze_contribution, search_catalog) that move table data to other Google APIs — is not on it and must fail closed until it is reviewed. If this tool is legitimate, contact your gateway admin to introspect it live and add its verified name to the per-tenant allowlist in this policy after review."

- description: >-
    Red-team regression (\z anchoring) — a TRAILING newline glued after an
    allowlisted suffix ("execute_sql\n") is denied. This is the case that
    actually distinguishes RE2/Go `$` (end-of-text, \z) from Perl `$`
    (\Z, matches before a final newline): under Perl semantics the ASCII guard
    ^[A-Za-z0-9._-]+$ would match "execute_sql\n" and the name would be ALLOWED —
    a real bypass. OPA uses \z, so the trailing newline breaks the whole-string
    match and it fails closed. Locks the "$ anchors to end-of-text" assumption the
    policy comment relies on (the existing mid-string-newline test does not — that
    one is denied regardless of \z vs \Z because the char class cannot span \n).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: "execute_sql\n"
      uri: null
    payload:
      name: "execute_sql\n"
      args:
        sql: SELECT 1
  output:
    expectedResult: deny

- description: >-
    Red-team regression (\z anchoring, CR variant) — a trailing carriage return
    after an allowlisted suffix ("execute_sql\r") is likewise denied. CR is
    outside [A-Za-z0-9._-] and, like the LF variant, only slips through if `$`
    matched before a final line terminator; OPA's \z semantics fail it closed.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: "execute_sql\r"
      uri: null
    payload:
      name: "execute_sql\r"
      args:
        sql: SELECT 1
  output:
    expectedResult: deny
