- description: >-
    An unknown / renamed upstream tool (bigquery-mcp-run_sql — e.g. execute_sql
    renamed after the audit) stops matching the allowlist and fails closed with
    the drift reason.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: bigquery-mcp-run_sql
      uri: null
    payload:
      name: bigquery-mcp-run_sql
      args:
        sql: SELECT 1
  output:
    expectedResult: deny
    expectedReason: "This BigQuery tool is not on the audited BigQuery allowlist, so the gateway denies it by default and surfaces the call as tool drift. The allowlist pins the verified official Google / MCP Toolbox tools (execute_sql, execute_sql_readonly, list_dataset_ids, list_table_ids, get_dataset_info, get_table_info) and the community server tools (query, execute-query, list-tables, describe-table); a newly added, renamed, or self-expanding upstream tool — including the MCP Toolbox AI-analytics tools (ask_data_insights, forecast, analyze_contribution, search_catalog) that move table data to other Google APIs — is not on it and must fail closed until it is reviewed. If this tool is legitimate, contact your gateway admin to introspect it live and add its verified name to the per-tenant allowlist in this policy after review."

