      name: glean-search
      uri: null
    payload:
      name: glean-search
      args:
        query: q3 roadmap
        app: gdrive
        num_results: 500
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    num_results: 50
    query: q3 roadmap
    app: gdrive
