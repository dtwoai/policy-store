# Branch coverage for glean.ingress.fence_datasource_scope.
# Rule branches: non-fenced tool pass-through; _search sibling pass-through;
# search scoped to non-restricted app; restricted app cleared / not cleared /
# no identity; unscoped search cleared-for-all / not; array-valued app;
# malformed groups claim; empty app string; tool-name casing/prefix.

- description: Non-search tool (chat) passes through untouched — chat has no app filter and is covered by egress.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: glean-chat
      uri: null
    payload:
      name: glean-chat
      args:
        message: what is our renewal process
  output:
    expectedResult: allow

- description: Sibling *_search tool (gmail_search) is not fenced by this datasource policy — excluded by the -search-only match.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: glean-gmail_search
      uri: null
    payload:
      name: glean-gmail_search
      args:
        query: "from:ceo subject:board"
  output:
    expectedResult: allow

- description: Search scoped to a non-restricted datasource (confluence). Allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: glean-search
      uri: null
    payload:
      name: glean-search
      args:
        query: deploy runbook
        app: confluence
  output:
    expectedResult: allow

- description: Search of restricted datasource gong by a caller in the cleared group (sales). Allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: glean-search
      uri: null
    subject:
      sub: auth0|rep
      claims:
        groups:
          - sales
    payload:
      name: glean-search
      args:
        query: acme renewal call
        app: gong
  output:
    expectedResult: allow

- description: Search of restricted datasource salescloud by a caller not in the cleared group. Deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: glean-search
      uri: null
    subject:
      sub: auth0|eng
      claims:
        groups:
          - engineering
    payload:
      name: glean-search
      args:
        query: pipeline
        app: salescloud
  output:
    expectedResult: deny
    expectedReason: "This Glean search targets restricted datasource(s) (salescloud) your account is not cleared for. Search a datasource you have access to, or contact your InfoSec team if your role requires that source."

- description: Restricted datasource with no subject/claims at all — fails closed. Deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: glean-search
      uri: null
    payload:
      name: glean-search
      args:
        query: exec comp
        app: gong
  output:
    expectedResult: deny
    expectedReason: "This Glean search targets restricted datasource(s) (gong) your account is not cleared for. Search a datasource you have access to, or contact your InfoSec team if your role requires that source."

- description: Restricted HR datasource (workday) by a caller cleared for hr. Allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: glean-search
      uri: null
    subject:
      sub: auth0|hr
      claims:
        groups:
          - hr
    payload:
      name: glean-search
      args:
        query: headcount plan
        app: workday
  output:
    expectedResult: allow

- description: Restricted HR datasource (bamboohr) by a caller not cleared for hr. Deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: glean-search
      uri: null
    subject:
      sub: auth0|sales
      claims:
        groups:
          - sales
    payload:
      name: glean-search
      args:
        query: salaries
        app: bamboohr
  output:
    expectedResult: deny
    expectedReason: "This Glean search targets restricted datasource(s) (bamboohr) your account is not cleared for. Search a datasource you have access to, or contact your InfoSec team if your role requires that source."

- description: Unscoped search (no app) by a caller cleared for ALL restricted datasources. Allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: glean-search
      uri: null
    subject:
      sub: auth0|super
      claims:
        groups:
          - sales
          - revops
          - hr
    payload:
      name: glean-search
      args:
        query: quarterly summary
  output:
    expectedResult: allow

- description: Unscoped search (no app) by a caller cleared for only some restricted datasources. Deny, directing to pass an explicit app.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: glean-search
      uri: null
    subject:
      sub: auth0|rep
      claims:
        groups:
          - sales
          - revops
    payload:
      name: glean-search
      args:
        query: compensation
  output:
    expectedResult: deny
    expectedReason: "This Glean search has no `app` datasource filter, so it fans out across every indexed system, including restricted ones (Gong call recordings, Salesforce CRM, HR). Pass an explicit `app` naming the datasource you need, or contact your InfoSec team if you need broader search access."

- description: Unscoped search by a caller with no identity at all — fails closed. Deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: glean-search
      uri: null
    payload:
      name: glean-search
      args:
        query: anything
  output:
    expectedResult: deny
    expectedReason: "This Glean search has no `app` datasource filter, so it fans out across every indexed system, including restricted ones (Gong call recordings, Salesforce CRM, HR). Pass an explicit `app` naming the datasource you need, or contact your InfoSec team if you need broader search access."

- description: Red team — app passed as an array mixing a benign and a restricted source; caller not cleared for the restricted one. Deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: glean-search
      uri: null
    subject:
      sub: auth0|eng
      claims:
        groups:
          - engineering
    payload:
      name: glean-search
      args:
        query: leak attempt
        app:
          - gdrive
          - gong
  output:
    expectedResult: deny
    expectedReason: "This Glean search targets restricted datasource(s) (gong) your account is not cleared for. Search a datasource you have access to, or contact your InfoSec team if your role requires that source."

- description: app as an array of only non-restricted sources. Allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
