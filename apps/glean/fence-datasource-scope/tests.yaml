- description: Red team — groups claim is a string, not an array (malformed). member_of fails closed, restricted source denied.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: glean-search
      uri: null
    subject:
      sub: auth0|rep
