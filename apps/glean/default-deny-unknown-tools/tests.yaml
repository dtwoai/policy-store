- description: "Fail-closed on missing tool name: a request with no
    input.resource.name cannot be matched against the reviewed allowlist and is
    denied by default (unlike apps that pass nameless calls through)."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      uri: null
  output:
    expectedResult: deny
    expectedReason: "This request carries no tool name, so it cannot be matched against the reviewed Glean allowlist and is denied by default (fail closed). Verify the gateway is populating input.resource.name with the dump-input debug technique; if tool names are missing systemically, fix the gateway configuration rather than relaxing this policy."
