# ---------- Negatives: conservative-regex ----------

- description: In-scope tool but content carries no PII — response passes through byte-identical, no transform.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: glean-search
      uri: null
    payload:
      name: glean-search
      text:
        - "The runbook is ready for review."
  output:
    expectedResult: allow
  transformApplied: false

- description: Conservative-regex negatives — a short 9-digit run, a dotted version string, and a 12-digit run (below the 13-digit PAN floor) are NOT redacted, so an otherwise clean doc passes through byte-identical.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: glean-read_document
      uri: null
    payload:
      name: glean-read_document
      text:
        - "Ref 123456789, version 1.2.3, order 123456789012"
  output:
    expectedResult: allow
  transformApplied: false

- description: Non-string (custom {field,value}) content block with no string `text` key passes through the redact_block guards unmodified — PII under other keys is out of the policy's claim, no transform.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: glean-search
      uri: null
    payload:
      name: glean-search
      text:
        - field: ssn
          value: "123-45-6789"
  output:
    expectedResult: allow
  transformApplied: false

# ---------- Guards ----------

- description: Ingress hook (mode input) is never in scope — the same tool + SSN produces no transform on the pre-invoke path.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: glean-search
      uri: null
    payload:
      name: glean-search
      text:
        - "SSN 123-45-6789"
  output:
    expectedResult: allow
  transformApplied: false

# ---------- Red-team regression cases (reviewer, standards §10) ----------

- description: "Red-team: egress with action=tool_post_invoke but mode unset — is_egress still matches on action, so redaction fires (no fail-open leak)."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    resource:
      type: tool
      name: glean-search
      uri: null
    payload:
      name: glean-search
      text:
        - "SSN 123-45-6789"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "SSN [REDACTED-SSN]"

- description: "Red-team: egress that leaks what an ingress datasource fence would block — an HR-source page body with SSN + PAN + IBAN is still fully redacted, since this policy runs regardless of the ingress verdict."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: glean-search
      uri: null
    payload:
      name: glean-search
      text:
        - "HR source leak: SSN 123-45-6789, PAN 4111 1111 1111 1111, IBAN GB82WEST12345698765432"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "HR source leak: SSN [REDACTED-SSN], PAN [REDACTED-PAN], IBAN [REDACTED-BANK]"

- description: "Red-team DOCUMENTED residual: an IBAN printed with spaces every four chars breaks contiguity, so the iban_pattern does not match and it passes through unredacted (no transform). Captures the spaced-IBAN residual under Known limitations."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: glean-search
      uri: null
    payload:
      name: glean-search
      text:
        - "IBAN GB82 WEST 1234 5698 7654 32 on file"
  output:
    expectedResult: allow
  transformApplied: false

- description: "Red-team DOCUMENTED residual: full-width Unicode-digit SSN is not matched — RE2 `\\d` is ASCII-only, so the identifier streams through unredacted (no transform)."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: glean-search
      uri: null
    payload:
      name: glean-search
      text:
        - "Full-width SSN １２３-４５-６７８９ on file"
  output:
    expectedResult: allow
  transformApplied: false

- description: "Red-team DOCUMENTED residual (word-boundary adjacency): an SSN wrapped in Markdown italics underscores (_123-45-6789_) is NOT redacted — `_` is a regex word char, so the `\\b` anchor finds no boundary."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: glean-search
      uri: null
    payload:
      name: glean-search
      text:
        - "contact _123-45-6789_ now"
  output:
    expectedResult: allow
  transformApplied: false

- description: "Red-team DOCUMENTED residual: off-spec scalar `text` (a bare string, not an array) fails the is_array transform guard — no transform fires and the SSN passes through (fail-open on a shape off the documented gateway contract)."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: glean-search
      uri: null
    payload:
      name: glean-search
      text: "Onboarding SSN 123-45-6789"
  output:
    expectedResult: allow
  transformApplied: false

- description: "Red-team DOCUMENTED residual: standard MCP embedded-resource block carries its body under nested `resource.text`, not a top-level `text` string — block_text reads only the top-level `text`, so the SSN passes through unredacted (no transform)."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: glean-read_document
      uri: null
    payload:
      name: glean-read_document
      text:
        - type: resource
          resource:
            uri: "glean://doc/1"
            text: "Onboarding SSN 123-45-6789"
  output:
    expectedResult: allow
  transformApplied: false

- description: "Red-team DOCUMENTED residual: a nested-array content block (block that is itself an array of sub-blocks) is neither string nor object, so it hits the passthrough branch and the embedded SSN is not redacted (no transform)."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: glean-search
      uri: null
    payload:
      name: glean-search
      text:
        - - "nested SSN 123-45-6789"
  output:
    expectedResult: allow
  transformApplied: false

- description: "Red-team over-match guard: the generic `search` entry does not fire on a name that merely ends in the letters `search` after an underscore (glean-gmail_search is matched by its OWN distinctive entry, not the generic one) — confirmed here by an underscore-joined non-listed compound `glean-vendor_search` staying out of scope."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: glean-vendor_search
      uri: null
    payload:
      name: glean-vendor_search
      text:
        - "SSN 123-45-6789"
  output:
    expectedResult: allow
  transformApplied: false

- description: "Red-team DOCUMENTED residual: an underscore-joined server prefix on a GENERIC name (glean_search) is NOT matched — the generic entries exclude underscore, so this fails open. Pin the exact hyphen-class prefix per tenant. (Distinctive names still match under underscore — see the glean_read_document case above.)"
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: glean_search
      uri: null
    payload:
      name: glean_search
      text:
        - "SSN 123-45-6789"
  output:
    expectedResult: allow
  transformApplied: false

- description: "Red-team DOCUMENTED residual (PAN ceiling): a contiguous 20-digit numeric run (e.g. a long domestic bank-account number) exceeds the 13–19-digit PAN window, and its only word boundaries are the two ends, so pan_run cannot match it and it passes through unredacted (no transform)."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: glean-read_document
      uri: null
    payload:
      name: glean-read_document
      text:
        - "Settlement account 12345678901234567890 confirmed"
  output:
    expectedResult: allow
  transformApplied: false

- description: "Red-team DOCUMENTED residual: an off-spec structured block whose `text` value is itself an ARRAY (not a string) is rejected by block_text's is_string guard, so it hits the passthrough branch and the embedded SSN is not redacted (no transform)."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: glean-search
      uri: null
    payload:
      name: glean-search
      text:
        - type: text
          text:
            - "SSN 123-45-6789"
  output:
    expectedResult: allow
  transformApplied: false

- description: "Red-team DOCUMENTED residual (unlisted content read tool): the memory read tool (glean-read_memory, action:read, ExplicitMemories) can return user-entered PII but is out of scope, so an SSN in a memory read streams through unredacted (no transform). Captured under Known limitations alongside employee_search/code_search."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: glean-read_memory
      uri: null
    payload:
      name: glean-read_memory
      text:
        - "Stored memory: user's SSN is 123-45-6789"
  output:
    expectedResult: allow
  transformApplied: false

- description: "Red-team DOCUMENTED residual: the bare `memory` write/read tool is likewise out of scope — a memory response carrying an SSN is not redacted (no transform). Memory writes are gated by the deny-memory-writes companion; memory read content is not redacted here."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: glean-memory
      uri: null
    payload:
      name: glean-memory
      text:
        - "Stored memory: SSN 123-45-6789"
  output:
    expectedResult: allow
  transformApplied: false

- description: "Red-team guard: memory_schema is schema/graph introspection (structure, not record content) and is intentionally excluded — no transform even with an SSN-shaped string present."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: glean-memory_schema
      uri: null
    payload:
      name: glean-memory_schema
      text:
        - "field example 123-45-6789"
  output:
    expectedResult: allow
  transformApplied: false

- description: "Red-team byte-identical guard: a fully-clean MCP structured object block (no PII) produces value-equal output through object.union, so redacted_blocks == text_blocks and NO transform is emitted — confirming the byte-identical passthrough claim holds for object blocks, not just plain strings."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: glean-read_document
      uri: null
    payload:
      name: glean-read_document
      text:
        - type: text
          text: "Quarterly summary — nothing sensitive in this block."
  output:
    expectedResult: allow
  transformApplied: false
