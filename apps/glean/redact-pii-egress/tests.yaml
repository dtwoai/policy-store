# Egress transform policy (default allow := true) — allow is always true; the
# meaningful assertions are transformApplied / transformedArgsContain. Cases
# cover every rule branch: each detection class independently (SSN, PAN, IBAN)
# and all three together; every in-scope tool (distinctive names + generic
# search/chat); the resource.name / tool_metadata.name / payload.name candidate
# surfaces; case-insensitive matching; out-of-scope tools (employee_search,
# code_search, agents/proxied, ingress); MCP {type,text} object blocks;
# non-string blocks; conservative-regex negatives; and every documented
# red-team residual.

# ---------- In-scope: each PII class independently ----------

- description: In-scope glean-search response — SSN, PAN (4-4-4-4), and IBAN are all redacted in place; surrounding text is kept.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: glean-search
      uri: null
    payload:
      name: glean-search
      text:
        - "Vendor record: SSN 123-45-6789, card 4111 1111 1111 1111, IBAN GB82WEST12345698765432"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "Vendor record: SSN [REDACTED-SSN], card [REDACTED-PAN], IBAN [REDACTED-BANK]"

- description: Lone SSN in a chat synthesis response is redacted on its own — no pairing required.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: glean-chat
      uri: null
    payload:
      name: glean-chat
      text:
        - "Per the onboarding doc the SSN on file is 078-05-1120."
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "Per the onboarding doc the SSN on file is [REDACTED-SSN]."

- description: Lone unseparated 16-digit PAN run in a read_document response is redacted independently.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: glean-read_document
      uri: null
    payload:
      name: glean-read_document
      text:
        - "Charge posted to 4111111111111111 last night"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "Charge posted to [REDACTED-PAN] last night"

- description: Amex 15-digit 4-6-5 PAN in a gmail_search snippet is redacted (distinct from the 4-4-4-4 shape).
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: glean-gmail_search
      uri: null
    payload:
      name: glean-gmail_search
      text:
        - "Receipt card 3782 822463 10005 attached"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "Receipt card [REDACTED-PAN] attached"

- description: Lone IBAN in an outlook_search response is redacted independently as a bank identifier.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: glean-outlook_search
      uri: null
    payload:
      name: glean-outlook_search
      text:
        - "Wire to DE89370400440532013000 by Friday"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "Wire to [REDACTED-BANK] by Friday"

- description: meeting_lookup transcript line with a dash-grouped PAN is redacted.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: glean-meeting_lookup
      uri: null
    payload:
      name: glean-meeting_lookup
      text:
        - "Speaker: read out the card 4111-1111-1111-1111 on the call"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "Speaker: read out the card [REDACTED-PAN] on the call"

