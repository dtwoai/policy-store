# ---------- Block-shape coverage ----------

- description: Only the block that contains PII is rewritten; clean blocks pass through unchanged.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: glean-search
      uri: null
    payload:
      name: glean-search
      text:
        - "Quarterly summary — no identifiers here."
        - "Contact record SSN 123-45-6789"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "Quarterly summary — no identifiers here."
      - "Contact record SSN [REDACTED-SSN]"

- description: MCP-standard structured text block {type:text, text:...} — the inner `text` is redacted and `type` preserved.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: glean-read_document
      uri: null
    payload:
      name: glean-read_document
      text:
        - type: text
          text: "Doc body: SSN 123-45-6789 and card 4111 1111 1111 1111"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - text: "Doc body: SSN [REDACTED-SSN] and card [REDACTED-PAN]"
        type: text

- description: Mixed content-block array — one plain string and one MCP {type,text} object, both carrying PII — every block is redacted regardless of shape.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: glean-search
      uri: null
    payload:
      name: glean-search
      text:
        - "Plain block SSN 078-05-1120"
        - type: text
          text: "Object block IBAN DE89370400440532013000"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "Plain block SSN [REDACTED-SSN]"
      - text: "Object block IBAN [REDACTED-BANK]"
        type: text

# ---------- Negatives: out-of-scope tools ----------

- description: employee_search (underscore-joined compound tool, out of scope per spec) must NOT match the generic `search` entry — no transform even with an SSN present.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: glean-employee_search
      uri: null
    payload:
      name: glean-employee_search
      text:
        - "SSN 123-45-6789"
  output:
    expectedResult: allow
  transformApplied: false

- description: code_search (underscore-joined compound tool, out of scope) must NOT match the generic `search` entry — no transform.
  input:
