# --- Red-team regression cases (standards §10) --------------------------------

- description: 'Red-team (claim check): boolean flag sent as uppercase string "TRUE"
    — description claims case-insensitive string coercion, so it must still deny.'
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: google-calendar-mcp-create-event
      uri: null
    payload:
      name: google-calendar-mcp-create-event
      args:
        summary: Deal team
        guestsCanModify: "TRUE"
  output:
    expectedResult: deny
    expectedReason: 'This event sets guestsCanModify to true, granting every guest — including any external attendees — edit rights over the event. Remove guestsCanModify (or set it to false) before creating or updating the event. Contact your security team if delegated edit access is genuinely required.'

- description: 'Red-team (documented residual, Known limitations "Argument-key
    assumptions"): a server that renames the flag to snake_case (guests_can_modify)
    is NOT matched, so the call is allowed. Pins the documented bypass surface —
    if a real in-scope server ever ships snake_case keys, add them to the flag list.'
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: google-calendar-mcp-create-event
      uri: null
    payload:
      name: google-calendar-mcp-create-event
      args:
        summary: Deal team
        guests_can_modify: true
  output:
    expectedResult: allow

- description: 'Red-team (fixed): guestsCanModify sent as the number 1 (numeric-boolean
    client) — treated as on, deny.'
  input:
