  output:
    expectedResult: deny
    expectedReason: Deleting calendar events through the agent is limited to the calendar-admins group because Google Calendar offers no MCP-level undo. Ask a calendar administrator to remove the event, or contact your IT team if you believe this is a false positive.

- description: "Red-team A1 residual (documented limitation) — manage_event with an action verb outside the destructive set (expunge) by a non-admin, single scope. Treated as a non-destructive create/update and allowed; documents the unverified-enum residual. Policy should allow."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: workspace-mcp-manage_event
      uri: null
    subject:
