- description: nspady delete-event (kebab-case) with no subject claims at all — grant must fail closed. Policy should deny with the delete reason.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: google-calendar-mcp-delete-event
      uri: null
    payload:
      name: google-calendar-mcp-delete-event
      args:
        calendarId: primary
        eventId: abc123
  output:
    expectedResult: deny
    expectedReason: Deleting calendar events through the agent is limited to the calendar-admins group because Google Calendar offers no MCP-level undo. Ask a calendar administrator to remove the event, or contact your IT team if you believe this is a false positive.

- description: Official Google delete_event (snake_case) in uppercase, caller in an unrelated group — matching must be case-insensitive and delimiter-normalized. Policy should deny.
