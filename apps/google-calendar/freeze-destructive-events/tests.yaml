# --- Red-team regression cases (reviewer, standards §10) --------------------

- description: "Red-team A1 — manage_event with action=cancel (destructive synonym, not literal 'delete') by a non-admin, single scope. Synonym must be caught, not slip through as a create/update. Policy should deny with the delete reason."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: workspace-mcp-manage_event
      uri: null
    subject:
      sub: google-apps|dev@example.com
      claims:
        groups:
          - engineering
    payload:
      name: workspace-mcp-manage_event
      args:
        action: cancel
        eventId: abc123
        modificationScope: single
  output:
    expectedResult: deny
    expectedReason: Deleting calendar events through the agent is limited to the calendar-admins group because Google Calendar offers no MCP-level undo. Ask a calendar administrator to remove the event, or contact your IT team if you believe this is a false positive.

- description: "Red-team A1 — manage_event with action=remove (destructive synonym) by a non-admin, single scope. Policy should deny with the delete reason."
