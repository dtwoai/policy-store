# Reason strings referenced below (kept exactly in sync with policy.md):
#   R_DELETE   — delete tools / manage_event deletes limited to calendar-admins
#   R_NO_ACTION — manage_event missing usable action (fail closed, non-admins)
#   R_SERIES   — series-wide modificationScope blocked for everyone
#   R_NO_SCOPE — manage_event missing usable modificationScope (fail closed, everyone)

- description: Read tool (list_events) is outside the event-mutation family. Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: gcal-mcp-list_events
      uri: null
    payload:
      name: gcal-mcp-list_events
      args:
        startTime: "2026-07-01T00:00:00Z"
        endTime: "2026-07-31T00:00:00Z"
  output:
    expectedResult: allow

- description: nspady get-event ends in "-event" but is not a mutation verb — suffix family must not overreach reads. Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: google-calendar-mcp-get-event
      uri: null
    payload:
      name: google-calendar-mcp-get-event
      args:
        eventId: abc123
  output:
    expectedResult: allow

- description: Plain single-event create with no modificationScope (the normal shape for create calls) by a non-admin. Policy should allow.
