        summary: 1:1 with Sam
        start: "2026-07-16T10:00:00Z"
        end: "2026-07-16T10:30:00Z"
        calendarId: primary
  output:
    expectedResult: allow

- description: Single-instance update (modificationScope thisEventOnly) by a non-admin. Policy should allow.
