      args:
        action: expunge
        eventId: abc123
        modificationScope: single
  output:
    expectedResult: allow

- description: "Red-team A3 — dual scope keys: a safe camelCase modificationScope=single paired with a series-wide snake_case modification_scope=all. Both keys are inspected; the series-wide value must be caught. Policy should deny with the series reason."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: gcal-update_event
      uri: null
    subject:
      sub: google-apps|dev@example.com
      claims:
        groups:
          - engineering
    payload:
      name: gcal-update_event
      args:
        eventId: abc123
        modificationScope: single
        modification_scope: all
  output:
    expectedResult: deny
    expectedReason: Series-wide recurring-event changes are blocked for all callers because they can silently move or wipe standing meetings with no MCP-level undo. Retry with modificationScope set to a single instance, or make series-wide changes in the Google Calendar UI.

