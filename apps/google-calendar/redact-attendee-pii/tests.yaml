      claims:
        groups:
          - sales
    payload:
      name: GOOGLE-CALENDAR-MCP-LIST-EVENTS
      text:
        - '{"items":[]}'
  output:
    expectedResult: allow
  transformApplied: true

- description: >-
    Tool name present only on tool_metadata.name (resource.name is a
    non-calendar value). All-surface matching puts the call in scope.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: unknown-passthrough
      uri: null
    tool_metadata:
      name: google-calendar-mcp-get-events
    subject:
      sub: google-apps|agent@dtwo.ai
      claims:
        groups:
          - sales
    payload:
      name: unknown-passthrough
      text:
        - '{"items":[]}'
  output:
    expectedResult: allow
  transformApplied: true

- description: >-
    Egress scope satisfied by action alone (mode absent). The is_egress
    action-branch keeps redaction from failing open when mode is unset.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    resource:
      type: tool
      name: google-calendar-mcp-list-events
      uri: null
    subject:
      sub: google-apps|agent@dtwo.ai
      claims:
        groups:
          - sales
    payload:
      name: google-calendar-mcp-list-events
      text:
        - '{"items":[]}'
  output:
    expectedResult: allow
  transformApplied: true

- description: >-
    Missing claims entirely (no subject block). The grant fails closed — a
    caller with no groups is NOT exempt, so the response is scrubbed.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: google-calendar-mcp-list-events
      uri: null
    payload:
      name: google-calendar-mcp-list-events
      text:
        - '{"attendees":[{"email":"patient@example.com"}],"summary":"dialysis follow-up"}'
  output:
    expectedResult: allow
  transformApplied: true

- description: >-
    Exempt caller — `calendar-full-read` present in the groups array. No
    transform; the full response passes through unredacted.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: google-calendar-mcp-list-events
      uri: null
    subject:
      sub: google-apps|exec@dtwo.ai
      claims:
        groups:
          - sales
          - calendar-full-read
    payload:
      name: google-calendar-mcp-list-events
      text:
        - '{"attendees":[{"email":"cfo@target.com"}]}'
  output:
    expectedResult: allow
  transformApplied: false

- description: >-
    Exempt caller where the IdP emits a single group as a bare string rather
    than an array. The bare-string branch grants the exemption.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: google-calendar-mcp-list-events
      uri: null
    subject:
      sub: google-apps|exec@dtwo.ai
      claims:
        groups: calendar-full-read
    payload:
      name: google-calendar-mcp-list-events
      text:
        - '{"attendees":[{"email":"cfo@target.com"}]}'
  output:
    expectedResult: allow
  transformApplied: false

- description: >-
    Red-team: claim-shape spoofing. `groups` is an object/map whose VALUE is
    "calendar-full-read". The is_array guard blocks value-iteration, so the
    caller is NOT exempt and the response is still scrubbed.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: google-calendar-mcp-list-events
      uri: null
    subject:
      sub: google-apps|attacker@dtwo.ai
      claims:
        groups:
          role: calendar-full-read
    payload:
      name: google-calendar-mcp-list-events
      text:
        - '{"attendees":[{"email":"cfo@target.com"}]}'
  output:
    expectedResult: allow
  transformApplied: true

- description: >-
    Non-calendar read tool (`list-calendars`) does not match either branch, so
    no transform is emitted — the response passes through unchanged.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: google-calendar-mcp-list-calendars
      uri: null
    subject:
