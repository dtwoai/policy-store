# Egress transform-only policy: `allow` is always true (default allow := true).
# The behaviour under test is whether `transform` is emitted (transformApplied),
# i.e. whether the response would be scrubbed for this caller + tool + direction.

- description: >-
    Calendar read (kebab `list-events`) for a non-exempt caller. Suffix branch
    fires; transform is emitted with the documented redact fields/patterns.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: google-calendar-mcp-list-events
      uri: null
    subject:
      sub: google-apps|agent@dtwo.ai
      claims:
        groups:
          - sales
    payload:
      name: google-calendar-mcp-list-events
      text:
        - '{"attendees":[{"email":"cfo@target.com"}],"summary":"Project Atlas M&A sync"}'
  output:
    expectedResult: allow
  transformApplied: true
  transform:
    replacement: "[REDACTED]"
    redact_fields:
      - email
      - displayName
      - attendeeEmails
      - conferenceData
      - hangoutLink

- description: >-
    Singular `get-event` still matches the [-_]events? suffix (optional trailing
    s). Non-exempt caller -> transform emitted.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: gcal-mcp-get-event
      uri: null
    subject:
      sub: google-apps|agent@dtwo.ai
      claims:
        groups:
          - engineering
    payload:
      name: gcal-mcp-get-event
      text:
        - '{"summary":"1:1","conferenceData":{"entryPoints":[{"uri":"https://meet.google.com/abc-defg-hij"}]}}'
  output:
    expectedResult: allow
  transformApplied: true

