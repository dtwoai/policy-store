      claims:
        groups:
          - sales
    payload:
      name: google-calendar-mcp-list-calendars
      text:
        - '{"items":[{"id":"primary"}]}'
  output:
    expectedResult: allow
  transformApplied: false

- description: >-
    Write tool `create-event` ALSO ends in `-event`, so its echoed-back response
    is scrubbed on egress too (documented over-match). Transform-only, so the
    write itself is never blocked — the write path is guarded separately at
    ingress. A non-exempt caller here gets the response scrubbed.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: google-calendar-mcp-create-event
      uri: null
    subject:
      sub: google-apps|agent@dtwo.ai
      claims:
        groups:
          - sales
    payload:
      name: google-calendar-mcp-create-event
      text:
        - '{"id":"evt123","status":"confirmed","attendees":[{"email":"cfo@target.com"}]}'
  output:
    expectedResult: allow
  transformApplied: true

- description: >-
    Red-team: meeting-link leak. A get-event response carries the join URL in
    the top-level `hangoutLink` field (populated independently of
    conferenceData) and again as a Meet URL pasted into `description` free text.
    The transform now lists `hangoutLink` among redact_fields and a conferencing
    URL pattern among redact_patterns, so neither channel survives for a
    non-exempt caller.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: google-calendar-mcp-get-event
      uri: null
    subject:
      sub: google-apps|agent@dtwo.ai
      claims:
        groups:
          - sales
    payload:
      name: google-calendar-mcp-get-event
      text:
        - '{"summary":"Board sync","hangoutLink":"https://meet.google.com/abc-defg-hij","description":"Backup line: https://us02web.zoom.us/j/123456789"}'
  output:
    expectedResult: allow
  transformApplied: true
  transform:
    replacement: "[REDACTED]"
    redact_fields:
      - email
      - displayName
      - attendeeEmails
      - conferenceData
      - hangoutLink
    redact_patterns:
      - '\b\d{3}-\d{2}-\d{4}\b'
      - '[\w.+-]+@[\w-]+\.[\w.-]+'
      - '\b\d{3}[-.\s]\d{3}[-.\s]\d{4}\b'
      - '\+\d{6,15}\b'
      - '(?i)\b(?:diagnosis|prognosis|biopsy|chemo(?:therapy)?|oncolog\w*|psychiatr\w*|dialysis|colonoscopy|prescription)\b'
      - '(?i)https?://[\w.-]*(?:meet\.google\.com|zoom\.us|teams\.microsoft\.com|webex\.com)/\S*'

- description: >-
    Ingress on a calendar read (tool_pre_invoke / mode input) is out of scope —
    is_egress fails both branches, so no transform. Prevents scrubbing arguments
    on the request path.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: google-calendar-mcp-list-events
      uri: null
    subject:
      sub: google-apps|agent@dtwo.ai
      claims:
        groups:
          - sales
    payload:
      name: google-calendar-mcp-list-events
      args:
        calendarId: primary
  output:
    expectedResult: allow
  transformApplied: false

- description: >-
    Red-team (finding, fixed): attendee record carries only a displayName and no
    email field. Before the fix the person's name would survive email-only
    redaction; displayName is now in redact_fields, so the transform lists it and
    the name is scrubbed for a non-exempt caller.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: google-calendar-mcp-get-event
      uri: null
    subject:
      sub: google-apps|agent@dtwo.ai
      claims:
        groups:
          - sales
    payload:
      name: google-calendar-mcp-get-event
      text:
        - '{"summary":"Sync","attendees":[{"displayName":"Dr. Jane Roe","responseStatus":"accepted"}],"organizer":{"displayName":"Alex Admin"}}'
  output:
    expectedResult: allow
  transformApplied: true
  transform:
    replacement: "[REDACTED]"
    redact_fields:
      - email
      - displayName
      - attendeeEmails
      - conferenceData
      - hangoutLink

- description: >-
    Red-team (shape probe): attendees supplied as a FLAT array of email strings
    (["a@corp.com", ...]) rather than objects with an `email` key. redact_fields
    "email" cannot see array elements, but the email redact_patterns entry runs
    byte-level over the serialized response and catches them, so the transform is
    still emitted for a non-exempt caller. Defense-in-depth holds.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: google-calendar-mcp-list-events
      uri: null
    subject:
      sub: google-apps|agent@dtwo.ai
      claims:
        groups:
          - sales
    payload:
      name: google-calendar-mcp-list-events
      text:
        - '{"items":[{"summary":"Standup","attendees":["a@corp.com","b@corp.com"]}]}'
  output:
    expectedResult: allow
  transformApplied: true

- description: >-
    Red-team (finding, documented residual): a free/busy availability read
    (`get-freebusy`) matches NEITHER the [-_]events? suffix nor the gcal_ prefix,
    so no transform is emitted. Its calendar-ID keys are attendee email addresses
    the caller queried, which therefore pass through unscrubbed. Documented under
    Known limitations (free/busy out of scope); test locks the current behavior
    so any future scope expansion is a deliberate, tested change.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: google-calendar-mcp-get-freebusy
      uri: null
    subject:
      sub: google-apps|agent@dtwo.ai
      claims:
        groups:
          - sales
    payload:
      name: google-calendar-mcp-get-freebusy
      text:
        - '{"calendars":{"a@corp.com":{"busy":[{"start":"2026-07-16T09:00:00Z","end":"2026-07-16T09:30:00Z"}]}}}'
  output:
    expectedResult: allow
  transformApplied: false
