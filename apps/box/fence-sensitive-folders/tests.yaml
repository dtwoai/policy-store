# --- Red-team: file copy exfil (fixed) ----------------------------------------
- description: 'Red-team (fixed) — copy_file duplicates a fenced finance file into a
    caller-chosen unfenced folder; a non-finance caller could then read the copy. Copy
    is now fenced like move/read, so denied.'
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: box-remote-copy_file
      uri: null
    subject:
      sub: google-apps|dev@example.com
      claims:
        groups:
          - engineering
    payload:
      name: box-remote-copy_file
      args:
        file_id: "9876543210"
        parent_folder_id: "0"
  output:
    expectedResult: deny
    expectedReason: Box file 9876543210 is fenced as sensitive and requires the 'finance' IdP group. Ask your Box administrator for access, or contact InfoSec if this fence looks wrong.

- description: 'Red-team (fixed) — copy_file of the fenced finance file by a caller who
    holds finance is still allowed (has-group branch survives the copy fence).'
  input:
