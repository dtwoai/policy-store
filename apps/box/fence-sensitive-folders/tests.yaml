# Fence configuration under test (placeholders in policy.md):
#   fenced_folders: 1234567890->finance, 1234567891->hr, 1234567892->legal
#   fenced_files:   9876543210->finance, 9876543211->hr
# Reason strings must match the sprintf output in policy.md exactly.

# --- Allow: tool this policy does not inspect ---------------------------------
- description: Non-inspected read tool (who_am_i) with no subject — passes through
    untouched (not a fenced-scope tool).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: box-remote-who_am_i
      uri: null
    payload:
      name: box-remote-who_am_i
      args: {}
  output:
    expectedResult: allow

- description: Non-tool ingress hook (prompt_pre_fetch) — resource is not a fenced
    tool, so it passes.
  input:
    action: prompt_pre_fetch
    kind: prompt_pre_fetch
    mode: input
    resource:
      type: prompt
      name: greeting
      uri: null
    payload:
      prompt_id: greeting
      args:
        user: alice
  output:
    expectedResult: allow

