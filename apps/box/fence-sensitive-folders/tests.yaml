    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: box-remote-get_file_content
      uri: null
    subject:
      sub: google-apps|dev@example.com
      claims:
        groups:
          - engineering
    payload:
      name: box-remote-get_file_content
      args:
        file_id: "5550001111"
  output:
    expectedResult: allow

