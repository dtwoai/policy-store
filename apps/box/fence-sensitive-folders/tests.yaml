# --- Red-team: ancestry residuals (documented, not statelessly fixable) --------
- description: 'Red-team (documented residual) — recursive community listing of the unfenced
    root folder 0 enumerates items inside fenced subtrees. The policy only tests the literal
    top folder_id (0, unfenced) and cannot resolve ancestry, so it allows. Documented under
    Known limitations; mitigate by pinning root IDs and pairing egress redaction.'
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: box-community-box_folder_items_list_tool
      uri: null
    subject:
      sub: auth0|bob
      claims:
        groups:
          - engineering
    payload:
      name: box-community-box_folder_items_list_tool
      args:
        folder_id: "0"
        is_recursive: true
  output:
    expectedResult: allow

- description: 'Red-team (documented residual) — a non-privileged caller sidesteps the
    unscoped-search deny by scoping community search to the unfenced root folder 0, which
    still searches into fenced subtrees. The literal ancestor ID (0) is not fenced, so the
    scoped-search allow fires. Documented under Known limitations.'
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: box-community-box_search_tool
      uri: null
    subject:
      sub: auth0|bob
      claims:
        groups:
          - engineering
    payload:
      name: box-community-box_search_tool
      args:
        query: payroll ssn
        where_to_look_for_query: FILE_CONTENT
        ancestor_folder_ids:
          - "0"
  output:
    expectedResult: allow
