# --- Red-team regression cases (reviewer, standards §10) ---

- description: "Red-team: object-shaped groups claim {department: finance} must NOT grant the exemption — is_array guard fails it closed, so redaction still applies."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: box-mcp-get_file_content
      uri: null
    subject:
      sub: auth0|u18
      claims:
        groups:
          department: finance
    payload:
      name: box-mcp-get_file_content
      text:
        - "SSN 123-45-6789"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "SSN [REDACTED-SSN]"

- description: "Red-team: nested-array groups [[hr]] is not a flat array of strings — fails closed (not exempt), redaction applies."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: box-mcp-get_file_content
      uri: null
    subject:
      sub: auth0|u19
      claims:
        groups:
          - - hr
    payload:
      name: box-mcp-get_file_content
      text:
        - "SSN 123-45-6789"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "SSN [REDACTED-SSN]"

- description: "Red-team: egress with action=tool_post_invoke but mode unset — is_egress still matches on action, so redaction fires (no fail-open leak)."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    resource:
      type: tool
      name: box-mcp-get_file_content
      uri: null
    subject:
      sub: auth0|u20
      claims:
        groups:
          - eng
    payload:
      name: box-mcp-get_file_content
      text:
        - "SSN 123-45-6789"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "SSN [REDACTED-SSN]"

- description: "Red-team: tool name present only under payload.name (resource.name empty, no tool_metadata) — payload.name is a candidate surface, so the call is in scope and redaction fires."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: ""
      uri: null
    subject:
      sub: auth0|u21
      claims:
        groups:
          - eng
    payload:
      name: box-mcp-get_file_content
      text:
        - "SSN 123-45-6789"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "SSN [REDACTED-SSN]"
