# Egress transform policy (default allow := true) — allow is always true; the
# meaningful assertions are transformApplied / transformedArgsContain. Cases
# cover every rule branch: each detection class, the Luhn gate, both pairing
# heuristics, the tool_metadata fallback, both group-exemption forms, fail-closed
# on missing claims, out-of-scope tools, non-string blocks, and the ingress guard.

- description: Content tool, non-exempt caller — SSN and a Luhn-valid card are both redacted in place.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: box-mcp-get_file_content
      uri: null
    subject:
      sub: auth0|u1
      claims:
        groups:
          - marketing
    payload:
      name: box-mcp-get_file_content
      text:
        - "Employee SSN: 123-45-6789, card 4111 1111 1111 1111"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "Employee SSN: [REDACTED-SSN], card [REDACTED-CC]"

- description: Labeled routing + account numbers co-occur (bank_pair) — both are redacted.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: box-mcp-ai_extract_structured
      uri: null
    subject:
      sub: auth0|u3
      claims:
        groups:
          - eng
    payload:
      name: box-mcp-ai_extract_structured
      text:
        - "Routing number: 021000021 Account number: 1234567890"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "[REDACTED-BANK-ROUTING] [REDACTED-BANK-ACCOUNT]"

- description: Email and phone co-occur (contact_pair) — both are redacted, surrounding text kept.
