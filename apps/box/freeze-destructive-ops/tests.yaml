- description: File delete with no subject/claims at all — exemption fails closed, deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: box-mcp-box_file_delete_tool
      uri: null
    payload:
      name: box-mcp-box_file_delete_tool
      args:
        file_id: "1234567890"
  output:
    expectedResult: deny
    expectedReason: "Deleting Box files, folders, or collaborations, removing shared links, and clearing retention dates are restricted to the box-admins group. Box trash makes deletions recoverable, but content destruction and retention tampering by an agent are out of policy. Perform the action manually in the Box web app, or ask a box-admins member. Contact your InfoSec team if this block is a false positive."
- description: File delete by a caller whose groups claim lacks box-admins — deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: box-mcp-box_file_delete_tool
      uri: null
    subject:
      sub: auth0|analyst@example.com
      claims:
        groups:
          - finance
          - engineering
    payload:
      name: box-mcp-box_file_delete_tool
      args:
        file_id: "1234567890"
  output:
    expectedResult: deny
    expectedReason: "Deleting Box files, folders, or collaborations, removing shared links, and clearing retention dates are restricted to the box-admins group. Box trash makes deletions recoverable, but content destruction and retention tampering by an agent are out of policy. Perform the action manually in the Box web app, or ask a box-admins member. Contact your InfoSec team if this block is a false positive."
- description: File delete by a box-admins member — group exemption allows the single delete.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: box-mcp-box_file_delete_tool
