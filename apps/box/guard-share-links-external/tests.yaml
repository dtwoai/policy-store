- description: Infosec-group caller may create an external collaboration
    (break-glass exemption).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: box-remote-create_collaboration
      uri: null
    subject:
      sub: auth0|infosec-admin@example.com
      claims:
        groups:
          - infosec
    payload:
      name: box-remote-create_collaboration
      args:
        item:
          type: folder
          id: "9821"
        accessible_by:
          type: user
          login: auditor@external-firm.example.org
        role: viewer
  output:
    expectedResult: allow

- description: Infosec-group caller may create an open shared link
    (break-glass exemption).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: box-remote-add_file_shared_link
      uri: null
    subject:
      sub: auth0|infosec-admin@example.com
      claims:
        groups:
          - Infosec
    payload:
      name: box-remote-add_file_shared_link
      args:
        file_id: "1234"
        access: open
  output:
    expectedResult: allow

- description: Caller in a different group (finance) is not exempt — open
