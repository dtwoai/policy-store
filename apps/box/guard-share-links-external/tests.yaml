      args:
        file_id: "1234"
        access: open
  output:
    expectedResult: deny
    expectedReason: Public 'open' Box shared links are blocked because they mint an anonymous URL visible outside the organization. Use 'company' or 'collaborators' access instead. Contact your InfoSec team if you need a public link.

- description: Red-team — crafted double-@ login cannot smuggle an approved
    suffix; denied as external.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: box-remote-create_collaboration
      uri: null
    payload:
      name: box-remote-create_collaboration
      args:
        item:
          type: file
          id: "1234"
        accessible_by:
          type: user
          login: mallory@evil.com@example.com
        role: editor
  output:
    expectedResult: deny
    expectedReason: "Box collaboration with 'mallory@evil.com@example.com' is blocked: the invitee's email domain is not on the approved corporate domain list. Invite a corporate account instead, or ask your InfoSec team to approve the domain."

- description: Red-team — case variance in tool name and access value is still
    caught (Open on a mixed-case tool name).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: Box-Remote-Add_File_Shared_Link
      uri: null
    payload:
      name: Box-Remote-Add_File_Shared_Link
      args:
        file_id: "1234"
        access: "Open"
  output:
    expectedResult: deny
    expectedReason: Public 'open' Box shared links are blocked because they mint an anonymous URL visible outside the organization. Use 'company' or 'collaborators' access instead. Contact your InfoSec team if you need a public link.

- description: Red-team — uppercase-domain login still matches the allowlist
    (case-insensitive domain check).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: box-remote-create_collaboration
      uri: null
    payload:
      name: box-remote-create_collaboration
      args:
        item:
          type: folder
          id: "9821"
        accessible_by:
          type: user
          login: Bob@EXAMPLE.COM
        role: viewer
  output:
    expectedResult: allow

- description: Red-team — non-string access (array [open]) on a shared-link tool
    fails closed instead of passing through.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: box-remote-add_file_shared_link
      uri: null
    payload:
      name: box-remote-add_file_shared_link
      args:
        file_id: "1234"
        access:
          - open
  output:
    expectedResult: deny
    expectedReason: This Box shared-link call has a malformed 'access' value (not a string), so the public-link check cannot run and the request fails closed. Re-issue with access set to 'company' or 'collaborators'.

- description: Red-team — non-string access (object {value:open}) on a
    community shared-link tool fails closed.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: box-mcp-box_shared_link_file_create_or_update_tool
      uri: null
    payload:
      name: box-mcp-box_shared_link_file_create_or_update_tool
      args:
        file_id: "1234"
        access:
          value: open
  output:
    expectedResult: deny
    expectedReason: This Box shared-link call has a malformed 'access' value (not a string), so the public-link check cannot run and the request fails closed. Re-issue with access set to 'company' or 'collaborators'.

- description: Infosec-group caller may still send a malformed-access shared-link
    call (break-glass exemption wins over the malformed fail-closed).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: box-remote-add_file_shared_link
      uri: null
    subject:
      sub: auth0|infosec-admin@example.com
      claims:
        groups:
          - infosec
    payload:
      name: box-remote-add_file_shared_link
      args:
        file_id: "1234"
        access:
          - open
  output:
    expectedResult: allow

- description: Documented residual — update_file_properties carrying a nested
    shared_link.access=open is NOT a matched sharing tool and passes through
    (alternate create path; see Known limitations).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: box-remote-update_file_properties
      uri: null
    payload:
      name: box-remote-update_file_properties
      args:
        file_id: "1234"
        shared_link:
          access: open
  output:
    expectedResult: allow

- description: Documented residual — group-claim sent as a bare string (not a
    list) does not satisfy the infosec exemption; open link still denied
    (exemption fails closed).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: box-remote-add_file_shared_link
      uri: null
    subject:
      sub: auth0|impostor@example.com
      claims:
        groups: infosec
    payload:
      name: box-remote-add_file_shared_link
      args:
        file_id: "1234"
        access: open
  output:
    expectedResult: deny
    expectedReason: Public 'open' Box shared links are blocked because they mint an anonymous URL visible outside the organization. Use 'company' or 'collaborators' access instead. Contact your InfoSec team if you need a public link.

- description: Red-team — non-string collaboration login (nested object, an
    evasion of the domain string check) fails closed with the external-domain
    reason; trim_space cannot run on a non-string, so login_domain_allowed is
    undefined and the allow rule cannot fire.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: box-remote-create_collaboration
      uri: null
    payload:
      name: box-remote-create_collaboration
      args:
        item:
          type: folder
          id: "9821"
        accessible_by:
          type: user
          login:
            n: x@example.com
        role: editor
  output:
    expectedResult: deny
    expectedReason: "Box collaboration with '{\"n\": \"x@example.com\"}' is blocked: the invitee's email domain is not on the approved corporate domain list. Invite a corporate account instead, or ask your InfoSec team to approve the domain."

- description: Documented residual — box_folder_set_upload_email_tool (community)
    sets a public inbound-upload email address (widens external exposure) but is
    not a share-link/collaboration grant, so it is NOT matched and passes through
    (see Known limitations; gate with a companion policy if needed).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: box-mcp-box_folder_set_upload_email_tool
      uri: null
    payload:
      name: box-mcp-box_folder_set_upload_email_tool
      args:
        folder_id: "9821"
        access: open
  output:
    expectedResult: allow

- description: Documented residual — box_file_set_download_open_tool (community)
    widens download scope on an existing shared link but is not a grant tool, so
    it is NOT matched and passes through (see Known limitations).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: box-mcp-box_file_set_download_open_tool
      uri: null
    payload:
      name: box-mcp-box_file_set_download_open_tool
      args:
        file_id: "1234"
  output:
    expectedResult: allow
