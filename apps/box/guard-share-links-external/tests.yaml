# Tests for box/guard-share-links-external. Every rule branch is covered:
# pass-through, both collaboration dialects (login allowed / login external /
# login missing), both shared-link dialects (open / company / collaborators /
# missing access), the infosec exemption (present / absent / other groups),
# and red-team cases (crafted double-@ login, case variance).
- description: Non-sharing Box tool (upload_file) passes through untouched.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: box-remote-upload_file
      uri: null
    payload:
      name: box-remote-upload_file
      args:
        parent_folder_id: "0"
        name: notes.txt
  output:
    expectedResult: allow

- description: Official create_collaboration with an internal login (allowed
    corporate domain) is allowed.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: box-remote-create_collaboration
      uri: null
    payload:
      name: box-remote-create_collaboration
      args:
        item:
          type: folder
          id: "9821"
        accessible_by:
          type: user
          login: bob@example.com
        role: viewer
  output:
    expectedResult: allow

- description: Official create_collaboration with an external login domain is
    denied with the external-domain reason.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: box-remote-create_collaboration
      uri: null
    payload:
      name: box-remote-create_collaboration
      args:
        item:
          type: file
          id: "1234"
        accessible_by:
          type: user
          login: mallory@evil.example.net
        role: editor
  output:
    expectedResult: deny
    expectedReason: "Box collaboration with 'mallory@evil.example.net' is blocked: the invitee's email domain is not on the approved corporate domain list. Invite a corporate account instead, or ask your InfoSec team to approve the domain."

- description: Official create_collaboration by user id (no login field) fails
    closed for a non-exempt caller.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: box-remote-create_collaboration
      uri: null
    payload:
      name: box-remote-create_collaboration
      args:
        item:
          type: folder
          id: "9821"
        accessible_by:
          type: user
          id: "5551212"
        role: editor
  output:
    expectedResult: deny
    expectedReason: This Box collaboration grant carries no invitee email login (id-based, group, or role-only grant), so the external-domain check cannot run and the request fails closed. Re-issue the grant with the invitee's email login, or ask your InfoSec team to run it.

- description: Official update_collaboration (role-only change, carries no
    login) fails closed for a non-exempt caller.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: box-remote-update_collaboration
      uri: null
    payload:
      name: box-remote-update_collaboration
      args:
        collaboration_id: "778899"
        role: co-owner
  output:
    expectedResult: deny
    expectedReason: This Box collaboration grant carries no invitee email login (id-based, group, or role-only grant), so the external-domain check cannot run and the request fails closed. Re-issue the grant with the invitee's email login, or ask your InfoSec team to run it.

