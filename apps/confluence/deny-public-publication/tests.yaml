- description: Ordinary page create by a non-comms agent is allowed but forced to draft + private.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: atlassian-createconfluencepage
      uri: null
    subject:
      sub: google-apps|agent@acme.com
      claims:
        groups:
          - engineering
    payload:
      name: atlassian-createconfluencepage
      args:
        spaceId: TEAM123
        title: Runbook
        contentType: page
        status: current
        body: "..."
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    status: draft
    isPrivate: true
    spaceId: TEAM123

