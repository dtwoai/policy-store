- description: Red-team (documented residual) — a non-comms agent flips its own draft to status:"current" via an update on an internal (non-blog, non-public) page. Updates are never transformed and internal publication is not denied, so this passes through. Blog/public writes remain hard-denied; see Known limitations.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: atlassian-updateconfluencepage
      uri: null
    subject:
      sub: google-apps|agent@acme.com
      claims:
        groups:
          - engineering
    payload:
      name: atlassian-updateconfluencepage
      args:
        spaceId: TEAM123
        pageId: "123"
        status: current
        body: "..."
  output:
    expectedResult: allow
  transformApplied: false

- description: Red-team (documented residual) — community confluence_move_page relocating a page INTO a public space is not a matched create/update tool, so it passes through untouched. Out of scope for this policy; freeze/group-gate move on community deployments. See Known limitations.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: mcp-atlassian-confluence_move_page
      uri: null
