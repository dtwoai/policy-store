# Tests for confluence/deny-public-publication (package confluence.ingress.deny_public_publication).
# Covers every rule branch: non-publish passthrough, blog block, public-space
# block (official spaceId + community space_id fallback), allowed-create draft
# transform, comms exemption (deny + transform), community tool names, update
# never-transformed, joined multi-reason, and fail-closed / null-safe edges.

- description: Non-publish Confluence tool (read) passes through untouched, no transform.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: atlassian-getconfluencepage
      uri: null
    subject:
      sub: google-apps|agent@acme.com
      claims:
        groups:
          - engineering
    payload:
      name: atlassian-getconfluencepage
      args:
        pageId: "12345"
  output:
    expectedResult: allow
  transformApplied: false

- description: Agent (non-comms) creates an org-wide blog on the official tool. Deny with the blog reason.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: atlassian-createconfluencepage
      uri: null
    subject:
      sub: google-apps|agent@acme.com
      claims:
        groups:
          - engineering
    payload:
      name: atlassian-createconfluencepage
      args:
        spaceId: TEAM123
        title: Q3 launch
        contentType: blog
        body: "..."
  output:
    expectedResult: deny
    expectedReason: "This Confluence write publishes a blog post, which broadcasts to your whole organization. Agent-initiated blog posts are blocked. Post it as a regular page in a team space instead, or ask a member of the comms team to publish it. Contact your admin if you believe this is a false positive."

