      claims:
        groups:
          - engineering
    payload:
      name: mcp-atlassian-confluence_move_page
      args:
        page_id: "123"
        target_space_id: PUBLIC-SPACE-ID
  output:
    expectedResult: allow
  transformApplied: false

- description: Red-team (documented residual) — non-comms UPDATE by pageId only (no spaceId) to a page that already lives in a public space is not space-checked, because the space is not part of an update request. Passes through un-transformed. Creates into public spaces are still hard-denied; see Known limitations.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: atlassian-updateconfluencepage
      uri: null
    subject:
