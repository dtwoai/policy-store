- description: Agent (non-comms) updates a page in a public / anonymous-access space (official spaceId). Deny with the public-space reason.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: atlassian-updateconfluencepage
      uri: null
    subject:
      sub: google-apps|agent@acme.com
      claims:
        groups:
          - engineering
    payload:
      name: atlassian-updateconfluencepage
      args:
        spaceId: PUBLIC-SPACE-ID
        pageId: "123"
        title: Notice
        body: "..."
  output:
    expectedResult: deny
    expectedReason: "This Confluence write targets a public or anonymous-access space, which would publish externally visible content. Agent-initiated writes to public spaces are blocked. Move the content to an internal space, or ask a member of the comms team to publish it. Contact your admin if this space should not be treated as public."

