- description: Non-destructive Confluence write (update page) — not a frozen tool, allowed.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: mcp-atlassian-confluence_update_page
      uri: null
    payload:
      name: mcp-atlassian-confluence_update_page
      args:
        page_id: "123456"
        title: Runbook
        body: "..."
  output:
    expectedResult: allow

- description: Official Rovo read tool (get page) — not a frozen tool, allowed.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: atlassian-getconfluencepage
      uri: null
    payload:
      name: atlassian-getconfluencepage
      args:
        pageId: "123456"
  output:
    expectedResult: allow

- description: Agent tries to delete a page (no admin group) — frozen tool, denied with reason.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: mcp-atlassian-confluence_delete_page
      uri: null
    subject:
      sub: google-apps|agent@acme.com
      claims:
        groups:
          - engineering
    payload:
      name: mcp-atlassian-confluence_delete_page
      args:
        page_id: "123456"
  output:
    expectedResult: deny
    expectedReason: Deleting Confluence pages or attachments is frozen on the agent channel. Deletions are irreversible, so a human must perform them in the Confluence UI. Contact your Confluence admins if this deletion is required.

- description: Agent tries to delete an attachment (no admin group) — frozen tool, denied.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: mcp-atlassian-confluence_delete_attachment
      uri: null
    subject:
      sub: google-apps|agent@acme.com
      claims:
        groups:
          - support
    payload:
      name: mcp-atlassian-confluence_delete_attachment
      args:
        attachment_id: "att-99"
  output:
    expectedResult: deny
    expectedReason: Deleting Confluence pages or attachments is frozen on the agent channel. Deletions are irreversible, so a human must perform them in the Confluence UI. Contact your Confluence admins if this deletion is required.

- description: Red-team — mixed-case tool name for delete page. Case-insensitive match still denies.
  input:
