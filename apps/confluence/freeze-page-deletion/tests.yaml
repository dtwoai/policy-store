- description: Red-team — delete tool name padded with trailing space + newline. Names are whitespace-trimmed before matching, so the freeze still fires (fixed bypass).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: "mcp-atlassian-confluence_delete_page \n"
      uri: null
    subject:
      sub: google-apps|agent@acme.com
      claims:
        groups:
          - engineering
    payload:
      name: "mcp-atlassian-confluence_delete_page \n"
      args:
        page_id: "123456"
  output:
    expectedResult: deny
    expectedReason: Deleting Confluence pages or attachments is frozen on the agent channel. Deletions are irreversible, so a human must perform them in the Confluence UI. Contact your Confluence admins if this deletion is required.

- description: Red-team — delete tool name padded with a zero-width space (U+200B) evades the suffix match. Documented limitation — not exploitable, since MCP servers dispatch by exact name and reject the padded name as an unknown tool.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: "mcp-atlassian-confluence_delete_page​"
      uri: null
    payload:
      name: "mcp-atlassian-confluence_delete_page​"
      args:
        page_id: "123456"
  output:
    expectedResult: allow

- description: Red-team — content destruction via an allowed write; blank-body confluence_update_page passes through. Documented limitation — versioned and recoverable from page history, unlike the frozen irreversible deletes.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: mcp-atlassian-confluence_update_page
