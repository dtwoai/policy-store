      claims:
        groups:
          - engineering
    payload:
      name: MCP-Atlassian-Confluence_Delete_Page
      args: {}
  output:
    expectedResult: deny

- description: Break-glass — admin-group member deletes a page during maintenance. Allowed.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: mcp-atlassian-confluence_delete_page
      uri: null
    subject:
      sub: google-apps|admin@acme.com
      claims:
        groups:
          - confluence-admins
    payload:
      name: mcp-atlassian-confluence_delete_page
      args:
        page_id: "123456"
  output:
    expectedResult: allow

- description: Red-team — fail closed when the caller has claims but no groups at all. Delete denied.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: mcp-atlassian-confluence_delete_page
      uri: null
    subject:
      sub: google-apps|agent@acme.com
      claims:
        scope: openid profile email
    payload:
      name: mcp-atlassian-confluence_delete_page
      args:
        page_id: "123456"
  output:
    expectedResult: deny

- description: Red-team — fail closed when there is no subject object at all (no IdP identity). Delete denied.
