# --- Red-team regression cases (reviewer, standards §10) ---

- description: "Red-team: egress with action=tool_post_invoke but mode unset — is_egress still matches on action, so redaction fires (no fail-open leak)."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    resource:
      type: tool
      name: atlassian-getconfluencepage
      uri: null
    subject:
      sub: auth0|u21
      claims:
        groups:
          - eng
    payload:
      name: atlassian-getconfluencepage
      text:
        - "SSN 123-45-6789"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "SSN [REDACTED-SSN]"

- description: "Red-team: object-shaped groups claim {department: pii-full} must NOT grant the exemption — the is_array guard fails it closed, so redaction still applies."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: atlassian-getconfluencepage
      uri: null
    subject:
      sub: auth0|u22
      claims:
        groups:
          department: pii-full
    payload:
      name: atlassian-getconfluencepage
      text:
        - "SSN 123-45-6789"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "SSN [REDACTED-SSN]"

- description: "Red-team: nested-array groups [[pii-full]] is not a flat array of strings — the is_string(g) guard fails it closed (not exempt), redaction applies."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: atlassian-getconfluencepage
      uri: null
    subject:
      sub: auth0|u23
      claims:
        groups:
          - - pii-full
    payload:
      name: atlassian-getconfluencepage
      text:
        - "SSN 123-45-6789"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "SSN [REDACTED-SSN]"

- description: "Red-team: egress that leaks what an ingress space fence would block — a restricted-space page body with SSN + email + phone is still fully redacted, since this policy runs regardless of the ingress verdict."
  input:
    action: tool_post_invoke
