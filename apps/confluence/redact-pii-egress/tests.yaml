# Egress transform policy (default allow := true) — allow is always true; the
# meaningful assertions are transformApplied / transformedArgsContain. Cases
# cover every rule branch: each detection class independently (SSN, email,
# phone) and all three together, every in-scope tool suffix (official +
# community), the resource.name / tool_metadata.name / payload.name candidate
# surfaces, both group-exemption forms, case-insensitive matching, fail-closed
# on missing/oddly-shaped claims, out-of-scope tools, non-string blocks,
# conservative-regex negatives (page IDs / version strings), and the ingress guard.

- description: In-scope getConfluencePage, non-exempt caller — SSN, email, and phone are all redacted in place; surrounding wiki text is kept.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: atlassian-getconfluencepage
      uri: null
    subject:
      sub: auth0|u1
      claims:
        groups:
          - marketing
    payload:
      name: atlassian-getconfluencepage
      text:
        - "Onboarding SSN 123-45-6789, contact jane@acme.com or 206-555-0100"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "Onboarding SSN [REDACTED-SSN], contact [REDACTED-EMAIL] or [REDACTED-PHONE]"

