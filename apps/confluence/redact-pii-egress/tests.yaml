  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "HR space leak: SSN [REDACTED-SSN], [REDACTED-EMAIL], [REDACTED-PHONE]"

- description: "Red-team FIXED: page body delivered as MCP-standard structured text blocks {type:text, text:...} — the inner `text` is redacted and `type` preserved. Before the fix, object blocks slipped past the string-only redactor and leaked verbatim."
  input:
