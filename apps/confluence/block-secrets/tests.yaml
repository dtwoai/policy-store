            password: "hunter2plaintextvalue"
  output:
    expectedResult: allow

- description: "Red-team documented residual — confluence_upload_attachment is not in write_tool_suffixes, so the tool is never recognized as an inspected write. Even a provider secret staged in its text `comment` metadata field (a key that IS in body_arg_keys) is not scanned, because body extraction only runs for recognized write tools. Policy allows (documented non-inspected-write limitation)."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: mcp-atlassian-confluence_upload_attachment
      uri: null
    payload:
