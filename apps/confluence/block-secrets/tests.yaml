- description: Read tool (getConfluencePage) is not a write we inspect. Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: atlassian-getconfluencepage
      uri: null
    payload:
      name: atlassian-getconfluencepage
      args:
        pageId: "5678"
  output:
    expectedResult: allow

- description: Normal page create with a clean body. Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: atlassian-createconfluencepage
      uri: null
    payload:
      name: atlassian-createconfluencepage
      args:
        spaceId: "1234"
        title: Sprint retro notes
        body: We shipped the ingress policies and closed 12 issues.
  output:
    expectedResult: allow

- description: Page create whose body embeds an AWS access key ID. Policy should deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: atlassian-createconfluencepage
      uri: null
    payload:
      name: atlassian-createconfluencepage
      args:
        spaceId: "1234"
        title: Deploy runbook
        body: Export AWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE before running.
  output:
    expectedResult: deny
    expectedReason: "This Confluence write looks like it contains a secret (API key, password, token, or private key). A created or updated page or comment is visible org-wide immediately and cannot be un-published, so it is blocked before it reaches Confluence. Store credentials in your secret manager and reference them instead. Contact your InfoSec team if this was a false positive."

