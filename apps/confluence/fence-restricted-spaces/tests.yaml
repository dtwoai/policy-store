- description: Red-team — OR disjunction broadens a benign space scope across all spaces; denied without full clearance.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: atlassian-searchconfluenceusingcql
      uri: null
    payload:
      name: atlassian-searchconfluenceusingcql
      args:
        cql: space = ENG or text ~ "salary"
  output:
    expectedResult: deny
    expectedReason: This CQL search uses an OR clause, which broadens results past any space filter to every Confluence space, including restricted ones. Split it into separate space-scoped searches, or contact your InfoSec team if you need broader search access.
- description: Red-team — OR with an ancestor clause (points into a restricted page) past a benign space scope is denied without full clearance.
