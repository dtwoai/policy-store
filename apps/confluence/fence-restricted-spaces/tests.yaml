- description: Known limitation — a bare numeric spaceId not present in the restricted config passes through.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: atlassian-getpagesinconfluencespace
      uri: null
    payload:
      name: atlassian-getpagesinconfluencespace
      args:
        spaceId: 1234567
  output:
    expectedResult: allow
- description: Space lookup explicitly scoped to SEC (array filter) is denied for a caller without the infosec group.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: atlassian-getconfluencespaces
      uri: null
    subject:
      sub: auth0|dev
      claims:
        groups:
          - engineering
    payload:
      name: atlassian-getconfluencespaces
      args:
        keys:
          - ENG
          - SEC
  output:
    expectedResult: deny
    expectedReason: Looking up restricted Confluence space(s) (SEC) is not permitted for your account. Contact your InfoSec team if your role requires access.
- description: Space lookup scoped via a comma-separated string filter naming LEGAL is denied without the legal group.
