# Placeholder note: space keys HR/LEGAL/SEC and groups hr/legal/infosec are
# placeholders — remap to your tenant's space keys and IdP groups at import time.
- description: Non-fenced Confluence tool (page fetch by id) passes through untouched.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: atlassian-getconfluencepage
      uri: null
    payload:
      name: atlassian-getconfluencepage
      args:
        pageId: "123456"
  output:
    expectedResult: allow
- description: CQL search scoped to a non-restricted space is allowed with no identity at all.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: atlassian-searchconfluenceusingcql
      uri: null
    payload:
      name: atlassian-searchconfluenceusingcql
      args:
        cql: space = ENG and text ~ "deploy runbook"
  output:
    expectedResult: allow
- description: CQL search naming the restricted HR space is denied for a caller with no groups claim (fails closed).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: atlassian-searchconfluenceusingcql
      uri: null
    subject:
      sub: auth0|dev
      claims:
        org_id: org_123
    payload:
      name: atlassian-searchconfluenceusingcql
      args:
        cql: space=HR and text ~ "salary bands"
  output:
    expectedResult: deny
    expectedReason: This CQL search reaches into restricted Confluence space(s) (HR) that your account is not cleared for. Scope the query to spaces you work in, or contact your InfoSec team if you believe this is a false positive.
- description: CQL search naming HR is allowed for a caller whose IdP groups include hr (case-insensitive group match).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: atlassian-searchconfluenceusingcql
      uri: null
    subject:
      sub: auth0|hr-lead
      claims:
        groups:
          - HR
          - everyone
    payload:
      name: atlassian-searchconfluenceusingcql
      args:
        cql: space = HR and title ~ "onboarding"
  output:
    expectedResult: allow
- description: space in (...) list naming LEGAL is denied for a caller cleared only for hr.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: atlassian-searchconfluenceusingcql
      uri: null
    subject:
      sub: auth0|hr-lead
      claims:
        groups:
          - hr
    payload:
      name: atlassian-searchconfluenceusingcql
      args:
        cql: space in (ENG, LEGAL) and text ~ "contract"
  output:
    expectedResult: deny
    expectedReason: This CQL search reaches into restricted Confluence space(s) (LEGAL) that your account is not cleared for. Scope the query to spaces you work in, or contact your InfoSec team if you believe this is a false positive.
- description: space in (...) with quoted, lowercase legal key is allowed for a legal group member.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: atlassian-searchconfluenceusingcql
      uri: null
    subject:
      sub: auth0|counsel
      claims:
        groups:
          - legal
    payload:
      name: atlassian-searchconfluenceusingcql
      args:
        cql: space in ('ENG', 'legal') and text ~ "NDA"
  output:
    expectedResult: allow
- description: Unscoped CQL (no space clause) fans out across all spaces — denied for a caller without full clearance.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: atlassian-searchconfluenceusingcql
      uri: null
    payload:
      name: atlassian-searchconfluenceusingcql
      args:
        cql: text ~ "roadmap"
  output:
    expectedResult: deny
    expectedReason: This CQL search has no space filter, so it would fan out across every Confluence space, including restricted ones. Add a space = KEY or space in (...) clause naming the spaces you need, or contact your InfoSec team if you need broader search access.
- description: Unscoped CQL is allowed for a caller cleared for every restricted-space group.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: atlassian-searchconfluenceusingcql
      uri: null
    subject:
      sub: auth0|compliance-officer
      claims:
        groups:
          - hr
          - legal
          - infosec
    payload:
      name: atlassian-searchconfluenceusingcql
      args:
        cql: text ~ "quarterly review" order by lastmodified desc
  output:
    expectedResult: allow
- description: Red-team — search call with no cql argument at all is treated as unscoped and fails closed.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: atlassian-searchconfluenceusingcql
      uri: null
    payload:
      name: atlassian-searchconfluenceusingcql
      args: {}
  output:
    expectedResult: deny
    expectedReason: This CQL search has no space filter, so it would fan out across every Confluence space, including restricted ones. Add a space = KEY or space in (...) clause naming the spaces you need, or contact your InfoSec team if you need broader search access.
- description: Community confluence_search (query argument) naming SEC is denied for a non-infosec caller.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: confluence-mcp-confluence_search
      uri: null
    subject:
      sub: auth0|dev
      claims:
        groups:
          - engineering
    payload:
      name: confluence-mcp-confluence_search
      args:
        query: space = SEC and text ~ "incident postmortem"
  output:
    expectedResult: deny
    expectedReason: This CQL search reaches into restricted Confluence space(s) (SEC) that your account is not cleared for. Scope the query to spaces you work in, or contact your InfoSec team if you believe this is a false positive.
- description: Red-team — a negative clause (space != HR) does not count as scoping; still fans out, so it is denied without full clearance.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: atlassian-searchconfluenceusingcql
      uri: null
    payload:
      name: atlassian-searchconfluenceusingcql
      args:
        cql: space != HR and text ~ "offer letter"
  output:
    expectedResult: deny
    expectedReason: This CQL search has no space filter, so it would fan out across every Confluence space, including restricted ones. Add a space = KEY or space in (...) clause naming the spaces you need, or contact your InfoSec team if you need broader search access.
- description: Red-team — a space key that merely contains a restricted key as a substring (CHROME contains HR) is not a match.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: atlassian-searchconfluenceusingcql
      uri: null
    payload:
      name: atlassian-searchconfluenceusingcql
      args:
        cql: space in (CHROME) and text ~ "extension"
  output:
    expectedResult: allow
- description: Red-team — mixed-case tool name and quoted lowercase space key still hit the fence.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: Atlassian-SearchConfluenceUsingCql
      uri: null
    payload:
      name: Atlassian-SearchConfluenceUsingCql
      args:
        cql: Space = "hr" AND created > now("-4w")
  output:
    expectedResult: deny
    expectedReason: This CQL search reaches into restricted Confluence space(s) (HR) that your account is not cleared for. Scope the query to spaces you work in, or contact your InfoSec team if you believe this is a false positive.
- description: Page listing scoped to the restricted HR space is denied for a caller with no identity.
  input:
