# --- RED-TEAM: adjacent digit groups shadow a grouped PAN (documented residual)
- description: >
    Pathological sequence where a leading 4-4-4-4 window (1234 5678 4111 1111)
    is consumed first and fails Luhn, so the real grouped PAN inside the run is
    never matched. Documented "adjacent digit groups shadow" residual — no
    transform.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: databricks-sql-poll_sql_result
      uri: null
    payload:
      name: databricks-sql-poll_sql_result
      text:
        - "1234 5678 4111 1111 1111 1111"
    subject:
      sub: google-apps|casey@acme.com
      claims:
        groups:
          - support
  output:
    expectedResult: allow
  transformApplied: false

# --- RED-TEAM: PAN glued to a word character (underscore) is missed (documented)
- description: >
    A PAN immediately preceded by an underscore (a word char in RE2) has no
    leading word boundary, so no pattern matches. Documented glued-to-word-char
    residual — no transform. This is the deliberate cost of \b anchoring.
  input:
