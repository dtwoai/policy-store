      text:
        - "PAN 4111111111111111 seen"
    subject:
      sub: google-apps|casey@acme.com
      claims:
        groups:
          role: pci-full-pan
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "PAN 411111******1111 seen"

# --- 20+ digit run: no word boundary inside → not partially masked, passthrough
- description: >
    A 20-digit run has no internal word boundary, so the 13-19 pattern cannot
    match it. No transform — a long identifier is never partially masked.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: databricks-sql-poll_sql_result
      uri: null
    payload:
      name: databricks-sql-poll_sql_result
      text:
        - "trace id 41111111111111114567"
    subject:
      sub: google-apps|casey@acme.com
      claims:
        groups:
          - support
  output:
    expectedResult: allow
  transformApplied: false

# --- Non-array text (bare string) → fail-open, no transform
- description: >
