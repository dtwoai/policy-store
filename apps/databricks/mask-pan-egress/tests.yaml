  output:
    expectedResult: allow
  transformApplied: false

# --- RED-TEAM (FIXED): tool name only under tool_metadata.name, no resource.name
- description: >
    Legacy/pre-PARC egress delivery where the tool name arrives under
    tool_metadata.name (and payload.name) but resource.name is absent. Before the
    fix the scope check read only resource.name and failed open (no mask = PAN
    leak). The name is now resolved from resource.name -> tool_metadata.name ->
    payload.name, so poll_sql_result is in scope and the PAN is masked.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    tool_metadata:
      name: databricks-sql-poll_sql_result
    payload:
      name: databricks-sql-poll_sql_result
      text:
        - '{"rows":[["acct-889","4111111111111111"]]}'
    subject:
      sub: google-apps|casey@acme.com
      claims:
        groups:
          - support
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - '{"rows":[["acct-889","411111******1111"]]}'

