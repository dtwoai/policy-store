# Every case feeds ONLY the object under `input` to OPA as the input document.
# expectedResult asserts data.<pkg>.allow; transformApplied / transformedArgsContain
# assert the transform behaviour that expectedResult cannot express.

# --- poll_sql_result: unseparated 16-digit PAN in a JSON result block → masked
- description: >
    poll_sql_result returns a lakehouse row containing a Luhn-valid unseparated
    16-digit PAN. In scope, caller not exempt → masked to BIN+last4.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: databricks-sql-poll_sql_result
      uri: null
    payload:
      name: databricks-sql-poll_sql_result
      text:
        - '{"rows":[["acct-889","4111111111111111"]]}'
    subject:
      sub: google-apps|casey@acme.com
      claims:
        groups:
          - support
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - '{"rows":[["acct-889","411111******1111"]]}'

# --- genie_poll_response: grouped 4-4-4-4 PAN in NL answer → masked, separators dropped
- description: >
    genie_poll_response prose contains a grouped 4-4-4-4 PAN. Masked form drops
    the separators and keeps BIN+last4.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: databricks-genie-genie_poll_response
      uri: null
    payload:
      name: databricks-genie-genie_poll_response
      text:
        - "The top account used card 4111 1111 1111 1111 last month."
    subject:
      sub: google-apps|casey@acme.com
      claims:
        groups:
          - analyst
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "The top account used card 411111******1111 last month."

