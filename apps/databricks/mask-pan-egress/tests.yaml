- description: >
    A grouped 4-4-4-4 PAN with a stray fifth digit glued to the last group
    ("4111 1111 1111 11110"). The grouped pattern's trailing \b fails and the
    single-space separators break the run below the 13-contiguous-digit floor of
    the unseparated pattern, so nothing matches. Documented glued-to-grouped
    residual — no transform, PAN passes through unmasked.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: databricks-sql-poll_sql_result
      uri: null
    payload:
      name: databricks-sql-poll_sql_result
      text:
        - "card 4111 1111 1111 11110 on file"
    subject:
      sub: google-apps|casey@acme.com
      claims:
        groups:
          - support
  output:
    expectedResult: allow
  transformApplied: false

# --- RED-TEAM: encoding/obfuscation — dot-separated PAN evades the space/dash patterns
- description: >
    A Luhn-valid 16-digit PAN written with dot separators ("4111.1111.1111.1111").
    The grouped pattern only accepts space/dash separators and the dots break the
    run below the 13-contiguous-digit floor of the unseparated pattern, so nothing
    matches. Documented encoding/obfuscation residual (§ Known limitations:
    "separators other than space/dash ... do not match") — no transform, PAN
    passes through unmasked. Pair with default-deny-unknown-tools / upstream DLP.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: databricks-sql-poll_sql_result
      uri: null
    payload:
      name: databricks-sql-poll_sql_result
      text:
        - "card 4111.1111.1111.1111 on file"
    subject:
      sub: google-apps|casey@acme.com
      claims:
        groups:
          - support
  output:
    expectedResult: allow
  transformApplied: false

# --- RED-TEAM: substring-collision — a shorter PAN is a literal substring of a longer PAN
- description: >
    Two distinct Luhn-valid PANs in one block where the 16-digit one
    ("4444444444444448") is a literal string prefix of the 17-digit one
    ("44444444444444485"). strings.replace_n applies the shorter key inside the
    longer run, so the longer PAN masks to "444444******44485" — middle digits
    are still masked, but five trailing chars remain visible instead of four.
    Documented substring-collision residual (§ Known limitations) — over-exposure
    of one extra digit, never an unmasked middle. Confirms the doc claim.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: databricks-sql-poll_sql_result
      uri: null
    payload:
      name: databricks-sql-poll_sql_result
      text:
        - "S 4444444444444448 L 44444444444444485"
    subject:
      sub: google-apps|casey@acme.com
      claims:
        groups:
          - support
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "S 444444******4448 L 444444******44485"

# --- RED-TEAM: `__` signature pulls a non-index tool into scope (over-masking, documented)
- description: >
    A metadata tool (list_clusters) on a gateway server whose configured name
    contains a double underscore ("my__srv"). The `__` AI-Search heuristic puts it
    in scope, so its response IS scanned and the Luhn-valid PAN masked. Documented
    over-masking (not a leak — transform-only, card shapes only). Avoid `__` in
    server names if this collateral scanning is unwanted.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: my__srv-list_clusters
      uri: null
    payload:
      name: my__srv-list_clusters
      text:
        - '{"clusters":["4111111111111111"]}'
    subject:
      sub: google-apps|casey@acme.com
      claims:
        groups:
          - support
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - '{"clusters":["411111******1111"]}'
