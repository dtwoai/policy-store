# Branch coverage:
#   allow: non-SQL tool (Genie) · read-only SELECT · SHOW/DESCRIBE/EXPLAIN · exempt admin
#   deny:  each mutating verb (INSERT/UPDATE/DELETE/MERGE/DROP/TRUNCATE/ALTER/
#          CREATE/GRANT/REVOKE/VACUUM/RESTORE) + COPY INTO export + missing-SQL
#          fail-closed
#   red-team: alt arg key · lowercase · community collision · string-groups spoof ·
#             no-claims · non-string SQL · Genie passthrough · VACUUM/RESTORE
#             Delta purge/revert · comment-column false-positive guard · absent args ·
#             EXECUTE IMMEDIATE fragment-reassembly bypass (fixed) + its exempt path ·
#             DENY permission statement (fixed) · LOAD DATA ingest (fixed) ·
#             COPY-INTO comment-injection residual (documented) · deny-column FP ·
#             REORG APPLY PURGE destructive purge (fixed) + reorg-column FP ·
#             EXECUTE-IMMEDIATE comment-injection residual (documented)
- description: Read-only SELECT on the managed execute_sql tool. No mutating
    keyword — allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: databricks-sql-execute_sql
      uri: null
    payload:
      name: databricks-sql-execute_sql
      args:
        statement: SELECT id, total FROM main.sales.orders LIMIT 10
  output:
    expectedResult: allow
- description: SELECT with created_at/updated_at columns. Word-boundary anchoring
    means these do not trip CREATE/UPDATE — allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: databricks-sql-execute_sql
      uri: null
    payload:
      name: databricks-sql-execute_sql
      args:
        statement: SELECT id, created_at, updated_at FROM merge_log
  output:
    expectedResult: allow
- description: SHOW/DESCRIBE/EXPLAIN read-only statement on the read-only tool.
    Pass through — allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: databricks-sql-execute_sql_read_only
      uri: null
    payload:
      name: databricks-sql-execute_sql_read_only
      args:
        statement: DESCRIBE TABLE main.sales.orders
  output:
    expectedResult: allow
- description: Genie natural-language tool. Not a SQL tool; the word "delete" in
    prose is irrelevant — allow (pass-through, out of scope).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: databricks-genie-genie_ask
      uri: null
    payload:
      name: databricks-genie-genie_ask
      args:
        question: delete nothing, just tell me this quarter's revenue
  output:
    expectedResult: allow
- description: poll_sql_result egress-style helper (carries the handle, not SQL).
    Not a matched SQL tool — allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: databricks-sql-poll_sql_result
      uri: null
    payload:
      name: databricks-sql-poll_sql_result
      args:
        statement_handle: 01ef-abc
  output:
    expectedResult: allow
- description: DROP TABLE via managed execute_sql, non-exempt caller. Destructive —
    deny with the write/DDL reason.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: databricks-sql-execute_sql
      uri: null
    payload:
      name: databricks-sql-execute_sql
      args:
        statement: DROP TABLE main.sales.customers
    subject:
      sub: google-apps|analyst@dtwo.ai
      claims:
        groups:
          - analysts
  output:
    expectedResult: deny
    expectedReason: This Databricks SQL statement performs a write, DDL, permission, or export operation (INSERT, UPDATE, DELETE, MERGE, DROP, TRUNCATE, ALTER, CREATE, GRANT, REVOKE, or COPY INTO) and is blocked on the agent MCP path, which is read-only. Re-issue it as a read-only statement (SELECT, SHOW, DESCRIBE, or EXPLAIN) through the execute_sql_read_only tool, or have a member of the data-engineering group run the change. If this was a false positive, contact your data platform team.
