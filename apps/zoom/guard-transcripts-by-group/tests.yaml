# Reason strings (exact) reused across deny cases:
#  T = 'Meeting transcripts, summaries, and next-steps are restricted. Retrieving
#      them requires membership in the transcript-reader group (placeholder
#      "zoom-transcript-readers"). ...'
#  P = 'Retrieving a recording passcode (raw_passcode/encode_passcode) requires
#      membership in the recording-admin group (placeholder "zoom-admins"), ...'

- description: Non-guarded tool (meeting search) is unaffected — allowed even with no groups.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: zoom-workspace-search_meetings
      uri: null
    payload:
      name: zoom-workspace-search_meetings
      args:
        q: quarterly review
    subject:
      claims:
        groups: []
  output:
    expectedResult: allow

- description: Transcript requested by a caller in the transcript-reader group — allowed.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: zoom-workspace-get_recording_resource
      uri: null
    payload:
      name: zoom-workspace-get_recording_resource
      args:
        meetingId: "8891234567"
        types:
          - transcript
    subject:
      claims:
        groups:
          - zoom-transcript-readers
  output:
    expectedResult: allow

- description: Transcript requested without the transcript-reader group — denied.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: zoom-workspace-get_recording_resource
      uri: null
    payload:
      name: zoom-workspace-get_recording_resource
      args:
        meetingId: "8891234567"
        types:
          - transcript
    subject:
      claims:
        groups:
          - marketing
  output:
    expectedResult: deny
    expectedReason: 'Meeting transcripts, summaries, and next-steps are restricted. Retrieving them requires membership in the transcript-reader group (placeholder "zoom-transcript-readers"). Ask your workspace administrator to grant you that group, or request a non-transcript asset instead. If you believe you already have this access, ask your admin to verify your IdP group mapping.'

