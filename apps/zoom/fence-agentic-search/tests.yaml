# Branches covered:
#  - non-search_zoom tool -> passthrough (allow, no transform)
#  - array with native + external -> transform strips external
#  - single string (native) -> transform normalizes to array
#  - array all-external -> deny (fail closed) + exact reason
#  - missing search_entities -> deny (fail closed) + exact reason
#  - non-string/array shape (number) -> deny (fail closed)
#  - uppercase tool suffix + mixed casing entities -> matched, stripped
#  - unrecognized (non-external) corpus value -> stripped

- description: Non-search_zoom tool passes through untouched — no transform, allowed.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: zoom-workspace-get_meeting_assets
      uri: null
    payload:
      name: zoom-workspace-get_meeting_assets
      args:
        meetingId: "abc123"
  output:
    expectedResult: allow
  transformApplied: false

- description: search_zoom with native + external corpora — external stripped, other args preserved.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: zoom-workspace-search_zoom
      uri: null
    payload:
      name: zoom-workspace-search_zoom
      args:
        query: Q3 renewal risks
        search_entities:
          - meetings
          - salesforce
          - workday
        page_size: 20
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    search_entities:
      - meetings
    query: Q3 renewal risks
    page_size: 20

- description: search_zoom with a single native string — normalized to an allowlisted array.
  input:
    action: tool_pre_invoke
