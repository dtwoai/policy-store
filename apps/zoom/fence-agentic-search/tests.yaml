    expectedReason: "Zoom agentic search is fenced to Zoom-native corpora, and this request named only external or unrecognized corpora (none specified). None can be reached through Zoom's search fan-out. Query those systems through their own governed connector, or re-run search_zoom with a Zoom-native corpus. Contact your InfoSec team if a Zoom-native corpus was wrongly rejected."
  transformApplied: false

