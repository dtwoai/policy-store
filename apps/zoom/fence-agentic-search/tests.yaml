# Documents the sibling-argument residual (Known limitations): the transform
# filters search_entities but copies any OTHER argument through verbatim. If the
# upstream tool honored an undocumented second corpus selector (`sources` here),
# external data would still be reachable. This case locks in the pass-through
# behavior so the residual is visible and regression-tested.
- description: Red-team — undocumented sibling corpus key (sources) passes through unchanged while search_entities is filtered (documented residual).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: zoom-workspace-search_zoom
      uri: null
    payload:
      name: zoom-workspace-search_zoom
      args:
        query: renewal risks
        search_entities:
          - meetings
          - salesforce
        sources:
          - salesforce
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    search_entities:
      - meetings
    sources:
      - salesforce
    query: renewal risks

- description: Red-team — wildcard/meta corpus value ("all") is not in the allowlist, stripped, and the call denies (fail closed).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: zoom-workspace-search_zoom
      uri: null
    payload:
      name: zoom-workspace-search_zoom
      args:
        search_entities:
          - all
  output:
    expectedResult: deny
    expectedReason: "Zoom agentic search is fenced to Zoom-native corpora, and this request named only external or unrecognized corpora (all). None can be reached through Zoom's search fan-out. Query those systems through their own governed connector, or re-run search_zoom with a Zoom-native corpus. Contact your InfoSec team if a Zoom-native corpus was wrongly rejected."
  transformApplied: false

- description: Red-team — nested non-string element (an array inside search_entities) is dropped harmlessly; native sibling still survives, no crash.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: zoom-workspace-search_zoom
      uri: null
    payload:
      name: zoom-workspace-search_zoom
      args:
        search_entities:
          - meetings
          - - salesforce
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    search_entities:
      - meetings

# Documents the case-variant sibling-key residual (Known limitations): the lookup
# and rewrite key are the exact lowercase string "search_entities". A sibling key
# differing only in case (SEARCH_ENTITIES) is an unrelated argument and passes
# through verbatim while the lowercase search_entities is filtered to native. On a
# standard case-sensitive JSON-RPC server this is harmless (only the lowercase key
# is read); this case locks in the pass-through so the residual is visible and
# regression-tested for servers that fold argument-key case.
- description: Red-team — case-variant sibling key (SEARCH_ENTITIES) passes through unchanged while lowercase search_entities is filtered (documented residual).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: zoom-workspace-search_zoom
      uri: null
    payload:
      name: zoom-workspace-search_zoom
      args:
        query: renewal risks
        search_entities:
          - meetings
          - salesforce
        SEARCH_ENTITIES:
          - salesforce
          - workday
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    search_entities:
      - meetings
    SEARCH_ENTITIES:
      - salesforce
      - workday
    query: renewal risks

- description: Red-team — whitespace-padded native token (" meetings") is not normalized, stripped, and the call denies (fail-safe direction, no bypass).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: zoom-workspace-search_zoom
      uri: null
    payload:
      name: zoom-workspace-search_zoom
      args:
        search_entities:
          - " meetings"
  output:
    expectedResult: deny
  transformApplied: false
