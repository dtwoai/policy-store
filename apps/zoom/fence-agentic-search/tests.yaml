- description: search_zoom targeting only external corpora — denied, no Zoom-native corpus remains.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: zoom-workspace-search_zoom
      uri: null
    payload:
      name: zoom-workspace-search_zoom
      args:
        query: open tickets
        search_entities:
          - servicenow
          - workday
  output:
    expectedResult: deny
    expectedReason: "Zoom agentic search is fenced to Zoom-native corpora, and this request named only external or unrecognized corpora (servicenow, workday). None can be reached through Zoom's search fan-out. Query those systems through their own governed connector, or re-run search_zoom with a Zoom-native corpus. Contact your InfoSec team if a Zoom-native corpus was wrongly rejected."
  transformApplied: false

