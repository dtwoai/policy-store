# case: allow
- description: complete_checkout where the gateway-resolved merchant
    (input.context.merchant) is on the buyer's allowlist
    (input.context.mandate.merchant_allowlist). Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: ucp-shopify-complete_checkout
      uri: null
    payload:
      name: ucp-shopify-complete_checkout
      args:
        id: chk_123
    context:
      merchant: approved-airline
      mandate:
        merchant_allowlist:
          - approved-airline
          - approved-hotel
    subject:
      claims:
        sub: agent-7
  output:
    expectedResult: allow
# case: deny-slugified
- description: "Live-gateway shape: the gateway federates tools as
    \"<server-prefix>-<op>\" and slugifies underscores to hyphens, so the tool
    arrives as \"ucp-shop-complete-checkout\" — no underscore survives. This
    fixture proves the policy still matches (an underscore-only suffix match
    would fail open here). Scenario otherwise identical to deny.json:
    complete_checkout where the gateway-resolved merchant
    (input.context.merchant) is NOT on the buyer's allowlist. Policy should deny
    with a reason."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: ucp-shop-complete-checkout
      uri: null
    payload:
      name: ucp-shop-complete-checkout
      args:
        id: chk_999
    context:
      merchant: random-marketplace
      mandate:
        merchant_allowlist:
          - approved-airline
          - approved-hotel
    subject:
      claims:
        sub: agent-7
  output:
    expectedResult: deny
    expectedReason: Checkout with merchant "random-marketplace" is not permitted; it
      is not on the approved-merchant allowlist for this buyer.
