# case: allow-escalate
- description: High-value update_checkout response ($742.50 = 74250 minor units,
    at/above the 50000 cap) that DOES carry a continue_url. The response is
    well-formed enough to hand back to a human, so allow=true — but the policy
    still emits an escalation reason telling the agent not to auto-complete and
    to send the buyer to the continue_url for review.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: ucp-shop-update_checkout
      uri: null
    payload:
      name: ucp-shop-update_checkout
      args:
        id: checkout_01J9WXYZ
      result:
        id: checkout_01J9WXYZ
        status: requires_escalation
        currency: USD
        continue_url: https://shop.example.com/checkouts/01J9WXYZ/review
        totals:
          - type: subtotal
            amount: 69900
            display_text: Subtotal
          - type: tax
            amount: 4350
            display_text: Tax
          - type: total
            amount: 74250
            display_text: Total
    context:
      mandate:
        max_total: 50000
        currency: USD
    subject:
      claims:
        sub: agent-runner-01
  output:
    expectedResult: allow
    expectedReason: "Checkout grand total (74250 minor units) is at or above the
      approval threshold of 50000. Do not call complete_checkout autonomously:
      send the buyer to the continue_url for human review and approval (UCP
      status requires_escalation / requires_buyer_review)."
# case: allow-ambiguous-totals
- description: update_checkout response carrying TWO totals[] entries with type ==
    "total" (an ambiguous/malformed totals array). The shared exactly-one-total
    idiom leaves grand_total unresolved, so the policy cannot prove the order is
    high-value and passes the response through (allow, no reason). The ingress
    completion-blocking policies fail closed on the same ambiguity at
    complete_checkout time, so a charge cannot slip through this gap.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: ucp-shop-update_checkout
      uri: null
    payload:
      name: ucp-shop-update_checkout
      args:
        id: checkout_01J9WXYZ
      result:
        id: checkout_01J9WXYZ
        status: ready_for_complete
        currency: USD
        continue_url: ""
        totals:
          - type: total
            amount: 74250
            display_text: Total
          - type: total
            amount: 74250
            display_text: Total (duplicate)
    context:
      mandate:
        max_total: 50000
        currency: USD
    subject:
      claims:
        sub: agent-runner-01
  output:
    expectedResult: allow
