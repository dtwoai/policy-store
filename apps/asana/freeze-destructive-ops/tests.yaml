    expectedReason: "This Asana deletion is blocked because deletions over MCP are irreversible: delete_task permanently removes a task and its non-shared subtasks with no trash-restore path, so a destroyed record survives nowhere else. Route this request through a member of your Asana admin group (placeholder: asana-admins) instead. If you believe this block is a false positive, ask your InfoSec team to add you to that group."
- description: "Red-team suffix evasion (regression): tool name padded with a
    trailing NBSP (U+00A0, \"asana-delete_task\\xA0\"). trim_space uses Go
    unicode.IsSpace, which treats NBSP as whitespace, so it is stripped before the
    endswith check and the suffix still matches — deny. Locks in that the
    whitespace normalization is Unicode-aware, not ASCII-only."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: "asana-delete_task\xA0"
      uri: null
    subject:
      sub: user@example.com
      claims:
        groups:
          - marketing
    payload:
      name: "asana-delete_task\xA0"
      args:
        task_id: "1201234567890"
  output:
    expectedResult: deny
    expectedReason: "This Asana deletion is blocked because deletions over MCP are irreversible: delete_task permanently removes a task and its non-shared subtasks with no trash-restore path, so a destroyed record survives nowhere else. Route this request through a member of your Asana admin group (placeholder: asana-admins) instead. If you believe this block is a false positive, ask your InfoSec team to add you to that group."
- description: "Red-team claim spoofing (regression): groups is an ARRAY whose one
    element is an object carrying the admin name ([{\"name\":\"asana-admins\"}]).
    is_array passes, but the element is an object, not the string \"asana-admins\",
    so `group == admin_group` is false and the admin branch fails closed — deny.
    Complements the string-groups and object-container-groups spoof cases."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: asana-delete_task
      uri: null
    subject:
      sub: user@example.com
      claims:
        groups:
          - name: asana-admins
    payload:
      name: asana-delete_task
      args:
        task_id: "1201234567890"
  output:
    expectedResult: deny
    expectedReason: "This Asana deletion is blocked because deletions over MCP are irreversible: delete_task permanently removes a task and its non-shared subtasks with no trash-restore path, so a destroyed record survives nowhere else. Route this request through a member of your Asana admin group (placeholder: asana-admins) instead. If you believe this block is a false positive, ask your InfoSec team to add you to that group."
- description: "Red-team residual (DOCUMENTED, not fixed): a trailing zero-width
    space (U+200B) after the verb is a non-whitespace code point that trim_space
    does NOT strip, so endswith misses and the call passes through. This is not a
    real evasion — a padded name does not route to the real delete tool on the
    gateway — but it documents the exact-suffix boundary. Allow."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: "asana-delete_task​"
      uri: null
    subject:
      sub: user@example.com
      claims:
        groups:
          - marketing
    payload:
      name: "asana-delete_task​"
      args:
        task_id: "1201234567890"
  output:
    expectedResult: allow
