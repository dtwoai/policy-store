# Reason string is identical across every deny case; anchored here for reuse.
- description: "Red-team under-match (FIXED): bare-verb delete_section behind the
    gateway prefix (asana-delete_section) with NO community asana_ tool prefix.
    Before the fix the suffix was asana_delete_section, so this bare official-style
    name slipped through and was allowed; the bare-verb suffix now catches it —
    deny for non-admin."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: asana-delete_section
      uri: null
    subject:
      sub: user@example.com
      claims:
        groups:
          - marketing
    payload:
      name: asana-delete_section
      args:
        section_id: "1209999"
  output:
    expectedResult: deny
    expectedReason: "This Asana deletion is blocked because deletions over MCP are irreversible: delete_task permanently removes a task and its non-shared subtasks with no trash-restore path, so a destroyed record survives nowhere else. Route this request through a member of your Asana admin group (placeholder: asana-admins) instead. If you believe this block is a false positive, ask your InfoSec team to add you to that group."
