- description: "Red-team admin-gate fail-open (FIXED): groups claim is an OBJECT
    whose values include the admin group name ({\"0\":\"asana-admins\"}). Without the
    is_array guard, `some group in groups` would iterate object values and grant
    admin; the guard forces this non-array shape to fail closed — deny."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: asana-delete_task
      uri: null
    subject:
      sub: user@example.com
