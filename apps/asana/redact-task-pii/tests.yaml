# Transform-only egress policy (default allow := true): a PII-redaction transform
# on Asana task/comment/status read responses. Never denies. Cases cover every
# rule branch: each detection class independently (SSN, email, phone, IBAN) and
# all together; every in-scope read suffix (official bare + community asana_);
# separator-anchored matching (equality, hyphen, underscore) and its over-match
# guard; both group-claim forms (array + bare string) and case-insensitivity for
# the exemption; fail-closed on missing/oddly-shaped claims; out-of-scope tools;
# non-string blocks; MCP {type,text} blocks; conservative-regex negatives; the
# ingress guard; and documented residuals.

# ---- Redaction: each class independently + combined ----

- description: In-scope get_task (official, behind gateway prefix), non-exempt caller — SSN, email, and phone inside serialized notes JSON are all redacted; structural keys kept.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: asana-mcp-get_task
      uri: null
    subject:
      sub: auth0|u1
      claims:
        groups:
          - engineering
    payload:
      name: asana-mcp-get_task
      text:
        - '{"gid":"1201234567890","notes":"Reach jane@acme.com or 206-555-0100; SSN 123-45-6789"}'
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - '{"gid":"1201234567890","notes":"Reach [REDACTED-EMAIL] or [REDACTED-PHONE]; SSN [REDACTED-SSN]"}'

- description: Lone SSN in a get_tasks response is redacted on its own — no pairing required.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: asana-mcp-get_tasks
      uri: null
    subject:
      sub: auth0|u2
      claims:
        groups:
          - sales
    payload:
      name: asana-mcp-get_tasks
      text:
        - "Candidate note: SSN 078-05-1120 on file"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "Candidate note: SSN [REDACTED-SSN] on file"

