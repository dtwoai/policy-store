      text:
        - "SSN 123-45-6789"
  output:
    expectedResult: allow
  transformApplied: false

- description: "Red-team FIX: parenthesized area code with NO separator before the local number (`(206)555-0100`) is now redacted — the doc listed the spaced `(206) 555-0100` form as supported, but the pre-fix pattern required a separator after `)` and leaked this equally common form."
  input:
