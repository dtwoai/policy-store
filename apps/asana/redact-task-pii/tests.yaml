  output:
    expectedResult: allow
  transformApplied: false

- description: "Red-team DOCUMENTED residual: tool name present only under tool_metadata.name (resource.name empty) is NOT matched — this policy reads only resource.name, so the SSN streams through (documented single-surface limitation)."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
