# ---- Red-team regression cases (reviewer, standards §10) ----

- description: "Red-team: egress with action=tool_post_invoke but mode unset — is_egress still matches on action, so redaction fires (no fail-open leak)."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    resource:
      type: tool
      name: asana-mcp-get_task
      uri: null
    subject:
      sub: auth0|u27
      claims:
        groups:
          - eng
    payload:
      name: asana-mcp-get_task
      text:
        - "SSN 123-45-6789"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "SSN [REDACTED-SSN]"

- description: "Red-team: object-shaped groups claim {department: privacy-officer} must NOT grant the exemption — the is_array guard fails it closed, so redaction still applies."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: asana-mcp-get_task
      uri: null
    subject:
      sub: auth0|u28
      claims:
        groups:
          department: privacy-officer
    payload:
      name: asana-mcp-get_task
      text:
        - "SSN 123-45-6789"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "SSN [REDACTED-SSN]"

- description: "Red-team: nested-array groups [[privacy-officer]] is not a flat array of strings — the is_string(g) guard fails it closed (not exempt), redaction applies."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: asana-mcp-get_task
      uri: null
    subject:
      sub: auth0|u29
      claims:
        groups:
          - - privacy-officer
    payload:
      name: asana-mcp-get_task
      text:
        - "SSN 123-45-6789"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "SSN [REDACTED-SSN]"

- description: "Red-team: egress that leaks what an ingress project fence would block — a restricted HR-task body with SSN + email + phone + IBAN is still fully redacted, since this policy runs regardless of the ingress verdict."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: asana-mcp-get_task
      uri: null
    subject:
      sub: auth0|u30
      claims:
        groups:
          - eng
    payload:
      name: asana-mcp-get_task
      text:
        - "HR task leak: SSN 123-45-6789, jane@acme.com, 206-555-0100, IBAN GB29NWBK60161331926819"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "HR task leak: SSN [REDACTED-SSN], [REDACTED-EMAIL], [REDACTED-PHONE], IBAN [REDACTED-IBAN]"

- description: "Red-team DOCUMENTED residual: off-spec scalar `text` (a bare string, not an array) fails the is_array transform guard — no transform fires and the SSN passes through (fail-open on a shape off the documented gateway contract)."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: asana-mcp-get_task
      uri: null
    subject:
      sub: auth0|u31
      claims:
        groups:
          - eng
    payload:
      name: asana-mcp-get_task
      text: "Task note SSN 123-45-6789"
  output:
    expectedResult: allow
  transformApplied: false

- description: "Red-team DOCUMENTED residual: full-width Unicode-digit SSN is not matched — RE2 `\\d` is ASCII-only, so the identifier streams through unredacted (no transform)."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: asana-mcp-get_task
      uri: null
    subject:
      sub: auth0|u32
      claims:
        groups:
          - eng
    payload:
      name: asana-mcp-get_task
      text:
        - "Full-width SSN １２３-４５-６７８９ on file"
  output:
    expectedResult: allow
  transformApplied: false

- description: "Red-team DOCUMENTED residual (word-boundary adjacency): an SSN wrapped in Markdown italics underscores (_123-45-6789_) is NOT redacted — `_` is a regex word char, so the `\\b` anchor finds no boundary."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: asana-mcp-get_task_stories
      uri: null
    subject:
