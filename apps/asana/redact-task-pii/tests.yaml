  transformApplied: true
  transformedArgsContain:
    text:
      - "Vendor contact [REDACTED-PHONE] on the SOW"

- description: "Red-team DOCUMENTED residual: non-hyphenated SSN forms (space `123 45 6789`, dot `123.45.6789`) are NOT matched — the pattern is hyphenated-only by design (bare/space/dot runs collide with GIDs and version strings), so these stream through (no transform)."
