# Fence config in policy.md maps placeholder GIDs -> groups:
#   1201111111111 -> hr, 1202222222222 -> legal,
#   1203333333333 -> ma, 1204444444444 -> incident
# Reason strings embed the GID + group, so deny cases pin the exact reason.

- description: Read tool (get_task) is not an inspected write. Pass-through allow,
    even for a fenced-looking arg.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: asana-get_task
      uri: null
    subject:
      sub: google-apps|dev@example.com
      claims:
        groups:
          - engineering
    payload:
      name: asana-get_task
      args:
        task_id: "1201111111111"
  output:
    expectedResult: allow

- description: create_tasks batch targeting a NON-fenced project. Allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: asana-create_tasks
      uri: null
    subject:
      sub: google-apps|dev@example.com
      claims:
        groups:
          - engineering
    payload:
      name: asana-create_tasks
      args:
        tasks:
          - name: ship it
            project: "1209999999999"
  output:
    expectedResult: allow

- description: add_comment on a fenced HR project by a caller IN the hr group.
    Mapped-group branch allows the write.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: asana-add_comment
      uri: null
    subject:
      sub: google-apps|hr@example.com
      claims:
        groups:
          - hr
    payload:
      name: asana-add_comment
      args:
        project: "1201111111111"
        text: onboarding note
  output:
    expectedResult: allow

- description: create_tasks batch element names a fenced HR project (element
    `project` field). Caller lacks hr group. Deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: asana-create_tasks
      uri: null
    subject:
      sub: google-apps|dev@example.com
      claims:
        groups:
          - engineering
    payload:
      name: asana-create_tasks
      args:
        tasks:
          - name: leak into HR
            project: "1201111111111"
  output:
    expectedResult: deny
    expectedReason: "Asana project 1201111111111 is fenced as sensitive and requires the 'hr' IdP group to write to it; this call targets it directly. Route the write through a member of the 'hr' group, or contact InfoSec if this fence looks wrong."

