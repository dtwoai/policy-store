    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: asana-create_tasks
      uri: null
    subject:
      sub: google-apps|hr@example.com
      claims:
        groups:
          - hr
    payload:
      name: asana-create_tasks
      args:
        tasks:
          - name: hr task
            project: "1201111111111"
          - name: legal task
            project: "1202222222222"
  output:
    expectedResult: deny
    expectedReason: "Asana project 1202222222222 is fenced as sensitive and requires the 'legal' IdP group to write to it; this call targets it directly. Route the write through a member of the 'legal' group, or contact InfoSec if this fence looks wrong."

