- description: domdomegg delete_records (batch by recordIds) by a non-admin. "delete"
    substring matches. Deny with reason.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: airtable-delete_records
      uri: null
    subject:
      sub: user@example.com
      claims:
        groups:
          - marketing
    payload:
      name: airtable-delete_records
      args:
        baseId: app0123456789
        tableId: tbl0123456789
        recordIds:
          - rec0000000000001
          - rec0000000000002
  output:
    expectedResult: deny
    expectedReason: "This Airtable deletion is blocked because deletions over MCP are irreversible at the API level: delete_records permanently removes rows by record ID (only Airtable's revision history or trash can restore them) and delete_page permanently removes an interface page. Make intentional deletions in the Airtable web UI instead, where they can be reviewed and undone. If you believe this block is a false positive, ask your Airtable admin to add you to the airtable-admins group."
