# --- Adversarial red-team review (standards section 10) ---------------------
- description: Residual — a lowercase UK National Insurance number (ab123456c) is
    NOT matched; the national_id_pattern character classes are uppercase-only by
    design, so it passes through unredacted (no transform). Locks the
    description's "uppercase only" national-ID claim.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: airtable-get_record
