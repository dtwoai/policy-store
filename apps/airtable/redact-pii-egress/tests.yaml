# --- Red-team residuals (standards section 10) ------------------------------
- description: Residual — SSN split across two adjacent content blocks matches in
    neither block on its own; the per-block regex fires nowhere and the value
    leaks through unredacted (no transform). Locks the split-across-blocks
    residual.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: airtable-list_records
      uri: null
    subject:
      sub: auth0|u1
      claims:
        groups:
          - sales
    payload:
      name: airtable-list_records
      text:
        - "SSN 123-45-"
        - "6789 (continued)"
  output:
    expectedResult: allow
  transformApplied: false
- description: Residual — full-width-digit SSN (U+FF10..U+FF19) is not matched by
    the ASCII \d pattern, so it passes through unredacted (no transform). Locks
    the obfuscation residual.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: airtable-list_records
      uri: null
    subject:
      sub: auth0|u1
      claims:
        groups:
          - sales
    payload:
      name: airtable-list_records
      text:
        - "SSN １２３-４５-６７８９ on file"
  output:
    expectedResult: allow
  transformApplied: false
- description: Residual — space-separated SSN is deliberately not matched (the SSN
    pattern is the canonical hyphenated form only), so it passes through (no
    transform). Locks the "hyphenated form only" claim.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: airtable-list_records
      uri: null
    subject:
      sub: auth0|u1
      claims:
        groups:
          - sales
    payload:
      name: airtable-list_records
      text:
        - "SSN 123 45 6789 on file"
  output:
    expectedResult: allow
  transformApplied: false
- description: Residual — a bare 10-digit run (2065550100) is not matched by the
    phone patterns (no + for E.164, no separator for NANP) — it collides with
    numeric IDs — so it passes through unredacted (no transform). Locks the
    "bare digit runs are not matched" invariant.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: airtable-list_records
      uri: null
    subject:
      sub: auth0|u1
      claims:
        groups:
          - sales
    payload:
      name: airtable-list_records
      text:
        - "ref 2065550100 on file"
  output:
    expectedResult: allow
  transformApplied: false
- description: Residual — an unprefixed bare tool name (list_records) with no
    leading-hyphen server prefix does NOT match the hyphen-anchored suffix set,
    so the response passes through unredacted (no transform). Locks the "suffix
    matching assumes the hyphen server-name prefix" residual.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: list_records
      uri: null
    subject:
      sub: auth0|u1
      claims:
        groups:
          - sales
    payload:
      name: list_records
      text:
        - "Payroll SSN 123-45-6789 leaks if this matched"
  output:
    expectedResult: allow
  transformApplied: false

