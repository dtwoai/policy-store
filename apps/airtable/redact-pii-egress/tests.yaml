# Transform-only egress policy: every case expects allow. The gate-only
# transformApplied / transformedArgsContain keys assert the redaction itself.

# --- Detection classes (non-exempt caller) ---------------------------------
- description: Official list_records_for_table — serialized-JSON record with an
    email and SSN in fields values is redacted; quotes and record IDs survive.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: airtable-list_records_for_table
      uri: null
    subject:
      sub: auth0|u1
      claims:
        groups:
          - sales
    payload:
      name: airtable-list_records_for_table
      text:
        - '{"records":[{"id":"rec1","fields":{"Email":"jane.doe@example.com","SSN":"123-45-6789"}}]}'
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - '{"records":[{"id":"rec1","fields":{"Email":"[REDACTED]","SSN":"[REDACTED]"}}]}'
- description: domdomegg list_records — plain email in field content is redacted.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: airtable-list_records
      uri: null
    subject:
      sub: auth0|u1
      claims:
        groups:
          - sales
    payload:
      name: airtable-list_records
      text:
        - "Owner: bob.smith@corp.example.org"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "Owner: [REDACTED]"
- description: Official get_record_for_page — hyphenated US SSN is redacted.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: airtable-get_record_for_page
      uri: null
    subject:
      sub: auth0|u1
      claims:
        groups:
          - sales
    payload:
      name: airtable-get_record_for_page
      text:
        - "Candidate SSN: 123-45-6789 on file"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "Candidate SSN: [REDACTED] on file"
- description: domdomegg get_record — UK National Insurance number (national-ID
    class) is redacted.
