# --- Structured content blocks ----------------------------------------------
- description: MCP structured {type,text} content block — the inner text string is
    redacted and every other key is preserved.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: airtable-list_records
      uri: null
    subject:
      sub: auth0|u1
      claims:
        groups:
          - sales
    payload:
      name: airtable-list_records
      text:
        - type: text
          text: "Patient SSN 123-45-6789"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - text: "Patient SSN [REDACTED]"
        type: text
- description: Non-string, non-{type,text} object block passes through unmodified
    while the adjacent string block is redacted.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: airtable-list_records
      uri: null
    subject:
      sub: auth0|u1
      claims:
        groups:
          - sales
    payload:
      name: airtable-list_records
      text:
        - mimeType: text/csv
        - "row: 987-65-4321"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - mimeType: text/csv
      - "row: [REDACTED]"
- description: Bare-string payload.text (not an array) — the string shape is
    redacted in place rather than passing through unredacted.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: airtable-list_records
