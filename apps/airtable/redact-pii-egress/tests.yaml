          - sales
    payload:
      name: airtable-list_records
      text: "SSN 123-45-6789 email x@y.com"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text: "SSN [REDACTED] email [REDACTED]"

# --- Group exemption --------------------------------------------------------
- description: Exempt caller — groups array contains data-privileged
    (case-insensitive) — receives unredacted content, no transform.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: airtable-list_records_for_table
      uri: null
    subject:
      sub: auth0|u2
      claims:
        groups:
          - Data-Privileged
    payload:
      name: airtable-list_records_for_table
      text:
        - "SSN 123-45-6789"
  output:
    expectedResult: allow
  transformApplied: false
- description: Exempt caller — IdP emits the groups claim as a bare string —
    receives unredacted content, no transform.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: airtable-list_records
      uri: null
    subject:
