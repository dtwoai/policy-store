# --- Documented residuals: baseId-carrying tools NOT in the enumerated set ---

- description: Red-team (documented residual) — create_comment carries a baseId but is not in the enumerated set, so it passes through.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: airtable-create_comment
      uri: null
    payload:
      name: airtable-create_comment
      args:
        baseId: appUNSANCTIONED99
        tableId: tbl123
        recordId: rec1
        text: note
  output:
    expectedResult: allow

- description: Red-team (documented residual) — community delete_records is NOT fenced; relies on the freeze-destructive-ops companion.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
