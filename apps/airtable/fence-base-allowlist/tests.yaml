# Tests for airtable/fence-base-allowlist.
# Covers: discovery pass-through (ping/list_bases/search_bases/list_workspaces),
# allowlisted base allow (official + community spellings, reads + writes + schema),
# non-allowlisted base deny, fail-closed missing/misplaced baseId, case-insensitive
# tool matching, and documented residuals (delete_records, list_tables_for_base,
# get_table_schema, create_base not fenced).

# --- Discovery tools carry no baseId -> allowed ---

- description: Discovery tool list_bases carries no baseId and passes through.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: airtable-list_bases
      uri: null
    payload:
      name: airtable-list_bases
      args: {}
  output:
    expectedResult: allow

- description: Discovery tool ping passes through.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: airtable-ping
      uri: null
    payload:
      name: airtable-ping
      args: {}
  output:
    expectedResult: allow

- description: Discovery tool search_bases passes through (name contains no record stem).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: airtable-search_bases
      uri: null
    payload:
      name: airtable-search_bases
      args:
        searchTerm: crm
  output:
    expectedResult: allow

- description: Discovery tool list_workspaces passes through.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: airtable-list_workspaces
      uri: null
    payload:
      name: airtable-list_workspaces
      args: {}
  output:
    expectedResult: allow

