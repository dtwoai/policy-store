# --- Fail-closed branch: base-scoped tool with no usable baseId ---

- description: Fail closed — base-scoped tool with empty args (no baseId) is denied.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: airtable-list_records_for_table
      uri: null
    payload:
      name: airtable-list_records_for_table
      args: {}
  output:
    expectedResult: deny
    expectedReason: This Airtable tool operates on a specific base but no baseId was supplied, so it cannot be matched against the sanctioned-base allowlist. Re-issue the call naming an allowlisted base, and request base onboarding through your data-governance owner if the base you need is not yet allowlisted.

- description: Red-team — baseId supplied under a wrong key (base_id) is not seen, so it fails closed.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: airtable-update_records_for_table
      uri: null
    payload:
      name: airtable-update_records_for_table
      args:
        base_id: appEXAMPLEBASE0001
        tableId: tbl123
  output:
    expectedResult: deny
    expectedReason: This Airtable tool operates on a specific base but no baseId was supplied, so it cannot be matched against the sanctioned-base allowlist. Re-issue the call naming an allowlisted base, and request base onboarding through your data-governance owner if the base you need is not yet allowlisted.

# --- Fail closed when the payload is absent entirely (missing-args red-team) ---

- description: Fail closed — base-scoped tool with NO payload key at all resolves baseId to "" and is denied.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: airtable-list_records_for_table
      uri: null
  output:
    expectedResult: deny
    expectedReason: This Airtable tool operates on a specific base but no baseId was supplied, so it cannot be matched against the sanctioned-base allowlist. Re-issue the call naming an allowlisted base, and request base onboarding through your data-governance owner if the base you need is not yet allowlisted.

# --- Red-team (documented residual): alternate word separators are NOT matched ---
# Stems are underscore-delimited; a hyphen- or camelCase-spelled record tool falls through
# the non-base-scoped allow branch and reaches a non-allowlisted base. Not exploitable against
# the two verified (snake_case) servers; documented under Known limitations as a portability gap.

- description: Red-team (documented residual) — hyphen-delimited list-records-for-table is not matched by the underscore stems, so it passes through even on a NON-allowlisted base.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: airtable-list-records-for-table
      uri: null
    payload:
      name: airtable-list-records-for-table
      args:
        baseId: appUNSANCTIONED99
        tableId: tbl123
  output:
    expectedResult: allow

- description: Red-team (documented residual) — camelCase listRecords is not matched by the underscore stems, so it passes through even on a NON-allowlisted base.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: airtable-listRecords
      uri: null
    payload:
      name: airtable-listRecords
      args:
        baseId: appUNSANCTIONED99
        tableId: tbl123
  output:
    expectedResult: allow

