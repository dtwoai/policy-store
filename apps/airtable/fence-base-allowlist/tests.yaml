    mode: input
    resource:
      type: tool
      name: airtable-list_records_for_table
      uri: null
    payload:
      name: airtable-list_records_for_table
      args:
        baseId: appUNSANCTIONED99
        tableId: tbl123
  output:
    expectedResult: deny
    expectedReason: Airtable base appUNSANCTIONED99 is not on the sanctioned-base allowlist, so the agent may not operate on it. Request base onboarding through your data-governance owner, or contact them if you believe this base is already governed.

