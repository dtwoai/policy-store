- description: >-
    Community destructive delete_records (the biggest capability delta vs. the
    official server) ends in "e_records", NOT the allowlisted update_records /
    search_records / list_records suffixes, so it is denied by default with the
    drift reason. Locks the critical endswith non-collision.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: airtable-delete_records
      uri: null
    payload:
      name: airtable-delete_records
      args:
        baseId: appABC
        tableId: tbl123
        recordIds:
          - rec1
  output:
    expectedResult: deny
    expectedReason: "This Airtable tool is not on the audited allowlist, so the gateway denies it by default and surfaces the call as tool drift. Default-deny is mandatory for Airtable because the rashidazarang community server advertises ~42 unverified tools — including webhook-management tools that open a persistent outbound data channel surviving the MCP session — and because upstream servers add tools over time (e.g. the May-2026 upload_attachment), so a new or renamed tool must fail closed until it is reviewed. Ask a gateway admin to introspect the tool live and, if it is safe for agents, add its verified name suffix to the per-tenant allowlist."

