# Tests for airtable/default-deny-unknown-tools.
# Covers every branch of the allowlist gate:
#   - allow: official verbose names (bare + gateway-prefixed), domdomegg terse
#     names, page reads, writes, upload_attachment, case-insensitive match;
#   - deny (fail closed): community destructive delete_records (endswith
#     non-collision), display_records_for_table widget (endswith non-collision),
#     structure/exposure tools, unverified rashidazarang webhook tool,
#     missing/empty name, non-string name, non-ASCII homoglyph, newline splice,
#     whitespace padding, deliberately-excluded official page-discovery tool;
#   - documented residuals: prefix glued directly to an allowlisted suffix, and
#     the short "ping" suffix matching any un-audited name ending in "ping".

- description: Official verbose read (gateway-prefixed airtable-list_records_for_table) ends with an allowlisted suffix and is allowed.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: airtable-list_records_for_table
      uri: null
    payload:
      name: airtable-list_records_for_table
      args:
        baseId: appABC
        tableId: tbl123
  output:
    expectedResult: allow

