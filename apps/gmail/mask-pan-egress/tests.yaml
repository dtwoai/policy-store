# --- Red-team regression cases (standards §10) ---
- description: "RED-TEAM (claim-spoof): groups claim shaped as an OBJECT carrying
    the exempt value (groups={\"role\":\"pci-full-pan\"}). The is_array guard is
    load-bearing here — without it, iterating the object's *values* would match
    \"pci-full-pan\" and wrongly grant the exemption. Guard holds: not exempt, so
    the transform still applies (fail-closed)."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: gmail-mcp-get_thread
      uri: null
    subject:
      sub: google-apps|attacker@acme.com
      claims:
        groups:
          role: pci-full-pan
    payload:
      name: gmail-mcp-get_thread
      text:
        - '{"messages":[{"plaintextBody":"Card: 4111 1111 1111 1111"}]}'
  output:
    expectedResult: allow
  transformApplied: true
- description: "RED-TEAM (claim-spoof): subject and claims present but no groups
    claim at all. object.get defaults to [], is_array is satisfied but no member
    equals the exempt group, so the exemption fails closed and the transform
    applies."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: gmail-mcp-get_thread
      uri: null
    subject:
      sub: google-apps|casey@acme.com
      claims:
        scope: openid profile email
    payload:
      name: gmail-mcp-get_thread
      text:
        - '{"messages":[{"plaintextBody":"Card: 4111 1111 1111 1111"}]}'
  output:
    expectedResult: allow
  transformApplied: true
- description: "RED-TEAM (tool-scoping residual): Google/Claude connector
    list_drafts is NOT in mailbox_read_suffixes, so a card number a human typed
    into a draft body is returned to the agent UNMASKED. Documented scoping gap
    (Known limitations) — pinned here so the exclusion is intentional, not an
    accidental miss. Add list_drafts to the suffix list to close it."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: gmail-mcp-list_drafts
      uri: null
    subject:
      sub: google-apps|casey@acme.com
      claims:
        groups:
          - support
    payload:
      name: gmail-mcp-list_drafts
      text:
        - '{"drafts":[{"plaintextBody":"draft to customer: 4111 1111 1111 1111"}]}'
  output:
    expectedResult: allow
  transformApplied: false
- description: "Pattern-set pin: assert the exact redact_patterns array and
    replacement the transform emits, so a silent edit that drops or alters any of
    the three PAN patterns (the mechanism behind every documented regex-edge
    residual) is caught as a regression."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: gmail-mcp-get_thread
      uri: null
    subject:
      sub: google-apps|casey@acme.com
      claims:
        groups:
          - support
    payload:
      name: gmail-mcp-get_thread
      text:
        - '{"messages":[{"plaintextBody":"Card: 4111 1111 1111 1111"}]}'
  output:
    expectedResult: allow
  transformApplied: true
  transform:
    redact_patterns:
      - '\b\d{4}[ -]\d{4}[ -]\d{4}[ -]\d{4}\b'
      - '\b3[47]\d{2}[ -]\d{6}[ -]\d{5}\b'
      - '\b\d{13,19}\b'
    replacement: "[PAN REDACTED]"
- description: "RED-TEAM (regex-edge, documented): a 4+12 space split
    (\"4111 111111111111\") matches neither grouped pattern nor the unseparated
    run (the single space breaks the run into sub-13-digit pieces), so this PAN
    shape is NOT masked. NOTE: the isolated runner asserts that the transform
    fires (pattern emission), not the masked bytes; the evasion itself is verified
    out-of-band via OPA regex.match and recorded under Known limitations."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: gmail-mcp-get_thread
      uri: null
    subject:
      sub: google-apps|casey@acme.com
      claims:
        groups:
          - support
    payload:
      name: gmail-mcp-get_thread
      text:
        - '{"messages":[{"plaintextBody":"pay with 4111 111111111111 today"}]}'
  output:
    expectedResult: allow
  transformApplied: true
