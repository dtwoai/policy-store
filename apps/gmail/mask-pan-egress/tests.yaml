- description: Official-connector get_thread FULL_CONTENT response containing a
    grouped PAN, caller not in the exempt group. Transform applies with the
    masked-marker replacement.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: gmail-mcp-get_thread
      uri: null
    subject:
      sub: google-apps|casey@acme.com
      claims:
        groups:
          - support
    payload:
      name: gmail-mcp-get_thread
      text:
        - '{"messages":[{"plaintextBody":"Customer card: 4111 1111 1111 1111, exp 12/27"}]}'
  output:
    expectedResult: allow
  transformApplied: true
  transform:
    replacement: "[PAN REDACTED]"
