# --- Red-team cases (standards §10) ---
- description: "Red-team: whitespace-padded action ' delete ' on manage_gmail_label.
    trim_space normalizes the value before comparison so a server that strips the
    action before dispatch cannot be used to slip a delete past the policy. Deny."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: gmail-manage_gmail_label
      uri: null
    payload:
      name: gmail-manage_gmail_label
      args:
        action: " delete "
        label_id: Label_42
  output:
    expectedResult: deny
    expectedReason: "Deleting Gmail labels is blocked: removing a label silently strips it from every message that carries it and breaks retention and archiving workflows. Keep the label; create/update/list label actions remain available. Contact your InfoSec team if a label legitimately must be removed."
- description: "Red-team: newline-padded action 'delete\\n' on manage_gmail_filter.
    trim_space strips the trailing newline, so the mixed case + trailing-whitespace
    trick is defeated. Deny."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: gmail-manage_gmail_filter
      uri: null
    payload:
      name: gmail-manage_gmail_filter
      args:
        action: "Delete\n"
        filter_id: ANe1Bmj7
  output:
    expectedResult: deny
    expectedReason: "Deleting Gmail filters is blocked: filters control mail routing and their removal is silent and hard to audit. Leave the filter in place; list/get/create/update filter actions remain available. Contact your InfoSec team if a filter legitimately must be removed."
- description: "Red-team: whitespace-padded NON-delete action ' create ' must still
    pass through — trim_space normalization must not over-block legitimate
    create/update/list actions. Allow."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: gmail-manage_gmail_label
      uri: null
    payload:
      name: gmail-manage_gmail_label
      args:
        action: " create "
        name: audit-hold
  output:
    expectedResult: allow
- description: "Red-team: fail-closed on missing args — a name-only hard-delete tool
    (delete_email) with no payload/args at all is still denied on tool name alone;
    absence of arguments does not open a bypass."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: gmail-delete_email
      uri: null
  output:
    expectedResult: deny
    expectedReason: "Permanent email deletion is blocked: delete_email and batch_delete_emails bypass the trash and cannot be undone, and records must survive agent error and prompt injection. Archive by modifying labels (modify_email / batch_modify_gmail_message_labels) or move the message to trash instead. Contact your InfoSec team if a record legitimately must be destroyed."
- description: "Red-team: interior-whitespace action 'de lete' is NOT normalized and
    passes the policy — documented residual. It also fails the upstream server's
    exact-string dispatch, so no deletion occurs. Allow (documents the boundary)."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: gmail-manage_gmail_label
      uri: null
    payload:
      name: gmail-manage_gmail_label
      args:
        action: "de lete"
        label_id: Label_42
  output:
    expectedResult: allow
- description: "Red-team: camelCase batchDeleteEmails is NOT caught by the snake_case
    suffix matcher — documented portability residual (all three verified servers use
    snake_case). Add the suffix before relying on the policy against such a server.
    Allow (documents the boundary)."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: gmail-batchDeleteEmails
      uri: null
    payload:
