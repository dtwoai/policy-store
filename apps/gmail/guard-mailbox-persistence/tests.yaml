# ---------------------------------------------------------------------------
# Second red-team pass (reviewer, standards §10). No exploitable bypass found;
# these pin suffix precision (no over-block), fail-closed on encoding tricks,
# and the documented scope boundaries the description claims.
# ---------------------------------------------------------------------------
- description: "Red-team encoding trick: action padded with surrounding whitespace
    (' list ') is not the literal read value, so it must fail closed and deny — proves
    whitespace cannot smuggle a mutation past the read check (nor sneak a read through)."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: workspace-mcp-manage_gmail_filter
      uri: null
    payload:
      name: workspace-mcp-manage_gmail_filter
      args:
        user_google_email: user@example.com
        action: " list "
  output:
    expectedResult: deny
    expectedReason: "This Gmail filter management call is blocked: only the read-only actions 'list' and 'get' are allowed, because filter changes can silently auto-forward or auto-delete mail and persist after this session ends. Manage filters in the Gmail settings UI instead. If a filter change is legitimately needed, ask your InfoSec team to review this request."
- description: "Red-team: mixed-case NON-read action ('CREATE') must be denied — confirms
    case-insensitivity only ever recognizes known reads (list/get) and never opens a
    mutation path."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: workspace-mcp-manage_gmail_filter
      uri: null
    payload:
      name: workspace-mcp-manage_gmail_filter
      args:
        user_google_email: user@example.com
        action: CREATE
        criteria:
          from: ceo@example.com
  output:
    expectedResult: deny
    expectedReason: "This Gmail filter management call is blocked: only the read-only actions 'list' and 'get' are allowed, because filter changes can silently auto-forward or auto-delete mail and persist after this session ends. Manage filters in the Gmail settings UI instead. If a filter change is legitimately needed, ask your InfoSec team to review this request."
- description: "Red-team: action non-string (array) cannot be classified as a read, must
    fail closed and deny — exercises the is_string guard branch."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: workspace-mcp-manage_gmail_filter
      uri: null
    payload:
      name: workspace-mcp-manage_gmail_filter
      args:
        user_google_email: user@example.com
        action:
          - list
  output:
    expectedResult: deny
    expectedReason: "This Gmail filter management call is blocked: only the read-only actions 'list' and 'get' are allowed, because filter changes can silently auto-forward or auto-delete mail and persist after this session ends. Manage filters in the Gmail settings UI instead. If a filter change is legitimately needed, ask your InfoSec team to review this request."
- description: "Red-team suffix precision: create_label is a create_* verb but NOT a filter
    tool — it must pass through untouched (allow). Proves endswith('create_filter') does
    not over-block sibling create verbs (single-purpose boundary)."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: gmail-mcp-create_label
      uri: null
    payload:
      name: gmail-mcp-create_label
      args:
        name: Invoices
  output:
    expectedResult: allow
- description: "Red-team scope boundary: an unrelated write tool (send_email) must NOT be
    blocked by this single-purpose filter policy — allow. External send is a different
    family's job."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: gmail-mcp-send_email
      uri: null
    payload:
      name: gmail-mcp-send_email
      args:
        to:
          - recipient@example.com
        subject: hello
        body: hi
  output:
    expectedResult: allow
- description: "Red-team documented boundary: delete_filter passes through THIS policy
    (allow) — its denial is delegated to the freeze-destructive-ops companion. Pins the
    Composition/Known-limitations claim so the delegation stays intentional, not accidental."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: gmail-mcp-delete_filter
      uri: null
    payload:
      name: gmail-mcp-delete_filter
      args:
        filterId: ANe1Bmj4example
  output:
    expectedResult: allow
