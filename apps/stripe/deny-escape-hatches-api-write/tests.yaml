- description: Unrelated Stripe tool (list_customers) is out of scope. Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: stripe-mcp-list_customers
      uri: null
    payload:
      name: stripe-mcp-list_customers
      args:
        limit: 10
  output:
    expectedResult: allow
- description: Finance-group caller uses the passthrough against a non-money endpoint
    (/v1/customers). Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: stripe-mcp-stripe_api_write
      uri: null
    subject:
      sub: auth0|cfo
      claims:
        groups:
          - finance
    payload:
      name: stripe-mcp-stripe_api_write
      args:
        path: /v1/customers
        method: POST
        params:
          name: Acme Corp
  output:
    expectedResult: allow
- description: Billing-admin caller, benign endpoint (/v1/invoices). Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: stripe-mcp-stripe_api_write
      uri: null
    subject:
      sub: auth0|billing
      claims:
        groups:
          - billing-admin
    payload:
      name: stripe-mcp-stripe_api_write
      args:
        path: /v1/invoices
        method: POST
        params:
          customer: cus_123
  output:
    expectedResult: allow
- description: Caller outside finance/billing-admin uses the passthrough with a benign
    endpoint. Policy should deny with the role-gate reason.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: stripe-mcp-stripe_api_write
      uri: null
    subject:
      sub: auth0|dev
      claims:
        groups:
          - engineering
    payload:
      name: stripe-mcp-stripe_api_write
      args:
        path: /v1/customers
        method: POST
  output:
    expectedResult: deny
    expectedReason: The Stripe API-write passthrough can execute any Stripe write and is restricted to the finance and billing-admin groups. Use the dedicated named Stripe tools for routine changes, or ask your Stripe administrator for access. Contact your InfoSec team if this was a false positive.
