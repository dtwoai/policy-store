  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: stripe-mcp-create_refund
      uri: null
    payload:
      name: stripe-mcp-create_refund
      args:
        payment_intent: pi_3AbcDef
        amount: 100
  output:
    expectedResult: deny
    expectedReason: Agent-issued Stripe refunds are limited to members of the finance or billing-admin group. Ask someone in those groups to issue this refund from the Stripe dashboard. Contact your InfoSec team if you believe your access is misconfigured.
- description: Community server's inverted refund_create suffix is matched too —
    non-group caller denied.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: stripe-community-refund_create
      uri: null
    subject:
      sub: auth0|sam
      claims:
        groups:
          - support
    payload:
      name: stripe-community-refund_create
      args:
        payment_intent: pi_3AbcDef
        amount: 100
  output:
    expectedResult: deny
    expectedReason: Agent-issued Stripe refunds are limited to members of the finance or billing-admin group. Ask someone in those groups to issue this refund from the Stripe dashboard. Contact your InfoSec team if you believe your access is misconfigured.
- description: "Documented residual (red-team): the meta-tool stripe_api_write can
    issue a refund via POST /v1/refunds but is NOT a dedicated refund tool, so this
    single-purpose policy passes it through. Locks in the known-limitation escape
    hatch — pair with an API-write gate to close it."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: stripe-mcp-stripe_api_write
      uri: null
    subject:
      sub: auth0|sam
      claims:
        groups:
          - support
    payload:
      name: stripe-mcp-stripe_api_write
      args:
        method: POST
        path: /v1/refunds
        params:
          payment_intent: pi_3AbcDef
          amount: 9999999
  output:
    expectedResult: allow
- description: Out-of-group caller AND over-ceiling amount — both reasons fire and
    are joined sorted with "; ".
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: stripe-mcp-create_refund
      uri: null
    subject:
      sub: auth0|sam
      claims:
        groups:
          - support
    payload:
      name: stripe-mcp-create_refund
      args:
        payment_intent: pi_3AbcDef
        amount: 99999
  output:
    expectedResult: deny
    expectedReason: Agent-issued Stripe refunds are limited to members of the finance or billing-admin group. Ask someone in those groups to issue this refund from the Stripe dashboard. Contact your InfoSec team if you believe your access is misconfigured.; This refund has no explicit amount or exceeds the 50000-cent ($500.00) ceiling for agent-issued refunds; Stripe treats a missing amount as a full refund. Route this refund to a human in the Stripe dashboard. Contact your InfoSec team if the cap is blocking a legitimate refund.
