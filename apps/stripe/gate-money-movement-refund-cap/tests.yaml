  output:
    expectedResult: deny
    expectedReason: This refund has no explicit amount or exceeds the 50000-cent ($500.00) ceiling for agent-issued refunds; Stripe treats a missing amount as a full refund. Route this refund to a human in the Stripe dashboard. Contact your InfoSec team if the cap is blocking a legitimate refund.
- description: Refund tool call with args missing entirely — denied (default deny
    fails closed) with the cap reason.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: stripe-mcp-create_refund
      uri: null
    subject:
      sub: auth0|jane
      claims:
        groups:
          - finance
    payload:
      name: stripe-mcp-create_refund
  output:
    expectedResult: deny
    expectedReason: This refund has no explicit amount or exceeds the 50000-cent ($500.00) ceiling for agent-issued refunds; Stripe treats a missing amount as a full refund. Route this refund to a human in the Stripe dashboard. Contact your InfoSec team if the cap is blocking a legitimate refund.
- description: Caller outside the finance/billing-admin groups is denied even for a
    small in-cap refund.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: stripe-mcp-create_refund
      uri: null
    subject:
      sub: auth0|sam
      claims:
        groups:
          - support
    payload:
      name: stripe-mcp-create_refund
      args:
        payment_intent: pi_3AbcDef
        amount: 100
  output:
    expectedResult: deny
    expectedReason: Agent-issued Stripe refunds are limited to members of the finance or billing-admin group. Ask someone in those groups to issue this refund from the Stripe dashboard. Contact your InfoSec team if you believe your access is misconfigured.
- description: Caller with no subject/claims at all (unpopulated identity) fails
