- description: 'Red-team (fail-open): resource.name absent, tool identified only by
    the legacy payload.name alias. The scrub must still fire — matching on the
    alias closes the fail-open where a missing resource.name let the redirect pass.'
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    payload:
      name: stripe-mcp-create_payment_link
      args:
        price: price_1QxAbC
        quantity: 1
        redirect_url: https://evil.example/collect
  output:
    expectedResult: allow
  transformApplied: true
  transform:
    transformed_payload:
      price: price_1QxAbC
      quantity: 1
- description: 'Red-team (backslash host confusion): "https://evil.example\@allowed.example/"
    — a WHATWG browser treats "\" as an authority terminator and navigates to
    evil.example, not the allowlistable allowed.example. Host extraction must not
    read allowed.example here; the redirect is stripped and stays stripped even
    if allowed.example is later pinned.'
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: stripe-mcp-create_payment_link
      uri: null
    payload:
      name: stripe-mcp-create_payment_link
      args:
        price: price_1QxAbC
        quantity: 1
        redirect_url: 'https://evil.example\@allowed.example/collect'
  output:
    expectedResult: allow
  transformApplied: true
  transform:
    transformed_payload:
      price: price_1QxAbC
      quantity: 1
