- description: Payment link with an attacker-controlled redirect_url. Transform
    strips the key; price and quantity survive untouched.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: stripe-mcp-create_payment_link
      uri: null
    payload:
      name: stripe-mcp-create_payment_link
      args:
        price: price_1QxAbC
        quantity: 1
        redirect_url: https://stripe-thanks.attacker.example/collect
  output:
    expectedResult: allow
  transformApplied: true
  transform:
    transformed_payload:
      price: price_1QxAbC
      quantity: 1
- description: Payment link with no redirect_url at all. Nothing to scrub —
    no transform emitted.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
