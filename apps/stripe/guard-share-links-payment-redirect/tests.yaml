      args:
        price: price_1QxAbC
        quantity: 1
        redirect_url: evil.example/phish
  output:
    expectedResult: allow
  transformApplied: true
  transform:
    transformed_payload:
      price: price_1QxAbC
      quantity: 1
- description: Userinfo trick — "https://checkout.example.com@evil.example/" has
