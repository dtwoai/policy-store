      name: stripe-mcp-create_payment_link
      uri: null
    payload:
      name: stripe-mcp-create_payment_link
      args:
        price: price_1QxAbC
        quantity: 2
  output:
    expectedResult: allow
  transformApplied: false
- description: Payment link with an empty-string redirect_url. Treated as absent —
