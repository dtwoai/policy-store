- description: With the shipped EMPTY allowlist, even a plausibly-legitimate
    corporate redirect host is stripped. Pin allowed_redirect_hosts at import
    time to let your own domains through.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: stripe-mcp-create_payment_link
      uri: null
    payload:
      name: stripe-mcp-create_payment_link
      args:
        price: price_1QxAbC
        quantity: 1
        redirect_url: https://checkout.example.com/thanks
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    price: price_1QxAbC
    quantity: 1
- description: Scheme-less redirect_url ("evil.example/phish") cannot be host-parsed.
    Fails closed — stripped.
  input:
    action: tool_pre_invoke
