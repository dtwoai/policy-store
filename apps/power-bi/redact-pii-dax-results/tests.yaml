- description: ExecuteQuery (PascalCase) result with email, SSN, and a Luhn-valid
    card — non-exempt caller. All three classes redacted; PascalCase name matched
    via lowercased suffix.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: powerbi-mcp-ExecuteQuery
      uri: null
    subject:
      sub: auth0|u1
      claims:
        groups:
          - analytics
    payload:
      name: powerbi-mcp-ExecuteQuery
      text:
        - '{"results":[{"email":"jane@acme.com","ssn":"123-45-6789","card":"4111 1111 1111 1111"}]}'
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - '{"results":[{"email":"[REDACTED-EMAIL]","ssn":"[REDACTED-SSN]","card":"[REDACTED-CARD]"}]}'
