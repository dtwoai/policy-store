- description: Red-team (documented residual) — a full-model write via model_operations that carries a Roles/RLS definition is NOT caught by the named-RLS-suffix match and passes through this policy alone; PF-28 does not backstop it (model_operations is an audited tool). Mitigate by gating model_operations behind bi-governance. Documented under Known limitations.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: powerbi-modeling-model_operations
      uri: null
    subject:
      sub: auth0|analyst
      claims:
        groups:
          - analysts
    payload:
      name: powerbi-modeling-model_operations
      args:
        operation: createOrReplace
        roles:
          - name: RegionFilter
            filter: TRUE()
  output:
    expectedResult: allow

