- description: Non-RLS modeling tool passes through — this policy governs only the RLS-role surface.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: powerbi-modeling-measure_operations
      uri: null
    subject:
      sub: auth0|analyst
      claims:
        groups:
          - analysts
    payload:
      name: powerbi-modeling-measure_operations
      args:
        operation: list
  output:
    expectedResult: allow

- description: RLS-role edit (security_role_operations) by a non-governance caller — deny with reason.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: powerbi-modeling-security_role_operations
      uri: null
    subject:
      sub: auth0|analyst
      claims:
        groups:
          - analysts
    payload:
      name: powerbi-modeling-security_role_operations
      args:
        operation: update
        role: RegionFilter
        filter: TRUE()
  output:
    expectedResult: deny
    expectedReason: "Power BI row-level-security (RLS) role definitions are frozen on the agent path — an RLS filter expression controls who sees which rows, so changing it is a governance action, not a data change. This tool is blocked for every operation (including read-only role listings) because its operation argument cannot be trusted to distinguish a read from a filter rewrite. Request RLS role changes through your data-governance workflow. If your role requires editing RLS through the gateway, ask your data-governance team to add you to the 'bi-governance' IdP group, or contact your InfoSec team if this looks like a false positive."

- description: Same RLS-role edit by a bi-governance member — allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: powerbi-modeling-security_role_operations
      uri: null
    subject:
      sub: auth0|steward
      claims:
        groups:
          - bi-governance
    payload:
      name: powerbi-modeling-security_role_operations
      args:
        operation: update
        role: RegionFilter
        filter: TRUE()
  output:
    expectedResult: allow

- description: Read-only role listing through the multiplexer is still blocked for a non-governance caller (whole-tool deny).
  input:
