# --- Red-team: parenthesis-wrapped bare table (fixed bypass) -----------------
- description: Paren-wrapped quoted table EVALUATE ('Customers') is still a full dump. Policy should deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: powerbi-mcp-ExecuteQuery
      uri: null
    payload:
      name: powerbi-mcp-ExecuteQuery
      args:
        expression: "EVALUATE ('Customers')"
  output:
    expectedResult: deny

- description: Paren-wrapped quoted table with no space EVALUATE('Customers'). Policy should deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: powerbi-mcp-ExecuteQuery
      uri: null
    payload:
      name: powerbi-mcp-ExecuteQuery
      args:
        dax_query: "EVALUATE('Sales')"
  output:
    expectedResult: deny

- description: Paren-wrapped unquoted table EVALUATE ( Customers ). Policy should deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: powerbi-mcp-ExecuteQuery
      uri: null
    payload:
      name: powerbi-mcp-ExecuteQuery
      args:
        expression: "EVALUATE ( Customers )"
  output:
    expectedResult: deny

- description: Paren-wrapped FILTER is genuinely bounded and must remain allowed (fix must not over-block). Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: powerbi-mcp-ExecuteQuery
      uri: null
    payload:
      name: powerbi-mcp-ExecuteQuery
      args:
        expression: "EVALUATE (FILTER('Customers', 'Customers'[Region] = \"EMEA\"))"
  output:
    expectedResult: allow

# --- Red-team: documented residual evasions (allowed by design) --------------
- description: Comment between EVALUATE and a quoted table defeats the pattern — documented false negative. Policy allows.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: powerbi-mcp-ExecuteQuery
      uri: null
    payload:
      name: powerbi-mcp-ExecuteQuery
      args:
        expression: "EVALUATE /* dump */ 'Customers'"
  output:
    expectedResult: allow

- description: Double-parenthesised table EVALUATE (('Customers')) — documented nesting residual. Policy allows.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: powerbi-mcp-ExecuteQuery
      uri: null
    payload:
      name: powerbi-mcp-ExecuteQuery
      args:
        expression: "EVALUATE (('Customers'))"
  output:
    expectedResult: allow
