- description: Service-principal (idtyp=app) runs ExecuteQuery — RLS not enforced, deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: powerbi-mcp-ExecuteQuery
      uri: null
    subject:
      claims:
        idtyp: app
        oid: 22222222-2222-2222-2222-222222222222
        appid: 33333333-3333-3333-3333-333333333333
    payload:
      name: powerbi-mcp-ExecuteQuery
      args:
        query: EVALUATE 'Customers'
  output:
    expectedResult: deny
    expectedReason: Power BI does not enforce row-level security (RLS) under service-principal authentication, so this read/query would return every RLS role's data. Run Power BI query tools (ExecuteQuery, ValueSearch, execute_dax, dax_query_operations) under an interactive Entra user identity instead of an app/service-principal token. Ask your data-governance team for an exception if this service principal is intentionally scoped.
