- description: RED-TEAM (blocklist residual, documented). createCalendarEvent is a
    real write tool on the piotr-agier google-drive-mcp server but is not on the
    Drive write-suffix list, so this policy does NOT gate it — it passes through even
    with no drive-writers membership. Documents the residual; pair with PF-28
    default-deny-unknown-tools to close it.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    subject:
      sub: google-apps|bob@acme.com
      claims:
        groups:
          - eng
    resource:
      type: tool
      name: gdrive-mcp-createCalendarEvent
      uri: null
    payload:
      name: gdrive-mcp-createCalendarEvent
      args:
        summary: staged event
  output:
    expectedResult: allow
- description: RED-TEAM (renamed/unknown write, documented). A future or renamed
