      args:
        presentationId: 1AbC
  output:
    expectedResult: allow
- description: RED-TEAM (fail-open on classification, documented). A tool call with
    NEITHER resource.name NOR payload.name cannot be classified as a write and is
    allowed. Not reachable by a normal caller (the gateway sets both fields);
    documents the edge and locks the behavior.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    subject:
      sub: google-apps|bob@acme.com
      claims: {}
    payload:
      args: {}
  output:
    expectedResult: allow
- description: RED-TEAM (payload.name fallback, FIXED). resource.name is absent but
    the legacy alias payload.name carries a write tool (create_file) and the caller
    is not in drive-writers. The classifier now reads both fields, so the write is
    caught and denied — closes the resource.name-only fail-open.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    subject:
      sub: google-apps|bob@acme.com
      claims:
        groups:
          - eng
    payload:
      name: gdrive-mcp-create_file
      args:
        name: notes.txt
  output:
    expectedResult: deny
    expectedReason: Google Drive write tools are restricted to members of the 'drive-writers' group. Ask a user who is in that group to make this change for you, or request 'drive-writers' membership from your identity administrator. If this tool call was wrongly classified as a write, ask your InfoSec team to review this policy's suffix list.
- description: RED-TEAM (claim-shape spoof surface, documented). The groups claim is
    a single string "drive-writers" (not an array), as some IdPs emit it. Iterating
    a string yields no members, so membership fails and the write is denied
    (fail closed). Locks the documented array-of-strings requirement.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    subject:
      sub: google-apps|bob@acme.com
      claims:
        groups: drive-writers
    resource:
      type: tool
      name: gdrive-mcp-create_file
      uri: null
    payload:
      name: gdrive-mcp-create_file
      args:
        name: notes.txt
  output:
    expectedResult: deny
    expectedReason: Google Drive write tools are restricted to members of the 'drive-writers' group. Ask a user who is in that group to make this change for you, or request 'drive-writers' membership from your identity administrator. If this tool call was wrongly classified as a write, ask your InfoSec team to review this policy's suffix list.
- description: RED-TEAM (namespaced group claim, documented). The caller's groups
    live under a namespaced key (https://acme.com/groups) instead of "groups", so
    the plain "groups" lookup resolves empty and the write is denied (fail closed).
    Documents claim-key portability.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    subject:
      sub: google-apps|bob@acme.com
      claims:
        https://acme.com/groups:
          - drive-writers
    resource:
      type: tool
      name: gdrive-mcp-create_file
      uri: null
    payload:
      name: gdrive-mcp-create_file
      args:
        name: notes.txt
  output:
    expectedResult: deny
    expectedReason: Google Drive write tools are restricted to members of the 'drive-writers' group. Ask a user who is in that group to make this change for you, or request 'drive-writers' membership from your identity administrator. If this tool call was wrongly classified as a write, ask your InfoSec team to review this policy's suffix list.
- description: RED-TEAM (object-map claim-shape spoof, FIXED). The groups claim is
    an object map whose VALUE equals drive-writers ({"role":"drive-writers"}), a
    shape the Known-limitations block promises is denied fail-closed. Rego's
    `some x in obj` iterates object VALUES, so before the is_array guard this
    granted the write (value collision). The is_array check now rejects the
    non-array shape and the write is denied. Locks the fix and keeps the
    description accurate.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    subject:
      sub: google-apps|bob@acme.com
      claims:
        groups:
          role: drive-writers
    resource:
      type: tool
      name: gdrive-mcp-create_file
      uri: null
    payload:
      name: gdrive-mcp-create_file
      args:
        name: notes.txt
  output:
    expectedResult: deny
    expectedReason: Google Drive write tools are restricted to members of the 'drive-writers' group. Ask a user who is in that group to make this change for you, or request 'drive-writers' membership from your identity administrator. If this tool call was wrongly classified as a write, ask your InfoSec team to review this policy's suffix list.
- description: RED-TEAM (unverified connector write suffix, documented). The
