    unverified; if the connector ships its create tool under a divergent suffix
    (hypothetical `save_document` here, NOT a confirmed name) it is not on
    write_suffixes and passes through ungated for a caller with no group. Locks the
    documented connector/blocklist residual.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    subject:
      sub: google-apps|bob@acme.com
      claims:
        groups:
          - eng
    resource:
      type: tool
      name: mcp__claude_ai_Google_Drive__save_document
      uri: null
    payload:
      name: mcp__claude_ai_Google_Drive__save_document
      args:
        name: notes.txt
  output:
    expectedResult: allow
