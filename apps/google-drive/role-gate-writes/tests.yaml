- description: Read-class tool (Google official search_files) with no identity at
    all. Reads pass through freely — allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: gdrive-mcp-search_files
      uri: null
    payload:
      name: gdrive-mcp-search_files
      args:
        query: quarterly report
  output:
    expectedResult: allow
- description: Read-class tool (piotr-agier downloadFile) with no groups claim.
