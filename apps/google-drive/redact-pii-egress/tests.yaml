# Transform-only egress policy: every case expects allow. The gate-only
# transformApplied / transformedArgsContain keys assert the redaction itself.
- description: Google official read_file_content — SSN and email in file content
    are redacted for a non-exempt caller.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: gdrive-read_file_content
      uri: null
    subject:
      sub: auth0|u1
      claims:
        groups:
          - engineering
    payload:
      name: gdrive-read_file_content
      text:
        - "Payroll: SSN 123-45-6789, contact jane.doe@example.com"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "Payroll: SSN [REDACTED-SSN], contact [REDACTED-EMAIL]"
- description: Google official download_file_content — parenthesized US phone
    number is redacted.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
