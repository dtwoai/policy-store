- description: Red-team — payload.text is a bare string (not an array). Fix
    verification, standards section 10 fail-open probe. The bare-string shape is
    redacted in place rather than passing through unredacted.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: gdrive-read_file_content
      uri: null
    subject:
      sub: auth0|u1
      claims:
        groups:
          - engineering
    payload:
      name: gdrive-read_file_content
      text: "SSN 123-45-6789 email x@y.com"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text: "SSN [REDACTED-SSN] email [REDACTED-EMAIL]"
- description: Red-team — bare-string payload.text for an exempt caller is left
    unredacted (exemption still honored on the bare-string branch).
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: gdrive-read_file_content
      uri: null
    subject:
      sub: auth0|u2
      claims:
        groups:
          - privacy-reviewers
    payload:
      name: gdrive-read_file_content
      text: "SSN 123-45-6789"
  output:
    expectedResult: allow
  transformApplied: false
- description: Red-team — documented residual (standards section 10). PII inside
    an MCP TextContent object block {type,text} is NOT scanned; the object is a
    non-string block and passes through untouched, so no transform is emitted.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: gdrive-read_file_content
      uri: null
    subject:
      sub: auth0|u1
      claims:
        groups:
          - engineering
    payload:
      name: gdrive-read_file_content
      text:
        - type: text
          text: "Payroll SSN 123-45-6789"
  output:
    expectedResult: allow
  transformApplied: false
- description: Red-team — documented residual (standards section 10, "split
    strings"). An SSN split across two adjacent content blocks matches in
    neither block on its own, so no per-block regex fires and the value leaks
    through unredacted (no transform). Locks the documented split-across-blocks
    residual.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: gdrive-read_file_content
      uri: null
    subject:
      sub: auth0|u1
      claims:
        groups:
          - engineering
    payload:
      name: gdrive-read_file_content
      text:
        - "SSN 123-45-"
        - "6789 (continued)"
  output:
    expectedResult: allow
  transformApplied: false
- description: Red-team — documented residual (standards section 10,
    "encoding/obfuscation"). Fullwidth-digit SSN (Unicode U+FF10..U+FF19) is not
    matched by the ASCII \d SSN pattern, so it passes through unredacted (no
    transform). Locks the documented obfuscation residual.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: gdrive-read_file_content
      uri: null
    subject:
      sub: auth0|u1
      claims:
        groups:
          - engineering
    payload:
      name: gdrive-read_file_content
      text:
        - "SSN １２３-４５-６７８９ on file"
  output:
    expectedResult: allow
  transformApplied: false
- description: Red-team — documented residual (standards section 10, regex
    edges). A non-hyphenated (space-separated) SSN is deliberately not matched —
    the SSN pattern is the canonical hyphenated form only — so it passes through
    unredacted (no transform). Locks the "hyphenated form only" claim.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: gdrive-read_file_content
      uri: null
    subject:
      sub: auth0|u1
      claims:
        groups:
          - engineering
    payload:
      name: gdrive-read_file_content
      text:
        - "SSN 123 45 6789 on file"
  output:
    expectedResult: allow
  transformApplied: false
- description: Red-team — regex edge (standards section 10, "newlines"). Two
    hyphenated SSNs on separate lines within a single content block are both
    redacted — newlines do not break matching (the patterns use \b, not .),
    confirming multi-line blocks are fully scanned.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: gdrive-read_file_content
      uri: null
    subject:
      sub: auth0|u1
      claims:
        groups:
          - engineering
    payload:
      name: gdrive-read_file_content
      text:
        - "Line1 123-45-6789\nLine2 987-65-4321"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "Line1 [REDACTED-SSN]\nLine2 [REDACTED-SSN]"
- description: Red-team fix — parenthesized area code with no separator after the
    ")" ((206)555-0100) is a common US phone format the description claims to
    cover; it is now redacted. Locks the phone-regex fix for the paren-no-space
    shape.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: gdrive-read_file_content
      uri: null
    subject:
      sub: auth0|u1
      claims:
        groups:
          - engineering
    payload:
      name: gdrive-read_file_content
      text:
        - "Call the office at (206)555-0100 today"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "Call the office at [REDACTED-PHONE] today"
- description: Red-team — documented residual (standards section 10, regex edges).
    A bare 10-digit run (2065550100) is deliberately NOT matched by the phone
    pattern — it collides with file IDs and other identifiers — so it passes
    through unredacted (no transform). Locks the "bare 10-digit runs are not
    matched" invariant after the paren-no-space fix.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: gdrive-read_file_content
      uri: null
    subject:
      sub: auth0|u1
      claims:
        groups:
          - engineering
    payload:
      name: gdrive-read_file_content
      text:
        - "ref 2065550100 on file"
  output:
    expectedResult: allow
  transformApplied: false
- description: Red-team — documented residual (standards section 10, alternate
    tool names). A bare, unprefixed tool name with no leading-hyphen server
    prefix (read_file_content) does NOT match the hyphen-anchored suffix set, so
    the response passes through unredacted (no transform). Locks the documented
    "suffix matching assumes the hyphen server-name prefix" residual.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: read_file_content
      uri: null
    subject:
      sub: auth0|u1
      claims:
        groups:
          - engineering
    payload:
      name: read_file_content
      text:
        - "Payroll SSN 123-45-6789 leaks if this matched"
  output:
    expectedResult: allow
  transformApplied: false
- description: Ingress hook for the same tool name (mode input) — this egress
    policy does not fire; no transform.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: gdrive-read_file_content
      uri: null
    subject:
      sub: auth0|u1
      claims:
        groups:
          - engineering
    payload:
      name: gdrive-read_file_content
      args:
        file_id: 1AbCdEf
  output:
    expectedResult: allow
  transformApplied: false
