    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: gdrive-mcp-search_files
      uri: null
    payload:
      name: gdrive-mcp-search_files
      args:
        query: quarterly roadmap
  output:
    expectedResult: allow

- description: Fenced read tool addressing a file that is not on the restricted list. Policy should allow.
