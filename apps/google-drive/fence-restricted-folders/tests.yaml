      name: gdrive-mcp-read_file_content
      uri: null
    payload:
      name: gdrive-mcp-read_file_content
      args:
        fileId: 1a2B3c4D5e6F7g8H9i0J
  output:
    expectedResult: allow

- description: Content read of a restricted file via `fileId` (official-server suffix). Policy should deny with the read-fence reason.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
