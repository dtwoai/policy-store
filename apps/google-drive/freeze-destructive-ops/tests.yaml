          - engineering
    payload:
      name: google-drive-mcp-deleteItemPermanently
      args:
        itemId: 1AbCdEfGhIjKlMnOp
  output:
    expectedResult: allow
- description: "RED-TEAM (documented under-match, whitespace/newline padding): a tool
    name with a trailing newline does NOT end in the deleteitem token, so endswith
    misses it. MCP dispatches by exact registered name, so a padded name never
    resolves to the real delete tool at the server — not a live bypass. Pins the
    §10 newline edge."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: "google-drive-mcp-deleteItem\n"
      uri: null
    subject:
      sub: google-apps|analyst@example.com
      claims:
        groups:
          - engineering
    payload:
      name: "google-drive-mcp-deleteItem\n"
      args:
        itemId: 1AbCdEfGhIjKlMnOp
  output:
    expectedResult: allow
