- description: "RED-TEAM (documented under-match, trailing qualifier): a hard-delete
    named deleteItemPermanently does NOT end in the deleteitem token (endswith is
    exact), so suffix matching misses it and it passes through. No current Drive
    server exposes this name; pins the documented residual so a future server name
    change is caught by the suite."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: google-drive-mcp-deleteItemPermanently
      uri: null
    subject:
