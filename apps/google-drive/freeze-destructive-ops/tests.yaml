- description: "RED-TEAM (claim-spoofing, fail-open closed): groups claim shaped as
    an object/map whose value is drive-admins. `some group in groups` would iterate
    object VALUES and match, granting the exemption — the is_array guard forces this
    to fail closed. Policy should deny."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: google-drive-mcp-deleteItem
      uri: null
    subject:
      sub: google-apps|analyst@example.com
      claims:
        groups:
          role: drive-admins
    payload:
      name: google-drive-mcp-deleteItem
      args:
        itemId: 1AbCdEfGhIjKlMnOp
  output:
    expectedResult: deny
    expectedReason: Deleting Google Drive content from an agent is blocked. Ask a human collaborator to perform the deletion in the Drive UI instead. If this is a false positive, ask your gateway administrator to add you to the drive-admins IdP group or contact your InfoSec team.
- description: "RED-TEAM (claim-spoofing, fail-open closed): groups claim is an
