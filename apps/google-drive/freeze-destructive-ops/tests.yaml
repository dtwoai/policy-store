- description: "RED-TEAM (claim-spoofing, array-with-object element): groups is a
    proper array but one element is an object {\"x\":\"drive-admins\"} and the other
    a benign string. Element-wise `group == \"drive-admins\"` never matches (object
    != string; benign string != admin), so the exemption fails closed. Complements
    the object-map case by exercising is_array-true with a non-string element."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: google-drive-mcp-deleteItem
      uri: null
    subject:
      sub: google-apps|analyst@example.com
      claims:
        groups:
          - x: drive-admins
          - engineering
    payload:
