- description: Egress hook (tool_post_invoke) on gdrive_search — the action
    guard keeps the ingress clamp off the output path.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: gdrive-mcp-gdrive_search
      uri: null
    payload:
      name: gdrive-mcp-gdrive_search
      text:
        - '{"files": []}'
  output:
    expectedResult: allow
  transformApplied: false
- description: Red-team — pageSize 0 is NOT clamped (clamp only fires above the
    cap). Known servers reject 0, but a lenient server reading 0 as "unbounded"
    would pass uncapped (documented non-positive residual).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: gdrive-mcp-gdrive_search
      uri: null
    payload:
      name: gdrive-mcp-gdrive_search
      args:
        query: "fullText contains 'salary'"
        pageSize: 0
  output:
    expectedResult: allow
  transformApplied: false
- description: Red-team — pageSize -1 is NOT clamped (-1 > 25 is false). A server
    reading -1 as "return everything" would bypass the cap (documented
    non-positive residual).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: gdrive-mcp-gdrive_search
      uri: null
    payload:
      name: gdrive-mcp-gdrive_search
      args:
        query: "fullText contains 'ssn'"
        pageSize: -1
  output:
    expectedResult: allow
  transformApplied: false
- description: Red-team — scientific-notation numeric string "1e3" IS parsed by
    to_number (=1000) and clamped to 25; locks the parser reach so the residual
    docs are not read as "all non-plain literals pass".
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: gdrive-mcp-gdrive_search
      uri: null
    payload:
      name: gdrive-mcp-gdrive_search
      args:
        query: "fullText contains 'passport'"
        pageSize: "1e3"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    pageSize: 25
    query: "fullText contains 'passport'"
