- description: Red-team — whitespace-padded numeric string " 100" is trimmed
    before parsing and clamped to 25 (a lenient server would coerce " 100" to
    100, so the clamp must catch it).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: gdrive-mcp-gdrive_search
      uri: null
    payload:
      name: gdrive-mcp-gdrive_search
      args:
        query: "fullText contains 'salary'"
        pageSize: " 100"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    pageSize: 25
    query: "fullText contains 'salary'"
- description: Red-team — case-variant key "PageSize" (capital P) is NOT clamped;
    key matching is case-sensitive (documented residual — all known Drive servers
    use lowercase pageSize).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: gdrive-mcp-gdrive_search
      uri: null
    payload:
      name: gdrive-mcp-gdrive_search
      args:
        query: "fullText contains 'ssn'"
        PageSize: 100
  output:
    expectedResult: allow
  transformApplied: false
- description: Red-team — locale-formatted numeric string "1,000" cannot be
    parsed by to_number, so it is skipped and passes uncapped (documented
    server-coercion residual).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: gdrive-mcp-gdrive_search
      uri: null
    payload:
      name: gdrive-mcp-gdrive_search
      args:
        query: "fullText contains 'passport'"
        pageSize: "1,000"
  output:
    expectedResult: allow
  transformApplied: false
