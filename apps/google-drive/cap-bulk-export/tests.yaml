- description: gdrive_search (isaacphi) with pageSize 100 — over the cap, clamped
    to 25; query and pageToken preserved.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: gdrive-mcp-gdrive_search
      uri: null
    payload:
      name: gdrive-mcp-gdrive_search
      args:
        query: "fullText contains 'salary'"
        pageSize: 100
        pageToken: tok-123
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    pageSize: 25
    query: "fullText contains 'salary'"
    pageToken: tok-123
- description: gdrive_search with no page-size argument — passes through untouched;
