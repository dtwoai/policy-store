    companion, not this ingress policy.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: google-drive-mcp-get_file_metadata
      uri: null
    subject:
      sub: google-apps|dev@example.com
      claims:
        groups:
          - engineering
    payload:
      name: google-drive-mcp-get_file_metadata
      args:
        fileId: 1AbCdEfGhIjKlMnOp
  output:
    expectedResult: allow
