      name: google-drive-mcp-get_file_permissions
      args:
        fileId: 1AbCdEfGhIjKlMnOp
  output:
    expectedResult: allow
- description: get_file_permissions by a caller outside the infosec group. Policy
    should deny with the escalation reason.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: google-drive-mcp-get_file_permissions
      uri: null
    subject:
      sub: google-apps|dev@example.com
      claims:
        groups:
          - engineering
    payload:
      name: google-drive-mcp-get_file_permissions
      args:
        fileId: 1AbCdEfGhIjKlMnOp
  output:
    expectedResult: deny
    expectedReason: "Reading Drive file permissions is restricted: the response enumerates collaborator email addresses and which files are shared externally. Sharing-state review is an admin task — ask your Drive administrator to review the file's sharing settings, or ask your InfoSec team to add you to the infosec group if your role requires ACL access."
- description: get_file_permissions with no subject at all (no IdP configured).
