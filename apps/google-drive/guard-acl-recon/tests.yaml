- description: Red-team (F1, documented residual) — list_recent_files does not end
    in `permissions`, so it is allowed. Like search_files/get_file_metadata it
    backs onto Drive files.list and can project owners/sharingUser/shared/
    permissions fields, so it carries the same ACL-recon residual. Documented,
    not fixed — close it with an egress field-stripping companion, not this
    ingress policy.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: google-drive-mcp-list_recent_files
      uri: null
    subject:
      sub: google-apps|dev@example.com
      claims:
        groups:
          - engineering
    payload:
      name: google-drive-mcp-list_recent_files
      args:
        fields: "files(owners,sharingUser,shared,permissions)"
  output:
    expectedResult: allow
