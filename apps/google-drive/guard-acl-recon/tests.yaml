- description: Unrelated Drive tool (search_files) — not an ACL read. Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: google-drive-mcp-search_files
      uri: null
    subject:
      sub: google-apps|dev@example.com
      claims:
        groups:
          - engineering
    payload:
      name: google-drive-mcp-search_files
      args:
        query: "fullText contains 'roadmap'"
  output:
    expectedResult: allow
- description: get_file_permissions by an infosec-group member. Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: google-drive-mcp-get_file_permissions
      uri: null
    subject:
      sub: google-apps|sec@example.com
      claims:
        groups:
          - engineering
          - infosec
    payload:
      name: google-drive-mcp-get_file_permissions
      args:
        fileId: 1AbCdEfGhIjKlMnOp
  output:
    expectedResult: allow
- description: get_file_permissions with a mixed-case group value (InfoSec) — group
    matching is case-insensitive. Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: google-drive-mcp-get_file_permissions
      uri: null
    subject:
      sub: google-apps|sec@example.com
      claims:
        groups:
          - InfoSec
