# ---------------------------------------------------------------------------
# Positive cases — one per pinned tool group, plus case-insensitivity and a
# short-suffix (`-get-view`) that must not be shadowed by `-get-view-data`.
# ---------------------------------------------------------------------------
- description: Pinned data-read tool (query-datasource), server-prefixed. Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: tableau-mcp-query-datasource
      uri: null
    payload:
      name: tableau-mcp-query-datasource
      args:
        datasourceLuid: abc-123
        query:
          fields: []
  output:
    expectedResult: allow

- description: Pinned catalog-read tool (list-workbooks). Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: tableau-mcp-list-workbooks
      uri: null
    payload:
      name: tableau-mcp-list-workbooks
      args: {}
  output:
    expectedResult: allow

- description: Pinned Pulse read (generate-pulse-insight-brief). Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: tableau-mcp-generate-pulse-insight-brief
      uri: null
    payload:
      name: tableau-mcp-generate-pulse-insight-brief
      args:
        metricId: m-1
  output:
    expectedResult: allow

- description: Pinned admin-insights read (query-admin-insights-ts-events). Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
