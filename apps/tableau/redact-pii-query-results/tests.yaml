# --- Fail-closed: groups array holds only a non-string element (no eval error)
- description: >
    Red-team — the groups claim is an array whose only element is a number, not a
    string. lower() on the non-string element yields an undefined binding rather
    than a hard evaluation error, so is_exempt stays false, the transform is still
    defined, and redaction applies (fail-closed — no fail-open leak).
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
