# --- Multi-row CSV in one block: embedded newlines don't defeat per-row matching
- description: >
    Red-team — a multi-row CSV delivered as one string block with embedded
    newlines. \b-anchored patterns match per line, so PII on every row (email on
    row 2, SSN on row 3, Luhn-valid PAN on row 4) is redacted/masked; newlines do
    not shield later rows.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: tableau-get-view-data
      uri: null
    subject:
      sub: auth0|u1
      claims:
        groups:
          - support
    payload:
      name: tableau-get-view-data
      text:
        - "name,detail\njohn,john@a.com\njane,540-12-3456\nacct,4111111111111111"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
