# Transform-only policy: every case expects allow. The assertions that matter
# are transformApplied / transformedArgsContain (gate-only keys). Each feeds ONLY
# the object under `input` to OPA as the input document.

# --- query-datasource: email redacted (non-analyst caller)
- description: >
    query-datasource returns a VDS row with an email. In scope, caller not in
    data-analysts -> email redacted.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: tableau-query-datasource
      uri: null
    subject:
      sub: auth0|u1
      claims:
        groups:
          - support
    payload:
      name: tableau-query-datasource
      text:
        - "cust 42 | contact jane.doe@acme.com booked"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "cust 42 | contact [REDACTED-EMAIL] booked"

# --- get-view-data: separator-formatted US phone redacted
- description: >
    get-view-data CSV contains a separator-formatted US phone number. Redacted.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: tableau-get-view-data
      uri: null
    subject:
