      claims:
        groups:
          - support
    payload:
      name: tableau-get-view-data
      text:
        - "Call the lead at (206) 555-0100 tomorrow"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "Call the lead at [REDACTED-PHONE] tomorrow"

