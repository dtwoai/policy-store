# --- Denies: calculation present, non-analyst caller -------------------------
- description: Calculation directly in fields[], non-analyst caller. Policy should deny with the calculation reason.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: tableau-mcp-query-datasource
      uri: null
    subject:
      sub: "google-apps|mkt@dtwo.ai"
      claims:
        groups:
          - marketing
    payload:
      name: tableau-mcp-query-datasource
      args:
        datasourceLuid: abc-123
        query:
          fields:
            - fieldCaption: Region
            - calculation: "SUM([Salary]) / SUM([Headcount])"
              fieldAlias: avg_salary
  output:
    expectedResult: deny
    expectedReason: "This Tableau VizQL Data Service query includes a calculation field, which accepts an arbitrary Tableau calc expression that can reference any column in the datasource and bypasses column-level (fieldCaption) allowlisting. Arbitrary calculations are restricted to the data-analysts group on the agent MCP path. Re-issue the query using only fieldCaption fields and standard filters, or ask a member of the data-analysts group to run it. If you need calculation access, contact your data platform team."

- description: Calculation nested under a filter's field sub-object, non-analyst caller. Policy should deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: tableau-mcp-query-datasource
      uri: null
    subject:
      sub: "google-apps|mkt@dtwo.ai"
      claims:
        groups:
          - marketing
    payload:
      name: tableau-mcp-query-datasource
      args:
        datasourceLuid: abc-123
        query:
          fields:
            - fieldCaption: Region
          filters:
            - field:
                calculation: "IF [Salary] > 200000 THEN 1 ELSE 0 END"
              filterType: QUANTITATIVE
              min: 1
  output:
    expectedResult: deny
    expectedReason: "This Tableau VizQL Data Service query includes a calculation field, which accepts an arbitrary Tableau calc expression that can reference any column in the datasource and bypasses column-level (fieldCaption) allowlisting. Arbitrary calculations are restricted to the data-analysts group on the agent MCP path. Re-issue the query using only fieldCaption fields and standard filters, or ask a member of the data-analysts group to run it. If you need calculation access, contact your data platform team."

- description: Calculation directly on a filters[] entry (not nested), non-analyst caller. Policy should deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: tableau-mcp-query-datasource
      uri: null
    subject:
      sub: "google-apps|mkt@dtwo.ai"
      claims:
        groups:
          - marketing
    payload:
      name: tableau-mcp-query-datasource
      args:
        datasourceLuid: abc-123
        query:
          filters:
            - calculation: "[Salary] > 200000"
              filterType: QUANTITATIVE
  output:
    expectedResult: deny

