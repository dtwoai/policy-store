# Tests for tableau/guard-query-calculation (PF-07, ingress).
# Covers every rule branch: non-guarded tool passthrough, analyst exemption,
# calculation-free query pass, fail-safe on missing/empty query, and the
# calculation deny for non-analysts (fields[] direct, filters[] nested,
# filters[] direct) — plus red-team cases (no claims at all fails closed,
# non-object array element, calculation confined but analyst still exempt).
#
# Red-team gate (standards §10) additions:
#   - TOP-N filter `fieldToMeasure` calc (non-analyst) MUST deny — this position
#     was a confirmed bypass before the recursive-walk fix (VDS topNFilterSchema:
#     fieldToMeasure is a FilterField union that admits {calculation}).
#   - Same fieldToMeasure calc by a data-analysts caller MUST still allow.
#   - Bare tool name `query-datasource` (no gateway prefix) is ALLOWED —
#     documents the suffix-match portability fail-open (see Known limitations).
#   - Stringified `query` (JSON passed as a string, not an object) is ALLOWED —
#     walk sees an opaque scalar, so the guard does not fire; documents the
#     structured-query fail-open backstopped by the server's VDS object schema.
#   - Mis-cased `Calculation` key (casing/lookalike-key trick) is ALLOWED — JSON
#     keys are case-sensitive so walk misses it; documents the case-sensitive-key
#     fail-open (server VDS schema rejects the mis-cased field as the backstop).
#   - `groups` sent as a bare string (claim-spoof) with a calc MUST deny — the
#     is_array guard makes a non-array groups claim fail closed (not exempt).
#   - A column literally NAMED "calculation" (a fieldCaption VALUE, not a
#     `calculation:` key) is ALLOWED — walk keys on the structural key name.

# --- Passthrough: non-guarded Tableau tool -----------------------------------
- description: list-datasources is not the VDS query tool. Policy should allow regardless of args.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: tableau-mcp-list-datasources
      uri: null
    payload:
      name: tableau-mcp-list-datasources
      args: {}
  output:
    expectedResult: allow

- description: get-view-data is not the VDS query tool even though it returns row data. Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: tableau-mcp-get-view-data
      uri: null
    payload:
      name: tableau-mcp-get-view-data
      args:
        viewId: v-987
  output:
    expectedResult: allow

# --- Calculation-free query passes for a non-analyst -------------------------
- description: fieldCaption-only fields and a standard SET filter, non-analyst caller. No calculation. Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: tableau-mcp-query-datasource
      uri: null
    subject:
      sub: "google-apps|mkt@dtwo.ai"
      claims:
        groups:
          - marketing
    payload:
      name: tableau-mcp-query-datasource
      args:
        datasourceLuid: abc-123
        query:
          fields:
            - fieldCaption: Region
            - fieldCaption: Sales
          filters:
            - field:
                fieldCaption: Region
              filterType: SET
              values:
                - West
  output:
    expectedResult: allow

