# --- Red-team: mis-cased calculation key (casing/lookalike trick) fails open ---
- description: >-
    Mis-cased calculation key `Calculation` (capital C), non-analyst. JSON keys
    are case-sensitive, so walk does not match the lowercase `calculation` key and
    the guard does not fire — documents the casing/lookalike-key fail-open. The
    official VDS schema only recognizes lowercase `calculation`, so the server
    rejects the mis-cased field before it executes (backstop, not a data leak).
    Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: tableau-mcp-query-datasource
      uri: null
    subject:
      sub: "google-apps|mkt@dtwo.ai"
      claims:
        groups:
          - marketing
    payload:
      name: tableau-mcp-query-datasource
      args:
        datasourceLuid: abc-123
        query:
          fields:
            - Calculation: "SUM([Salary])"
              fieldAlias: avg_salary
  output:
    expectedResult: allow

# --- Red-team: claim-spoof — groups sent as a bare string fails closed --------
- description: >-
    Claim-spoofing attempt: `groups` sent as a bare string "data-analysts" instead
    of an array, carrying a calculation, non-analyst path. The is_array guard
    yields no memberships, so is_analyst fails closed and the caller is NOT exempt.
    Policy should deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: tableau-mcp-query-datasource
      uri: null
    subject:
      sub: "google-apps|mkt@dtwo.ai"
      claims:
        groups: data-analysts
    payload:
      name: tableau-mcp-query-datasource
      args:
        datasourceLuid: abc-123
        query:
          fields:
            - calculation: "SUM([Salary])"
  output:
    expectedResult: deny
    expectedReason: "This Tableau VizQL Data Service query includes a calculation field, which accepts an arbitrary Tableau calc expression that can reference any column in the datasource and bypasses column-level (fieldCaption) allowlisting. Arbitrary calculations are restricted to the data-analysts group on the agent MCP path. Re-issue the query using only fieldCaption fields and standard filters, or ask a member of the data-analysts group to run it. If you need calculation access, contact your data platform team."

# --- Red-team: column NAMED "calculation" (value, not key) does not deny ------
- description: >-
    A column literally named "calculation" carried as a fieldCaption VALUE (not a
    `calculation:` key), non-analyst. walk keys on the structural key name, so a
    value of "calculation" under fieldCaption is not matched and there is no
    arbitrary-expression surface. Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: tableau-mcp-query-datasource
      uri: null
    subject:
      sub: "google-apps|mkt@dtwo.ai"
      claims:
        groups:
          - marketing
    payload:
      name: tableau-mcp-query-datasource
      args:
        datasourceLuid: abc-123
        query:
          fields:
            - fieldCaption: calculation
  output:
    expectedResult: allow
