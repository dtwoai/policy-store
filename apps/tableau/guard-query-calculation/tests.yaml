# --- Red-team: calculation smuggled into a TOP-N filter's fieldToMeasure ------
- description: >-
    Calculation hidden in a TOP-N filter's fieldToMeasure sub-object, non-analyst
    caller. This position (distinct from field) was a confirmed bypass before the
    recursive-walk fix. Policy should deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: tableau-mcp-query-datasource
      uri: null
    subject:
      sub: "google-apps|mkt@dtwo.ai"
      claims:
        groups:
          - marketing
    payload:
      name: tableau-mcp-query-datasource
      args:
        datasourceLuid: abc-123
        query:
          fields:
            - fieldCaption: State
          filters:
            - field:
                fieldCaption: State
              filterType: TOP
              howMany: 10
              fieldToMeasure:
                calculation: "SUM([Salary]) / SUM([Headcount])"
              direction: TOP
  output:
    expectedResult: deny
    expectedReason: "This Tableau VizQL Data Service query includes a calculation field, which accepts an arbitrary Tableau calc expression that can reference any column in the datasource and bypasses column-level (fieldCaption) allowlisting. Arbitrary calculations are restricted to the data-analysts group on the agent MCP path. Re-issue the query using only fieldCaption fields and standard filters, or ask a member of the data-analysts group to run it. If you need calculation access, contact your data platform team."

- description: >-
    Same TOP-N fieldToMeasure calculation by a data-analysts caller. Exempt —
    policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: tableau-mcp-query-datasource
      uri: null
    subject:
      sub: "google-apps|analyst@dtwo.ai"
      claims:
        groups:
          - data-analysts
    payload:
      name: tableau-mcp-query-datasource
      args:
        datasourceLuid: abc-123
        query:
          filters:
            - field:
                fieldCaption: State
              filterType: TOP
              howMany: 10
              fieldToMeasure:
                calculation: "SUM([Salary]) / SUM([Headcount])"
              direction: TOP
  output:
    expectedResult: allow

# --- Red-team: bare tool name (no gateway prefix) fails open (documented) -----
- description: >-
    Bare tool name `query-datasource` with no gateway server prefix carrying a
    calculation, non-analyst. The suffix match requires a leading hyphen, so this
    does NOT match and passes unguarded — documents the portability fail-open in
    Known limitations. Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: query-datasource
      uri: null
    subject:
      sub: "google-apps|mkt@dtwo.ai"
      claims:
        groups:
          - marketing
    payload:
      name: query-datasource
      args:
        datasourceLuid: abc-123
        query:
          fields:
            - calculation: "SUM([Salary])"
  output:
    expectedResult: allow

# --- Red-team: stringified query blob fails open (documented) ----------------
- description: >-
    Query passed as a stringified JSON blob rather than an object, carrying a
    calculation, non-analyst. walk sees an opaque scalar with no `calculation`
    key, so the guard does not fire and the call passes unguarded — documents the
    structured-query fail-open (the server's VDS object schema rejects a
    string-typed query as the backstop). Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: tableau-mcp-query-datasource
      uri: null
    subject:
      sub: "google-apps|mkt@dtwo.ai"
      claims:
        groups:
          - marketing
    payload:
      name: tableau-mcp-query-datasource
      args:
        datasourceLuid: abc-123
        query: '{"fields":[{"calculation":"SUM([Salary])"}]}'
  output:
    expectedResult: allow

