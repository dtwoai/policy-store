- description: "Red-team fail-open (fixed): groups is an OBJECT whose value is the
    admin name ({\"0\": \"tableau-admins\"}), not an array. Before the is_array
    guard, `some group in groups` iterated object values, found the admin string,
    and granted the exemption. The guard makes any non-array groups value fail
    closed as the description promises. Deny for the destructive call."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: tableau-delete-workbook
      uri: null
    subject:
      sub: analyst@example.com
      claims:
        groups:
          "0": tableau-admins
    payload:
      name: tableau-delete-workbook
      args:
        workbookId: wb-luid-1
  output:
    expectedResult: deny
    expectedReason: "This Tableau content operation is blocked because it is hard to reverse: deleted workbooks and data sources sit in the recycle bin for only a limited window before they are gone for good, and a silently stopped or rescheduled extract refresh leaves dashboards stale while they still look live. Ask a member of your Tableau admin group (placeholder: tableau-admins) to run it, or ask your InfoSec team to add you to that group if you believe you should have access."
- description: "Documented residual (not a policy bypass): an internal extra
    separator (delete-data-source) does not end with the registered
    delete-datasource suffix, so it does not match. Safe because the server routes
    tool names by exact match — this string names no real tool. Policy allows."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: tableau-delete-data-source
      uri: null
    subject:
      sub: analyst@example.com
      claims:
        groups:
          - data-analysts
    payload:
      name: tableau-delete-data-source
      args:
        datasourceId: ds-luid-1
  output:
    expectedResult: allow
- description: "Documented residual (not a policy bypass): a camelCase name
    (tableauDeleteWorkbook) has no hyphen/underscore separator, so it does not
    match the kebab suffix. This is safe because the official and known community
    servers route tool names by exact match — this string names no real tool and
    cannot execute a delete. Policy allows (no match)."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: tableauDeleteWorkbook
      uri: null
    subject:
      sub: analyst@example.com
      claims:
        groups:
          - data-analysts
    payload:
      name: tableauDeleteWorkbook
      args:
        workbookId: wb-luid-1
  output:
    expectedResult: allow
- description: "Red-team residual (documented, not a policy bypass): the tool name
    ends with a zero-width space (U+200B, \\u200b) after delete-workbook. Unlike a
    trailing regular space/newline, ZWSP is a format character that trim_space does
    NOT strip, so the endswith suffix match misses it and the policy allows. This is
    safe only because the server routes tool names by exact match — the ZWSP-suffixed
    string names no registered tool and cannot execute a delete. Verifies the
    documented boundary: trim_space handles whitespace, not zero-width chars. Allows."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: "tableau-delete-workbook​"
      uri: null
    subject:
      sub: analyst@example.com
      claims:
        groups:
          - data-analysts
    payload:
      name: "tableau-delete-workbook​"
      args:
        workbookId: wb-luid-1
  output:
    expectedResult: allow
