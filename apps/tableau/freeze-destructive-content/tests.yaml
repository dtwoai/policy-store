# Reason string is stable and identical for every deny branch.
- description: Read tool outside the destructive family, caller has no claims at
    all. Policy should allow (pass-through branch).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: tableau-list-workbooks
      uri: null
    payload:
      name: tableau-list-workbooks
      args: {}
  output:
    expectedResult: allow
- description: Read tool whose name superficially resembles the frozen family —
    list-extract-refresh-tasks (plural). Must NOT over-match the singular
    delete/update suffixes. Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: tableau-list-extract-refresh-tasks
      uri: null
    subject:
      sub: analyst@example.com
      claims:
        groups:
          - data-analysts
    payload:
      name: tableau-list-extract-refresh-tasks
      args: {}
  output:
    expectedResult: allow
- description: delete-workbook by a non-admin (groups do not include
    tableau-admins). Deny with reason.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: tableau-delete-workbook
      uri: null
    subject:
      sub: analyst@example.com
      claims:
        groups:
          - data-analysts
    payload:
      name: tableau-delete-workbook
      args:
        workbookId: wb-luid-1
  output:
    expectedResult: deny
    expectedReason: "This Tableau content operation is blocked because it is hard to reverse: deleted workbooks and data sources sit in the recycle bin for only a limited window before they are gone for good, and a silently stopped or rescheduled extract refresh leaves dashboards stale while they still look live. Ask a member of your Tableau admin group (placeholder: tableau-admins) to run it, or ask your InfoSec team to add you to that group if you believe you should have access."
- description: delete-workbook by a caller who carries tableau-admins among other
    groups. Admin branch allows the call.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: tableau-delete-workbook
      uri: null
    subject:
      sub: admin@example.com
      claims:
        groups:
          - engineering
          - tableau-admins
    payload:
      name: tableau-delete-workbook
      args:
        workbookId: wb-luid-1
  output:
    expectedResult: allow
