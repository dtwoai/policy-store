- description: get-view-image by a caller outside the data-analyst group is denied.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: tableau-get-view-image
      uri: null
    subject:
      sub: auth0|eng
      claims:
        groups:
          - engineering
    payload:
      name: tableau-get-view-image
      args:
        viewId: aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa
  output:
    expectedResult: deny
    expectedReason: Tableau image renders (get-view-image / get-custom-view-image) return PNGs that cannot be redacted, so they are restricted to the data-analyst group. Use a CSV data read (get-view-data) or contact your data-governance owner if your role requires image exports.

