- description: Non-fenced Tableau tool (list-datasources) passes through untouched.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: tableau-list-datasources
      uri: null
    payload:
      name: tableau-list-datasources
      args: {}
  output:
    expectedResult: allow

- description: query-datasource against an approved datasource LUID is allowed.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: tableau-query-datasource
      uri: null
    payload:
      name: tableau-query-datasource
      args:
        datasourceLuid: 11111111-1111-1111-1111-111111111111
  output:
    expectedResult: allow

- description: query-datasource against a datasource not on the allowlist is denied.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: tableau-query-datasource
      uri: null
    payload:
      name: tableau-query-datasource
      args:
        datasourceLuid: 99999999-9999-9999-9999-999999999999
  output:
    expectedResult: deny
    expectedReason: Tableau datasource 99999999-9999-9999-9999-999999999999 is not on the approved-datasource allowlist, so the agent may not query it. Query an approved datasource, or request datasource onboarding through your data-governance owner if you believe this one should be cleared.

- description: query-datasource with a missing datasourceLuid fails closed (deny).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: tableau-query-datasource
      uri: null
    payload:
      name: tableau-query-datasource
      args:
        query:
          fields: []
  output:
    expectedResult: deny
    expectedReason: This Tableau query supplied no datasourceLuid, so it cannot be matched against the approved-datasource allowlist. Re-issue the call naming an approved datasource, and request datasource onboarding through your data-governance owner if the one you need is not yet approved.

- description: query-datasource with an empty-string datasourceLuid fails closed (deny).
  input:
