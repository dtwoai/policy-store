- description: Red-team — query against an approved datasource carrying an arbitrary `calculation` field is still allowed (documented column-level escape hatch; pair with the calculation-field guard companion).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: tableau-query-datasource
      uri: null
    payload:
      name: tableau-query-datasource
      args:
        datasourceLuid: 11111111-1111-1111-1111-111111111111
        query:
          fields:
            - calculation: "[Salary] * 1"
  output:
    expectedResult: allow

- description: Red-team — bare `query-datasource` with no gateway prefix, naming a non-allowlisted datasource, is denied (suffix matching is prefix-independent).
  input:
