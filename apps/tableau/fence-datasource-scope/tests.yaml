- description: get-view-image by a caller in the data-analyst group is allowed.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: tableau-get-view-image
      uri: null
    subject:
      sub: auth0|amy
      claims:
        groups:
          - data-analysts
    payload:
      name: tableau-get-view-image
      args:
        viewId: aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa
  output:
    expectedResult: allow

- description: get-custom-view-image by a caller in the data-analyst group is allowed (covers the custom-view suffix).
