- description: Create a journal entry with no subject/claims at all — fails closed, denied.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: netsuite-mcp-ns_createRecord
      uri: null
    payload:
      name: netsuite-mcp-ns_createRecord
      args:
        recordType: journalentry
        data: '{"memo":"accrual"}'
  output:
    expectedResult: deny
    expectedReason: "NetSuite financial-transaction writes (recordType 'journalentry') are restricted to finance and controller roles. Posting or altering ledger transactions — especially in a closed accounting period — is a restatement risk, so segregation-of-duties controls gate this action. Ask a finance or controller colleague to make the change, or request the appropriate group membership from your finance systems administrator if you believe this is a false positive."

