- description: Read tool (ns_getRecord) is not a financial write — allowed.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: netsuite-mcp-ns_getRecord
      uri: null
    subject:
      claims:
        groups:
          - sales
    payload:
      name: netsuite-mcp-ns_getRecord
      args:
        recordType: journalentry
        id: "42"
  output:
    expectedResult: allow

- description: Create of a non-gated record type (customer) by a non-finance caller — allowed (out of scope).
