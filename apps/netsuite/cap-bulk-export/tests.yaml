- description: ns_runCustomSuiteQL with pageSize 5000 — above the ceiling is
    rewritten to 100; sqlQuery and description preserved.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: netsuite-mcp-ns_runCustomSuiteQL
      uri: null
    payload:
      name: netsuite-mcp-ns_runCustomSuiteQL
      args:
        sqlQuery: SELECT * FROM customer
        description: pull all customers
        pageSize: 5000
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    pageSize: 100
    sqlQuery: SELECT * FROM customer
    description: pull all customers
- description: ns_runCustomSuiteQL with no pageSize argument — pageSize 100 is
    injected (the server would otherwise apply its own large default page).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: netsuite-mcp-ns_runCustomSuiteQL
      uri: null
    payload:
      name: netsuite-mcp-ns_runCustomSuiteQL
      args:
        sqlQuery: SELECT id, companyName FROM customer
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    pageSize: 100
    sqlQuery: SELECT id, companyName FROM customer
- description: ns_runCustomSuiteQL with pageSize 50 — already within the ceiling,
    passes through with no transform.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: netsuite-mcp-ns_runCustomSuiteQL
      uri: null
    payload:
      name: netsuite-mcp-ns_runCustomSuiteQL
      args:
        sqlQuery: SELECT id, companyName FROM customer WHERE id = 42
        pageSize: 50
  output:
    expectedResult: allow
  transformApplied: false
- description: ns_runCustomSuiteQL with pageSize exactly 100 — boundary value is
    allowed unchanged (clamp only fires above the ceiling).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: netsuite-mcp-ns_runCustomSuiteQL
      uri: null
    payload:
      name: netsuite-mcp-ns_runCustomSuiteQL
      args:
        sqlQuery: SELECT id FROM vendor
        pageSize: 100
  output:
    expectedResult: allow
  transformApplied: false
- description: "Red-team: pageSize 0 — a non-positive value some SQL layers read as
    unbounded is clamped to 100, not passed through."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: netsuite-mcp-ns_runCustomSuiteQL
      uri: null
    payload:
      name: netsuite-mcp-ns_runCustomSuiteQL
      args:
        sqlQuery: SELECT * FROM vendor
        pageSize: 0
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    pageSize: 100
    sqlQuery: SELECT * FROM vendor
- description: "Red-team: negative pageSize (-1) — also outside the 1-100 range,
    clamped to 100."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: netsuite-mcp-ns_runCustomSuiteQL
      uri: null
    payload:
      name: netsuite-mcp-ns_runCustomSuiteQL
      args:
        sqlQuery: SELECT * FROM employee
        pageSize: -1
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    pageSize: 100
    sqlQuery: SELECT * FROM employee
- description: 'Red-team: non-numeric pageSize ("5000" as a string) — fail-safe,
    replaced with 100 rather than letting the server parse it.'
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: netsuite-mcp-ns_runCustomSuiteQL
      uri: null
    payload:
      name: netsuite-mcp-ns_runCustomSuiteQL
      args:
        sqlQuery: SELECT * FROM customer
        pageSize: "5000"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    pageSize: 100
    sqlQuery: SELECT * FROM customer
- description: Uppercase tool name NS_RUNCUSTOMSUITEQL with pageSize 999 — tool
    matching is case-insensitive.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: NETSUITE-MCP-NS_RUNCUSTOMSUITEQL
      uri: null
    payload:
      name: NETSUITE-MCP-NS_RUNCUSTOMSUITEQL
      args:
        sqlQuery: SELECT * FROM transaction
        pageSize: 999
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    pageSize: 100
    sqlQuery: SELECT * FROM transaction
- description: Bare tool name ns_runCustomSuiteQL (no gateway prefix) with pageSize
    300 — suffix match still fires.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: ns_runCustomSuiteQL
      uri: null
    payload:
