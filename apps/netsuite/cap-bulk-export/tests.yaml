    sqlQuery: SELECT * FROM subsidiary
- description: args object missing entirely (payload has name only) — pageSize
    defaults to 0, transform still fires and injects pageSize 100.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: netsuite-mcp-ns_runCustomSuiteQL
      uri: null
    payload:
      name: netsuite-mcp-ns_runCustomSuiteQL
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    pageSize: 100
- description: "Red-team (alternate arg key): SuiteQL call whose arguments are under
    the `arguments` envelope key (NetSuite landscape-note convention) with
    pageSize 400 — the fallback read still clamps to 100."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: netsuite-mcp-ns_runCustomSuiteQL
      uri: null
    payload:
      name: netsuite-mcp-ns_runCustomSuiteQL
      arguments:
        sqlQuery: SELECT * FROM vendor
        pageSize: 400
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    pageSize: 100
    sqlQuery: SELECT * FROM vendor
- description: Non-SuiteQL tool ns_getRecord with a stray pageSize 500 — name does
    not match the SuiteQL suffix, passes through untouched.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: netsuite-mcp-ns_getRecord
      uri: null
    payload:
      name: netsuite-mcp-ns_getRecord
      args:
        recordType: customer
        pageSize: 500
  output:
    expectedResult: allow
  transformApplied: false
- description: "Red-team (fixed fail-open): args envelope is JSON null — coerced to
    {} so the clamp still fires and injects pageSize 100 instead of passing the
    call through unclamped."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: netsuite-mcp-ns_runCustomSuiteQL
      uri: null
    payload:
      name: netsuite-mcp-ns_runCustomSuiteQL
      args: null
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    pageSize: 100
- description: "Red-team (documented gap): page size supplied under an alternate-case
    key (PageSize) — pageSize 100 is injected but the PageSize alias is left
    intact; a case-insensitive server could still honour it. See Known
    limitations."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: netsuite-mcp-ns_runCustomSuiteQL
      uri: null
    payload:
      name: netsuite-mcp-ns_runCustomSuiteQL
      args:
        sqlQuery: SELECT * FROM customer
        PageSize: 5000
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    pageSize: 100
    PageSize: 5000
- description: "Red-team (documented gap): a benign in-range pageSize 50 coexisting
    with a large PageSize alias 5000 — the clamp condition is NOT met (pageSize is
    valid), so no transform fires at all and PageSize 5000 passes through
    completely unclamped. Pairing a small canonical pageSize with a large alias is
    a deliberate way to slip past the clamp on a case-insensitive server. See Known
    limitations (alias keys are never removed)."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: netsuite-mcp-ns_runCustomSuiteQL
      uri: null
    payload:
      name: netsuite-mcp-ns_runCustomSuiteQL
      args:
        sqlQuery: SELECT * FROM customer
        pageSize: 50
        PageSize: 5000
  output:
    expectedResult: allow
  transformApplied: false
- description: "Red-team (documented gap): glints-dev netsuite_run_suiteql with a
    large Limit — different tool suffix and argument key, so the call passes
    through unclamped. See Known limitations."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
