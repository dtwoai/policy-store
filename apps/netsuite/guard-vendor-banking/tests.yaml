  output:
    expectedResult: allow

# Red-team DOCUMENTED residual: a field named exactly "account" (or glAccount)
# is intentionally NOT matched — on a vendor record it is almost always a GL
# reference; matching it would false-positive on nearly every vendor edit. A
# genuine bank field must carry a number suffix / acct / payment-context prefix.
- description: Red-team DOC — bare "account" and "glAccount" keys (GL references) are intentionally not matched, allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
