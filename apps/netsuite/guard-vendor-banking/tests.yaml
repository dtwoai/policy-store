# Red-team: a fail-open path — when the generic `args` container is a scalar
# (not an object), object.union used to type-error and leave ns_args undefined,
# which silently disabled the check. The banking edit lives in `arguments`; it
# must still be denied. as_object() coercion closes this.
- description: Red-team — payload.args is a scalar string while arguments carries the bank edit — must not fail open, deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: netsuite-mcp-ns_updateRecord
      uri: null
    subject:
      sub: auth0|jane
      claims:
        groups:
          - viewer
    payload:
      name: netsuite-mcp-ns_updateRecord
      args: "recordType=vendor"
      arguments:
        recordType: vendor
        data: '{"routingNumber":"021000021"}'
  output:
    expectedResult: deny
    expectedReason: "Editing vendor banking or payment-instruction details through the agent is blocked to prevent payment fraud. Make vendor bank changes through your reviewed accounts-payable (AP) process instead. Contact your finance team if this is a false positive."

- description: Red-team — the whole bank edit under the scalar-shadowed args container works after coercion (arguments scalar, args object), deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: netsuite-mcp-ns_updateRecord
      uri: null
    subject:
      sub: auth0|jane
      claims: {}
    payload:
      name: netsuite-mcp-ns_updateRecord
      arguments: "not-an-object"
      args:
        recordType: vendor
        data: '{"iban":"DE89370400440532013000"}'
  output:
    expectedResult: deny

# Documentation case: the policy inspects field *keys*, not values, so a bank
# number smuggled into a non-banking field's value (e.g. a free-text "notes"
# field) is allowed — it does not write the vendor's routing/account field and
# so is not a payment-redirect vector. See "Bank field names are pattern-based"
# in Known limitations.
- description: Value-only smuggling — bank digits inside a benign "notes" value (no bank key) — not a banking edit, allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: netsuite-mcp-ns_updateRecord
      uri: null
    subject:
      sub: auth0|jane
      claims: {}
    payload:
      name: netsuite-mcp-ns_updateRecord
      arguments:
        recordType: vendor
        data: '{"notes":"remit to routing 021000021 account 123456"}'
  output:
    expectedResult: allow

