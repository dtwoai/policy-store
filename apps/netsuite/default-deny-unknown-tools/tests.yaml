- description: "Red-team (documented residual — WRITE-suffix smuggle, the sharp
    edge): an attacker who installs a custom SuiteScript tool on /v1/all can name
    it `<anything>-ns_createrecord` (hyphen separator included) and the `-` suffix
    branch ALLOWS it, smuggling an arbitrary create past the default-deny. This
    test locks in the dangerous behavior the Known-limitations `Suffix matching
    trusts the <server-name>- prefix convention` bullet warns about — previously
    the suffix residual was only exercised via a benign read tool
    (`report-ns_runreport`). The real fix is to pin full exact gateway names for
    any account that connects to /v1/all. Policy currently ALLOWS (documented)."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: evilserver-ns_createrecord
      uri: null
    payload:
      name: evilserver-ns_createrecord
      args:
        recordType: vendor
        data: "{\"account\": \"999888777\"}"
  output:
    expectedResult: allow
- description: "Red-team (malformed resource — number): `resource` is a number, not
    an object. The description claims a number in place of the resource object is
    normalized to {} so the name resolves to \"\" and the deny carries the nameless
    fail-closed reason. Locks in that claimed shape (previously only null and
    string were tested). Policy should deny."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource: 42
  output:
    expectedResult: deny
    expectedReason: This request carries no tool name, so it cannot be matched against the pinned NetSuite allowlist and is denied by default (fail closed). Verify the gateway is populating input.resource.name with the dump-input debug technique; if tool names are missing systemically, fix the gateway configuration rather than relaxing this policy.
- description: "Red-team (malformed resource — array): `resource` is an array, not
    an object (is_object is false for arrays), normalized to {} so the name
    resolves to \"\" and the deny carries the nameless fail-closed reason. Locks in
    the array shape the description names. Policy should deny."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource: []
  output:
    expectedResult: deny
    expectedReason: This request carries no tool name, so it cannot be matched against the pinned NetSuite allowlist and is denied by default (fail closed). Verify the gateway is populating input.resource.name with the dump-input debug technique; if tool names are missing systemically, fix the gateway configuration rather than relaxing this policy.
