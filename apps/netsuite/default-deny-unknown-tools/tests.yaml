- description: "Red-team (malformed resource): `resource` is null instead of an
    object. object.get on a non-object would raise a built-in type error and
    leave the deny reasonless; the resource_obj normalization keeps it a clean
    fail-closed deny carrying the nameless reason so the drift-alert content is
    preserved. Policy should deny."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource: null
  output:
    expectedResult: deny
    expectedReason: This request carries no tool name, so it cannot be matched against the pinned NetSuite allowlist and is denied by default (fail closed). Verify the gateway is populating input.resource.name with the dump-input debug technique; if tool names are missing systemically, fix the gateway configuration rather than relaxing this policy.
- description: "Red-team (malformed resource): `resource` is a string, not an
    object. Normalized to {} so the name resolves to \"\" and the deny carries
    the nameless fail-closed reason. Policy should deny."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource: "not-an-object"
  output:
    expectedResult: deny
    expectedReason: This request carries no tool name, so it cannot be matched against the pinned NetSuite allowlist and is denied by default (fail closed). Verify the gateway is populating input.resource.name with the dump-input debug technique; if tool names are missing systemically, fix the gateway configuration rather than relaxing this policy.
- description: "Red-team (encoding — trailing newline): an allowlisted name with a
    trailing newline (`netsuite-mcp-ns_getrecord\\n`) fails the anchored ASCII
    character-class guard (RE2 `^...$` does not admit the trailing newline), so it
    never reaches an allow branch and is denied with the drift reason. Locks in
    that newline injection cannot smuggle an allowlisted name through. Policy
    should deny."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: "netsuite-mcp-ns_getrecord\n"
      uri: null
  output:
    expectedResult: deny
