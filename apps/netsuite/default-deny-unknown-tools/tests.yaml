- description: Account-specific custom SuiteScript tool exposed on /v1/all
    (post_bank_transfer) with a developer-chosen name not on the allowlist.
    Policy should deny with the drift-alert reason.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: netsuite-mcp-post_bank_transfer
      uri: null
    payload:
      name: netsuite-mcp-post_bank_transfer
      args:
        amount: "50000"
  output:
    expectedResult: deny
    expectedReason: The NetSuite tool 'netsuite-mcp-post_bank_transfer' is not on the pinned allowlist of audited NetSuite standard MCP tools, so it is denied by default. The NetSuite AI Connector's /services/mcp/v1/all endpoint can expose account-specific custom SuiteScript tools (built with Oracle's MCP Sample Tools) whose developer-chosen names and side effects are unknowable in advance, so an unrecognized name may be a new, renamed, or custom tool that has not been reviewed. If this tool is legitimate, ask your gateway operator to audit it and add its exact tool-name suffix to the allowlist in this policy before agents can call it.
