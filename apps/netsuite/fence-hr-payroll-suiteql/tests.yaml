- description: SuiteQL query naming employee/ssn/compensation by a non-HR caller is denied.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: netsuite-mcp-ns_runCustomSuiteQL
      uri: null
    subject:
      sub: google-apps|dev@example.com
      claims:
        groups:
          - engineering
    payload:
      name: netsuite-mcp-ns_runCustomSuiteQL
      arguments:
        sqlQuery: SELECT firstname, ssn, compensation FROM employee
  output:
    expectedResult: deny
