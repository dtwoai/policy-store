# --- Fail-safe edge cases ---
- description: create_or_update_file with no content argument at all. Nothing to scan → passes through.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: github-mcp-create_or_update_file
      uri: null
    payload:
      name: github-mcp-create_or_update_file
      args:
        owner: acme
        repo: app
        path: empty.txt
        branch: main
        message: create empty
  output:
    expectedResult: allow

- description: Case-insensitive tool matching — uppercase server/tool name with a secret in content must still deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: GitHub-MCP-CREATE_OR_UPDATE_FILE
      uri: null
    payload:
      name: GitHub-MCP-CREATE_OR_UPDATE_FILE
      args:
        owner: acme
        repo: app
        path: .env
        branch: main
        message: config
        content: "AWS_KEY=AKIAIOSFODNN7EXAMPLE"
  output:
    expectedResult: deny

# --- Red-team: secret smuggled into the commit message (persists to git history) ---
- description: Red-team - create_or_update_file with clean content but an AWS key in the commit message. The message lands in git history, so it must deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: github-mcp-create_or_update_file
      uri: null
    payload:
      name: github-mcp-create_or_update_file
      args:
        owner: acme
        repo: app
        path: notes.txt
        branch: main
        message: "rotate AKIAIOSFODNN7EXAMPLE before Friday"
        content: "harmless file body, nothing to see here"
  output:
    expectedResult: deny
    expectedReason: This GitHub write looks like it contains a secret (API key, password, token, or private key). Route credentials through your secret manager instead of committing them. Contact your InfoSec team if this was a false positive.

- description: Red-team - push_files with all-clean file contents but a GitHub PAT in the top-level commit message must deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: github-mcp-push_files
      uri: null
    payload:
      name: github-mcp-push_files
      args:
        owner: acme
        repo: app
        branch: main
        message: "add token ghp_abcdefghijklmnopqrstuvwxyz0123456789"
        files:
          - path: a.txt
            content: harmless first file
          - path: b.txt
            content: also harmless
  output:
    expectedResult: deny
    expectedReason: This GitHub write looks like it contains a secret (API key, password, token, or private key). Route credentials through your secret manager instead of committing them. Contact your InfoSec team if this was a false positive.

- description: create_or_update_file with a normal, secret-free commit message must still allow (no false positive from message scanning).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: github-mcp-create_or_update_file
      uri: null
    payload:
      name: github-mcp-create_or_update_file
      args:
        owner: acme
        repo: app
        path: README.md
        branch: main
        message: "docs: update setup instructions and fix typos"
        content: "# App\n\nRun the dev server."
  output:
    expectedResult: allow

# --- Documented residual: base64-encoded secret is not decoded (Known limitations) ---
- description: Documented limitation - a base64-encoded AWS key in file content is not decoded, so it passes through. Pins the Known-limitations residual.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: github-mcp-create_or_update_file
      uri: null
    payload:
      name: github-mcp-create_or_update_file
      args:
        owner: acme
        repo: app
        path: blob.b64
        branch: main
        message: add encoded blob
        content: "QUtJQUlPU0ZPRE5ON0VYQU1QTEU="
  output:
    expectedResult: allow
