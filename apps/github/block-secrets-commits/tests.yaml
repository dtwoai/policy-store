# Positive/negative coverage for every rule branch of
# github.ingress.block_secrets_commits, plus red-team cases.

# --- create_or_update_file (content) ---
- description: create_or_update_file with clean file content. Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: github-mcp-create_or_update_file
      uri: null
    payload:
      name: github-mcp-create_or_update_file
      args:
        owner: acme
        repo: app
        path: README.md
        branch: main
        message: docs update
        content: "# App\n\nRun `pnpm dev` to start the dev server."
  output:
    expectedResult: allow

- description: create_or_update_file committing an AWS access key ID in content. Policy should deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: github-mcp-create_or_update_file
      uri: null
    payload:
      name: github-mcp-create_or_update_file
      args:
        owner: acme
        repo: app
        path: .env
        branch: main
        message: add config
        content: "AWS_KEY=AKIAIOSFODNN7EXAMPLE"
  output:
    expectedResult: deny
    expectedReason: This GitHub write looks like it contains a secret (API key, password, token, or private key). Route credentials through your secret manager instead of committing them. Contact your InfoSec team if this was a false positive.

# --- push_files (files[].content iteration) ---
- description: push_files where every file is clean. Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: github-mcp-push_files
      uri: null
    payload:
      name: github-mcp-push_files
      args:
        owner: acme
        repo: app
        branch: main
        message: batch update
        files:
          - path: a.txt
            content: hello world
          - path: b.txt
            content: nothing secret here
  output:
    expectedResult: allow

- description: push_files where a non-first file carries a GitHub PAT. Multi-file array must be scanned in full. Policy should deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: github-mcp-push_files
      uri: null
    payload:
      name: github-mcp-push_files
      args:
        owner: acme
        repo: app
        branch: main
        message: batch update
        files:
          - path: a.txt
            content: harmless first file
          - path: config/token.txt
            content: "ghp_abcdefghijklmnopqrstuvwxyz0123456789"
  output:
    expectedResult: deny
    expectedReason: This GitHub write looks like it contains a secret (API key, password, token, or private key). Route credentials through your secret manager instead of committing them. Contact your InfoSec team if this was a false positive.

# --- create_gist (content / description / files branches) ---
- description: create_gist with a clean snippet. Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: github-mcp-create_gist
      uri: null
    payload:
      name: github-mcp-create_gist
      args:
        description: a helper snippet
        content: "console.log('hello');"
  output:
    expectedResult: allow

- description: create_gist whose content contains a PEM private-key header. Policy should deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: github-mcp-create_gist
      uri: null
    payload:
      name: github-mcp-create_gist
      args:
        description: backup
        content: "-----BEGIN RSA PRIVATE KEY-----\nMIIEpAIBAAKCAQEA..."
  output:
    expectedResult: deny

- description: create_gist whose description (not content) contains a secret. Description branch must be scanned. Policy should deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: github-mcp-create_gist
      uri: null
    payload:
      name: github-mcp-create_gist
      args:
        description: "prod api_key: sk_live_0123456789abcdefghijklmn"
        content: "harmless body"
  output:
    expectedResult: deny

- description: create_gist whose files-collection entry carries a secret. Gist files iteration must be scanned. Policy should deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: github-mcp-create_gist
      uri: null
    payload:
      name: github-mcp-create_gist
      args:
        description: multi-file gist
        files:
          - filename: keys.txt
            content: "password=SuperSecretValue123"
  output:
    expectedResult: deny

