    expectedReason: Submitting a pull-request approval requires a human. This agent can create draft reviews and leave review comments (COMMENT or REQUEST_CHANGES), but it cannot approve a pull request. Ask a human reviewer to submit the approval and perform the merge. Contact your InfoSec or engineering-lead team if this control is blocking a legitimate automated workflow.

- description: "Red-team fix (fail-open bypass): review_write with NO payload object at all is denied. object.get(input, 'payload', {}) tolerates the absent payload and the args guard fails closed; previously input.payload being undefined cascaded to allow=true."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: github-mcp-pull_request_review_write
      uri: null
  output:
    expectedResult: deny
    expectedReason: Submitting a pull-request approval requires a human. This agent can create draft reviews and leave review comments (COMMENT or REQUEST_CHANGES), but it cannot approve a pull request. Ask a human reviewer to submit the approval and perform the merge. Contact your InfoSec or engineering-lead team if this control is blocking a legitimate automated workflow.

- description: "Red-team (documented residual): a tool_pre_invoke with no resource.name matches no target suffix and passes through. The gateway always populates resource.name for tool hooks (not caller-supplied), so this is not attacker-controllable; see Known limitations. Front with PF-28 to hard-fail unnamed calls."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      uri: null
    payload:
      args:
        method: submit
        event: APPROVE
  output:
    expectedResult: allow

- description: "Red-team (documented residual): delegation to an autonomous Copilot agent (create_pull_request_with_copilot) is NOT a merge/approve tool, so it passes through. See Known limitations — the human-in-the-loop guarantee only binds the governed agent, not a second agent it hands work to."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: github-mcp-create_pull_request_with_copilot
      uri: null
    payload:
      name: github-mcp-create_pull_request_with_copilot
      args:
        owner: acme
        repo: app
        title: land it
        problem_statement: finish and merge this change
  output:
    expectedResult: allow
