- description: "Red-team fix (fail-open bypass): review_write with a NON-OBJECT args (args is a string) is denied. object.get on a non-object args raised a runtime type error that left official_review_blocked undefined, so `allow if not official_review_blocked` fired on `not undefined`. The is_object guard coerces args to {} -> unrecognized method -> deny."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: github-mcp-pull_request_review_write
      uri: null
    payload:
      name: github-mcp-pull_request_review_write
      args: submit
  output:
    expectedResult: deny
    expectedReason: Submitting a pull-request approval requires a human. This agent can create draft reviews and leave review comments (COMMENT or REQUEST_CHANGES), but it cannot approve a pull request. Ask a human reviewer to submit the approval and perform the merge. Contact your InfoSec or engineering-lead team if this control is blocking a legitimate automated workflow.

- description: "Red-team fix (fail-open bypass): review_write with args as an ARRAY is denied (non-object args coerced to {} -> fail closed)."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: github-mcp-pull_request_review_write
      uri: null
    payload:
      name: github-mcp-pull_request_review_write
      args:
        - method
        - submit
  output:
    expectedResult: deny
    expectedReason: Submitting a pull-request approval requires a human. This agent can create draft reviews and leave review comments (COMMENT or REQUEST_CHANGES), but it cannot approve a pull request. Ask a human reviewer to submit the approval and perform the merge. Contact your InfoSec or engineering-lead team if this control is blocking a legitimate automated workflow.

- description: "Red-team fix (fail-open bypass): review_write with args explicitly null is denied (null coerced to {} -> fail closed)."
  input:
    action: tool_pre_invoke
