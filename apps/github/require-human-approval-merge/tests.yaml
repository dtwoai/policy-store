# Deny reasons reused across cases (must match policy.md verbatim).
# merge:  "Merging a pull request requires a human. ..."
# review: "Submitting a pull-request approval requires a human. ..."

- description: merge_pull_request (official server) is always denied.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: github-mcp-merge_pull_request
      uri: null
    payload:
      name: github-mcp-merge_pull_request
      args:
        owner: acme
        repo: app
        pullNumber: 42
        merge_method: squash
  output:
    expectedResult: deny
    expectedReason: Merging a pull request requires a human. This agent can open and update pull requests, but it cannot merge them. Ask a human maintainer to review and merge this pull request. Contact your InfoSec or engineering-lead team if this control is blocking a legitimate automated workflow.

