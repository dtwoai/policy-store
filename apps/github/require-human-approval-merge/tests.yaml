# --- Red-team (standards §10) bypass regression cases ---

- description: "Red-team fix: submit with a non-string event (array) is denied. A non-string value made lower() error, leaving review_event undefined so the approval slipped through; is_string coercion now forces it into the deny branch."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: github-mcp-pull_request_review_write
      uri: null
    payload:
      name: github-mcp-pull_request_review_write
      args:
        owner: acme
        repo: app
        method: submit
        event:
          - APPROVE
  output:
    expectedResult: deny
    expectedReason: Submitting a pull-request approval requires a human. This agent can create draft reviews and leave review comments (COMMENT or REQUEST_CHANGES), but it cannot approve a pull request. Ask a human reviewer to submit the approval and perform the merge. Contact your InfoSec or engineering-lead team if this control is blocking a legitimate automated workflow.

- description: "Red-team fix: submit with a numeric event is denied (non-string coerced to \"\" -> malformed -> fail closed)."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: github-mcp-pull_request_review_write
      uri: null
    payload:
      name: github-mcp-pull_request_review_write
      args:
        owner: acme
        repo: app
        method: submit
        event: 123
  output:
    expectedResult: deny
    expectedReason: Submitting a pull-request approval requires a human. This agent can create draft reviews and leave review comments (COMMENT or REQUEST_CHANGES), but it cannot approve a pull request. Ask a human reviewer to submit the approval and perform the merge. Contact your InfoSec or engineering-lead team if this control is blocking a legitimate automated workflow.

- description: "Red-team: a non-string method also fails closed (method coerced to \"\" -> unrecognized -> denied)."
  input:
    action: tool_pre_invoke
