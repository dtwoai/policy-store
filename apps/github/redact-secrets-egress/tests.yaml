      text:
        - "See ghp_ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 in code"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "See [REDACTED-SECRET] in code"

