# Egress transform policy (default allow := true) — allow is always true; the
# meaningful assertions are transformApplied / transformedArgsContain. Cases
# cover every secret pattern branch (key=value, AWS access-key ID, AWS
# secret-access-key, GitHub classic PAT, GitHub fine-grained PAT, Slack token,
# Stripe live key, Google API key, OpenAI key, PEM header), every in-scope tool
# suffix (get_file_contents, search_code, get_job_logs, pull_request_read,
# community get_pull_request_files), the tool_metadata/payload-name fallbacks,
# non-string blocks, out-of-scope tools, the ingress guard, and red-team
# mode/surface bypasses.

# --- One case per secret pattern branch (positive) ---

- description: "Pattern[1] AWS access-key ID in a file read (get_file_contents) is masked in place."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: github-mcp-get_file_contents
      uri: null
    payload:
      name: github-mcp-get_file_contents
      text:
        - "const key = 'AKIAIOSFODNN7EXAMPLE';"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "const key = '[REDACTED-SECRET]';"

- description: "Pattern[3] GitHub classic PAT in search_code results is masked; surrounding text kept."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
