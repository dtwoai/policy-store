- description: Non-send tool (reading mail) is untouched by this policy. Allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: ms365-list-mail-messages
      uri: null
    payload:
      name: ms365-list-mail-messages
      args:
        folderId: inbox
  output:
    expectedResult: allow
- description: send-mail with to+cc recipients all on corporate domains
    (mixed-case addresses are normalized). Allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: ms365-send-mail
      uri: null
    payload:
      name: ms365-send-mail
      args:
        body:
          Message:
            subject: Q3 numbers
            toRecipients:
              - emailAddress:
                  address: CFO@Example.com
            ccRecipients:
              - emailAddress:
                  address: controller@example.org
  output:
    expectedResult: allow
- description: send-mail with an external address hidden in bccRecipients, and a
    caller whose groups claim does not include the exempt group. Deny with the
    external-recipients reason.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    subject:
      sub: google-apps|agent@example.com
      claims:
        groups:
          - staff
    resource:
      type: tool
      name: ms365-send-mail
      uri: null
    payload:
      name: ms365-send-mail
      args:
        body:
          Message:
            subject: forecast attached
            toRecipients:
              - emailAddress:
                  address: cfo@example.com
            bccRecipients:
              - emailAddress:
                  address: partner@outside.io
  output:
    expectedResult: deny
    expectedReason: "This message addresses recipients outside the approved corporate domains: partner@outside.io. Remove the external addresses or save a draft for a human to review and send. Contact your InfoSec team if an external domain should be approved."
- description: forward-mail-message uses the top-level capitalized ToRecipients
    shape; external recipient there is caught. Deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: ms365-forward-mail-message
      uri: null
    payload:
      name: ms365-forward-mail-message
      args:
        messageId: AAMkAGI2
        body:
          Comment: FYI
          ToRecipients:
            - emailAddress:
                address: rival@competitor.com
  output:
    expectedResult: deny
    expectedReason: "This message addresses recipients outside the approved corporate domains: rival@competitor.com. Remove the external addresses or save a draft for a human to review and send. Contact your InfoSec team if an external domain should be approved."
- description: forward-mail-message to a corporate-domain recipient via the
    top-level ToRecipients shape. Allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: ms365-forward-mail-message
      uri: null
    payload:
      name: ms365-forward-mail-message
      args:
        messageId: AAMkAGI2
        body:
          Comment: routing internally
          ToRecipients:
            - emailAddress:
                address: legal@example.com
  output:
    expectedResult: allow
- description: reply-mail-message with a comment only — recipients live
    server-side on the thread and are invisible to the gateway. Fail closed with
    the no-visible-recipients reason.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: ms365-reply-mail-message
      uri: null
    payload:
      name: ms365-reply-mail-message
      args:
        messageId: AAMkAGI2
        body:
          comment: sounds good, approved
  output:
    expectedResult: deny
    expectedReason: No recipient addresses are visible in this request, so the corporate-domain check cannot run and the send is blocked. Include explicit recipients in the call, or create a draft and let a human send it from Outlook. Contact your InfoSec team if this blocks a legitimate workflow.
- description: send-draft-message carries only a messageId — the draft's
    recipients are server-side. Fail closed with the no-visible-recipients
    reason.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: ms365-send-draft-message
      uri: null
    payload:
      name: ms365-send-draft-message
      args:
        messageId: AAMkAGI2draft
  output:
    expectedResult: deny
    expectedReason: No recipient addresses are visible in this request, so the corporate-domain check cannot run and the send is blocked. Include explicit recipients in the call, or create a draft and let a human send it from Outlook. Contact your InfoSec team if this blocks a legitimate workflow.
- description: Caller in the external-comms exemption group may email external
    recipients. Allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    subject:
      sub: google-apps|pr@example.com
      claims:
        groups:
          - external-comms
    resource:
      type: tool
      name: ms365-send-mail
      uri: null
    payload:
      name: ms365-send-mail
      args:
        body:
          Message:
            toRecipients:
              - emailAddress:
                  address: press@newswire.com
  output:
    expectedResult: allow
- description: A recipient entry with no readable emailAddress.address (only a
    display name) cannot be verified, even though the other recipient is
    internal. Fail closed with the unreadable-recipient reason.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: ms365-send-mail
      uri: null
    payload:
      name: ms365-send-mail
      args:
        body:
          Message:
            toRecipients:
              - emailAddress:
                  address: cfo@example.com
              - emailAddress:
                  name: Mystery Recipient
  output:
    expectedResult: deny
    expectedReason: A recipient in this request is missing a readable email address, so the corporate-domain check cannot run and the send is blocked. Provide every recipient as emailAddress.address, or create a draft for human review. Contact your InfoSec team if this was a false positive.
- description: send-shared-mailbox-mail with an external toRecipient in the
