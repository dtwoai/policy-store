  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: ms365-send-shared-mailbox-mail
      uri: null
    payload:
      name: ms365-send-shared-mailbox-mail
      args:
        sharedMailbox: support@example.com
        body:
          Message:
            toRecipients:
              - emailAddress:
                  address: customer@gmail.com
  output:
    expectedResult: deny
    expectedReason: "This message addresses recipients outside the approved corporate domains: customer@gmail.com. Remove the external addresses or save a draft for a human to review and send. Contact your InfoSec team if an external domain should be approved."
- description: reply-all-mail-message that supplies explicit corporate-domain
