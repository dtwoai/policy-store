- description: "Documented limitation: non-tool ingress hooks are gated too.
    A resource_pre_fetch whose resource name is a URI matches no read verb and
    fails closed for a non-writer — deny."
  input:
    action: resource_pre_fetch
    kind: resource_pre_fetch
    mode: input
    resource:
      type: resource
      name: ms365://mail/inbox
      uri: ms365://mail/inbox
    subject:
      sub: google-apps|sam@example.com
      claims:
        groups:
          - engineering
    payload:
      uri: ms365://mail/inbox
  output:
    expectedResult: deny
    expectedReason: This Microsoft 365 tool call is a write, which requires membership in the m365-writers IdP group; your identity token does not carry it. Read tools (list, get, search, download, extract, find, parse) remain available. Contact your InfoSec team for write access, or if this looks like a misclassified read.
