- description: Write tool (send-mail) with no subject at all. Claims absent —
    fail closed, deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: ms365-send-mail
      uri: null
    payload:
      name: ms365-send-mail
      args:
        body:
          Message:
            subject: hi
  output:
    expectedResult: deny
    expectedReason: This Microsoft 365 tool call is a write, which requires membership in the m365-writers IdP group; your identity token does not carry it. Read tools (list, get, search, download, extract, find, parse) remain available. Contact your InfoSec team for write access, or if this looks like a misclassified read.
- description: Write tool with claims present but no groups key — fail closed,
    deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: ms365-update-mail-message
      uri: null
    subject:
      sub: google-apps|sam@example.com
      claims:
        email: sam@example.com
    payload:
      name: ms365-update-mail-message
      args:
        messageId: m1
  output:
    expectedResult: deny
    expectedReason: This Microsoft 365 tool call is a write, which requires membership in the m365-writers IdP group; your identity token does not carry it. Read tools (list, get, search, download, extract, find, parse) remain available. Contact your InfoSec team for write access, or if this looks like a misclassified read.
