# Reason string used by every deny assertion below (single-reason policy).
# "This Microsoft 365 tool call is a write, which requires membership in the
#  m365-writers IdP group; ..."

- description: Read tool (list- verb) with no identity claims at all. Reads pass
    for everyone — allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: ms365-list-mail-messages
      uri: null
    payload:
      name: ms365-list-mail-messages
      args: {}
  output:
    expectedResult: allow
- description: Read tool (get- verb) with mixed-case name. Tool matching is
    case-insensitive — allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: MS365-Get-Drive-Item
      uri: null
    payload:
      name: MS365-Get-Drive-Item
      args:
        driveId: d123
        driveItemId: i456
  output:
    expectedResult: allow
- description: Read tool (search- verb), no group claims — allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: ms365-search-query
      uri: null
    subject:
      sub: google-apps|sam@example.com
      claims:
        groups:
          - engineering
    payload:
      name: ms365-search-query
      args:
        body:
          requests: []
  output:
    expectedResult: allow
- description: Read tool (download- verb) — allow without any group.
  input:
    action: tool_pre_invoke
