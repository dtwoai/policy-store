    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: ms365-send-mail
      uri: null
    subject:
      sub: google-apps|sam@example.com
      claims:
        groups:
          "0": m365-writers
    payload:
      name: ms365-send-mail
      args: {}
  output:
    expectedResult: deny
    expectedReason: This Microsoft 365 tool call is a write, which requires membership in the m365-writers IdP group; your identity token does not carry it. Read tools (list, get, search, download, extract, find, parse) remain available. Contact your InfoSec team for write access, or if this looks like a misclassified read.
- description: "Group membership is exact and case-sensitive: M365-Writers
