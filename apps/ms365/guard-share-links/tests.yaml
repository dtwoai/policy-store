        body:
          recipients:
            - email: alice@example.com
            - email: partner@vendor-b.example
  output:
    expectedResult: deny
    expectedReason: "This sharing invitation includes recipients outside the corporate domain allowlist: partner@vendor-b.example. Share with organization members instead, or ask a member of the collab-admins group to send external invitations. Contact your InfoSec team if a domain should be added to the allowlist."

- description: Same external invitation from a collab-admins member — exemption applies, allowed.
  input:
