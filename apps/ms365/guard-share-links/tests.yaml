- description: Anonymous EDIT link — denied outright (writable anonymous link), not transformed.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: ms365-create-drive-item-share-link
      uri: null
    payload:
      name: ms365-create-drive-item-share-link
      args:
        driveId: b!abc
        driveItemId: 01XYZ
        body:
          type: edit
          scope: anonymous
  output:
    expectedResult: deny
    expectedReason: "Anonymous edit links are blocked: an anonymous edit link lets anyone on the internet modify this file without signing in, and Microsoft Graph creates it silently with no notification. Request the link with organization scope instead (anonymous view links are downgraded to organization scope automatically). Contact your InfoSec team if an external edit link is genuinely required."
  transformApplied: false

- description: Anonymous EDIT link from a collab-admins member — still denied; the edit+anonymous branch has no group exemption by design.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: ms365-create-drive-item-share-link
      uri: null
    subject:
      sub: admin@example.com
      claims:
        groups:
          - collab-admins
    payload:
      name: ms365-create-drive-item-share-link
      args:
        driveId: b!abc
        driveItemId: 01XYZ
        body:
          type: EDIT
          scope: ANONYMOUS
  output:
    expectedResult: deny
    expectedReason: "Anonymous edit links are blocked: an anonymous edit link lets anyone on the internet modify this file without signing in, and Microsoft Graph creates it silently with no notification. Request the link with organization scope instead (anonymous view links are downgraded to organization scope automatically). Contact your InfoSec team if an external edit link is genuinely required."
  transformApplied: false

- description: Sharing invitation to corporate-domain recipients only (body.recipients) — allowed.
