            - email: Bob@EXAMPLE.COM
  output:
    expectedResult: allow

- description: Sharing invitation with an external recipient under body.recipients, caller not in collab-admins — denied.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: ms365-share-drive-item
      uri: null
    subject:
