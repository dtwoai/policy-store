# --- Red-team regression cases (reviewer, standards §10) ---

- description: "Red-team: whitespace-padded anonymous scope (\" anonymous \") — trimming must still downgrade to organization, not slip past as an unrecognized value. Caller expiry supplied so the body is deterministic."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: ms365-create-drive-item-share-link
      uri: null
    payload:
      name: ms365-create-drive-item-share-link
      args:
        driveId: b!abc
        driveItemId: 01XYZ
        body:
          type: view
          scope: " anonymous "
          expirationDateTime: "2026-08-01T00:00:00Z"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    body:
      expirationDateTime: "2026-08-01T00:00:00Z"
      scope: organization
      type: view

- description: "Red-team: whitespace-padded anonymous EDIT link (type \" edit \", scope \" anonymous \") — trimming must fire the anonymous-edit deny, not silently pass or downgrade."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: ms365-create-drive-item-share-link
      uri: null
    payload:
      name: ms365-create-drive-item-share-link
      args:
        driveId: b!abc
        driveItemId: 01XYZ
        body:
          type: " edit "
          scope: " anonymous "
  output:
    expectedResult: deny
    expectedReason: "Anonymous edit links are blocked: an anonymous edit link lets anyone on the internet modify this file without signing in, and Microsoft Graph creates it silently with no notification. Request the link with organization scope instead (anonymous view links are downgraded to organization scope automatically). Contact your InfoSec team if an external edit link is genuinely required."
  transformApplied: false

- description: "Red-team: whitespace-only scope (\"   \") is treated as omitted and forced to organization (not left to a possibly-public tenant default). Caller expiry supplied for a deterministic body."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: ms365-create-drive-item-share-link
      uri: null
    payload:
      name: ms365-create-drive-item-share-link
      args:
        driveId: b!abc
        driveItemId: 01XYZ
        body:
          type: view
          scope: "   "
          expirationDateTime: "2026-08-01T00:00:00Z"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    body:
      expirationDateTime: "2026-08-01T00:00:00Z"
      scope: organization
      type: view

- description: "Red-team: expirationDateTime explicitly null must NOT defeat expiry injection — Graph treats null as no-expiry, so the transform must fire and inject a default (value is time-dependent, so only transform presence is asserted)."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: ms365-create-drive-item-share-link
      uri: null
    payload:
      name: ms365-create-drive-item-share-link
      args:
        driveId: b!abc
        driveItemId: 01XYZ
        body:
          type: view
          scope: organization
          expirationDateTime: null
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    driveId: b!abc
    driveItemId: 01XYZ
