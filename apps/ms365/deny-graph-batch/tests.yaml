- description: Ordinary ms365 tool (send-mail) is not the batch passthrough. Policy
    should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: ms365-send-mail
      uri: null
    subject:
      sub: user@example.com
      claims:
        groups:
          - finance
    payload:
      name: ms365-send-mail
      args:
        body:
          Message:
            subject: Q3 numbers
  output:
    expectedResult: allow
- description: Non-admin caller invokes the live graph-batch tool. Policy should deny
    with the escape-hatch reason.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: ms365-graph-batch
      uri: null
    subject:
      sub: user@example.com
      claims:
        groups:
          - finance
    payload:
      name: ms365-graph-batch
      args:
        requests:
          - method: DELETE
            url: /groups/0fabc123
            body: {}
  output:
    expectedResult: deny
    expectedReason: "The raw Graph batch tool is disabled: one batch call can reach any Microsoft Graph endpoint and bypass per-tool policies. Use the specific Microsoft 365 tool for your task instead (for example send-mail, get-drive-item, or list-mail-messages). If you have a legitimate batch workflow, contact your administrator to request access."
- description: Caller in the placeholder m365-admin group is exempt. Policy should
    allow the batch tool.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: ms365-graph-batch
      uri: null
    subject:
      sub: admin@example.com
      claims:
        groups:
          - m365-admin
    payload:
      name: ms365-graph-batch
      args:
        requests:
          - method: GET
            url: /me
  output:
    expectedResult: allow
