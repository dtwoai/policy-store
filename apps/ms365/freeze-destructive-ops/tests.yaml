- description: "Red-team type confusion: resource.name is a non-string (number)
    while payload.name carries a real delete tool. The names are matched
    independently, so the malformed resource.name cannot suppress the delete —
    deny (fail-closed)."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: 42
      uri: null
    subject:
      sub: user@example.com
      claims:
        groups:
          - finance
    payload:
      name: ms365-delete-mail-message
      args:
        messageId: AAMkAGI1
  output:
    expectedResult: deny
    expectedReason: "This delete/cancel operation is blocked because it is irreversible: records must survive agent error and prompt injection. Move the item to another folder or archive it instead of deleting. For legitimate admin cleanup, ask a member of your Microsoft 365 admin group (placeholder: m365-admin) to run it, or ask your InfoSec team to add you to that group."
