- description: Read tool outside the delete/cancel verb family, caller has no
    claims at all. Policy should allow (pass-through branch).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: ms365-list-mail-messages
      uri: null
    payload:
      name: ms365-list-mail-messages
      args: {}
  output:
    expectedResult: allow
- description: Move tool (the suggested alternative to deleting) is not gated.
    Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: ms365-move-mail-message
      uri: null
    subject:
      sub: user@example.com
      claims:
        groups:
          - finance
    payload:
      name: ms365-move-mail-message
      args:
        messageId: AAMkAGI1
        destinationFolderId: archive
  output:
    expectedResult: allow
- description: Delete mail message with no subject block at all (no IdP claims
    reached the gateway). Fails closed — deny with reason.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: ms365-delete-mail-message
      uri: null
    payload:
      name: ms365-delete-mail-message
      args:
        messageId: AAMkAGI1
  output:
    expectedResult: deny
    expectedReason: "This delete/cancel operation is blocked because it is irreversible: records must survive agent error and prompt injection. Move the item to another folder or archive it instead of deleting. For legitimate admin cleanup, ask a member of your Microsoft 365 admin group (placeholder: m365-admin) to run it, or ask your InfoSec team to add you to that group."
- description: Delete OneDrive file by a caller whose groups do not include
