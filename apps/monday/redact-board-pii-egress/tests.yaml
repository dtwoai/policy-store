# ---- Red-team regression cases (reviewer, standards §10) ----

- description: "Red-team FIXED bypass: parenthesized area code with no separator before the prefix ((206)555-0100) is a mainstream US phone rendering and is now redacted (was previously leaking)."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: monday-get_board_items_page
      uri: null
    subject:
      sub: auth0|u40
      claims:
        groups:
          - recruiting
    payload:
      name: monday-get_board_items_page
      text:
        - "Reach the candidate at (206)555-0100 anytime"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "Reach the candidate at [REDACTED-PHONE] anytime"


- description: "Red-team: egress with action=tool_post_invoke but mode unset — is_egress still matches on action, so redaction fires (no fail-open leak)."
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    resource:
      type: tool
      name: monday-get_board_items_page
      uri: null
    subject:
