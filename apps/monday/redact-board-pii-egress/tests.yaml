  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - "SSN [REDACTED-SSN]"

- description: "Red-team: object-shaped groups claim {department: pii-full} must NOT grant the redaction exemption — the is_array guard fails it closed, so redaction still applies."
