# Combined egress policy (default allow := true): a PII-redaction transform on
# monday board/doc/update read responses PLUS a narrow deny of the account
# directory tool for non-admins. Cases cover every rule branch: each detection
# class independently (SSN, email, phone, national ID) and all together; every
# in-scope read suffix (official + community); the resource.name /
# tool_metadata.name / payload.name candidate surfaces; serialized-columnValues
# JSON redaction; both group-claim forms (array + bare string) and
# case-insensitivity for exemption and admin; fail-closed on missing/oddly-shaped
# claims; the directory deny (non-admin) and admin passthrough; separator-anchored
# matching (hyphen, underscore, prefix-less) and its over-match guard; out-of-scope
# tools; non-string blocks; MCP {type,text} blocks; conservative-regex negatives;
# the ingress guard; and documented residuals.

# ---- Redaction: each class independently + combined ----

- description: In-scope get_board_items_page, non-exempt caller — SSN, email, and phone inside serialized columnValues JSON are all redacted; structural JSON keys are kept.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: monday-get_board_items_page
      uri: null
    subject:
      sub: auth0|u1
      claims:
        groups:
          - recruiting
    payload:
      name: monday-get_board_items_page
      text:
        - '{"email_col":"jane@acme.com","phone_col":"206-555-0100","ssn":"123-45-6789"}'
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    text:
      - '{"email_col":"[REDACTED-EMAIL]","phone_col":"[REDACTED-PHONE]","ssn":"[REDACTED-SSN]"}'

