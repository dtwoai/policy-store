- description: create_automation by a non-admin caller is denied (automation reason).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: monday-mcp-create_automation
      uri: null
    subject:
      sub: google-apps|bot@example.com
      claims:
        groups:
          - engineering
    payload:
      name: monday-mcp-create_automation
      args: {}
  output:
    expectedResult: deny
    expectedReason: "This monday tool installs a standing automation or workflow that keeps running after this session ends, which per-call governance cannot see or stop, so the gateway blocks agent and prompt-driven callers from creating one. Have a human set up the automation directly in the monday UI instead. If you are a designated automation author, ask your admin to add your IdP group to this policy's allow-list."

