      args: {}
  output:
    expectedResult: allow

- description: Red-team — a non-string (numeric) tool name is coerced to "" rather than
    handed to lower(), so no type error is raised and the call falls through to allow
    (matches nothing). Locks the is_string / not-is_string tool_name branch.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: 12345
      uri: null
    payload:
      name: "12345"
      args: {}
  output:
    expectedResult: allow
