- description: Known limitation (documented) — the GraphQL escape hatch all_monday_api
    carries no targeted tool name, so this name-based policy passes it through. Attach
    the escape-hatch deny companion. This case locks that residual behavior.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: monday-mcp-all_monday_api
      uri: null
    payload:
      name: monday-mcp-all_monday_api
      args:
        query: "mutation { create_automation }"
  output:
    expectedResult: allow

- description: Known limitation (documented) — all_api_write is likewise not targeted
