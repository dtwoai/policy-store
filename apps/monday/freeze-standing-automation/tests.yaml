- description: Red-team / known limitation (documented) — a gateway prefix joined by a
    non-`-`/`_` separator (dot) is NOT matched by the suffix branch and passes through.
    Only `-` and `_` count as separators; DTwo emits those, so this is a residual for
    unusual custom naming schemes. Locks the documented behavior.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: monday.mcp.create_automation
      uri: null
    subject:
      sub: google-apps|bot@example.com
      claims:
        groups:
          - engineering
    payload:
      name: monday.mcp.create_automation
      args: {}
  output:
    expectedResult: allow

- description: Red-team / known limitation (documented) — colon-separated prefix on an
    agent tool likewise passes through (non-`-`/`_` separator not matched).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: "monday:manage_agent"
      uri: null
    payload:
