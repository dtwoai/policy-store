# Tests for monday/fence-sensitive-boards.
# Covers: pass-through, board fence (deny + allow with group), write fence,
# workspace fence, scoped/unscoped search, privileged unscoped search,
# and fail-closed red-team cases.

- description: Non-inspected tool (get_board_info) passes through untouched.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: monday-mcp_get_board_info
      uri: null
    subject:
      sub: google-apps|dev@example.com
      claims:
        groups:
          - engineering
    payload:
      name: monday-mcp_get_board_info
      args:
        boardId: 1111111111
  output:
    expectedResult: allow

- description: Read of a non-fenced board is allowed regardless of group.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: monday-mcp_get_board_items_page
      uri: null
    subject:
      sub: google-apps|dev@example.com
      claims:
        groups:
          - engineering
    payload:
      name: monday-mcp_get_board_items_page
      args:
        boardId: 9999999999
  output:
    expectedResult: allow

- description: Read of a fenced HR board WITHOUT the hr group is denied.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: monday-mcp_get_board_items_page
      uri: null
    subject:
      sub: google-apps|dev@example.com
      claims:
        groups:
          - engineering
    payload:
      name: monday-mcp_get_board_items_page
      args:
        boardId: 1111111111
  output:
    expectedResult: deny
    expectedReason: monday board 1111111111 is fenced as sensitive and requires the 'hr' IdP group. Ask your monday admin for access, or contact InfoSec if this fence looks wrong.

- description: Read of a fenced HR board WITH the hr group is allowed.
  input:
