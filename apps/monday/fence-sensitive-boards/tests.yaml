      claims:
        groups:
          - engineering
    payload:
      name: monday-mcp_search
      args:
        searchTerm: candidate offer salary
  output:
    expectedResult: deny
    expectedReason: Account-wide monday search is restricted while sensitive boards are fenced. Re-run the search with boardIds or workspaceIds scoped to boards you may access, or ask your monday admin for the fenced groups.

- description: Unscoped account-wide search by a fully-privileged caller (holds hr, sales, infosec) is allowed.
