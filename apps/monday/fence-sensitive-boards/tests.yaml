- description: Red-team — unscoped account-wide search by a non-privileged caller is denied (cannot enumerate around the fence).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: monday-mcp_search
      uri: null
    subject:
