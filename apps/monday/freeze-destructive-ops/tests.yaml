# --- Tier 1: irreversible, no admin override ---
- description: delete_column by a non-admin. Tier 1 suffix matches. Deny with the
    irreversible reason.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: monday-delete_column
      uri: null
    subject:
      sub: user@example.com
      claims:
        groups:
          - marketing
    payload:
      name: monday-delete_column
      args:
        boardId: 123456789
        columnId: status
  output:
    expectedResult: deny
    expectedReason: "This monday operation is blocked for everyone: delete_column, delete_object_schema, and delete_object_schema_columns are irreversible and hit every item on the board (or a shared schema account-wide), and none of them route to the recycle bin. There is no admin override for these over MCP — make this structural change from the monday web UI, where it can be reviewed. If you believe this block is a false positive, contact your InfoSec team."
- description: delete_column by a monday-admins member. Tier 1 has NO admin
    override, so the admin is still denied with the irreversible reason.
