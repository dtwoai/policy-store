# Tier 1 (irreversible) reason and Tier 2 (admin-gated) reason are each stable
# strings; anchored on the deny cases below.
- description: Read tool (get_board_items_page) outside both destructive tiers,
    caller has no claims at all. Pass-through allow branch.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: monday-get_board_items_page
      uri: null
    payload:
      name: monday-get_board_items_page
      args:
        boardId: 123456789
  output:
    expectedResult: allow
- description: Non-destructive write (create_item) is not gated. Policy should
    allow even for a non-admin.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: monday-create_item
      uri: null
    subject:
      sub: user@example.com
      claims:
        groups:
          - marketing
    payload:
      name: monday-create_item
      args:
        boardId: 123456789
        name: New lead
  output:
    expectedResult: allow
- description: Non-destructive schema write (manage_object_schema_columns) is a
    near-miss for the delete_object_schema_columns suffix but the tail differs
    (manage_ vs delete_), so it is NOT frozen. Allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: monday-manage_object_schema_columns
      uri: null
    subject:
      sub: user@example.com
      claims:
        groups:
          - marketing
    payload:
      name: monday-manage_object_schema_columns
      args:
        schemaId: "s1"
  output:
    expectedResult: allow
- description: Non-destructive comment write (create_update) does not end with the
    delete_update suffix, so it is not gated. Allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: monday-create_update
      uri: null
    subject:
      sub: user@example.com
      claims:
        groups:
          - marketing
    payload:
      name: monday-create_update
      args:
        itemId: 456
        body: nice work
  output:
    expectedResult: allow

# --- Tier 2: recycle-bin-recoverable, admin-gated ---
- description: Official delete_item by a non-admin. delete_item suffix matches
    Tier 2. Deny with the admin-gate reason.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: monday-delete_item
      uri: null
    subject:
      sub: user@example.com
      claims:
        groups:
          - marketing
    payload:
      name: monday-delete_item
      args:
        itemId: 456
  output:
    expectedResult: deny
    expectedReason: "This monday deletion is blocked because delete/undo tools over MCP remove records an agent could destroy in error or under prompt injection: delete_item takes only an itemId with no confirmation, and delete_update, undo_action, and archive_item remove or reverse item data. These are recoverable from monday's recycle bin (~30 days) but still gated. Route this request through a member of your monday admin group (placeholder: monday-admins) instead. If you believe this block is a false positive, ask your InfoSec team to add you to that group."
