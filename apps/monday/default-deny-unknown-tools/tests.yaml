- description: Non-string tool name (number) is coerced to "" instead of raising a lower() type error — clean, reasoned deny (fail closed).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: 12345
      uri: null
    payload:
      name: 12345
      args: {}
  output:
    expectedResult: deny

- description: Homoglyph of an allowlisted suffix (Cyrillic "ѕearch") fails the raw ASCII guard before lower() runs and is denied — closes the Unicode case-fold / spoof evasion.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: "ѕearch"
      uri: null
    payload:
      name: "ѕearch"
      args:
        searchTerm: q3 deals
  output:
    expectedResult: deny

- description: Documented endswith residual — a prefix glued directly to an allowlisted suffix (xcreate_item) still matches and is allowed. Recorded in Known limitations; use full gateway tool names if stricter matching is required.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: xcreate_item
      uri: null
    payload:
      name: xcreate_item
      args:
        boardId: 12345
  output:
    expectedResult: allow

- description: >-
    Red-team regression — an embedded newline splicing a denied tool onto an
    allowlisted suffix ("delete_item\nsearch") is denied. The raw ASCII guard
    regex (^[A-Za-z0-9._-]+$) is NOT multiline in OPA/Go, so $ anchors to
    end-of-text and the newline breaks the whole-string match before endswith
    ever sees "search". Locks the non-multiline anchoring assumption.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: "delete_item\nsearch"
      uri: null
    payload:
      name: "delete_item\nsearch"
      args: {}
  output:
    expectedResult: deny

- description: >-
    Red-team regression — leading/trailing whitespace padding around an
    allowlisted suffix ("  search ") fails the raw ASCII character-class guard
    (space is outside [A-Za-z0-9._-]) and is denied. Locks the guard's
    strictness against whitespace-smuggled names.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: "  search "
      uri: null
    payload:
      name: "  search "
      args:
        searchTerm: q3 deals
  output:
    expectedResult: deny

- description: >-
    Red-team finding (documented drift blind spot) — a plausible future/renamed
    tool ending in the short generic suffix "search" (advanced_search) is
    auto-allowed by endswith, NOT surfaced as drift. Suffix matching cannot
    distinguish this from a legitimate gateway-prefixed "monday-mcp-search", so
    the residual is recorded under Known limitations; drop "search" and pin the
    full gateway name if drift alerting on the search family is required. Locks
    the behavior so the blind spot stays visible.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: advanced_search
      uri: null
    payload:
      name: advanced_search
      args:
        searchTerm: q3 deals
  output:
    expectedResult: allow

- description: >-
    Red-team regression — the broad-read tool get_full_board_data, explicitly
    called out as excluded in the description, does not end with any allowlisted
    suffix and is denied. Locks the stated exclusion of high-volume board reads.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: monday-mcp-get_full_board_data
      uri: null
    payload:
      name: monday-mcp-get_full_board_data
      args:
        boardId: 12345
  output:
    expectedResult: deny

- description: >-
    Red-team regression — create_update_in_monday (official write tool) ends in
    "in_monday", NOT the allowlisted "create_update" suffix, so the single
    create_update entry does not accidentally admit it. Locks a claimed
    non-collision.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: create_update_in_monday
      uri: null
    payload:
      name: create_update_in_monday
      args:
        itemId: 42
  output:
    expectedResult: deny
