# Tests for monday/default-deny-unknown-tools.
# Covers every branch of the allowlist gate:
#   - allow: bare official name, sakce monday_-prefixed name, gateway-prefixed
#     name, case-insensitive match, read + reversible-write suffixes;
#   - deny (fail closed): GraphQL escape hatch, manage_tools, batch create_items
#     (documented endswith non-match), missing/empty name, non-string name,
#     non-ASCII homoglyph (Unicode case-fold / spoof guard);
#   - documented residual: prefix glued directly to an allowlisted suffix.

- description: Bare official read on the allowlist (get_board_items_page) is allowed.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: get_board_items_page
      uri: null
    payload:
      name: get_board_items_page
      args:
        boardId: 12345
  output:
    expectedResult: allow

- description: Gateway-prefixed read (monday-mcp-get_board_items_page) ends with an allowlisted suffix and is allowed.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: monday-mcp-get_board_items_page
      uri: null
    payload:
      name: monday-mcp-get_board_items_page
      args:
        boardId: 12345
  output:
    expectedResult: allow

- description: sakce community spelling (monday_create_item) ends with create_item and is allowed by the single suffix entry.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: monday_create_item
      uri: null
    payload:
      name: monday_create_item
      args:
        boardId: 12345
        itemName: New lead
  output:
    expectedResult: allow

- description: Reversible-write suffix create_update is allowed.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: monday-mcp-create_update
      uri: null
    payload:
      name: monday-mcp-create_update
      args:
        itemId: 42
  output:
    expectedResult: allow

- description: Matching is case-insensitive (SEARCH) — an allowlisted suffix in uppercase is allowed.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: SEARCH
      uri: null
    payload:
      name: SEARCH
      args:
        searchTerm: q3 deals
  output:
    expectedResult: allow

- description: GraphQL escape hatch (all_monday_api) is not allowlisted — denied by default with the drift reason.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: monday-mcp-all_monday_api
      uri: null
    payload:
      name: monday-mcp-all_monday_api
      args:
        query: "mutation { delete_item (item_id: 42) { id } }"
  output:
    expectedResult: deny
    expectedReason: "This monday tool is not on the audited allowlist, so the gateway denies it by default and surfaces the call as tool drift. This fails closed against the GraphQL escape hatch (all_monday_api / all_api_read / all_api_write), the self-expanding manage_tools, the beta dynamic-API tools, and the developer apps-mode surface (monday_apps_export_storage_data, monday_apps_set_environment_variable) — any one of which could reduce every other monday policy to one opaque query string. Ask a gateway admin to review the tool and, if it is safe for agents, add its verified suffix to the allowlist."

- description: Self-expanding toolset (manage_tools) is not allowlisted and is denied.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: monday-mcp-manage_tools
      uri: null
    payload:
      name: monday-mcp-manage_tools
      args: {}
  output:
    expectedResult: deny

- description: Developer apps-mode tool (monday_apps_export_storage_data) is denied.
  input:
    action: tool_pre_invoke
