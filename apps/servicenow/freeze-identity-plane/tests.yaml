    expectedReason: "ServiceNow identity and group changes are frozen on the agent path — group membership drives ServiceNow ACLs, so user and group mutations are privilege-escalation primitives. Make these changes in the ServiceNow UI, or ask your identity admin to add you to the 'identity-admins' IdP group if your role requires making them through the gateway. Contact your InfoSec team if this looks like a false positive."
- description: add_group_members by an identity-admins member — the admin exemption
