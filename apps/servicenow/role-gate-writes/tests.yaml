# === Red-team review cases (standards §10) ===

# --- Closed bypass: write subflow embedding a `_get_` infix must NOT read as a read ---
# Before the fix the `_get_`/`_list_` underscore-infix rule classified this
# instance-defined write subflow as a read and allowed it for everyone. It now
# fails closed as an unrecognized tool.
- description: Write-ish subflow with a `_get_` infix (incident_get_and_resolve) — must NOT be misread as a read; denied fail-closed.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: servicenow-mcp-incident_get_and_resolve
      uri: null
    subject:
      sub: auth0|bob
      claims:
        groups:
          - engineering
    payload:
      name: servicenow-mcp-incident_get_and_resolve
      args:
        incident_id: INC0010
  output:
    expectedResult: deny
    expectedReason: "This ServiceNow tool (\"servicenow-mcp-incident_get_and_resolve\") is not on the gateway's read allowlist or verified write list, so it is denied by default (fail closed). ServiceNow tool names can be instance-defined; ask your gateway admin to classify this tool — add it to the read set, or to the gated write set for the 'servicenow-writers' group — in the policy."

# --- Closed bypass: `_list_` infix, even for a writer, is not a read and not a verified write ---
- description: Write-ish subflow with a `_list_` infix (case_list_and_close) by a writer — not a read verb, not a verified write; denied fail-closed.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: servicenow-mcp-case_list_and_close
      uri: null
    subject:
      sub: auth0|alice
      claims:
        groups:
          - servicenow-writers
    payload:
      name: servicenow-mcp-case_list_and_close
      args:
        case_id: CS0001
  output:
    expectedResult: deny
    expectedReason: "This ServiceNow tool (\"servicenow-mcp-case_list_and_close\") is not on the gateway's read allowlist or verified write list, so it is denied by default (fail closed). ServiceNow tool names can be instance-defined; ask your gateway admin to classify this tool — add it to the read set, or to the gated write set for the 'servicenow-writers' group — in the policy."

# --- Documented residual: a write whose name STARTS with a read verb reads as a read ---
# The `list_`/`get_` heuristic cannot distinguish an admin-named write subflow
# like get_and_close_incident from a genuine read. This asserts the KNOWN,
# documented behavior (Known limitations) — not a desired posture. The companion
# default-deny-unknown-tools (PF-28) policy is the mitigation.
- description: KNOWN LIMITATION — write subflow whose name starts with get_ (get_and_close_incident) is classified as a read and allowed; mitigated by the PF-28 companion.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: servicenow-mcp-get_and_close_incident
      uri: null
    subject:
      sub: auth0|bob
      claims:
        groups:
          - engineering
    payload:
      name: servicenow-mcp-get_and_close_incident
      args:
        incident_id: INC0010
  output:
    expectedResult: allow

# --- Closed bypass: instance-defined write-ish subflow ENDING in a read suffix ---
# Before the fix, has_read_suffix used a bare `endswith`, so any tool whose name
# merely ends with search_records/perform_query/natural_language_search was read
# as a read and allowed for everyone. This admin-named write subflow ends with
# `search_records`; the three exact reads are now anchored to a `-` boundary or
# the bare name, so this fails closed as an unrecognized tool.
- description: Write-ish subflow ending in a read suffix (incident_close_and_search_records) by a non-writer — must NOT be misread as search_records; denied fail-closed.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: servicenow-mcp-incident_close_and_search_records
      uri: null
    subject:
      sub: auth0|bob
      claims:
        groups:
          - engineering
    payload:
      name: servicenow-mcp-incident_close_and_search_records
      args:
        incident_id: INC0010
  output:
    expectedResult: deny
    expectedReason: "This ServiceNow tool (\"servicenow-mcp-incident_close_and_search_records\") is not on the gateway's read allowlist or verified write list, so it is denied by default (fail closed). ServiceNow tool names can be instance-defined; ask your gateway admin to classify this tool — add it to the read set, or to the gated write set for the 'servicenow-writers' group — in the policy."

# --- Consistency: an exact read under a `_`-joined server prefix now fails closed ---
# The description promises that a `_`-joined server prefix makes reads fail closed.
# Before the fix, the bare endswith allowed `servicenow_mcp_search_records`; the
# anchored match now denies it, matching the documented `_`-prefix behavior.
- description: Exact read (search_records) reached under a `_`-joined server prefix (servicenow_mcp_search_records) — not recognized at a boundary, denied fail-closed per the documented `_`-prefix caveat.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: servicenow_mcp_search_records
      uri: null
    payload:
      name: servicenow_mcp_search_records
      args:
        table: incident
  output:
    expectedResult: deny
    expectedReason: "This ServiceNow tool (\"servicenow_mcp_search_records\") is not on the gateway's read allowlist or verified write list, so it is denied by default (fail closed). ServiceNow tool names can be instance-defined; ask your gateway admin to classify this tool — add it to the read set, or to the gated write set for the 'servicenow-writers' group — in the policy."

# --- Boundary branch: bare (unprefixed) exact read is still recognized ---
# Locks the `tool_name == suffix` branch: a raw community-server name with no
# gateway prefix still passes as a read.
- description: Bare exact read tool (perform_query) with no server prefix and no subject — allowed via the exact-name read branch.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: perform_query
      uri: null
    payload:
      name: perform_query
      args:
        table: incident
  output:
    expectedResult: allow

