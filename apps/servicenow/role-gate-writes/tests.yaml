# Deny reasons are kept in one place so expectedReason matches policy.md exactly:
#  - group reason:   fired when a verified write is called by a non-writer
#  - unknown reason: fired when a tool is neither a recognized read nor a
#                    verified write (fail closed), including for writers

# --- Reads pass for everyone (list_ prefix, no subject) ---
- description: Read tool (list_incidents) with no subject at all — reads pass for everyone.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: servicenow-mcp-list_incidents
      uri: null
    payload:
      name: servicenow-mcp-list_incidents
      args:
        limit: 20
  output:
    expectedResult: allow

# --- Reads pass regardless of identity (get_ prefix, unrelated group) ---
- description: Read tool (get_user) for a caller with an unrelated group — reads are identity-independent.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: servicenow-mcp-get_user
      uri: null
    subject:
      sub: auth0|bob
      claims:
        groups:
          - engineering
    payload:
      name: servicenow-mcp-get_user
      args:
        user_id: abc123
  output:
    expectedResult: allow

