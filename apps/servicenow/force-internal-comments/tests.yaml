        groups:
          - staff
    payload:
      name: servicenow-mcp-add_comment
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    is_work_note: true

- description: "Red-team: spoofed group name close to service-desk (service_desk with underscore) — not an exact match, so caller is not exempt and the comment is rewritten."
