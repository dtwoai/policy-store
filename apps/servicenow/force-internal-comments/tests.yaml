      args:
        incident_id: INC0010001
        comment: noun_verb ordering bypass
  output:
    expectedResult: allow
  transformApplied: false

- description: "Red-team (missing-args fail-safe): add_comment with no args object at all — object.get chain yields {}, is_work_note is absent so the rewrite still fires and forces is_work_note true (does not fail open to a visible comment)."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
