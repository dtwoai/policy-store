- description: Non-service-desk caller, add_comment with is_work_note omitted — rewritten to an internal work note; comment and incident_id preserved.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: servicenow-mcp-add_comment
      uri: null
    subject:
      sub: agent@example.com
      claims:
        groups:
          - staff
    payload:
      name: servicenow-mcp-add_comment
      args:
        incident_id: INC0010001
        comment: Investigating now.
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    incident_id: INC0010001
    comment: Investigating now.
    is_work_note: true

