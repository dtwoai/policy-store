# --- Red-team regression cases (reviewer, standards §10) ---

- description: "Red-team: mixed-case tool name (ADD_COMMENT) — matching is case-insensitive, transform still fires."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: ServiceNow-MCP-ADD_COMMENT
      uri: null
    subject:
      sub: agent@example.com
      claims:
        groups:
          - staff
    payload:
      name: ServiceNow-MCP-ADD_COMMENT
      args:
        incident_id: INC0010001
        comment: casing bypass attempt
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    is_work_note: true

- description: "Red-team: buckner-style bare add_comment tool name (no server prefix) — suffix match still catches it."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: add_comment
      uri: null
    subject:
      sub: agent@example.com
      claims:
        groups:
          - staff
    payload:
      name: add_comment
      args:
        incident_id: INC0010001
        comment: bare name
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    is_work_note: true

- description: "Red-team: is_work_note as the string \"false\" (non-boolean) — treated as not-true, forced to boolean true."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: servicenow-mcp-add_comment
      uri: null
    subject:
      sub: agent@example.com
      claims:
        groups:
          - staff
    payload:
      name: servicenow-mcp-add_comment
      args:
        incident_id: INC0010001
        comment: string coercion attempt
        is_work_note: "false"
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    is_work_note: true

- description: "Red-team (documented residual): michaelbuckner natural_language_update is a free-text write with no is_work_note field — this single-purpose transform does not match it, so it passes through untouched. Pair with default-deny-unknown-tools / deny natural_language_update."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: servicenow-mcp-natural_language_update
      uri: null
    subject:
      sub: agent@example.com
      claims:
        groups:
          - staff
    payload:
      name: servicenow-mcp-natural_language_update
      args:
        query: "add a comment to INC0010001 that the customer can see: your refund is approved"
  output:
    expectedResult: allow
  transformApplied: false

- description: "Red-team (documented residual): noun_verb-ordered comment tool (comment_add, LokiMCPUniverse style) — endswith(add_comment) does not match, so no rewrite fires. Suffix must be added per-tenant after verifying the real name."
  input:
    action: tool_pre_invoke
