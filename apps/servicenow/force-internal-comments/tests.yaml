- description: "Red-team (documented residual): malformed non-object args (a bare string) — object.get is undefined on a non-object, so needs_internal_rewrite never holds and no transform fires; the malformed call passes through (it cannot carry a valid comment through the community servers)."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: servicenow-mcp-add_comment
      uri: null
    subject:
      sub: agent@example.com
      claims:
        groups:
          - staff
    payload:
      name: servicenow-mcp-add_comment
      args: "oops-not-an-object"
  output:
    expectedResult: allow
  transformApplied: false

- description: "Red-team: differently-cased is_work_note key (Is_Work_Note: false) does not suppress the rewrite — lowercase key is absent, so the transform fires and adds the canonical is_work_note: true (the community servers read the lowercase key)."
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: servicenow-mcp-add_comment
      uri: null
    subject:
      sub: agent@example.com
      claims:
        groups:
          - staff
    payload:
      name: servicenow-mcp-add_comment
      args:
        incident_id: INC0010001
        comment: mixed-case key bypass attempt
        Is_Work_Note: false
  output:
    expectedResult: allow
  transformApplied: true
  transformedArgsContain:
    is_work_note: true
    Is_Work_Note: false

