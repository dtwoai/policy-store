- description: Unguarded tool (create_incident) passes through untouched.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: servicenow-mcp-create_incident
      uri: null
    payload:
      name: servicenow-mcp-create_incident
      args:
        short_description: printer down
  output:
    expectedResult: allow

- description: Generic Table-API call on a non-sensitive table (incident) is allowed.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: servicenow-mcp-perform_query
      uri: null
    payload:
      name: servicenow-mcp-perform_query
      args:
        table: incident
        query: active=true
  output:
    expectedResult: allow

- description: perform_query on sys_user with no matching group is denied.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: servicenow-mcp-perform_query
      uri: null
    subject:
      claims:
        groups:
          - service-desk
    payload:
      name: servicenow-mcp-perform_query
      args:
        table: sys_user
        query: active=true
  output:
    expectedResult: deny
    expectedReason: "Access to the ServiceNow table 'sys_user' is restricted to the hr, infosec group(s). Narrow your query to a non-sensitive table, or request membership in one of those groups."

