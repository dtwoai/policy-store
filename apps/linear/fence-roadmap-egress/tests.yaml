- description: Non-guarded read (getIssues) — passes through regardless of group.
  input:
    action: tool_post_invoke
    kind: tool_post_invoke
    mode: output
    resource:
      type: tool
      name: linear-mcp-linear_getIssues
      uri: null
    payload:
      name: linear-mcp-linear_getIssues
      text:
        - '[{"id":"iss_1","title":"Fix login bug"}]'
    subject:
      claims:
        groups:
          - marketing
  output:
    expectedResult: allow

