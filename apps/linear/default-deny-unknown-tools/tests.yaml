    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: linear-mcp-linear_createIssue
      uri: null
    payload:
      name: linear-mcp-linear_createIssue
      args:
        title: Fix login bug
        teamId: t-123
  output:
    expectedResult: allow

- description: Case-insensitivity — uppercase bare official name (CREATE_ISSUE) matches via lower(). Branch 1. Allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: CREATE_ISSUE
      uri: null
    payload:
      name: CREATE_ISSUE
      args:
        title: Fix login bug
  output:
    expectedResult: allow

