# ---------------------------------------------------------------------------
# Red-team — regex/encoding edges (standards §10: "newlines, very long
# strings", encoding tricks). The raw-name ASCII guard's regex is anchored
# ^...$; in OPA/Go RE2 `$` matches end-of-text (like \z), NOT before a trailing
# newline, and `\n`/space are outside [A-Za-z0-9._-]. So any embedded/trailing
# newline or whitespace, and any oversized junk name, fails the guard and is
# denied. These lock that fail-closed behavior so a future edit that added the
# (?m) flag or dropped an anchor — silently opening a newline-splice bypass —
# becomes a visible test diff.
# ---------------------------------------------------------------------------
- description: Red-team — embedded newline splicing a dangerous tool after an allowlisted form (create_issue\nlinear_createWebhook). Newline is outside the ASCII class; anchored guard denies. Deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: "create_issue\nlinear_createWebhook"
      uri: null
    payload:
      name: "create_issue\nlinear_createWebhook"
      args: {}
  output:
    expectedResult: deny
    expectedReason: "This Linear tool is not on the audited allowlist, so the gateway denies it by default and surfaces the call as tool drift. The allowlist pins the verified official Linear tool names (list_issues, get_issue, create_issue, update_issue, create_comment, …); anything else — tacticlaunch community tools such as linear_createWebhook (standing exfiltration), linear_logoutAllSessions (account DoS), or linear_getOrganizationAuditEvents (org surveillance); delete/archive tools the official server does not have; unverified Feb-2026 initiative/milestone/project-update tools; or a renamed/newly added upstream tool — is denied until it is re-audited. If this tool is legitimate, ask a gateway admin to confirm its exact name with a live tools/list and add it to the allowlist for this Linear pipeline."

- description: Red-team — trailing-newline appended to an allowlisted name (create_issue\n). Go RE2 `$` is \z, not \Z, so the trailing newline is not tolerated; denied. Deny.
