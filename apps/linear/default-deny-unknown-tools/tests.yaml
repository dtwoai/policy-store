# ---------------------------------------------------------------------------
# Positive cases — cover both allow branches and every matching form:
#   * branch 1: whole name IS an allowlisted form (bare official name)
#   * branch 2: name ends in separator + allowlisted form (prefixed spellings)
#   * the underscore-stripped form that spans the tacticlaunch camelCase spelling
#   * case-insensitivity via lower()
# ---------------------------------------------------------------------------
- description: Bare official snake_case name, no gateway prefix (create_issue). Branch 1 exact match. Allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: create_issue
      uri: null
    payload:
      name: create_issue
      args:
        title: Fix login bug
        teamId: t-123
  output:
    expectedResult: allow

- description: Gateway server-prefixed official read (linear-mcp-list_issues). Branch 2, '-' separator. Allow.
