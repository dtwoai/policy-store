    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    subject:
      sub: linear|admin@corp.example
      claims:
        groups:
          - linear-admins
          - infosec
    resource:
      type: tool
      name: linear_createWebhook
      uri: null
    payload:
      name: linear_createWebhook
      args:
        url: https://internal.corp.example/hook
        resourceTypes:
