# ---------------------------------------------------------------------------
# Deny (removeUserFromTeam suffix branch): non-admin.
# ---------------------------------------------------------------------------
- description: removeUserFromTeam by a non-admin — matched by the explicit suffix,
    not by a delete/archive/logout marker. Denied.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: linear-linear_removeUserFromTeam
      uri: null
    subject:
      sub: user@example.com
      claims:
        groups:
          - engineering
    payload:
      name: linear-linear_removeUserFromTeam
      args:
        userId: U1
        teamId: T1
  output:
    expectedResult: deny

# ---------------------------------------------------------------------------
# Red-team: is_array guard on groups. A groups object whose values include
# "linear-admins" must NOT grant exemption (would fail open without is_array).
# ---------------------------------------------------------------------------
- description: Red-team — groups is an OBJECT {"0":"linear-admins"} rather than an
    array, on a destructive call. The is_array guard makes caller_is_admin fail
    closed, so the deleteComment is denied.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: linear-linear_deleteComment
      uri: null
    subject:
      sub: attacker@example.com
      claims:
        groups:
          "0": linear-admins
    payload:
      name: linear-linear_deleteComment
      args:
        id: C1
  output:
    expectedResult: deny

- description: Red-team — groups is a bare STRING "linear-admins" (not an array) on
    a destructive call. is_array fails, so caller_is_admin is false and the
    archiveIssue is denied.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: linear-linear_archiveIssue
      uri: null
    subject:
      sub: attacker@example.com
      claims:
        groups: linear-admins
    payload:
      name: linear-linear_archiveIssue
      args:
        id: ISS-1
  output:
    expectedResult: deny

# ---------------------------------------------------------------------------
# Red-team: independent resource/payload name matching. A non-string value in
# one field must not suppress a genuine destructive verb in the other.
# ---------------------------------------------------------------------------
- description: Red-team — resource.name is a non-string (number) but payload.name is
    the real destructive tool. name_of coerces the number to "", and the payload
    branch still matches, so the non-admin call is denied.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: 12345
      uri: null
    subject:
      sub: user@example.com
      claims:
        groups:
          - engineering
    payload:
      name: linear-linear_deleteInitiative
      args:
        id: INIT-1
  output:
    expectedResult: deny

- description: Red-team — resource.name carries the destructive verb while payload
    is entirely absent. The resource branch matches independently, so denied.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: linear-linear_deleteComment
      uri: null
    subject:
      sub: user@example.com
      claims:
        groups:
          - engineering
  output:
    expectedResult: deny

# ---------------------------------------------------------------------------
# Red-team: whitespace padding + underscore normalization + server-name prefix.
# ---------------------------------------------------------------------------
- description: Red-team — trailing newline padding on a destructive name. trim_space
    strips it before matching, so the non-admin call is denied.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: "linear-linear_deleteComment\n"
      uri: null
    subject:
      sub: user@example.com
      claims:
        groups:
          - engineering
    payload:
      name: "linear-linear_deleteComment\n"
      args:
        id: C1
  output:
    expectedResult: deny

- description: Red-team — snake_case destructive variant (linear_delete_comment).
    Underscores normalize to hyphens, so linear-delete- still contains the
    linear-delete marker and the non-admin call is denied.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: linear_delete_comment
      uri: null
    subject:
      sub: user@example.com
      claims:
        groups:
          - engineering
    payload:
      name: linear_delete_comment
      args:
        id: C1
  output:
    expectedResult: deny

- description: Red-team — arbitrary gateway server-name prefix (foo-linear_deleteComment).
    The marker anchors on the tool's own linear- prefix, independent of the
    server name, so the non-admin call is still denied.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: foo-linear_deleteComment
      uri: null
    subject:
      sub: user@example.com
      claims:
        groups:
          - engineering
    payload:
      name: foo-linear_deleteComment
      args:
        id: C1
  output:
    expectedResult: deny

# ---------------------------------------------------------------------------
# Red-team: contains-hardening on the removeUserFromTeam verb. A trailing-
# decorated variant must still be caught (endswith would have missed it).
# ---------------------------------------------------------------------------
- description: Red-team — removeUserFromTeam with a trailing-decorated suffix
    (linear_removeUserFromTeamAndDisable). The verb is matched with contains, not
    endswith, so the trailing chars do not evade the freeze; non-admin is denied.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: linear-linear_removeUserFromTeamAndDisable
      uri: null
    subject:
      sub: user@example.com
      claims:
        groups:
          - engineering
    payload:
      name: linear-linear_removeUserFromTeamAndDisable
      args:
        userId: U1
  output:
    expectedResult: deny

# ---------------------------------------------------------------------------
# Red-team (documented residual): non-string name in the ONLY populated field.
# Coerces to "" → treated as non-destructive → passes through. Harmless because
# such a malformed PARC cannot route to a real destructive tool at the MCP
# server. Documents the "Substring matching" Known-limitations note.
# ---------------------------------------------------------------------------
- description: Documented residual — resource.name is a non-string (array) and there
    is no payload fallback. name_of coerces to "", nothing matches, so the call
    passes through. Not a real evasion — a malformed name does not route to the
    real deleteComment tool.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name:
        - linear-linear_deleteComment
      uri: null
    subject:
      sub: user@example.com
      claims:
        groups:
          - engineering
  output:
    expectedResult: allow

# ---------------------------------------------------------------------------
# Red-team (documented residual): community server that glues the linear prefix
# with no underscore separator (linearDeleteComment). Normalization produces
# lineardeletecomment (no hyphen), so the linear-delete marker does not match.
# Documents the "Community-prefix assumption" Known-limitations bullet (case b).
# ---------------------------------------------------------------------------
- description: Documented residual — no-underscore prefix variant (linearDeleteComment).
    Without the underscore there is no linear- boundary, so the marker misses and
    the call passes through. Not a real evasion of the enumerated tacticlaunch set
    (which always uses linear_<verb>); compose PF-28 default-deny-unknown-tools if
    you cannot rely on that naming.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: linearDeleteComment
      uri: null
    payload:
      name: linearDeleteComment
      args:
        id: C1
    subject:
      sub: user@example.com
      claims:
        groups:
          - engineering
  output:
    expectedResult: allow
