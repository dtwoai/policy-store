# Tests for linear.ingress.freeze_destructive_ops
# Covers every rule branch: pass-through allow (not is_destructive_tool),
# admin-exempt allow (is_destructive_tool + caller_is_admin), and deny
# (is_destructive_tool + not caller_is_admin) across the delete/archive/logout
# verb classes and the removeUserFromTeam suffix. Also covers each fail-closed
# branch of caller_is_admin and the red-team hardening cases.

# ---------------------------------------------------------------------------
# Pass-through: non-destructive tools are never touched (allow branch 1).
# ---------------------------------------------------------------------------
- description: Read tool (linear_getIssues) by a caller with no subject at all. Not
    destructive, so the policy passes it through regardless of identity.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: linear-linear_getIssues
      uri: null
    payload:
      name: linear-linear_getIssues
      args:
        teamId: T1
  output:
    expectedResult: allow

- description: Non-destructive write (linear_createIssue) by a non-admin. Create is
    not a destructive verb, so it passes through.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: linear-linear_createIssue
      uri: null
    subject:
      sub: user@example.com
      claims:
        groups:
          - engineering
    payload:
      name: linear-linear_createIssue
      args:
        title: Bug
  output:
    expectedResult: allow

- description: Destructive-edit verb (linear_updateIssue) passes through — this policy
    freezes delete/archive/logout, not updates (documented out of scope).
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: linear-linear_updateIssue
      uri: null
    payload:
      name: linear-linear_updateIssue
      args:
        id: ISS-1
        description: overwritten
  output:
    expectedResult: allow

- description: A read tool whose name contains 'delete'-adjacent text but not the
    linear- verb marker (linear_getDocumentContentHistory) passes through — the
    marker anchors on linear-delete/archive/logout, not bare substrings.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: linear-linear_getDocumentContentHistory
      uri: null
    payload:
      name: linear-linear_getDocumentContentHistory
      args: {}
  output:
    expectedResult: allow

# ---------------------------------------------------------------------------
# Admin-exempt allow (allow branch 2): destructive + caller_is_admin.
# ---------------------------------------------------------------------------
- description: archiveIssue by a caller whose groups claim contains linear-admins.
    Destructive but admin-exempt, so allowed.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: linear-linear_archiveIssue
      uri: null
    subject:
      sub: admin@example.com
      claims:
        groups:
          - linear-admins
    payload:
      name: linear-linear_archiveIssue
      args:
        id: ISS-1
  output:
    expectedResult: allow

- description: deleteComment by an admin (multiple groups, one is linear-admins). Allowed.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: linear-linear_deleteComment
      uri: null
    subject:
      sub: admin@example.com
      claims:
        groups:
          - engineering
          - linear-admins
    payload:
      name: linear-linear_deleteComment
      args:
        id: C1
  output:
    expectedResult: allow

- description: removeUserFromTeam by an admin. The removeuserfromteam suffix is
    destructive but the caller is exempt, so allowed.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: linear-linear_removeUserFromTeam
      uri: null
    subject:
      sub: admin@example.com
      claims:
        groups:
          - linear-admins
    payload:
      name: linear-linear_removeUserFromTeam
      args:
        userId: U1
        teamId: T1
  output:
    expectedResult: allow

# ---------------------------------------------------------------------------
# Deny (delete class): destructive + not admin, one case per named tool.
# ---------------------------------------------------------------------------
- description: deleteComment by a non-admin (groups present but no linear-admins). Denied
    with the stable reason.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: linear-linear_deleteComment
      uri: null
    subject:
      sub: user@example.com
      claims:
        groups:
          - engineering
    payload:
      name: linear-linear_deleteComment
      args:
        id: C1
  output:
    expectedResult: deny
    expectedReason: "This destructive Linear operation is blocked. Delete and archive tools permanently remove records (comments, issues, initiatives, documents, teams) with no agent-side undo, and the session-logout tools can lock a user out of Linear entirely, so a hallucinated cleanup step or a prompt-injection payload could destroy work or trigger an account denial-of-service. Route this request through a member of your Linear admin group (placeholder: linear-admins) instead. If you believe this block is a false positive, ask your InfoSec team to add you to that group."

- description: deleteInitiative by a caller whose claims exist but carry no groups
    key. caller_is_admin fails closed (missing groups → []), so denied.
  input:
    action: tool_pre_invoke
    kind: tool_pre_invoke
    mode: input
    resource:
      type: tool
      name: linear-linear_deleteInitiative
      uri: null
    subject:
      sub: user@example.com
      claims:
        scope: openid profile
    payload:
      name: linear-linear_deleteInitiative
      args:
        id: INIT-1
  output:
    expectedResult: deny

