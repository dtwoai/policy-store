name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: read-all

env:
  OPA_VERSION: v1.17.1

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        # Version comes from the "packageManager" field in package.json.

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install OPA
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://openpolicyagent.org/downloads/${OPA_VERSION}/opa_linux_amd64_static" -o "$HOME/.local/bin/opa"
          chmod +x "$HOME/.local/bin/opa"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/opa" version

      - name: Check manifest
        run: pnpm manifest:check

      - name: Test policies (opa check + fixtures)
        run: pnpm test
